a a parábola da ovelha perdida", "mateus": {"referencia": "Mt 18.12-14", "texto": "12 Que vos parece? Se algum homem tiver cem ovelhas, e uma delas se desgarrar, não irá pelos montes, deixando as noventa e nove, em busca da que se desgarrou? 13 E, se, porventura, a acha, em verdade vos digo que maior prazer tem por aquela do que pelas noventa e nove que se não desgarraram. 14 Assim também não é vontade de vosso Pai, que está nos céus, que um destes pequeninos se perca."}, "marcos": null, "lucas": null, "joao": null}, {"id": 123, "ordem": 123, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": null, "titulo": "Jesus ensina como lidar com um crente que peca", "mateus": {"referencia": "Mt 18.15-20", "texto": "15 Ora, se teu irmão pecar contra ti, vai e repreende-o entre ti e ele só; se te ouvir, ganhaste a teu irmão. 16 Mas, se não te ouvir, leva ainda contigo um ou dois, para que, pela boca de duas ou três testemunhas, toda palavra seja confirmada. 17 E, se não as escutar, dize-o à igreja; e, se também não escutar a igreja, considera-o como um gentio e publicano. 18 Em verdade vos digo que tudo o que ligardes na terra será ligado no céu, e tudo o que desligardes na terra será desligado no céu. 19 Também vos digo que, se dois de vós concordarem na terra acerca de qualquer coisa que pedirem, isso lhes será feito por meu Pai, que está nos céus. 20 Porque onde estiverem dois ou três reunidos em meu nome, aí estou eu no meio deles."}, "marcos": null, "lucas": null, "joao": null}, {"id": 124, "ordem": 124, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": null, "titulo": "Jesus conta a parábola do devedor inclemente", "mateus": {"referencia": "Mt 18.21-35", "texto": "21 Então, Pedro, aproximando-se dele, disse: Senhor, até quantas vezes pecará meu irmão contra mim, e eu lhe perdoarei? Até sete? 22 Jesus lhe disse: Não te digo que até sete, mas até setenta vezes sete. 23 Por isso, o Reino dos céus pode comparar-se a um certo rei que quis fazer contas com os seus servos; 24 e, começando a fazer contas, foi-lhe apresentado um que lhe devia dez mil talentos. 25 E, não tendo ele com que pagar, o seu senhor mandou que ele, e sua mulher, e seus filhos fossem vendidos, com tudo quanto tinha, para que a dívida se lhe pagasse. 26 Então, aquele servo, prostrando-se, o reverenciava, dizendo: Senhor, sê generoso para comigo, e tudo te pagarei. 27 Então, o senhor daquele servo, movido de íntima compaixão, soltou-o e perdoou-lhe a dívida. 28 Saindo, porém, aquele servo, encontrou um dos seus conservos que lhe devia cem dinheiros e, lançando mão dele, sufocava-o, dizendo: Paga-me o que me deves. 29 Então, o seu companheiro, prostrando-se a seus pés, rogava-lhe, dizendo: Sê generoso para comigo, e tudo te pagarei. 30 Ele, porém, não quis; antes, foi encerrá-lo na prisão, até que pagasse a dívida. 31 Vendo, pois, os seus conservos o que acontecia, contristaram-se muito e foram declarar ao seu senhor tudo o que se passara. 32 Então, o seu senhor, chamando-o à sua presença, disse-lhe: Servo malvado, perdoei-te toda aquela dívida, porque me suplicaste. 33 Não devias tu, igualmente, ter compaixão do teu companheiro, como eu também tive misericórdia de ti? 34 E, indignado, o seu senhor o entregou aos atormentadores, até que pagasse tudo o que devia. 35 Assim vos fará também meu Pai celestial, se do coração não perdoardes, cada um a seu irmão, as suas ofensas."}, "marcos": null, "lucas": null, "joao": null}, {"id": 125, "ordem": 125, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": null, "titulo": "Os irmãos de Jesus o ridicularizam", "mateus": null, "marcos": null, "lucas": null, "joao": {"referencia": "Jo 7.1-9", "texto": "1 E, depois disso, Jesus andava pela Galileia e já não queria andar pela Judeia, pois os judeus procuravam matá-lo. 2 E estava próxima a festa dos judeus chamada de Festa dos Tabernáculos. 3 Disseram-lhe, pois, seus irmãos: Sai daqui e vai para a Judeia, para que também os teus discípulos vejam as obras que fazes. 4 Porque não há ninguém que procure ser conhecido que faça coisa alguma em oculto. Se fazes essas coisas, manifesta-te ao mundo. 5 Porque nem mesmo seus irmãos criam nele. 6 Disse-lhes, pois, Jesus: Ainda não é chegado o meu tempo, mas o vosso tempo sempre está pronto. 7 O mundo não vos pode odiar, mas ele me odeia a mim, porquanto dele testifico que as suas obras são más. 8 Subi vós a esta festa; eu não subo ainda a esta festa, porque ainda o meu tempo não está cumprido. 9 E, havendo-lhes dito isso, ficou na Galileia."}}, {"id": 126, "ordem": 126, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Dirige-se a Jerusalém", "titulo": "Jesus viaja para a Judeia", "mateus": {"referencia": "Mt 19.1-2", "texto": "1 E aconteceu que, concluindo Jesus esses discursos, saiu da Galileia e dirigiu-se aos confins da Judeia, além do Jordão. 2 E seguiram-no muitas gentes e curou-as ali."}, "marcos": {"referencia": "Mc 10.1", "texto": "1 E, levantando-se dali, foi para o território da Judeia, além do Jordão, e a multidão se reuniu em torno dele; e tornou a ensiná-los, como tinha por costume."}, "lucas": {"referencia": "Lc 9.51", "texto": "51 E aconteceu que, completando-se os dias para a sua assunção, manifestou o firme propósito de ir a Jerusalém."}, "joao": null}, {"id": 127, "ordem": 127, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Dirige-se a Jerusalém", "titulo": "Jesus passa por Samaria", "mateus": null, "marcos": null, "lucas": {"referencia": "Lc 9.52-56", "texto": "52 E mandou mensageiros diante da sua face; e, indo eles, entraram numa aldeia de samaritanos, para lhe prepararem pousada. 53 Mas não o receberam, porque o seu aspecto era como de quem ia a Jerusalém. 54 E os discípulos Tiago e João, vendo isso, disseram: Senhor, queres que digamos que desça fogo do céu e os consuma, como Elias também fez? 55 Voltando-se, porém, repreendeu-os e disse: Vós não sabeis de que espírito sois. 56 Porque o Filho do Homem não veio para destruir as almas dos homens, mas para salvá-las. E foram para outra aldeia."}, "joao": null}, {"id": 128, "ordem": 128, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Dirige-se a Jerusalém", "titulo": "Jesus ensina sobre o preço de segui-lo", "mateus": {"referencia": "Mt 8.18-22", "texto": "18 E Jesus, vendo em torno de si uma grande multidão, ordenou que passassem para a outra margem. 19 E, aproximando-se dele um escriba, disse: Mestre, aonde quer que fores, eu te seguirei. 20 E disse Jesus: As raposas têm covis, e as aves do céu têm ninhos, mas o Filho do Homem não tem onde reclinar a cabeça. 21 E outro de seus discípulos lhe disse: Senhor, permite-me que, primeiramente, vá sepultar meu pai. 22 Jesus, porém, disse-lhe: Segue-me e deixa aos mortos sepultar os seus mortos."}, "marcos": null, "lucas": {"referencia": "Lc 9.57-62", "texto": "57 E aconteceu que, indo eles pelo caminho, lhe disse um: Senhor, seguir-te-ei para onde quer que fores. 58 E disse-lhe Jesus: As raposas têm covis, e as aves do céu, ninhos, mas o Filho do Homem não tem onde reclinar a cabeça. 59 E disse a outro: Segue-me. Mas ele respondeu: Senhor, deixa que primeiro eu vá enterrar meu pai. 60 Mas Jesus lhe observou: Deixa aos mortos o enterrar os seus mortos; porém tu, vai e anuncia o Reino de Deus. 61 Disse também outro: Senhor, eu te seguirei, mas deixa-me despedir primeiro dos que estão em minha casa. 62 E Jesus lhe disse: Ninguém que lança mão do arado e olha para trás é apto para o Reino de Deus."}, "joao": null}, {"id": 129, "ordem": 129, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Dirige-se a Jerusalém", "titulo": "Jesus ensina abertamente no Templo", "mateus": null, "marcos": null, "lucas": null, "joao": {"referencia": "Jo 7.10-31", "texto": "10 Mas, quando seus irmãos já tinham subido à festa, então, subiu ele também não manifestamente, mas como em oculto. 11 Ora, os judeus procuravam-no na festa e diziam: Onde está ele? 12 E havia grande murmuração entre a multidão a respeito dele. Diziam alguns: Ele é bom. E outros diziam: Não; antes, engana o povo. 13 Todavia, ninguém falava dele abertamente, por medo dos judeus. 14 Mas, no meio da festa, subiu Jesus ao templo e ensinava. 15 E os judeus maravilhavam-se, dizendo: Como sabe este letras, não as tendo aprendido? 16 Jesus respondeu e disse-lhes: A minha doutrina não é minha, mas daquele que me enviou. 17 Se alguém quiser fazer a vontade dele, pela mesma doutrina, conhecerá se ela é de Deus ou se eu falo de mim mesmo. 18 Quem fala de si mesmo busca a sua própria glória, mas o que busca a glória daquele que o enviou, esse é verdadeiro, e não há nele injustiça. 19 Não vos deu Moisés a lei? E nenhum de vós observa a lei. Por que procurais matar-me? 20 A multidão respondeu e disse: Tens demônio; quem procura matar-te? 21 Respondeu Jesus e disse-lhes: Fiz uma obra, e todos vos maravilhais. 22 Pelo motivo de que Moisés vos deu a circuncisão (não que fosse de Moisés, mas dos pais), no sábado circuncidais um homem. 23 Se o homem recebe a circuncisão no sábado, para que a lei de Moisés não seja quebrantada, indignais-vos contra mim, porque, no sábado, curei de todo um homem? 24 Não julgueis segundo a aparência, mas julgai segundo a reta justiça. 25 Então, alguns dos de Jerusalém diziam: Não é este o que procuram matar? 26 E ei-lo aí está falando abertamente, e nada lhe dizem. Porventura, sabem, verdadeiramente, os príncipes, que este é o Cristo? 27 Todavia, bem sabemos de onde este é; mas, quando vier o Cristo, ninguém saberá de onde ele é. 28 Clamava, pois, Jesus no templo, ensinando e dizendo: Vós me conheceis e sabeis de onde sou; e eu não vim de mim mesmo, mas aquele que me enviou é verdadeiro, o qual vós não conheceis. 29 Mas eu conheço-o, porque dele sou, e ele me enviou. 30 Procuravam, pois, prendê-lo, mas ninguém lançou mão dele, porque ainda não era chegada a sua hora. 31 E muitos da multidão creram nele e diziam: Quando o Cristo vier, fará ainda mais sinais do que os que este tem feito?"}}, {"id": 130, "ordem": 130, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Dirige-se a Jerusalém", "titulo": "Os líderes religiosos tentam prender Jesus", "mateus": null, "marcos": null, "lucas": null, "joao": {"referencia": "Jo 7.32-53", "texto": "32 Os fariseus ouviram que a multidão murmurava dele essas coisas; e os fariseus e os principais dos sacerdotes mandaram servidores para o prenderem. 33 Disse-lhes, pois, Jesus: Ainda um pouco de tempo estou convosco e, depois, vou para aquele que me enviou. 34 Vós me buscareis e não me achareis; e aonde eu estou vós não podeis vir. 35 Disseram, pois, os judeus uns para os outros: Para onde irá este, que o não acharemos? Irá, porventura, para os dispersos entre os gregos e ensinará os gregos? 36 Que palavra é esta que disse: Buscar-me-eis e não me achareis; e: Aonde eu estou, vós não podeis ir? 37 E, no último dia, o grande dia da festa, Jesus pôs-se em pé e clamou, dizendo: Se alguém tem sede, que venha a mim e beba. 38 Quem crê em mim, como diz a Escritura, rios de água viva correrão do seu ventre. 39 E isso disse ele do Espírito, que haviam de receber os que nele cressem; porque o Espírito Santo ainda não fora dado, por ainda Jesus não ter sido glorificado. 40 Então, muitos da multidão, ouvindo essa palavra, diziam: Verdadeiramente, este é o Profeta. 41 Outros diziam: Este é o Cristo; mas diziam outros: Vem, pois, o Cristo da Galileia? 42 Não diz a Escritura que o Cristo vem da descendência de Davi e de Belém, da aldeia de onde era Davi? 43 Assim, entre o povo havia dissensão por causa dele. 44 E alguns deles queriam prendê-lo, mas ninguém lançou mão dele. 45 E os servidores foram ter com os principais dos sacerdotes e fariseus; e eles lhes perguntaram: Por que o não trouxestes? 46 Responderam os servidores: Nunca homem algum falou assim como este homem. 47 Responderam-lhes, pois, os fariseus: Também vós fostes enganados? 48 Creu nele, porventura, algum dos principais ou dos fariseus? 49 Mas esta multidão, que não sabe a lei, é maldita. 50 Nicodemos, que era um deles (o que de noite fora ter com Jesus), disse-lhes: 51 Porventura, condena a nossa lei um homem sem primeiro o ouvir e ter conhecimento do que faz? 52 Responderam eles e disseram-lhe: És tu também da Galileia? Examina e verás que da Galileia nenhum profeta surgiu. 53 E cada um foi para sua casa."}}, {"id": 131, "ordem": 131, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Dirige-se a Jerusalém", "titulo": "Jesus perdoa uma mulher adúltera", "mateus": null, "marcos": null, "lucas": null, "joao": {"referencia": "Jo 8.1-11", "texto": "1 Porém Jesus foi para o monte das Oliveiras. 2 E, pela manhã cedo, voltou para o templo, e todo o povo vinha ter com ele, e, assentando-se, os ensinava. 3 E os escribas e fariseus trouxeram-lhe uma mulher apanhada em adultério. 4 E, pondo-a no meio, disseram-lhe: Mestre, esta mulher foi apanhada, no próprio ato, adulterando, 5 e, na lei, nos mandou Moisés que as tais sejam apedrejadas. Tu, pois, que dizes? 6 Isso diziam eles, tentando-o, para que tivessem de que o acusar. Mas Jesus, inclinando-se, escrevia com o dedo na terra. 7 E, como insistissem, perguntando-lhe, endireitou-se e disse-lhes: Aquele que dentre vós está sem pecado seja o primeiro que atire pedra contra ela. 8 E, tornando a inclinar-se, escrevia na terra. 9 Quando ouviram isso, saíram um a um, a começar pelos mais velhos até aos últimos; ficaram só Jesus e a mulher, que estava no meio. 10 E, endireitando-se Jesus e não vendo ninguém mais do que a mulher, disse-lhe: Mulher, onde estão aqueles teus acusadores? Ninguém te condenou? 11 E ela disse: Ninguém, Senhor. E disse-lhe Jesus: Nem eu também te condeno; vai-te e não peques mais."}}, {"id": 132, "ordem": 132, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Dirige-se a Jerusalém", "titulo": "Jesus é a luz do mundo", "mateus": null, "marcos": null, "lucas": null, "joao": {"referencia": "Jo 8.12-20", "texto": "12 Falou-lhes, pois, Jesus outra vez, dizendo: Eu sou a luz do mundo; quem me segue não andará em trevas, mas terá a luz da vida. 13 Disseram-lhe, pois, os fariseus: Tu testificas de ti mesmo; o teu testemunho não é verdadeiro. 14 Respondeu Jesus e disse-lhes: Ainda que eu testifico de mim mesmo, o meu testemunho é verdadeiro, porque sei de onde vim e para onde vou; mas vós não sabeis de onde vim, nem para onde vou. 15 Vós julgais segundo a carne, eu a ninguém julgo. 16 E, se, na verdade, julgo, o meu juízo é verdadeiro, porque não sou eu só, mas eu e o Pai, que me enviou. 17 E na vossa lei está também escrito que o testemunho de dois homens é verdadeiro. 18 Eu sou o que testifico de mim mesmo, e de mim testifica também o Pai, que me enviou. 19 Disseram-lhe, pois: Onde está teu Pai? Jesus respondeu: Não me conheceis a mim, nem a meu Pai; se vós me conhecêsseis a mim, também conheceríeis a meu Pai. 20 Essas palavras disse Jesus no lugar do tesouro, ensinando no templo, e ninguém o prendeu, porque ainda não era chegada a sua hora."}}, {"id": 133, "ordem": 133, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Dirige-se a Jerusalém", "titulo": "Jesus adverte do juízo vindouro", "mateus": null, "marcos": null, "lucas": null, "joao": {"referencia": "Jo 8.21-30", "texto": "21 Disse-lhes, pois, Jesus outra vez: Eu retiro-me, e buscar-me-eis e morrereis no vosso pecado. Para onde eu vou não podeis vós ir. 22 Diziam, pois, os judeus: Porventura, quererá matar-se a si mesmo, pois diz: Para onde eu vou não podeis vós ir? 23 E dizia-lhes: Vós sois de baixo, eu sou de cima; vós sois deste mundo, eu não sou deste mundo. 24 Por isso, vos disse que morrereis em vossos pecados, porque, se não crerdes que eu sou, morrereis em vossos pecados. 25 Disseram-lhe, pois: Quem és tu? Jesus lhes disse: Isso mesmo que já desde o princípio vos disse. 26 Muito tenho que dizer e julgar de vós, mas aquele que me enviou é verdadeiro; e o que dele tenho ouvido, isso falo ao mundo. 27 Mas não entenderam que ele lhes falava do Pai. 28 Disse-lhes, pois, Jesus: Quando levantardes o Filho do Homem, então, conhecereis quem eu sou e que nada faço por mim mesmo; mas falo como o Pai me ensinou. 29 E aquele que me enviou está comigo; o Pai não me tem deixado só, porque eu faço sempre o que lhe agrada. 30 Dizendo ele essas coisas, muitos creram nele."}}, {"id": 134, "ordem": 134, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Dirige-se a Jerusalém", "titulo": "Jesus fala sobre os verdadeiros filhos de Deus", "mateus": null, "marcos": null, "lucas": null, "joao": {"referencia": "Jo 8.31-47", "texto": "31 Jesus dizia, pois, aos judeus que criam nele: Se vós permanecerdes na minha palavra, verdadeiramente, sereis meus discípulos 32 e conhecereis a verdade, e a verdade vos libertará. 33 Responderam-lhe: Somos descendência de Abraão, e nunca servimos a ninguém; como dizes tu: Sereis livres? 34 Respondeu-lhes Jesus: Em verdade, em verdade vos digo que todo aquele que comete pecado é servo do pecado. 35 Ora, o servo não fica para sempre em casa; o Filho fica para sempre. 36 Se, pois, o Filho vos libertar, verdadeiramente, sereis livres. 37 Bem sei que sois descendência de Abraão; contudo, procurais matar-me, porque a minha palavra não entra em vós. 38 Eu falo do que vi junto de meu Pai, e vós fazeis o que também vistes junto de vosso pai. 39 Responderam e disseram-lhe: Nosso pai é Abraão. Jesus disse-lhes: Se fôsseis filhos de Abraão, faríeis as obras de Abraão. 40 Mas, agora, procurais matar-me a mim, homem que vos tem dito a verdade que de Deus tem ouvido; Abraão não fez isso. 41 Vós fazeis as obras de vosso pai. Disseram-lhe, pois: Nós não somos nascidos de prostituição; temos um Pai, que é Deus. 42 Disse-lhes, pois, Jesus: Se Deus fosse o vosso Pai, certamente, me amaríeis, pois que eu saí e vim de Deus; não vim de mim mesmo, mas ele me enviou. 43 Por que não entendeis a minha linguagem? Por não poderdes ouvir a minha palavra. 44 Vós tendes por pai ao diabo e quereis satisfazer os desejos de vosso pai; ele foi homicida desde o princípio e não se firmou na verdade, porque não há verdade nele; quando ele profere mentira, fala do que lhe é próprio, porque é mentiroso e pai da mentira. 45 Mas porque vos digo a verdade, não me credes. 46 Quem dentre vós me convence de pecado? E, se vos digo a verdade, por que não credes? 47 Quem é de Deus escuta as palavras de Deus; por isso, vós não as escutais, porque não sois de Deus."}}, {"id": 135, "ordem": 135, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Dirige-se a Jerusalém", "titulo": "Jesus declara que é eterno", "mateus": null, "marcos": null, "lucas": null, "joao": {"referencia": "Jo 8.48-59", "texto": "48 Responderam, pois, os judeus e disseram-lhe: Não dizemos nós bem que és samaritano e que tens demônio? 49 Jesus respondeu: Eu não tenho demônio; antes, honro a meu Pai, e vós me desonrais. 50 Eu não busco a minha glória; há quem a busque e julgue. 51 Em verdade, em verdade vos digo que, se alguém guardar a minha palavra, nunca verá a morte. 52 Disseram-lhe, pois, os judeus: Agora, conhecemos que tens demônio. Morreu Abraão e os profetas; e tu dizes: Se alguém guardar a minha palavra, nunca provará a morte. 53 És tu maior do que Abraão, o nosso pai, que morreu? E também os profetas morreram; quem te fazes tu ser? 54 Jesus respondeu: Se eu me glorifico a mim mesmo, a minha glória não é nada; quem me glorifica é meu Pai, o qual dizeis que é vosso Deus. 55 E vós não o conheceis, mas eu conheço-o; e, se disser que não o conheço, serei mentiroso como vós; mas conheço-o e guardo a sua palavra. 56 Abraão, vosso pai, exultou por ver o meu dia, e viu-o, e alegrou-se. 57 Disseram-lhe, pois, os judeus: Ainda não tens cinquenta anos e viste Abraão? 58 Disse-lhes Jesus: Em verdade, em verdade vos digo que, antes que Abraão existisse, eu sou. 59 Então, pegaram em pedras para lhe atirarem; mas Jesus ocultou-se, e saiu do templo, passando pelo meio deles, e assim se retirou."}}, {"id": 136, "ordem": 136, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Dirige-se a Jerusalém", "titulo": "Jesus envia setenta e dois mensageiros", "mateus": null, "marcos": null, "lucas": {"referencia": "Lc 10.1-16", "texto": "1 E, depois disso, designou o Senhor ainda outros setenta e mandou-os adiante da sua face, de dois em dois, a todas as cidades e lugares aonde ele havia de ir. 2 E dizia-lhes: Grande é, em verdade, a seara, mas os obreiros são poucos; rogai, pois, ao Senhor da seara que envie obreiros para a sua seara. 3 Ide; eis que vos mando como cordeiros ao meio de lobos. 4 E não leveis bolsa, nem alforje, nem sandálias; e a ninguém saudeis pelo caminho. 5 E, em qualquer casa onde entrardes, dizei primeiro: Paz seja nesta casa. 6 E, se ali houver algum filho de paz, repousará sobre ele a vossa paz; e, se não, voltará para vós. 7 E ficai na mesma casa, comendo e bebendo do que eles tiverem, pois digno é o obreiro de seu salário. Não andeis de casa em casa. 8 E, em qualquer cidade em que entrardes e vos receberem, comei do que vos puserem diante. 9 E curai os enfermos que nela houver e dizei-lhes: É chegado a vós o Reino de Deus. 10 Mas, em qualquer cidade em que entrardes e vos não receberem, saindo por suas ruas, dizei: 11 Até o pó que da vossa cidade se nos pegou sacudimos sobre vós. Sabei, contudo, isto: já o Reino de Deus é chegado a vós. 12 E digo-vos que mais tolerância haverá naquele dia para Sodoma do que para aquela cidade. 13 Ai de ti, Corazim, ai de ti, Betsaida! Porque, se em Tiro e em Sidom se fizessem as maravilhas que em vós foram feitas, já há muito, assentadas em saco de pano grosseiro e cinza, se teriam arrependido. 14 Portanto, para Tiro e Sidom haverá menos rigor no Dia do Juízo do que para vós. 15 E tu, Cafarnaum, serás levantada até ao céu? Até ao inferno serás abatida. 16 Quem vos ouve a vós a mim me ouve; e quem vos rejeita a vós a mim me rejeita; e quem a mim me rejeita rejeita aquele que me enviou."}, "joao": null}, {"id": 137, "ordem": 137, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Dirige-se a Jerusalém", "titulo": "Os setenta e dois mensageiros retornam", "mateus": null, "marcos": null, "lucas": {"referencia": "Lc 10.17-24", "texto": "17 E voltaram os setenta com alegria, dizendo: Senhor, pelo teu nome, até os demônios se nos sujeitam. 18 E disse-lhes: Eu via Satanás, como raio, cair do céu. 19 Eis que vos dou poder para pisar serpentes, e escorpiões, e toda a força do Inimigo, e nada vos fará dano algum. 20 Mas não vos alegreis porque se vos sujeitem os espíritos; alegrai-vos, antes, por estar o vosso nome escrito nos céus. 21 Naquela mesma hora, se alegrou Jesus no Espírito Santo e disse: Graças te dou, ó Pai, Senhor do céu e da terra, porque escondeste essas coisas aos sábios e inteligentes e as revelaste às criancinhas; assim é, ó Pai, porque assim te aprouve. 22 Tudo por meu Pai me foi entregue; e ninguém conhece quem é o Filho, senão o Pai, nem quem é o Pai, senão o Filho e aquele a quem o Filho o quiser revelar. 23 E, voltando-se para os discípulos, disse-lhes em particular: Bem-aventurados os olhos que veem o que vós vedes, 24 pois vos digo que muitos profetas e reis desejaram ver o que vós vedes e não o viram; e ouvir o que ouvis e não o ouviram."}, "joao": null}, {"id": 138, "ordem": 138, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Dirige-se a Jerusalém", "titulo": "Jesus conta a parábola do bom samaritano", "mateus": null, "marcos": null, "lucas": {"referencia": "Lc 10.25-37", "texto": "25 E eis que se levantou um certo doutor da lei, tentando-o e dizendo: Mestre, que farei para herdar a vida eterna? 26 E ele lhe disse: Que está escrito na lei? Como lês? 27 E, respondendo ele, disse: Amarás ao Senhor, teu Deus, de todo o teu coração, e de toda a tua alma, e de todas as tuas forças, e de todo o teu entendimento e ao teu próximo como a ti mesmo. 28 E disse-lhe: Respondeste bem; faze isso e viverás. 29 Ele, porém, querendo justificar-se a si mesmo, disse a Jesus: E quem é o meu próximo? 30 E, respondendo Jesus, disse: Descia um homem de Jerusalém para Jericó, e caiu nas mãos dos salteadores, os quais o despojaram e, espancando-o, se retiraram, deixando-o meio morto. 31 E, ocasionalmente, descia pelo mesmo caminho certo sacerdote; e, vendo-o, passou de largo. 32 E, de igual modo, também um levita, chegando àquele lugar e vendo-o, passou de largo. 33 Mas um samaritano que ia de viagem chegou ao pé dele e, vendo-o, moveu-se de íntima compaixão. 34 E, aproximando-se, atou-lhe as feridas, aplicando-lhes azeite e vinho; e, pondo-o sobre a sua cavalgadura, levou-o para uma estalagem e cuidou dele; 35 E, partindo ao outro dia, tirou dois dinheiros, e deu-os ao hospedeiro, e disse-lhe: Cuida dele, e tudo o que de mais gastares eu to pagarei, quando voltar. 36 Qual, pois, destes três te parece que foi o próximo daquele que caiu nas mãos dos salteadores? 37 E ele disse: O que usou de misericórdia para com ele. Disse, pois, Jesus: Vai e faze da mesma maneira."}, "joao": null}, {"id": 139, "ordem": 139, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Dirige-se a Jerusalém", "titulo": "Jesus visita Marta e Maria", "mateus": null, "marcos": null, "lucas": {"referencia": "Lc 10.38-42", "texto": "38 E aconteceu que, indo eles de caminho, entrou numa aldeia; e certa mulher, por nome Marta, o recebeu em sua casa. 39 E tinha esta uma irmã, chamada Maria, a qual, assentando-se também aos pés de Jesus, ouvia a sua palavra. 40 Marta, porém, andava distraída em muitos serviços e, aproximando-se, disse: Senhor, não te importas que minha irmã me deixe servir só? Dize-lhe, pois, que me ajude. 41 E, respondendo Jesus, disse-lhe: Marta, Marta, estás ansiosa e afadigada com muitas coisas, 42 mas uma só é necessária; e Maria escolheu a boa parte, a qual não lhe será tirada."}, "joao": null}, {"id": 140, "ordem": 140, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Dirige-se a Jerusalém", "titulo": "Jesus instrui seus discípulos sobre a oração", "mateus": null, "marcos": null, "lucas": {"referencia": "Lc 11.1-13", "texto": "1 E aconteceu que, estando ele a orar num certo lugar, quando acabou, lhe disse um dos seus discípulos: Senhor, ensina-nos a orar, como também João ensinou aos seus discípulos. 2 E ele lhes disse: Quando orardes, dizei: Pai, santificado seja o teu nome; venha o teu Reino; 3 dá-nos cada dia o nosso pão cotidiano; 4 perdoa-nos os nossos pecados, pois também nós perdoamos a qualquer que nos deve; e não nos conduzas em tentação, mas livra-nos do mal. 5 Disse-lhes também: Qual de vós terá um amigo e, se for procurá-lo à meia-noite, lhe disser: Amigo, empresta-me três pães, 6 pois que um amigo meu chegou a minha casa, vindo de caminho, e não tenho o que apresentar-lhe; 7 se ele, respondendo de dentro, disser: Não me importunes; já está a porta fechada, e os meus filhos estão comigo na cama; não posso levantar-me para tos dar. 8 Digo-vos que, ainda que se não levante a dar-lhos por ser seu amigo, levantar-se-á, todavia, por causa da sua importunação e lhe dará tudo o que houver mister. 9 E eu vos digo a vós: Pedi, e dar-se-vos-á; buscai, e achareis; batei, e abrir-se-vos-á; 10 porque qualquer que pede recebe; e quem busca acha; e a quem bate, abrir-se-lhe-á. 11 E qual o pai dentre vós que, se o filho lhe pedir pão, lhe dará uma pedra? Ou também, se lhe pedir peixe, lhe dará por peixe uma serpente? 12 Ou também, se lhe pedir um ovo, lhe dará um escorpião? 13 Pois, se vós, sendo maus, sabeis dar boas dádivas aos vossos filhos, quanto mais dará o Pai celestial o Espírito Santo àqueles que lho pedirem?"}, "joao": null}, {"id": 141, "ordem": 141, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Dirige-se a Jerusalém", "titulo": "Jesus ensina sobre a luz interior", "mateus": null, "marcos": null, "lucas": {"referencia": "Lc 11.33-36", "texto": "33 E ninguém, acendendo uma candeia, a põe em oculto, nem debaixo do alqueire, mas no velador, para que os que entram vejam a luz. 34 A candeia do corpo é o olho. Sendo, pois, o teu olho simples, também todo o teu corpo será luminoso; mas, se for mau, também o teu corpo será tenebroso. 35 Vê, pois, que a luz que em ti há não sejam trevas. 36 Se, pois, todo o teu corpo é luminoso, não tendo em trevas parte alguma, todo será luminoso, como quando a candeia te alumia com o seu resplendor."}, "joao": null}, {"id": 142, "ordem": 142, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Dirige-se a Jerusalém", "titulo": "Jesus critica os líderes religiosos", "mateus": null, "marcos": null, "lucas": {"referencia": "Lc 11.37-54", "texto": "37 E, estando ele ainda falando, rogou-lhe um fariseu que fosse jantar com ele; e, entrando, assentou-se à mesa. 38 Mas o fariseu admirou-se, vendo que se não lavara antes do jantar. 39 E o Senhor lhe disse: Agora, vós, fariseus, limpais o exterior do copo e do prato, mas o vosso interior está cheio de rapina e maldade. 40 Loucos! O que fez o exterior não fez também o interior? 41 Dai, antes, esmola do que tiverdes, e eis que tudo vos será limpo. 42 Mas ai de vós, fariseus, que dizimais a hortelã, e a arruda, e toda hortaliça e desprezais o Juízo e o amor de Deus! Importava fazer essas coisas e não deixar as outras. 43 Ai de vós, fariseus, que amais os primeiros assentos nas sinagogas e as saudações nas praças! 44 Ai de vós, escribas e fariseus hipócritas, que sois como as sepulturas que não aparecem, e os homens que sobre elas andam não o sabem! 45 E, respondendo um dos doutores da lei, disse-lhe: Mestre, quando dizes isso também nos afrontas a nós. 46 E ele lhe disse: Ai de vós também, doutores da lei, que carregais os homens com cargas difíceis de transportar, e vós mesmos nem ainda com um dos vossos dedos tocais essas cargas! 47 Ai de vós que edificais os sepulcros dos profetas, e vossos pais os mataram! 48 Bem testificais, pois, que consentis nas obras de vossos pais; porque eles os mataram, e vós edificais os seus sepulcros. 49 Por isso, diz também a sabedoria de Deus: Profetas e apóstolos lhes mandarei; e eles matarão uns e perseguirão outros; 50 para que desta geração seja requerido o sangue de todos os profetas que, desde a fundação do mundo, foi derramado; 51 desde o sangue de Abel até ao sangue de Zacarias, que foi morto entre o altar e o templo; assim, vos digo, será requerido desta geração. 52 Ai de vós, doutores da lei, que tirastes a chave da ciência! Vós mesmos não entrastes e impedistes os que entravam. 53 E, dizendo-lhes ele isso, começaram os escribas e os fariseus a apertá-lo fortemente e a fazê-lo falar acerca de muitas coisas, 54 armando-lhe ciladas, a fim de apanharem da sua boca alguma coisa para o acusarem."}, "joao": null}, {"id": 143, "ordem": 143, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Dirige-se a Jerusalém", "titulo": "Jesus fala contra a hipocrisia", "mateus": null, "marcos": null, "lucas": {"referencia": "Lc 12.1-12", "texto": "1 Ajuntando-se, entretanto, muitos milhares de pessoas, de sorte que se atropelavam uns aos outros, começou a dizer aos seus discípulos: Acautelai-vos, primeiramente, do fermento dos fariseus, que é a hipocrisia. 2 Mas nada há encoberto que não haja de ser descoberto; nem oculto, que não haja de ser sabido. 3 Porquanto tudo o que em trevas dissestes à luz será ouvido; e o que falastes ao ouvido no gabinete sobre os telhados será apregoado. 4 E digo-vos, amigos meus: não temais os que matam o corpo e depois não têm mais o que fazer. 5 Mas eu vos mostrarei a quem deveis temer: temei aquele que, depois de matar, tem poder para lançar no inferno; sim, vos digo, a esse temei. 6 Não se vendem cinco passarinhos por dois ceitis? E nenhum deles está esquecido diante de Deus. 7 E até os cabelos da vossa cabeça estão todos contados. Não temais, pois; mais valeis vós do que muitos passarinhos. 8 E digo-vos que todo aquele que me confessar diante dos homens, também o Filho do Homem o confessará diante dos anjos de Deus. 9 Mas quem me negar diante dos homens será negado diante dos anjos de Deus. 10 E a todo aquele que disser uma palavra contra o Filho do Homem ser-lhe-á perdoada, mas ao que blasfemar contra o Espírito Santo não lhe será perdoado. 11 E, quando vos conduzirem às sinagogas, aos magistrados e potestades, não estejais solícitos de como ou do que haveis de responder, nem do que haveis de dizer. 12 Porque na mesma hora vos ensinará o Espírito Santo o que vos convenha falar."}, "joao": null}, {"id": 144, "ordem": 144, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Dirige-se a Jerusalém", "titulo": "Jesus conta a parábola do rico insensato", "mateus": null, "marcos": null, "lucas": {"referencia": "Lc 12.13-21", "texto": "13 E disse-lhe um da multidão: Mestre, dize a meu irmão que reparta comigo a herança. 14 Mas ele lhe disse: Homem, quem me pôs a mim por juiz ou repartidor entre vós? 15 E disse-lhes: Acautelai-vos e guardai-vos da avareza, porque a vida de qualquer não consiste na abundância do que possui. 16 E propôs-lhes uma parábola, dizendo: a herdade de um homem rico tinha produzido com abundância. 17 E arrazoava ele entre si, dizendo: Que farei? Não tenho onde recolher os meus frutos. 18 E disse: Farei isto: derribarei os meus celeiros, e edificarei outros maiores, e ali recolherei todas as minhas novidades e os meus bens; 19 e direi à minha alma: alma, tens em depósito muitos bens, para muitos anos; descansa, come, bebe e folga. 20 Mas Deus lhe disse: Louco, esta noite te pedirão a tua alma, e o que tens preparado para quem será? 21 Assim é aquele que para si ajunta tesouros e não é rico para com Deus."}, "joao": null}, {"id": 145, "ordem": 145, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Dirige-se a Jerusalém", "titulo": "Jesus adverte da preocupação", "mateus": null, "marcos": null, "lucas": {"referencia": "Lc 12.22-34", "texto": "22 E disse aos seus discípulos: Portanto, vos digo: não estejais apreensivos pela vossa vida, sobre o que comereis, nem pelo corpo, sobre o que vestireis. 23 Mais é a vida do que o sustento, e o corpo, mais do que as vestes. 24 Considerai os corvos, que nem semeiam, nem segam, nem têm despensa nem celeiro, e Deus os alimenta; quanto mais valeis vós do que as aves? 25 E qual de vós, sendo solícito, pode acrescentar um côvado à sua estatura? 26 Pois, se nem ainda podeis as coisas mínimas, por que estais ansiosos pelas outras? 27 Considerai os lírios, como eles crescem; não trabalham, nem fiam; e digo-vos que nem ainda Salomão, em toda a sua glória, se vestiu como um deles. 28 E, se Deus assim veste a erva, que hoje está no campo e amanhã é lançada no forno, quanto mais a vós, homens de pequena fé? 29 Não pergunteis, pois, que haveis de comer ou que haveis de beber, e não andeis inquietos. 30 Porque os gentios do mundo buscam todas essas coisas; mas vosso Pai sabe que necessitais delas. 31 Buscai, antes, o Reino de Deus, e todas essas coisas vos serão acrescentadas. 32 Não temas, ó pequeno rebanho, porque a vosso Pai agradou dar-vos o Reino. 33 Vendei o que tendes, e dai esmolas, e fazei para vós bolsas que não se envelheçam, tesouro nos céus que nunca acabe, aonde não chega ladrão, e a traça não rói. 34 Porque onde estiver o vosso tesouro, ali estará também o vosso coração."}, "joao": null}, {"id": 146, "ordem": 146, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Dirige-se a Jerusalém", "titulo": "Jesus adverte dos preparativos para sua vinda", "mateus": null, "marcos": null, "lucas": {"referencia": "Lc 12.35-48", "texto": "35 Estejam cingidos os vossos lombos, e acesas, as vossas candeias. 36 E sede vós semelhantes aos homens que esperam o seu senhor, quando houver de voltar das bodas, para que, quando vier e bater, logo possam abrir-lhe. 37 Bem-aventurados aqueles servos, os quais, quando o Senhor vier, achar vigiando! Em verdade vos digo que se cingirá, e os fará assentar à mesa, e, chegando-se, os servirá. 38 E, se vier na segunda vigília, e se vier na terceira vigília, e os achar assim, bem-aventurados são os tais servos. 39 Sabei, porém, isto: se o pai de família soubesse a que hora havia de vir o ladrão, vigiaria e não deixaria minar a sua casa. 40 Portanto, estai vós também apercebidos; porque virá o Filho do Homem à hora que não imaginais. 41 E disse-lhe Pedro: Senhor, dizes essa parábola a nós ou também a todos? 42 E disse o Senhor: Qual é, pois, o mordomo fiel e prudente, a quem o senhor pôs sobre os seus servos, para lhes dar a tempo a ração? 43 Bem-aventurado aquele servo a quem o senhor, quando vier, achar fazendo assim. 44 Em verdade vos digo que sobre todos os seus bens o porá. 45 Mas, se aquele servo disser em seu coração: O meu senhor tarda em vir, e começar a espancar os criados e criadas, e a comer, e a beber, e a embriagar-se, 46 virá o Senhor daquele servo no dia em que o não espera e numa hora que ele não sabe, e separá-lo-á, e lhe dará a sua parte com os infiéis. 47 E o servo que soube a vontade do seu senhor e não se aprontou, nem fez conforme a sua vontade, será castigado com muitos açoites. 48 Mas o que a não soube e fez coisas dignas de açoites com poucos açoites será castigado. E a qualquer que muito for dado, muito se lhe pedirá, e ao que muito se lhe confiou, muito mais se lhe pedirá."}, "joao": null}, {"id": 147, "ordem": 147, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Dirige-se a Jerusalém", "titulo": "Jesus adverte da divisão vindoura", "mateus": null, "marcos": null, "lucas": {"referencia": "Lc 12.49-53", "texto": "49 Vim lançar fogo na terra e que mais quero, se já está aceso? 50 Importa, porém, que eu seja batizado com um certo batismo, e como me angustio até que venha a cumprir-se! 51 Cuidais vós que vim trazer paz à terra? Não, vos digo, mas, antes, dissensão. 52 Porque, daqui em diante, estarão cinco divididos numa casa: três contra dois, e dois contra três. 53 O pai estará dividido contra o filho, e o filho, contra o pai, a mãe, contra a filha, e a filha, contra a mãe, a sogra, contra sua nora, e a nora, contra sua sogra."}, "joao": null}, {"id": 148, "ordem": 148, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Dirige-se a Jerusalém", "titulo": "Jesus adverte da crise futura", "mateus": null, "marcos": null, "lucas": {"referencia": "Lc 12.54-59", "texto": "54 E dizia também à multidão: Quando vedes a nuvem que vem do ocidente, logo dizeis: Lá vem chuva; e assim sucede. 55 E, quando assopra o vento sul, dizeis: Haverá calma; e assim sucede. 56 Hipócritas, sabeis discernir a face da terra e do céu; como não sabeis, então, discernir este tempo? 57 E por que não julgais também por vós mesmos o que é justo? 58 Quando, pois, vais com o teu adversário ao magistrado, procura livrar-te dele no caminho; para que não suceda que te conduza ao juiz, e o juiz te entregue ao meirinho, e o meirinho te encerre na prisão. 59 Digo-te que não sairás dali enquanto não pagares o derradeiro ceitil."}, "joao": null}, {"id": 149, "ordem": 149, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Dirige-se a Jerusalém", "titulo": "Jesus chama o povo ao arrependimento", "mateus": null, "marcos": null, "lucas": {"referencia": "Lc 13.1-9", "texto": "1 E, naquele mesmo tempo, estavam presentes ali alguns que lhe falavam dos galileus cujo sangue Pilatos misturara com os seus sacrifícios. 2 E, respondendo Jesus, disse-lhes: Cuidais vós que esses galileus foram mais pecadores do que todos os galileus, por terem padecido tais coisas? 3 Não, vos digo; antes, se vos não arrependerdes, todos de igual modo perecereis. 4 E aqueles dezoito sobre os quais caiu a torre de Siloé e os matou, cuidais que foram mais culpados do que todos quantos homens habitam em Jerusalém? 5 Não, vos digo; antes, se vos não arrependerdes, todos de igual modo perecereis. 6 E dizia esta parábola: Um certo homem tinha uma figueira plantada na sua vinha e foi procurar nela fruto, não o achando. 7 E disse ao vinhateiro: Eis que há três anos venho procurar fruto nesta figueira e não o acho; corta-a. Por que ela ocupa ainda a terra inutilmente? 8 E, respondendo ele, disse-lhe: Senhor, deixa-a este ano, até que eu a escave e a esterque; 9 e, se der fruto, ficará; e, se não, depois a mandarás cortar."}, "joao": null}, {"id": 150, "ordem": 150, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Dirige-se a Jerusalém", "titulo": "Jesus cura uma mulher aleijada", "mateus": null, "marcos": null, "lucas": {"referencia": "Lc 13.10-17", "texto": "10 E ensinava no sábado, numa das sinagogas. 11 E eis que estava ali uma mulher que tinha um espírito de enfermidade havia já dezoito anos; e andava curvada e não podia de modo algum endireitar-se. 12 E, vendo-a Jesus, chamou-a a si, e disse-lhe: Mulher, estás livre da tua enfermidade. 13 E impôs as mãos sobre ela, e logo se endireitou e glorificava a Deus. 14 E, tomando a palavra o príncipe da sinagoga, indignado porque Jesus curava no sábado, disse à multidão: Seis dias há em que é mister trabalhar; nestes, pois, vinde para serdes curados e não no dia de sábado. 15 Respondeu-lhe, porém, o Senhor e disse: Hipócrita, no sábado não desprende da manjedoura cada um de vós o seu boi ou jumento e não o leva a beber água? 16 E não convinha soltar desta prisão, no dia de sábado, esta filha de Abraão, a qual há dezoito anos Satanás mantinha presa? 17 E, dizendo ele isso, todos os seus adversários ficaram envergonhados, e todo o povo se alegrava por todas as coisas gloriosas que eram feitas por ele."}, "joao": null}, {"id": 151, "ordem": 151, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Dirige-se a Jerusalém", "titulo": "Jesus cura um cego de nascença", "mateus": null, "marcos": null, "lucas": null, "joao": {"referencia": "Jo 9.1-12", "texto": "1 E, passando Jesus, viu um homem cego de nascença. 2 E os seus discípulos lhe perguntaram, dizendo: Rabi, quem pecou, este ou seus pais, para que nascesse cego? 3 Jesus respondeu: Nem ele pecou, nem seus pais; mas foi assim para que se manifestem nele as obras de Deus. 4 Convém que eu faça as obras daquele que me enviou, enquanto é dia; a noite vem, quando ninguém pode trabalhar. 5 Enquanto estou no mundo, sou a luz do mundo. 6 Tendo dito isso, cuspiu na terra, e, com a saliva, fez lodo, e untou com o lodo os olhos do cego. 7 E disse-lhe: Vai, lava-te no tanque de Siloé (que significa o Enviado). Foi, pois, e lavou-se, e voltou vendo. 8 Então, os vizinhos e aqueles que dantes tinham visto que era cego diziam: Não é este aquele que estava assentado e mendigava? 9 Uns diziam: É este. E outros: Parece-se com ele. Ele dizia: Sou eu. 10 Diziam-lhe, pois: Como se te abriram os olhos? 11 Ele respondeu e disse-lhes: O homem chamado Jesus fez lodo, e untou-me os olhos, e disse-me: Vai ao tanque de Siloé e lava-te. Então, fui, e lavei-me, e vi. 12 Disseram-lhe, pois: Onde está ele? Respondeu: Não sei."}}, {"id": 152, "ordem": 152, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Dirige-se a Jerusalém", "titulo": "Os líderes religiosos questionam o homem que fora cego", "mateus": null, "marcos": null, "lucas": null, "joao": {"referencia": "Jo 9.13-34", "texto": "13 Levaram, pois, aos fariseus o que dantes era cego. 14 E era sábado quando Jesus fez o lodo e lhe abriu os olhos. 15 Tornaram, pois, também os fariseus a perguntar-lhe como vira, e ele lhes disse: Pôs-me lodo sobre os olhos, lavei-me e vejo. 16 Então, alguns dos fariseus diziam: Este homem não é de Deus, pois não guarda o sábado. Diziam outros: Como pode um homem pecador fazer tais sinais? E havia dissensão entre eles. 17 Tornaram, pois, a dizer ao cego: Tu que dizes daquele que te abriu os olhos? E ele respondeu: Que é profeta. 18 Os judeus, porém, não creram que ele tivesse sido cego e que agora visse, enquanto não chamaram os pais do que agora via. 19 E perguntaram-lhes, dizendo: É este o vosso filho, que vós dizeis ter nascido cego? Como, pois, vê agora? 20 Seus pais responderam e disseram-lhes: Sabemos que este é nosso filho e que nasceu cego, 21 mas como agora vê não sabemos; ou quem lhe tenha aberto os olhos não sabemos; tem idade; perguntai-lho a ele mesmo, e ele falará por si mesmo. 22 Seus pais disseram isso, porque temiam os judeus, porquanto já os judeus tinham resolvido que, se alguém confessasse ser ele o Cristo, fosse expulso da sinagoga. 23 Por isso, é que seus pais disseram: Tem idade; perguntai-lho a ele mesmo. 24 Chamaram, pois, pela segunda vez o homem que tinha sido cego e disseram-lhe: Dá glória a Deus; nós sabemos que esse homem é pecador. 25 Respondeu ele, pois, e disse: Se é pecador, não sei; uma coisa sei, e é que, havendo eu sido cego, agora vejo. 26 E tornaram a dizer-lhe: Que te fez ele? Como te abriu os olhos? 27 Respondeu-lhes: Já vo-lo disse e não ouvistes; para que o quereis tornar a ouvir? Quereis vós, porventura, fazer-vos também seus discípulos? 28 Então, o injuriaram e disseram: Discípulo dele sejas tu; nós, porém, somos discípulos de Moisés. 29 Nós bem sabemos que Deus falou a Moisés, mas este não sabemos de onde é. 30 O homem respondeu e disse-lhes: Nisto, pois, está a maravilha: que vós não saibais de onde ele é e me abrisse os olhos. 31 Ora, nós sabemos que Deus não ouve a pecadores; mas, se alguém é temente a Deus e faz a sua vontade, a esse ouve. 32 Desde o princípio do mundo, nunca se ouviu que alguém abrisse os olhos a um cego de nascença. 33 Se este não fosse de Deus, nada poderia fazer. 34 Responderam eles e disseram-lhe: Tu és nascido todo em pecados e nos ensinas a nós? E expulsaram-no."}}, {"id": 153, "ordem": 153, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Dirige-se a Jerusalém", "titulo": "Jesus ensina sobre a cegueira espiritual", "mateus": null, "marcos": null, "lucas": null, "joao": {"referencia": "Jo 9.35-41", "texto": "35 Jesus ouviu que o tinham expulsado e, encontrando-o, disse-lhe: Crês tu no Filho de Deus? 36 Ele respondeu e disse: Quem é ele, Senhor, para que nele creia? 37 E Jesus lhe disse: Tu já o tens visto, e é aquele que fala contigo. 38 Ele disse: Creio, Senhor. E o adorou. 39 E disse-lhe Jesus: Eu vim a este mundo para juízo, a fim de que os que não veem vejam e os que veem sejam cegos. 40 Aqueles dos fariseus que estavam com ele, ouvindo isso, disseram-lhe: Também nós somos cegos? 41 Disse-lhes Jesus: Se fôsseis cegos, não teríeis pecado; mas como agora dizeis: Vemos, por isso, o vosso pecado permanece."}}, {"id": 154, "ordem": 154, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Dirige-se a Jerusalém", "titulo": "Jesus é o bom pastor", "mateus": null, "marcos": null, "lucas": null, "joao": {"referencia": "Jo 10.1-21", "texto": "1 Na verdade, na verdade vos digo que aquele que não entra pela porta no curral das ovelhas, mas sobe por outra parte, é ladrão e salteador. 2 Aquele, porém, que entra pela porta é o pastor das ovelhas. 3 A este o porteiro abre, e as ovelhas ouvem a sua voz, e chama pelo nome às suas ovelhas e as traz para fora. 4 E, quando tira para fora as suas ovelhas, vai adiante delas, e as ovelhas o seguem, porque conhecem a sua voz. 5 Mas, de modo nenhum, seguirão o estranho; antes, fugirão dele, porque não conhecem a voz dos estranhos. 6 Jesus disse-lhes esta parábola, mas eles não entenderam o que era que lhes dizia. 7 Tornou, pois, Jesus a dizer-lhes: Em verdade vos digo que eu sou a porta das ovelhas. 8 Todos quantos vieram antes de mim são ladrões e salteadores, mas as ovelhas não os ouviram. 9 Eu sou a porta; se alguém entrar por mim, salvar-se-á, e entrará, e sairá, e achará pastagens. 10 O ladrão não vem senão a roubar, a matar e a destruir; eu vim para que tenham vida e a tenham com abundância. 11 Eu sou o bom Pastor; o bom Pastor dá a sua vida pelas ovelhas. 12 Mas o mercenário, que não é pastor, de quem não são as ovelhas, vê vir o lobo, e deixa as ovelhas, e foge; e o lobo as arrebata e dispersa. 13 Ora, o mercenário foge, porque é mercenário e não tem cuidado das ovelhas. 14 Eu sou o bom Pastor, e conheço as minhas ovelhas, e das minhas sou conhecido. 15 Assim como o Pai me conhece a mim, também eu conheço o Pai e dou a minha vida pelas ovelhas. 16 Ainda tenho outras ovelhas que não são deste aprisco; também me convém agregar estas, e elas ouvirão a minha voz, e haverá um rebanho e um Pastor. 17 Por isso, o Pai me ama, porque dou a minha vida para tornar a tomá-la. 18 Ninguém ma tira de mim, mas eu de mim mesmo a dou; tenho poder para a dar e poder para tornar a tomá-la. Esse mandamento recebi de meu Pai. 19 Tornou, pois, a haver divisão entre os judeus por causa dessas palavras. 20 E muitos deles diziam: Tem demônio e está fora de si; por que o ouvis? 21 Diziam outros: Estas palavras não são de endemoninhado; pode, porventura, um demônio abrir os olhos aos cegos?"}}, {"id": 155, "ordem": 155, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Dirige-se a Jerusalém", "titulo": "Os líderes religiosos cercam Jesus no Templo", "mateus": null, "marcos": null, "lucas": null, "joao": {"referencia": "Jo 10.22-42", "texto": "22 E em Jerusalém havia a Festa da Dedicação, e era inverno. 23 E Jesus passeava no templo, no alpendre de Salomão. 24 Rodearam-no, pois, os judeus e disseram-lhe: Até quando terás a nossa alma suspensa? Se tu és o Cristo, dize-no-lo abertamente. 25 Respondeu-lhes Jesus: Já vo-lo tenho dito, e não o credes. As obras que eu faço em nome de meu Pai, essas testificam de mim. 26 Mas vós não credes, porque não sois das minhas ovelhas, como já vo-lo tenho dito. 27 As minhas ovelhas ouvem a minha voz, e eu conheço-as, e elas me seguem; 28 e dou-lhes a vida eterna, e nunca hão de perecer, e ninguém as arrebatará das minhas mãos. 29 Meu Pai, que mas deu, é maior do que todos; e ninguém pode arrebatá-las das mãos de meu Pai. 30 Eu e o Pai somos um. 31 Os judeus pegaram, então, outra vez, em pedras para o apedrejarem. 32 Respondeu-lhes Jesus: Tenho-vos mostrado muitas obras boas procedentes de meu Pai; por qual dessas obras me apedrejais? 33 Os judeus responderam, dizendo-lhe: Não te apedrejamos por alguma obra boa, mas pela blasfêmia, porque, sendo tu homem, te fazes Deus a ti mesmo. 34 Respondeu-lhes Jesus: Não está escrito na vossa lei: Eu disse: sois deuses? 35 Pois, se a lei chamou deuses àqueles a quem a palavra de Deus foi dirigida (e a Escritura não pode ser anulada), 36 àquele a quem o Pai santificou e enviou ao mundo, vós dizeis: Blasfemas, porque disse: Sou Filho de Deus? 37 Se não faço as obras de meu Pai, não me acrediteis. 38 Mas, se as faço, e não credes em mim, crede nas obras, para que conheçais e acrediteis que o Pai está em mim, e eu, nele. 39 Procuravam, pois, prendê-lo outra vez, mas ele escapou de suas mãos, 40 e retirou-se outra vez para além do Jordão, para o lugar onde João tinha primeiramente batizado, e ali ficou. 41 E muitos iam ter com ele e diziam: Na verdade, João não fez sinal algum, mas tudo quanto João disse deste era verdade. 42 E muitos ali creram nele."}}, {"id": 156, "ordem": 156, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Dirige-se a Jerusalém", "titulo": "Jesus ensina sobre a entrada no reino", "mateus": null, "marcos": null, "lucas": {"referencia": "Lc 13.22-30", "texto": "22 E percorria as cidades e as aldeias, ensinando e caminhando para Jerusalém. 23 E disse-lhe um: Senhor, são poucos os que se salvam? E ele lhe respondeu: 24 Porfiai por entrar pela porta estreita, porque eu vos digo que muitos procurarão entrar e não poderão. 25 Quando o pai de família se levantar e cerrar a porta, e começardes a estar de fora e a bater à porta, dizendo: Senhor, Senhor, abre-nos; e, respondendo ele, vos disser: Não sei de onde vós sois, 26 então, começareis a dizer: Temos comido e bebido na tua presença, e tu tens ensinado nas nossas ruas. 27 E ele vos responderá: Digo-vos que não sei de onde vós sois; apartai-vos de mim, vós todos os que praticais a iniquidade. 28 Ali, haverá choro e ranger de dentes, quando virdes Abraão, e Isaque, e Jacó, e todos os profetas no Reino de Deus e vós, lançados fora. 29 E virão do Oriente, e do Ocidente, e do Norte, e do Sul e assentar-se-ão à mesa no Reino de Deus. 30 E eis que derradeiros há que serão os primeiros; e primeiros há que serão os derradeiros."}, "joao": null}, {"id": 157, "ordem": 157, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Dirige-se a Jerusalém", "titulo": "Jesus se entristece por causa de Jerusalém", "mateus": {"referencia": "Mt 23.37-39", "texto": "37 Jerusalém, Jerusalém, que matas os profetas e apedrejas os que te são enviados! Quantas vezes quis eu ajuntar os teus filhos, como a galinha ajunta os seus pintos debaixo das asas, e tu não quiseste! 38 Eis que a vossa casa vos ficará deserta. 39 Porque eu vos digo que, desde agora, me não vereis mais, até que digais: Bendito o que vem em nome do Senhor!"}, "marcos": null, "lucas": {"referencia": "Lc 13.31-35", "texto": "31 Naquele mesmo dia, chegaram uns fariseus, dizendo-lhe: Sai e retira-te daqui, porque Herodes quer matar-te. 32 E lhes respondeu: Ide e dizei àquela raposa: eis que eu expulso demônios, e efetuo curas, hoje e amanhã, e, no terceiro dia, sou consumado. 33 Importa, porém, caminhar hoje, amanhã e no dia seguinte, para que não suceda que morra um profeta fora de Jerusalém. 34 Jerusalém, Jerusalém, que matas os profetas e apedrejas os que te são enviados! Quantas vezes quis eu ajuntar os teus filhos, como a galinha ajunta os seus pintos debaixo das asas, e não quiseste? 35 Eis que a vossa casa se vos deixará deserta. E em verdade vos digo que não me vereis até que venha o tempo em que digais: Bendito aquele que vem em nome do Senhor!"}, "joao": null}, {"id": 158, "ordem": 158, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Dirige-se a Jerusalém", "titulo": "Jesus cura um homem com membros inchados", "mateus": null, "marcos": null, "lucas": {"referencia": "Lc 14.1-6", "texto": "1 Aconteceu, num sábado, que, entrando ele em casa de um dos principais dos fariseus para comer pão, eles o estavam observando. 2 E eis que estava ali diante dele um certo homem hidrópico. 3 E Jesus, tomando a palavra, falou aos doutores da lei e aos fariseus, dizendo: É lícito curar no sábado? 4 Eles, porém, calaram-se. E tomando-o, o curou e despediu. 5 E disse-lhes: Qual será de vós o que, caindo-lhe num poço, em dia de sábado, o jumento ou o boi, o não tire logo? 6 E nada lhe podiam replicar sobre isso."}, "joao": null}, {"id": 159, "ordem": 159, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Dirige-se a Jerusalém", "titulo": "Jesus ensina sobre a humildade", "mateus": null, "marcos": null, "lucas": {"referencia": "Lc 14.7-14", "texto": "7 E disse aos convidados uma parábola, reparando como escolhiam os primeiros assentos, dizendo-lhes: 8 Quando por alguém fores convidado às bodas, não te assentes no primeiro lugar, para que não aconteça que esteja convidado outro mais digno do que tu, 9 e, vindo o que te convidou a ti e a ele, te diga: Dá o lugar a este; e então, com vergonha, tenhas de tomar o derradeiro lugar. 10 Mas, quando fores convidado, vai e assenta-te no derradeiro lugar, para que, quando vier o que te convidou, te diga: Amigo, assenta-te mais para cima. Então, terás honra diante dos que estiverem contigo à mesa. 11 Porquanto, qualquer que a si mesmo se exaltar será humilhado, e aquele que a si mesmo se humilhar será exaltado. 12 E dizia também ao que o tinha convidado: Quando deres um jantar ou uma ceia, não chames os teus amigos, nem os teus irmãos, nem os teus parentes, nem vizinhos ricos, para que não suceda que também eles te tornem a convidar, e te seja isso recompensado. 13 Mas, quando fizeres convite, chama os pobres, aleijados, mancos e cegos 14 e serás bem-aventurado; porque eles não têm com que to recompensar; mas recompensado serás na ressurreição dos justos."}, "joao": null}, {"id": 160, "ordem": 160, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Dirige-se a Jerusalém", "titulo": "Jesus conta a parábola do grande banquete", "mateus": null, "marcos": null, "lucas": {"referencia": "Lc 14.15-24", "texto": "15 E, ouvindo isso um dos que estavam com ele à mesa, disse-lhe: Bem-aventurado o que comer pão no Reino de Deus! 16 Porém ele lhe disse: Um certo homem fez uma grande ceia e convidou a muitos. 17 E, à hora da ceia, mandou o seu servo dizer aos convidados: Vinde, que já tudo está preparado. 18 E todos à uma começaram a escusar-se. Disse-lhe o primeiro: Comprei um campo e preciso ir vê-lo; rogo-te que me hajas por escusado. 19 E outro disse: Comprei cinco juntas de bois e vou experimentá-los; rogo-te que me hajas por escusado. 20 E outro disse: Casei e, portanto, não posso ir. 21 E, voltando aquele servo, anunciou essas coisas ao seu senhor. Então, o pai de família, indignado, disse ao seu servo: Sai depressa pelas ruas e bairros da cidade e traze aqui os pobres, e os aleijados, e os mancos, e os cegos. 22 E disse o servo: Senhor, feito está como mandaste, e ainda há lugar. 23 E disse o senhor ao servo: Sai pelos caminhos e atalhos e força-os a entrar, para que a minha casa se encha. 24 Porque eu vos digo que nenhum daqueles varões que foram convidados provará a minha ceia."}, "joao": null}, {"id": 161, "ordem": 161, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Dirige-se a Jerusalém", "titulo": "Jesus ensina sobre o custo de ser um discípulo", "mateus": null, "marcos": null, "lucas": {"referencia": "Lc 14.25-35", "texto": "25 Ora, ia com ele uma grande multidão; e, voltando-se, disse-lhe: 26 Se alguém vier a mim e não aborrecer a seu pai, e mãe, e mulher, e filhos, e irmãos, e irmãs, e ainda também a sua própria vida, não pode ser meu discípulo. 27 E qualquer que não levar a sua cruz e não vier após mim não pode ser meu discípulo. 28 Pois qual de vós, querendo edificar uma torre, não se assenta primeiro a fazer as contas dos gastos, para ver se tem com que a acabar? 29 Para que não aconteça que, depois de haver posto os alicerces e não a podendo acabar, todos os que a virem comecem a escarnecer dele, 30 dizendo: Este homem começou a edificar e não pôde acabar. 31 Ou qual é o rei que, indo à guerra a pelejar contra outro rei, não se assenta primeiro a tomar conselho sobre se com dez mil pode sair ao encontro do que vem contra ele com vinte mil? 32 De outra maneira, estando o outro ainda longe, manda embaixadores e pede condições de paz. 33 Assim, pois, qualquer de vós que não renuncia a tudo quanto tem não pode ser meu discípulo. 34 Bom é o sal, mas, se ele degenerar, com que se adubará? 35 Nem presta para a terra, nem para o monturo; lançam-no fora. Quem tem ouvidos para ouvir, que ouça."}, "joao": null}, {"id": 162, "ordem": 162, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Dirige-se a Jerusalém", "titulo": "Jesus conta a parábola da ovelha perdida", "mateus": null, "marcos": null, "lucas": {"referencia": "Lc 15.1-7", "texto": "1 E chegavam-se a ele todos os publicanos e pecadores para o ouvir. 2 E os fariseus e os escribas murmuravam, dizendo: Este recebe pecadores e come com eles. 3 E ele lhes propôs esta parábola, dizendo: 4 Que homem dentre vós, tendo cem ovelhas e perdendo uma delas, não deixa no deserto as noventa e nove e não vai após a perdida até que venha a achá-la? 5 E, achando-a, a põe sobre seus ombros, cheio de júbilo; 6 e, chegando à sua casa, convoca os amigos e vizinhos, dizendo-lhes: Alegrai-vos comigo, porque já achei a minha ovelha perdida. 7 Digo-vos que assim haverá alegria no céu por um pecador que se arrepende, mais do que por noventa e nove justos que não necessitam de arrependimento."}, "joao": null}, {"id": 163, "ordem": 163, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Dirige-se a Jerusalém", "titulo": "Jesus conta a parábola da dracma perdida", "mateus": null, "marcos": null, "lucas": {"referencia": "Lc 15.8-10", "texto": "8 Ou qual a mulher que, tendo dez dracmas, se perder uma dracma, não acende a candeia, e varre a casa, e busca com diligência até a achar? 9 E, achando-a, convoca as amigas e vizinhas, dizendo: Alegrai-vos comigo, porque já achei a dracma perdida. 10 Assim vos digo que há alegria diante dos anjos de Deus por um pecador que se arrepende."}, "joao": null}, {"id": 164, "ordem": 164, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Dirige-se a Jerusalém", "titulo": "Jesus conta a parábola do filho pródigo", "mateus": null, "marcos": null, "lucas": {"referencia": "Lc 15.11-32", "texto": "11 E disse: Um certo homem tinha dois filhos. 12 E o mais moço deles disse ao pai: Pai, dá-me a parte da fazenda que me pertence. E ele repartiu por eles a fazenda. 13 E, poucos dias depois, o filho mais novo, ajuntando tudo, partiu para uma terra longínqua e ali desperdiçou a sua fazenda, vivendo dissolutamente. 14 E, havendo ele gastado tudo, houve naquela terra uma grande fome, e começou a padecer necessidades. 15 E foi e chegou-se a um dos cidadãos daquela terra, o qual o mandou para os seus campos a apascentar porcos. 16 E desejava encher o seu estômago com as bolotas que os porcos comiam, e ninguém lhe dava nada. 17 E, caindo em si, disse: Quantos trabalhadores de meu pai têm abundância de pão, e eu aqui pereço de fome! 18 Levantar-me-ei, e irei ter com meu pai, e dir-lhe-ei: Pai, pequei contra o céu e perante ti. 19 Já não sou digno de ser chamado teu filho; faze-me como um dos teus trabalhadores. 20 E, levantando-se, foi para seu pai; e, quando ainda estava longe, viu-o seu pai, e se moveu de íntima compaixão, e, correndo, lançou-se-lhe ao pescoço, e o beijou. 21 E o filho lhe disse: Pai, pequei contra o céu e perante ti e já não sou digno de ser chamado teu filho. 22 Mas o pai disse aos seus servos: Trazei depressa a melhor roupa, e vesti-lho, e ponde-lhe um anel na mão e sandálias nos pés, 23 e trazei o bezerro cevado, e matai-o; e comamos e alegremo-nos, 24 porque este meu filho estava morto e reviveu; tinha-se perdido e foi achado. E começaram a alegrar-se. 25 E o seu filho mais velho estava no campo; e, quando veio e chegou perto de casa, ouviu a música e as danças. 26 E, chamando um dos servos, perguntou-lhe que era aquilo. 27 E ele lhe disse: Veio teu irmão; e teu pai matou o bezerro cevado, porque o recebeu são e salvo. 28 Mas ele se indignou e não queria entrar. E, saindo o pai, instava com ele. 29 Mas, respondendo ele, disse ao pai: Eis que te sirvo há tantos anos, sem nunca transgredir o teu mandamento, e nunca me deste um cabrito para alegrar-me com os meus amigos. 30 Vindo, porém, este teu filho, que desperdiçou a tua fazenda com as meretrizes, mataste-lhe o bezerro cevado. 31 E ele lhe disse: Filho, tu sempre estás comigo, e todas as minhas coisas são tuas. 32 Mas era justo alegrarmo-nos e regozijarmo-nos, porque este teu irmão estava morto e reviveu; tinha-se perdido e foi achado."}, "joao": null}, {"id": 165, "ordem": 165, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Dirige-se a Jerusalém", "titulo": "Jesus conta a parábola do mordomo astuto", "mateus": null, "marcos": null, "lucas": {"referencia": "Lc 16.1-18", "texto": "1 E dizia também aos seus discípulos: Havia um certo homem rico, o qual tinha um mordomo; e este foi acusado perante ele de dissipar os seus bens. 2 E ele, chamando-o, disse-lhe: Que é isso que ouço de ti? Presta contas da tua mordomia, porque já não poderás ser mais meu mordomo. 3 E o mordomo disse consigo: Que farei, pois que o meu senhor me tira a mordomia? Cavar não posso; de mendigar tenho vergonha. 4 Eu sei o que hei de fazer, para que, quando for desapossado da mordomia, me recebam em suas casas. 5 E, chamando a si cada um dos devedores do seu senhor, disse ao primeiro: Quanto deves ao meu senhor? 6 E ele respondeu: Cem medidas de azeite. E disse-lhe: Toma a tua conta e, assentando-te já, escreve cinquenta. 7 Disse depois a outro: E tu quanto deves? E ele respondeu: Cem alqueires de trigo. E disse-lhe: Toma a tua conta e escreve oitenta. 8 E louvou aquele senhor o injusto mordomo por haver procedido prudentemente, porque os filhos deste mundo são mais prudentes na sua geração do que os filhos da luz. 9 E eu vos digo: granjeai amigos com as riquezas da injustiça, para que, quando estas vos faltarem, vos recebam eles nos tabernáculos eternos. 10 Quem é fiel no mínimo também é fiel no muito; quem é injusto no mínimo também é injusto no muito. 11 Pois, se nas riquezas injustas não fostes fiéis, quem vos confiará as verdadeiras? 12 E, se no alheio não fostes fiéis, quem vos dará o que é vosso? 13 Nenhum servo pode servir a dois senhores, porque ou há de aborrecer a um e amar ao outro ou se há de chegar a um e desprezar ao outro. Não podeis servir a Deus e a Mamom. 14 E os fariseus, que eram avarentos, ouviam todas essas coisas e zombavam dele. 15 E disse-lhes: Vós sois os que vos justificais a vós mesmos diante dos homens, mas Deus conhece o vosso coração, porque o que entre os homens é elevado perante Deus é abominação. 16 A Lei e os Profetas duraram até João; desde então, é anunciado o Reino de Deus, e todo homem emprega força para entrar nele. 17 E é mais fácil passar o céu e a terra do que cair um til da Lei. 18 Qualquer que deixa sua mulher e casa com outra adultera; e aquele que casa com a repudiada pelo marido adultera também."}, "joao": null}, {"id": 166, "ordem": 166, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Dirige-se a Jerusalém", "titulo": "Jesus fala sobre o homem rico e o mendigo", "mateus": null, "marcos": null, "lucas": {"referencia": "Lc 16.19-31", "texto": "19 Ora, havia um homem rico, e vestia-se de púrpura e de linho finíssimo, e vivia todos os dias regalada e esplendidamente. 20 Havia também um certo mendigo, chamado Lázaro, que jazia cheio de chagas à porta daquele. 21 E desejava alimentar-se com as migalhas que caíam da mesa do rico; e os próprios cães vinham lamber-lhe as chagas. 22 E aconteceu que o mendigo morreu e foi levado pelos anjos para o seio de Abraão; e morreu também o rico e foi sepultado. 23 E, no Hades, ergueu os olhos, estando em tormentos, e viu ao longe Abraão e Lázaro, no seu seio. 24 E, clamando, disse: Abraão, meu pai, tem misericórdia de mim e manda a Lázaro que molhe na água a ponta do seu dedo e me refresque a língua, porque estou atormentado nesta chama. 25 Disse, porém, Abraão: Filho, lembra-te de que recebeste os teus bens em tua vida, e Lázaro, somente males; e, agora, este é consolado, e tu, atormentado. 26 E, além disso, está posto um grande abismo entre nós e vós, de sorte que os que quisessem passar daqui para vós não poderiam, nem tampouco os de lá, passar para cá. 27 E disse ele: Rogo-te, pois, ó pai, que o mandes à casa de meu pai, 28 pois tenho cinco irmãos, para que lhes dê testemunho, a fim de que não venham também para este lugar de tormento. 29 Disse-lhe Abraão: Eles têm Moisés e os Profetas; ouçam-nos. 30 E disse ele: Não, Abraão, meu pai; mas, se algum dos mortos fosse ter com eles, arrepender-se-iam. 31 Porém Abraão lhe disse: Se não ouvem a Moisés e aos Profetas, tampouco acreditarão, ainda que algum dos mortos ressuscite."}, "joao": null}, {"id": 167, "ordem": 167, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Dirige-se a Jerusalém", "titulo": "Jesus fala sobre perdão e fé", "mateus": null, "marcos": null, "lucas": {"referencia": "Lc 17.1-10", "texto": "1 E disse aos discípulos: É impossível que não venham escândalos, mas ai daquele por quem vierem! 2 Melhor lhe fora que lhe pusessem ao pescoço uma pedra de moinho, e fosse lançado ao mar, do que fazer tropeçar um destes pequenos. 3 Olhai por vós mesmos. E, se teu irmão pecar contra ti, repreende-o; e, se ele se arrepender, perdoa-lhe; 4 e, se pecar contra ti sete vezes no dia e sete vezes no dia vier ter contigo, dizendo: Arrependo-me, perdoa-lhe. 5 Disseram, então, os apóstolos ao Senhor: Acrescenta-nos a fé. 6 E disse o Senhor: Se tivésseis fé como um grão de mostarda, diríeis a esta amoreira: Desarraiga-te daqui e planta-te no mar, e ela vos obedeceria. 7 E qual de vós terá um servo a lavrar ou a apascentar gado, a quem, voltando ele do campo, diga: Chega-te e assenta-te à mesa? 8 E não lhe diga antes: Prepara-me a ceia, e cinge-te, e serve-me, até que tenha comido e bebido, e depois comerás e beberás tu? 9 Porventura, dá graças ao tal servo, porque fez o que lhe foi mandado? Creio que não. 10 Assim também vós, quando fizerdes tudo o que vos for mandado, dizei: Somos servos inúteis, porque fizemos somente o que devíamos fazer."}, "joao": null}, {"id": 168, "ordem": 168, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Dirige-se a Jerusalém", "titulo": "Lázaro adoece e morre", "mateus": null, "marcos": null, "lucas": null, "joao": {"referencia": "Jo 11.1-16", "texto": "1 Estava, então, enfermo um certo Lázaro, de Betânia, aldeia de Maria e de sua irmã Marta. 2 E Maria era aquela que tinha ungido o Senhor com unguento e lhe tinha enxugado os pés com os seus cabelos, cujo irmão, Lázaro, estava enfermo. 3 Mandaram-lhe, pois, suas irmãs dizer: Senhor, eis que está enfermo aquele que tu amas. 4 E Jesus, ouvindo isso, disse: Esta enfermidade não é para morte, mas para glória de Deus, para que o Filho de Deus seja glorificado por ela. 5 Ora, Jesus amava a Marta, e a sua irmã, e a Lázaro. 6 Ouvindo, pois, que estava enfermo, ficou ainda dois dias no lugar onde estava. 7 Depois disso, disse aos seus discípulos: Vamos outra vez para a Judeia. 8 Disseram-lhe os discípulos: Rabi, ainda agora os judeus procuravam apedrejar-te, e tornas para lá? 9 Jesus respondeu: Não há doze horas no dia? Se alguém andar de dia, não tropeça, porque vê a luz deste mundo. 10 Mas, se andar de noite, tropeça, porque nele não há luz. 11 Assim falou e, depois, disse-lhes: Lázaro, o nosso amigo, dorme, mas vou despertá-lo do sono. 12 Disseram, pois, os seus discípulos: Senhor, se dorme, estará salvo. 13 Mas Jesus dizia isso da sua morte; eles, porém, cuidavam que falava do repouso do sono. 14 Então, Jesus disse-lhes claramente: Lázaro está morto, 15 e folgo, por amor de vós, de que eu lá não estivesse, para que acrediteis. Mas vamos ter com ele. 16 Disse, pois, Tomé, chamado Dídimo, aos condiscípulos: Vamos nós também, para morrermos com ele."}}, {"id": 169, "ordem": 169, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Dirige-se a Jerusalém", "titulo": "Jesus consola Maria e Marta", "mateus": null, "marcos": null, "lucas": null, "joao": {"referencia": "Jo 11.17-37", "texto": "17 Chegando, pois, Jesus, achou que já havia quatro dias que estava na sepultura. 18 (Ora, Betânia distava de Jerusalém quase quinze estádios.) 19 E muitos dos judeus tinham ido consolar a Marta e a Maria, acerca de seu irmão. 20 Ouvindo, pois, Marta que Jesus vinha, saiu-lhe ao encontro; Maria, porém, ficou assentada em casa. 21 Disse, pois, Marta a Jesus: Senhor, se tu estivesses aqui, meu irmão não teria morrido. 22 Mas também, agora, sei que tudo quanto pedires a Deus, Deus to concederá. 23 Disse-lhe Jesus: Teu irmão há de ressuscitar. 24 Disse-lhe Marta: Eu sei que há de ressuscitar na ressurreição do último Dia. 25 Disse-lhe Jesus: Eu sou a ressurreição e a vida; quem crê em mim, ainda que esteja morto, viverá; 26 e todo aquele que vive e crê em mim nunca morrerá. Crês tu isso? 27 Disse-lhe ela: Sim, Senhor, creio que tu és o Cristo, o Filho de Deus, que havia de vir ao mundo. 28 E, dito isso, partiu e chamou em segredo a Maria, sua irmã, dizendo: O Mestre está aqui e chama-te. 29 Ela, ouvindo isso, levantou-se logo e foi ter com ele. 30 (Ainda Jesus não tinha chegado à aldeia, mas estava no lugar onde Marta o encontrara.) 31 Vendo, pois, os judeus que estavam com ela em casa e a consolavam que Maria apressadamente se levantara e saíra, seguiram-na, dizendo: Vai ao sepulcro para chorar ali. 32 Tendo, pois, Maria chegado aonde Jesus estava e vendo-o, lançou-se aos seus pés, dizendo-lhe: Senhor, se tu estivesses aqui, meu irmão não teria morrido. 33 Jesus, pois, quando a viu chorar e também chorando os judeus que com ela vinham, moveu-se muito em espírito e perturbou-se. 34 E disse: Onde o pusestes? Disseram-lhe: Senhor, vem e vê. 35 Jesus chorou. 36 Disseram, pois, os judeus: Vede como o amava. 37 E alguns deles disseram: Não podia ele, que abriu os olhos ao cego, fazer também com que este não morresse?"}}, {"id": 170, "ordem": 170, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Dirige-se a Jerusalém", "titulo": "Jesus ressuscita Lázaro", "mateus": null, "marcos": null, "lucas": null, "joao": {"referencia": "Jo 11.38-44", "texto": "38 Jesus, pois, movendo-se outra vez muito em si mesmo, foi ao sepulcro; e era uma caverna e tinha uma pedra posta sobre ela. 39 Disse Jesus: Tirai a pedra. Marta, irmã do defunto, disse-lhe: Senhor, já cheira mal, porque é já de quatro dias. 40 Disse-lhe Jesus: Não te hei dito que, se creres, verás a glória de Deus? 41 Tiraram, pois, a pedra. E Jesus, levantando os olhos para o céu, disse: Pai, graças te dou, por me haveres ouvido. 42 Eu bem sei que sempre me ouves, mas eu disse isso por causa da multidão que está ao redor, para que creiam que tu me enviaste. 43 E, tendo dito isso, clamou com grande voz: Lázaro, vem para fora. 44 E o defunto saiu, tendo as mãos e os pés ligados com faixas, e o seu rosto, envolto num lenço. Disse-lhes Jesus: Desligai-o e deixai-o ir."}}, {"id": 171, "ordem": 171, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Dirige-se a Jerusalém", "titulo": "Os líderes religiosos planejam matar Jesus", "mateus": null, "marcos": null, "lucas": null, "joao": {"referencia": "Jo 11.45-57", "texto": "45 Muitos, pois, dentre os judeus que tinham vindo a Maria e que tinham visto o que Jesus fizera creram nele. 46 Mas alguns deles foram ter com os fariseus e disseram-lhes o que Jesus tinha feito. 47 Depois, os principais dos sacerdotes e os fariseus formaram conselho e diziam: Que faremos? Porquanto este homem faz muitos sinais. 48 Se o deixamos assim, todos crerão nele, e virão os romanos e tirar-nos-ão o nosso lugar e a nação. 49 E Caifás, um deles, que era sumo sacerdote naquele ano, lhes disse: Vós nada sabeis, 50 nem considerais que nos convém que um homem morra pelo povo e que não pereça toda a nação. 51 Ora, ele não disse isso de si mesmo, mas, sendo o sumo sacerdote naquele ano, profetizou que Jesus devia morrer pela nação. 52 E não somente pela nação, mas também para reunir em um corpo os filhos de Deus que andavam dispersos. 53 Desde aquele dia, pois, consultavam-se para o matarem. 54 Jesus, pois, já não andava manifestamente entre os judeus, mas retirou-se dali para a terra junto do deserto, para uma cidade chamada Efraim; e ali andava com os seus discípulos. 55 E estava próxima a Páscoa dos judeus, e muitos daquela região subiram a Jerusalém antes da Páscoa, para se purificarem. 56 Buscavam, pois, a Jesus e diziam uns aos outros, estando no templo: Que vos parece? Não virá à festa? 57 Ora, os principais dos sacerdotes e os fariseus tinham dado ordem para que, se alguém soubesse onde ele estava, o denunciasse, para o prenderem."}}, {"id": 172, "ordem": 172, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Dirige-se a Jerusalém", "titulo": "Jesus cura dez leprosos", "mateus": null, "marcos": null, "lucas": {"referencia": "Lc 17.11-19", "texto": "11 E aconteceu que, indo ele a Jerusalém, passou pelo meio de Samaria e da Galileia; 12 e, entrando numa certa aldeia, saíram-lhe ao encontro dez homens leprosos, os quais pararam de longe. 13 E levantaram a voz, dizendo: Jesus, Mestre, tem misericórdia de nós! 14 E ele, vendo-os, disse-lhes: Ide e mostrai-vos aos sacerdotes. E aconteceu que, indo eles, ficaram limpos. 15 E um deles, vendo que estava são, voltou glorificando a Deus em alta voz. 16 E caiu aos seus pés, com o rosto em terra, dando-lhe graças; e este era samaritano. 17 E, respondendo Jesus, disse: Não foram dez os limpos? E onde estão os nove? 18 Não houve quem voltasse para dar glória a Deus, senão este estrangeiro? 19 E disse-lhe: Levanta-te e vai; a tua fé te salvou."}, "joao": null}, {"id": 173, "ordem": 173, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Dirige-se a Jerusalém", "titulo": "Jesus ensina sobre a vinda do reino de Deus", "mateus": null, "marcos": null, "lucas": {"referencia": "Lc 17.20-37", "texto": "20 E, interrogado pelos fariseus sobre quando havia de vir o Reino de Deus, respondeu-lhes e disse: O Reino de Deus não vem com aparência exterior. 21 Nem dirão: Ei-lo aqui! Ou: Ei-lo ali! Porque eis que o Reino de Deus está entre vós. 22 E disse aos discípulos: Dias virão em que desejareis ver um dos dias do Filho do Homem e não o vereis. 23 E dir-vos-ão: Ei-lo aqui! Ou: Ei-lo ali! Não vades, nem os sigais, 24 porque, como o relâmpago ilumina desde uma extremidade inferior do céu até à outra extremidade, assim será também o Filho do Homem no seu dia. 25 Mas primeiro convém que ele padeça muito e seja reprovado por esta geração. 26 E, como aconteceu nos dias de Noé, assim será também nos dias do Filho do Homem. 27 Comiam, bebiam, casavam e davam-se em casamento, até ao dia em que Noé entrou na arca, e veio o dilúvio e consumiu a todos. 28 Como também da mesma maneira aconteceu nos dias de Ló: comiam, bebiam, compravam, vendiam, plantavam e edificavam. 29 Mas, no dia em que Ló saiu de Sodoma, choveu do céu fogo e enxofre, consumindo a todos. 30 Assim será no dia em que o Filho do Homem se há de manifestar. 31 Naquele dia, quem estiver no telhado, tendo os seus utensílios em casa, não desça a tomá-los; e, da mesma sorte, o que estiver no campo não volte para trás. 32 Lembrai-vos da mulher de Ló. 33 Qualquer que procurar salvar a sua vida perdê-la-á, e qualquer que a perder salvá-la-á. 34 Digo-vos que, naquela noite, estarão dois numa cama; um será tomado, e outro será deixado. 35 Duas estarão juntas, moendo; uma será tomada, e outra será deixada. 36 Dois estarão no campo; um será tomado, e outro será deixado. 37 E, respondendo, disseram-lhe: Onde, Senhor? E ele lhes disse: Onde estiver o corpo, aí se ajuntarão as águias."}, "joao": null}, {"id": 174, "ordem": 174, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Dirige-se a Jerusalém", "titulo": "Jesus conta a parábola da viúva persistente", "mateus": null, "marcos": null, "lucas": {"referencia": "Lc 18.1-8", "texto": "1 E contou-lhes também uma parábola sobre o dever de orar sempre e nunca desfalecer, 2 dizendo: Havia numa cidade um certo juiz, que nem a Deus temia, nem respeitava homem algum. 3 Havia também naquela mesma cidade uma certa viúva e ia ter com ele, dizendo: Faze-me justiça contra o meu adversário. 4 E, por algum tempo, não quis; mas, depois, disse consigo: Ainda que não temo a Deus, nem respeito os homens, 5 todavia, como esta viúva me molesta, hei de fazer-lhe justiça, para que enfim não volte e me importune muito. 6 E disse o Senhor: Ouvi o que diz o injusto juiz. 7 E Deus não fará justiça aos seus escolhidos, que clamam a ele de dia e de noite, ainda que tardio para com eles? 8 Digo-vos que, depressa, lhes fará justiça. Quando, porém, vier o Filho do Homem, porventura, achará fé na terra?"}, "joao": null}, {"id": 175, "ordem": 175, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Dirige-se a Jerusalém", "titulo": "Jesus conta a parábola de dois homens que oravam", "mateus": null, "marcos": null, "lucas": {"referencia": "Lc 18.9-14", "texto": "9 E disse também esta parábola a uns que confiavam em si mesmos, crendo que eram justos, e desprezavam os outros: 10 Dois homens subiram ao templo, a orar; um, fariseu, e o outro, publicano. 11 O fariseu, estando em pé, orava consigo desta maneira: Ó Deus, graças te dou, porque não sou como os demais homens, roubadores, injustos e adúlteros; nem ainda como este publicano. 12 Jejuo duas vezes na semana e dou os dízimos de tudo quanto possuo. 13 O publicano, porém, estando em pé, de longe, ne
