erencia": "Mt 4.23-25", "texto": "23 E percorria Jesus toda a Galileia, ensinando nas suas sinagogas, e pregando o evangelho do Reino, e curando todas as enfermidades e moléstias entre o povo. 24 E a sua fama correu por toda a Síria; e traziam-lhe todos os que padeciam acometidos de várias enfermidades e tormentos, os endemoninhados, os lunáticos e os paralíticos, e ele os curava. 25 E seguia-o uma grande multidão da Galileia, de Decápolis, de Jerusalém, da Judeia e dalém do Jordão."}, "marcos": {"referencia": "Mc 1.35-39", "texto": "35 E, levantando-se de manhã muito cedo, estando ainda escuro, saiu, e foi para um lugar deserto, e ali orava. 36 E seguiram-no Simão e os que com ele estavam. 37 E, achando-o, lhe disseram: Todos te buscam. 38 E ele lhes disse: Vamos às aldeias vizinhas, para que eu ali também pregue, porque para isso vim. 39 E pregava nas sinagogas deles, por toda a Galileia, e expulsava os demônios."}, "lucas": {"referencia": "Lc 4.42-44", "texto": "42 E, sendo já dia, saiu e foi para um lugar deserto; e a multidão o procurava e chegou junto dele; e o detinham, para que não se ausentasse deles. 43 Ele, porém, lhes disse: Também é necessário que eu anuncie a outras cidades o evangelho do Reino de Deus, porque para isso fui enviado. 44 E pregava nas sinagogas da Galileia."}, "joao": null}, {"id": 41, "ordem": 41, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Ministra na Galileia", "titulo": "Jesus cura um leproso", "mateus": {"referencia": "Mt 8.1-4", "texto": "1 E, descendo ele do monte, seguiu-o uma grande multidão. 2 E eis que veio um leproso e o adorou, dizendo: Senhor, se quiseres, podes tornar-me limpo. 3 E Jesus, estendendo a mão, tocou-o, dizendo: Quero; sê limpo. E logo ficou purificado da lepra. 4 Disse-lhe, então, Jesus: Olha, não o digas a alguém, mas vai, mostra-te ao sacerdote e apresenta a oferta que Moisés determinou, para lhes servir de testemunho."}, "marcos": {"referencia": "Mc 1.40-45", "texto": "40 E aproximou-se dele um leproso, que, rogando-lhe e pondo-se de joelhos diante dele, lhe dizia: Se queres, bem podes limpar-me. 41 E Jesus, movido de grande compaixão, estendeu a mão, e tocou-o, e disse-lhe: Quero, sê limpo! 42 E, tendo ele dito isso, logo a lepra desapareceu, e ficou limpo. 43 E, advertindo-o severamente, logo o despediu. 44 E disse-lhe: Olha, não digas nada a ninguém; porém vai, mostra-te ao sacerdote e oferece pela tua purificação o que Moisés determinou, para lhes servir de testemunho. 45 Mas, tendo ele saído, começou a apregoar muitas coisas e a divulgar o que acontecera; de sorte que Jesus já não podia entrar publicamente na cidade, mas conservava-se fora em lugares desertos; e de todas as partes iam ter com ele."}, "lucas": {"referencia": "Lc 5.12-16", "texto": "12 E aconteceu que, quando estava em uma daquelas cidades, eis que um homem cheio de lepra, vendo a Jesus, prostrou-se sobre o rosto e rogou-lhe, dizendo: Senhor, se quiseres, bem podes limpar-me. 13 E ele, estendendo a mão, tocou-lhe, dizendo: Quero; sê limpo. E logo a lepra desapareceu dele. 14 E ordenou-lhe que a ninguém o dissesse. Mas disse-lhe: Vai, mostra-te ao sacerdote e oferece, pela tua purificação, o que Moisés determinou, para que lhes sirva de testemunho. 15 Porém a sua fama se propagava ainda mais, e ajuntava-se muita gente para o ouvir e para ser por ele curada das suas enfermidades. 16 Porém ele retirava-se para os desertos e ali orava."}, "joao": null}, {"id": 42, "ordem": 42, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Ministra na Galileia", "titulo": "Jesus cura um paralítico", "mateus": {"referencia": "Mt 9.1-8", "texto": "1 E, entrando no barco, passou para a outra margem, e chegou à sua cidade. E eis que lhe trouxeram um paralítico deitado numa cama. 2 E Jesus, vendo a fé deles, disse ao paralítico: Filho, tem bom ânimo; perdoados te são os teus pecados. 3 E eis que alguns dos escribas diziam entre si: Ele blasfema. 4 Mas Jesus, conhecendo os seus pensamentos, disse: Por que pensais mal em vosso coração? 5 Pois o que é mais fácil? Dizer ao paralítico: Perdoados te são os teus pecados, ou: Levanta-te e anda? 6 Ora, para que saibais que o Filho do Homem tem na terra autoridade para perdoar pecados — disse então ao paralítico: Levanta-te, toma a tua cama e vai para tua casa. 7 E, levantando-se, foi para sua casa. 8 E a multidão, vendo isso, maravilhou-se e glorificou a Deus, que dera tal poder aos homens."}, "marcos": {"referencia": "Mc 2.1-12", "texto": "1 E, alguns dias depois, entrou outra vez em Cafarnaum, e soube-se que estava em casa. 2 E logo se ajuntaram tantos, que nem ainda nos lugares junto à porta eles cabiam; e anunciava-lhes a palavra. 3 E vieram ter com ele, conduzindo um paralítico, trazido por quatro. 4 E, não podendo aproximar-se dele, por causa da multidão, descobriram o telhado onde estava e, fazendo um buraco, baixaram o leito em que jazia o paralítico. 5 E Jesus, vendo-lhes a fé, disse ao paralítico: Filho, perdoados estão os teus pecados. 6 E estavam ali assentados alguns dos escribas, que arrazoavam em seu coração, dizendo: 7 Por que diz este assim blasfêmias? Quem pode perdoar pecados, senão Deus? 8 E Jesus, conhecendo logo em seu espírito que assim arrazoavam entre si, lhes disse: Por que arrazoais sobre estas coisas em vosso coração? 9 Qual é mais fácil? Dizer ao paralítico: Estão perdoados os teus pecados, ou dizer-lhe: Levanta-te, e toma o teu leito, e anda? 10 Ora, para que saibais que o Filho do Homem tem na terra poder para perdoar pecados (disse ao paralítico), 11 a ti te digo: Levanta-te, e toma o teu leito, e vai para tua casa. 12 E levantou-se e, tomando logo o leito, saiu em presença de todos, de sorte que todos se admiraram e glorificaram a Deus, dizendo: Nunca tal vimos."}, "lucas": {"referencia": "Lc 5.17-26", "texto": "17 E aconteceu que, em um daqueles dias, estava ensinando, e estavam ali assentados fariseus e doutores da lei que tinham vindo de todas as aldeias da Galileia, e da Judeia, e de Jerusalém. E a virtude do Senhor estava com ele para curar. 18 E eis que uns homens transportaram numa cama um homem que estava paralítico e procuravam fazê-lo entrar e pô-lo diante dele. 19 E, não achando por onde o pudessem levar, por causa da multidão, subiram ao telhado e, por entre as telhas, o baixaram com a cama até ao meio, diante de Jesus. 20 E, vendo-lhes a fé, Jesus disse ao paralítico: Homem, os teus pecados te são perdoados. 21 E os escribas e os fariseus começaram a arrazoar, dizendo: Quem é este que diz blasfêmias? Quem pode perdoar pecados, senão Deus? 22 Jesus, porém, conhecendo os seus pensamentos, respondeu e disse-lhes: Que arrazoais em vosso coração? 23 Qual é mais fácil? Dizer: Os teus pecados te são perdoados, ou dizer: Levanta-te e anda? 24 Ora, para que saibais que o Filho do Homem tem sobre a terra poder de perdoar pecados (disse ao paralítico), eu te digo: Levanta-te, toma a tua cama e vai para tua casa. 25 E, levantando-se logo diante deles e tomando a cama em que estava deitado, foi para sua casa glorificando a Deus. 26 E todos ficaram maravilhados, e glorificaram a Deus, e ficaram cheios de temor, dizendo: Hoje, vimos prodígios."}, "joao": null}, {"id": 43, "ordem": 43, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Ministra na Galileia", "titulo": "Jesus come com pecadores na casa de Mateus", "mateus": {"referencia": "Mt 9.9-13", "texto": "9 E Jesus, passando adiante dali, viu assentado na alfândega um homem chamado Mateus e disse-lhe: Segue-me. E ele, levantando-se, o seguiu. 10 E aconteceu que, estando ele em casa sentado à mesa, chegaram muitos publicanos e pecadores e sentaram-se juntamente com Jesus e seus discípulos. 11 E os fariseus, vendo isso, disseram aos seus discípulos: Por que come o vosso Mestre com os publicanos e pecadores? 12 Jesus, porém, ouvindo, disse-lhes: Não necessitam de médico os sãos, mas sim, os doentes. 13 Ide, porém, e aprendei o que significa: Misericórdia quero e não sacrifício. Porque eu não vim para chamar os justos, mas os pecadores, ao arrependimento."}, "marcos": {"referencia": "Mc 2.13-17", "texto": "13 E tornou a sair para o mar, e toda a multidão ia ter com ele, e ele os ensinava. 14 E, passando, viu Levi, filho de Alfeu, sentado na alfândega e disse-lhe: Segue-me. E, levantando-se, o seguiu. 15 E aconteceu que, estando sentado à mesa em casa deste, também estavam sentados à mesa com Jesus e com seus discípulos muitos publicanos e pecadores, porque eram muitos e o tinham seguido. 16 E os escribas e fariseus, vendo-o comer com os publicanos e pecadores, disseram aos seus discípulos: Por que come e bebe ele com os publicanos e pecadores? 17 E Jesus, tendo ouvido isso, disse-lhes: Os sãos não necessitam de médico, mas sim os que estão doentes; eu não vim chamar os justos, mas sim os pecadores."}, "lucas": {"referencia": "Lc 5.27-32", "texto": "27 E, depois disso, saiu, e viu um publicano, chamado Levi, assentado na recebedoria, e disse-lhe: Segue-me. 28 E ele, deixando tudo, levantou-se e o seguiu. 29 E fez-lhe Levi um grande banquete em sua casa; e havia ali uma multidão de publicanos e outros que estavam com eles à mesa. 30 E os escribas deles e os fariseus murmuravam contra os seus discípulos, dizendo: Por que comeis e bebeis com publicanos e pecadores? 31 E Jesus, respondendo, disse-lhes: Não necessitam de médico os que estão sãos, mas sim os que estão enfermos. 32 Eu não vim chamar os justos, mas sim os pecadores, ao arrependimento."}, "joao": null}, {"id": 44, "ordem": 44, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Ministra na Galileia", "titulo": "Os líderes religiosos perguntam a Jesus sobre o jejum", "mateus": {"referencia": "Mt 9.14-17", "texto": "14 Então, chegaram ao pé dele os discípulos de João, dizendo: Por que jejuamos nós, e os fariseus, muitas vezes, e os teus discípulos não jejuam? 15 E disse-lhes Jesus: Podem, porventura, andar tristes os filhos das bodas, enquanto o esposo está com eles? Dias, porém, virão em que lhes será tirado o esposo, e então jejuarão. 16 Ninguém deita remendo de pano novo em veste velha, porque semelhante remendo rompe a veste, e faz-se maior a rotura. 17 Nem se deita vinho novo em odres velhos; aliás, rompem-se os odres, e entorna-se o vinho, e os odres estragam-se; mas deita-se vinho novo em odres novos, e assim ambos se conservam."}, "marcos": {"referencia": "Mc 2.18-22", "texto": "18 Ora, os discípulos de João e os fariseus jejuavam; e foram e disseram-lhe: Por que jejuam os discípulos de João e os dos fariseus, e não jejuam os teus discípulos? 19 E Jesus disse-lhes: Podem, porventura, os filhos das bodas jejuar, enquanto está com eles o esposo? Enquanto têm consigo o esposo, não podem jejuar. 20 Mas dias virão em que lhes será tirado o esposo, e então jejuarão naqueles dias. 21 Ninguém costura remendo de pano novo em veste velha; porque o mesmo remendo novo rompe o velho, e a rotura fica maior. 22 E ninguém põe vinho novo em odres velhos; do contrário, o vinho novo rompe os odres, e entorna-se o vinho, e os odres estragam-se; o vinho novo deve ser posto em odres novos."}, "lucas": {"referencia": "Lc 5.33-39", "texto": "33 Disseram-lhe, então, eles: Por que jejuam muitas vezes os discípulos de João e fazem orações, como também os dos fariseus, mas os teus comem e bebem? 34 E ele lhes disse: Podeis vós fazer jejuar os convidados das bodas, enquanto o esposo está com eles? 35 Dias virão, porém, em que o esposo lhes será tirado, e, então, naqueles dias, jejuarão. 36 E disse-lhes também uma parábola: Ninguém tira um pedaço de uma veste nova para o coser em veste velha, pois que romperá a nova, e o remendo não condiz com a veste velha. 37 E ninguém põe vinho novo em odres velhos; de outra sorte, o vinho novo romperá os odres e entornar-se-á o vinho, e os odres se estragarão. 38 Mas o vinho novo deve ser posto em odres novos, e ambos juntamente se conservarão. 39 E ninguém, tendo bebido o velho, quer logo o novo, porque diz: Melhor é o velho."}, "joao": null}, {"id": 45, "ordem": 45, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Ministra na Galileia", "titulo": "Jesus cura o paralítico de Betesda", "mateus": null, "marcos": null, "lucas": null, "joao": {"referencia": "Jo 5.1-15", "texto": "1 Depois disso, havia uma festa entre os judeus, e Jesus subiu a Jerusalém. 2 Ora, em Jerusalém há, próximo à Porta das Ovelhas, um tanque, chamado em hebreu Betesda, o qual tem cinco alpendres. 3 Nestes jazia grande multidão de enfermos: cegos, coxos e paralíticos, esperando o movimento das águas. 4 Porquanto um anjo descia em certo tempo ao tanque e agitava a água; e o primeiro que ali descia, depois do movimento da água, sarava de qualquer enfermidade que tivesse. 5 E estava ali um homem que, havia trinta e oito anos, se achava enfermo. 6 E Jesus, vendo este deitado e sabendo que estava neste estado havia muito tempo, disse-lhe: Queres ficar são? 7 O enfermo respondeu-lhe: Senhor, não tenho homem algum que, quando a água é agitada, me coloque no tanque; mas, enquanto eu vou, desce outro antes de mim. 8 Jesus disse-lhe: Levanta-te, toma tua cama e anda. 9 Logo, aquele homem ficou são, e tomou a sua cama, e partiu. E aquele dia era sábado. 10 Então, os judeus disseram àquele que tinha sido curado: É sábado, não te é lícito levar a cama. 11 Ele respondeu-lhes: Aquele que me curou, ele próprio disse: Toma a tua cama e anda. 12 Perguntaram-lhe, pois: Quem é o homem que te disse: Toma a tua cama e anda? 13 E o que fora curado não sabia quem era, porque Jesus se havia retirado, em razão de naquele lugar haver grande multidão. 14 Depois, Jesus encontrou-o no templo e disse-lhe: Eis que já estás são; não peques mais, para que te não suceda alguma coisa pior. 15 E aquele homem foi e anunciou aos judeus que Jesus era o que o curara."}}, {"id": 46, "ordem": 46, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Ministra na Galileia", "titulo": "Jesus afirma ser o Filho de Deus", "mateus": null, "marcos": null, "lucas": null, "joao": {"referencia": "Jo 5.16-30", "texto": "16 E, por essa causa, os judeus perseguiram Jesus e procuravam matá-lo, porque fazia essas coisas no sábado. 17 E Jesus lhes respondeu: Meu Pai trabalha até agora, e eu trabalho também. 18 Por isso, pois, os judeus ainda mais procuravam matá-lo, porque não só quebrantava o sábado, mas também dizia que Deus era seu próprio Pai, fazendo-se igual a Deus. 19 Mas Jesus respondeu e disse-lhes: Na verdade, na verdade vos digo que o Filho por si mesmo não pode fazer coisa alguma, se o não vir fazer ao Pai, porque tudo quanto ele faz, o Filho o faz igualmente. 20 Porque o Pai ama ao Filho e mostra-lhe tudo o que faz; e ele lhe mostrará maiores obras do que estas, para que vos maravilheis. 21 Pois assim como o Pai ressuscita os mortos e os vivifica, assim também o Filho vivifica aqueles que quer. 22 E também o Pai a ninguém julga, mas deu ao Filho todo o juízo, 23 para que todos honrem o Filho, como honram o Pai. Quem não honra o Filho não honra o Pai, que o enviou. 24 Na verdade, na verdade vos digo que quem ouve a minha palavra e crê naquele que me enviou tem a vida eterna e não entrará em condenação, mas passou da morte para a vida. 25 Em verdade, em verdade vos digo que vem a hora, e agora é, em que os mortos ouvirão a voz do Filho de Deus, e os que a ouvirem viverão. 26 Porque, como o Pai tem a vida em si mesmo, assim deu também ao Filho ter a vida em si mesmo. 27 E deu-lhe o poder de exercer o juízo, porque é o Filho do Homem. 28 Não vos maravilheis disso, porque vem a hora em que todos os que estão nos sepulcros ouvirão a sua voz. 29 E os que fizeram o bem sairão para a ressurreição da vida; e os que fizeram o mal, para a ressurreição da condenação. 30 Eu não posso de mim mesmo fazer coisa alguma; como ouço, assim julgo, e o meu juízo é justo, porque não busco a minha vontade, mas a vontade do Pai, que me enviou."}}, {"id": 47, "ordem": 47, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Ministra na Galileia", "titulo": "Jesus reforça sua reivindicação", "mateus": null, "marcos": null, "lucas": null, "joao": {"referencia": "Jo 5.31-47", "texto": "31 Se eu testifico de mim mesmo, o meu testemunho não é verdadeiro. 32 Há outro que testifica de mim, e sei que o testemunho que ele dá de mim é verdadeiro. 33 Vós mandastes a João, e ele deu testemunho da verdade. 34 Eu, porém, não recebo testemunho de homem, mas digo isso, para que vos salveis. 35 Ele era a candeia que ardia e alumiava; e vós quisestes alegrar-vos por um pouco de tempo com a sua luz. 36 Mas eu tenho maior testemunho do que o de João, porque as obras que o Pai me deu para realizar, as mesmas obras que eu faço testificam de mim, de que o Pai me enviou. 37 E o Pai, que me enviou, ele mesmo testificou de mim. Vós nunca ouvistes a sua voz, nem vistes o seu parecer; 38 e a sua palavra não permanece em vós, porque naquele que ele enviou não credes vós. 39 Examinais as Escrituras, porque vós cuidais ter nelas a vida eterna, e são elas que de mim testificam. 40 E não quereis vir a mim para terdes vida. 41 Eu não recebo glória dos homens, 42 mas bem vos conheço, que não tendes em vós o amor de Deus. 43 Eu vim em nome de meu Pai, e não me aceitais; se outro vier em seu próprio nome, a esse aceitareis. 44 Como podeis vós crer, recebendo honra uns dos outros e não buscando a honra que vem só de Deus? 45 Não cuideis que eu vos hei de acusar para com o Pai. Há um que vos acusa, Moisés, em quem vós esperais. 46 Porque, se vós crêsseis em Moisés, creríeis em mim, porque de mim escreveu ele. 47 Mas, se não credes nos seus escritos, como crereis nas minhas palavras?"}}, {"id": 48, "ordem": 48, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Ministra na Galileia", "titulo": "Os discípulos colhem espigas no sábado", "mateus": {"referencia": "Mt 12.1-8", "texto": "1 Naquele tempo, passou Jesus pelas searas, em um sábado; e os seus discípulos, tendo fome, começaram a colher espigas e a comer. 2 E os fariseus, vendo isso, disseram-lhe: Eis que os teus discípulos fazem o que não é lícito fazer num sábado. 3 Ele, porém, lhes disse: Não tendes lido o que fez Davi, quando teve fome, ele e os que com ele estavam? 4 Como entrou na Casa de Deus e comeu os pães da proposição, que não lhe era lícito comer, nem aos que com ele estavam, mas só aos sacerdotes? 5 Ou não tendes lido na lei que, aos sábados, os sacerdotes no templo violam o sábado e ficam sem culpa? 6 Pois eu vos digo que está aqui quem é maior do que o templo. 7 Mas, se vós soubésseis o que significa: Misericórdia quero e não sacrifício, não condenaríeis os inocentes. 8 Porque o Filho do Homem até do sábado é Senhor."}, "marcos": {"referencia": "Mc 2.23-28", "texto": "23 E aconteceu que, passando ele num sábado pelas searas, os seus discípulos, caminhando, começaram a colher espigas. 24 E os fariseus lhe disseram: Vês? Por que fazem no sábado o que não é lícito? 25 Mas ele disse-lhes: Nunca lestes o que fez Davi, quando estava em necessidade e teve fome, ele e os que com ele estavam? 26 Como entrou na Casa de Deus, no tempo de Abiatar, sumo sacerdote, e comeu os pães da proposição, dos quais não era lícito comer senão aos sacerdotes, dando também aos que com ele estavam? 27 E disse-lhes: O sábado foi feito por causa do homem, e não o homem, por causa do sábado. 28 Assim, o Filho do Homem até do sábado é senhor."}, "lucas": {"referencia": "Lc 6.1-5", "texto": "1 E aconteceu que, num sábado, passou pelas searas, e os seus discípulos iam arrancando espigas e, esfregando-as com as mãos, as comiam. 2 E alguns dos fariseus lhes disseram: Por que fazeis o que não é lícito fazer nos sábados? 3 E Jesus, respondendo-lhes, disse: Nunca lestes o que fez Davi quando teve fome, ele e os que com ele estavam? 4 Como entrou na Casa de Deus, e tomou os pães da proposição, e os comeu, e deu também aos que estavam com ele, os quais não lhes era lícito comer, senão só aos sacerdotes? 5 E dizia-lhes: O Filho do Homem é senhor até do sábado."}, "joao": null}, {"id": 49, "ordem": 49, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Ministra na Galileia", "titulo": "Jesus cura a mão de um homem no sábado", "mateus": {"referencia": "Mt 12.9-14", "texto": "9 E, partindo dali, chegou à sinagoga deles. 10 E estava ali um homem que tinha uma das mãos mirrada; e eles, para acusarem Jesus, o interrogaram, dizendo: É lícito curar nos sábados? 11 E ele lhes disse: Qual dentre vós será o homem que, tendo uma ovelha, se num sábado ela cair numa cova, não lançará mão dela e a levantará? 12 Pois quanto mais vale um homem do que uma ovelha? É, por consequência, lícito fazer bem nos sábados. 13 Então disse àquele homem: Estende a mão. E ele a estendeu, e ficou sã como a outra. 14 E os fariseus, tendo saído, formaram conselho contra ele, para o matarem."}, "marcos": {"referencia": "Mc 3.1-6", "texto": "1 E outra vez entrou na sinagoga, e estava ali um homem que tinha uma das mãos mirrada. 2 E estavam observando-o se curaria no sábado, para o acusarem. 3 E disse ao homem que tinha a mão mirrada: Levanta-te e vem para o meio. 4 E perguntou-lhes: É lícito no sábado fazer bem ou fazer mal? Salvar a vida ou matar? E eles calaram-se. 5 E, olhando para eles em redor com indignação, condoendo-se da dureza do seu coração, disse ao homem: Estende a mão. E ele a estendeu, e foi-lhe restituída a mão, sã como a outra. 6 E, tendo saído os fariseus, tomaram logo conselho com os herodianos contra ele, procurando ver como o matariam."}, "lucas": {"referencia": "Lc 6.6-11", "texto": "6 E aconteceu também, em outro sábado, que entrou na sinagoga e estava ensinando; e havia ali um homem que tinha a mão direita mirrada. 7 E os escribas e fariseus atentavam nele, se o curaria no sábado, para acharem de que o acusar. 8 Mas ele, conhecendo bem os seus pensamentos, disse ao homem que tinha a mão mirrada: Levanta-te e fica em pé no meio. E, levantando-se ele, ficou em pé. 9 Então, Jesus lhes disse: Uma coisa vos hei de perguntar: É lícito nos sábados fazer bem ou fazer mal? Salvar a vida ou matar? 10 E, olhando para todos ao redor, disse ao homem: Estende a mão. E ele assim o fez, e a mão lhe foi restituída sã como a outra. 11 E ficaram cheios de furor, e uns com os outros conferenciavam sobre o que fariam a Jesus."}, "joao": null}, {"id": 50, "ordem": 50, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Ministra na Galileia", "titulo": "Grandes multidões seguem Jesus", "mateus": {"referencia": "Mt 12.15-21", "texto": "15 Jesus, sabendo isso, retirou-se dali, e acompanhou-o uma grande multidão de gente, e ele curou a todos. 16 E recomendava-lhes rigorosamente que o não descobrissem, 17 para que se cumprisse o que fora dito pelo profeta Isaías, que diz: 18 Eis aqui o meu servo que escolhi, o meu amado, em quem a minha alma se compraz; porei sobre ele o meu Espírito, e anunciará aos gentios o juízo. 19 Não contenderá, nem clamará, nem alguém ouvirá pelas ruas a sua voz; 20 não esmagará a cana quebrada e não apagará o morrão que fumega, até que faça triunfar o juízo. 21 E, no seu nome, os gentios esperarão."}, "marcos": {"referencia": "Mc 3.7-12", "texto": "7 E retirou-se Jesus com os seus discípulos para o mar, e seguia-o uma grande multidão da Galileia, e da Judeia, 8 e de Jerusalém, e da Idumeia, e dalém do Jordão, e de perto de Tiro, e de Sidom; uma grande multidão que, ouvindo quão grandes coisas fazia, vinha ter com ele. 9 E ele disse aos seus discípulos que lhe tivessem sempre pronto um barquinho junto dele, por causa da multidão, para que o não comprimisse, 10 porque tinha curado a muitos, de tal maneira que todos quantos tinham algum mal se arrojavam sobre ele, para lhe tocarem. 11 E os espíritos imundos, vendo-o, prostravam-se diante dele e clamavam, dizendo: Tu és o Filho de Deus. 12 E ele os ameaçava muito, para que não o manifestassem."}, "lucas": {"referencia": "Lc 6.17-19", "texto": "17 E, descendo com eles, parou num lugar plano, e também um grande número de seus discípulos, e grande multidão do povo de toda a Judeia, e de Jerusalém, e da costa marítima de Tiro e de Sidom; 18 os quais tinham vindo para o ouvir e serem curados das suas enfermidades, como também os atormentados dos espíritos imundos. E eram curados. 19 E toda a multidão procurava tocar-lhe, porque saía dele virtude que curava todos."}, "joao": null}, {"id": 51, "ordem": 51, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Ministra na Galileia", "titulo": "Jesus escolhe os doze discípulos", "mateus": null, "marcos": {"referencia": "Mc 3.13-19", "texto": "13 E subiu ao monte e chamou para si os que ele quis; e vieram a ele. 14 E nomeou doze para que estivessem com ele e os mandasse a pregar 15 e para que tivessem o poder de curar as enfermidades e expulsar os demônios: 16 Simão, a quem pôs o nome de Pedro; 17 Tiago, filho de Zebedeu, e João, irmão de Tiago, aos quais pôs o nome de Boanerges, que significa: Filhos do trovão; 18 André, e Filipe, e Bartolomeu, e Mateus, e Tomé, e Tiago, filho de Alfeu, e Tadeu, e Simão, o Zelote, 19 e Judas Iscariotes, o que o traiu."}, "lucas": {"referencia": "Lc 6.12-16", "texto": "12 E aconteceu que, naqueles dias, subiu ao monte a orar e passou a noite em oração a Deus. 13 E, quando já era dia, chamou a si os seus discípulos, e escolheu doze deles, a quem também deu o nome de apóstolos: 14 Simão, ao qual também chamou Pedro, e André, seu irmão; Tiago e João; Filipe e Bartolomeu; 15 Mateus e Tomé; Tiago, filho de Alfeu, e Simão, chamado Zelote; 16 Judas, filho de Tiago, e Judas Iscariotes, que foi o traidor."}, "joao": null}, {"id": 52, "ordem": 52, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Ministra na Galileia", "titulo": "Jesus profere as bem-aventuranças", "mateus": {"referencia": "Mt 5.1-12", "texto": "1 Jesus, vendo a multidão, subiu a um monte, e, assentando-se, aproximaram-se dele os seus discípulos; 2 e, abrindo a boca, os ensinava, dizendo: 3 Bem-aventurados os pobres de espírito, porque deles é o Reino dos céus; 4 bem-aventurados os que choram, porque eles serão consolados; 5 bem-aventurados os mansos, porque eles herdarão a terra; 6 bem-aventurados os que têm fome e sede de justiça, porque eles serão fartos; 7 bem-aventurados os misericordiosos, porque eles alcançarão misericórdia; 8 bem-aventurados os limpos de coração, porque eles verão a Deus; 9 bem-aventurados os pacificadores, porque eles serão chamados filhos de Deus; 10 bem-aventurados os que sofrem perseguição por causa da justiça, porque deles é o Reino dos céus; 11 bem-aventurados sois vós quando vos injuriarem, e perseguirem, e, mentindo, disserem todo o mal contra vós, por minha causa. 12 Exultai e alegrai-vos, porque é grande o vosso galardão nos céus; porque assim perseguiram os profetas que foram antes de vós."}, "marcos": null, "lucas": {"referencia": "Lc 6.20-26", "texto": "20 E, levantando ele os olhos para os seus discípulos, dizia: Bem-aventurados vós, os pobres, porque vosso é o Reino de Deus. 21 Bem-aventurados vós, que agora tendes fome, porque sereis fartos. Bem-aventurados vós, que agora chorais, porque haveis de rir. 22 Bem-aventurados sereis quando os homens vos aborrecerem, e quando vos separarem, e vos injuriarem, e rejeitarem o vosso nome como mau, por causa do Filho do Homem. 23 Folgai nesse dia, exultai, porque é grande o vosso galardão no céu, pois assim faziam os seus pais aos profetas. 24 Mas ai de vós, ricos! Porque já tendes a vossa consolação. 25 Ai de vós, os que estais fartos, porque tereis fome! Ai de vós, os que agora rides, porque vos lamentareis e chorareis! 26 Ai de vós quando todos os homens falarem bem de vós, porque assim faziam seus pais aos falsos profetas!"}, "joao": null}, {"id": 53, "ordem": 53, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": null, "titulo": "Jesus ensina sobre o sal e a luz", "mateus": {"referencia": "Mt 5.13-16", "texto": "13 Vós sois o sal da terra; e, se o sal for insípido, com que se há de salgar? Para nada mais presta, senão para se lançar fora e ser pisado pelos homens. 14 Vós sois a luz do mundo; não se pode esconder uma cidade edificada sobre um monte; 15 nem se acende a candeia e se coloca debaixo do alqueire, mas, no velador, e dá luz a todos que estão na casa. 16 Assim resplandeça a vossa luz diante dos homens, para que vejam as vossas boas obras e glorifiquem o vosso Pai, que está nos céus."}, "marcos": null, "lucas": null, "joao": null}, {"id": 54, "ordem": 54, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": null, "titulo": "Jesus ensina sobre a lei", "mateus": {"referencia": "Mt 5.17-20", "texto": "17 Não cuideis que vim destruir a lei ou os profetas; não vim ab-rogar, mas cumprir. 18 Porque em verdade vos digo que, até que o céu e a terra passem, nem um jota ou um til se omitirá da lei sem que tudo seja cumprido. 19 Qualquer, pois, que violar um destes menores mandamentos e assim ensinar aos homens será chamado o menor no Reino dos céus; aquele, porém, que os cumprir e ensinar será chamado grande no Reino dos céus. 20 Porque vos digo que, se a vossa justiça não exceder a dos escribas e fariseus, de modo nenhum entrareis no Reino dos céus."}, "marcos": null, "lucas": null, "joao": null}, {"id": 55, "ordem": 55, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": null, "titulo": "Jesus ensina sobre a ira", "mateus": {"referencia": "Mt 5.21-26", "texto": "21 Ouvistes que foi dito aos antigos: Não matarás; mas qualquer que matar será réu de juízo. 22 Eu, porém, vos digo que qualquer que, sem motivo, se encolerizar contra seu irmão será réu de juízo, e qualquer que chamar a seu irmão de raca será réu do Sinédrio; e qualquer que lhe chamar de louco será réu do fogo do inferno. 23 Portanto, se trouxeres a tua oferta ao altar e aí te lembrares de que teu irmão tem alguma coisa contra ti, 24 deixa ali diante do altar a tua oferta, e vai reconciliar-te primeiro com teu irmão, e depois vem, e apresenta a tua oferta. 25 Concilia-te depressa com o teu adversário, enquanto estás no caminho com ele, para que não aconteça que o adversário te entregue ao juiz, e o juiz te entregue ao oficial, e te encerrem na prisão. 26 Em verdade te digo que, de maneira nenhuma, sairás dali, enquanto não pagares o último ceitil."}, "marcos": null, "lucas": null, "joao": null}, {"id": 56, "ordem": 56, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": null, "titulo": "Jesus ensina sobre a luxúria", "mateus": {"referencia": "Mt 5.27-30", "texto": "27 Ouvistes que foi dito aos antigos: Não cometerás adultério. 28 Eu porém, vos digo que qualquer que atentar numa mulher para a cobiçar já em seu coração cometeu adultério com ela. 29 Portanto, se o teu olho direito te escandalizar, arranca-o e atira-o para longe de ti, pois te é melhor que se perca um dos teus membros do que todo o teu corpo seja lançado no inferno. 30 E, se a tua mão direita te escandalizar, corta-a e atira-a para longe de ti, porque te é melhor que um dos teus membros se perca do que todo o teu corpo seja lançado no inferno."}, "marcos": null, "lucas": null, "joao": null}, {"id": 57, "ordem": 57, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": null, "titulo": "Jesus ensina sobre o divórcio", "mateus": {"referencia": "Mt 5.31-32", "texto": "31 Também foi dito: Qualquer que deixar sua mulher, que lhe dê carta de desquite. 32 Eu, porém, vos digo que qualquer que repudiar sua mulher, a não ser por causa de prostituição, faz que ela cometa adultério; e qualquer que casar com a repudiada comete adultério."}, "marcos": null, "lucas": null, "joao": null}, {"id": 58, "ordem": 58, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": null, "titulo": "Jesus ensina sobre votos", "mateus": {"referencia": "Mt 5.33-37", "texto": "33 Outrossim, ouvistes que foi dito aos antigos: Não perjurarás, mas cumprirás teus juramentos ao Senhor. 34 Eu, porém, vos digo que, de maneira nenhuma, jureis nem pelo céu, porque é o trono de Deus, 35 nem pela terra, porque é o escabelo de seus pés, nem por Jerusalém, porque é a cidade do grande Rei, 36 nem jurarás pela tua cabeça, porque não podes tornar um cabelo branco ou preto. 37 Seja, porém, o vosso falar: Sim, sim; não, não, porque o que passa disso é de procedência maligna."}, "marcos": null, "lucas": null, "joao": null}, {"id": 59, "ordem": 59, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": null, "titulo": "Jesus ensina sobre a vingança", "mateus": {"referencia": "Mt 5.38-42", "texto": "38 Ouvistes que foi dito: Olho por olho e dente por dente. 39 Eu, porém, vos digo que não resistais ao mal; mas, se qualquer te bater na face direita, oferece-lhe também a outra; 40 e ao que quiser pleitear contigo e tirar-te a vestimenta, larga-lhe também a capa; 41 e, se qualquer te obrigar a caminhar uma milha, vai com ele duas. 42 Dá a quem te pedir e não te desvies daquele que quiser que lhe emprestes."}, "marcos": null, "lucas": null, "joao": null}, {"id": 60, "ordem": 60, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": null, "titulo": "Jesus ensina sobre amar os inimigos", "mateus": {"referencia": "Mt 5.43-48", "texto": "43 Ouvistes que foi dito: Amarás o teu próximo e aborrecerás o teu inimigo. 44 Eu, porém, vos digo: Amai a vossos inimigos, bendizei os que vos maldizem, fazei bem aos que vos odeiam e orai pelos que vos maltratam e vos perseguem, 45 para que sejais filhos do Pai que está nos céus; porque faz que o seu sol se levante sobre maus e bons e a chuva desça sobre justos e injustos. 46 Pois, se amardes os que vos amam, que galardão tereis? Não fazem os publicanos também o mesmo? 47 E, se saudardes unicamente os vossos irmãos, que fazeis de mais? Não fazem os publicanos também assim? 48 Sede vós, pois, perfeitos, como é perfeito o vosso Pai, que está nos céus."}, "marcos": null, "lucas": {"referencia": "Lc 6.27-36", "texto": "27 Mas a vós, que ouvis, digo: Amai a vossos inimigos, fazei bem aos que vos aborrecem, 28 bendizei os que vos maldizem e orai pelos que vos caluniam. 29 Ao que te ferir numa face, oferece-lhe também a outra; e ao que te houver tirado a capa, nem a túnica recuses. 30 E dá a qualquer que te pedir; e ao que tomar o que é teu, não lho tornes a pedir. 31 E como vós quereis que os homens vos façam, da mesma maneira fazei-lhes vós também. 32 E, se amardes aos que vos amam, que recompensa tereis? Também os pecadores amam aos que os amam. 33 E, se fizerdes bem aos que vos fazem bem, que recompensa tereis? Também os pecadores fazem o mesmo. 34 E, se emprestardes àqueles de quem esperais tornar a receber, que recompensa tereis? Também os pecadores emprestam aos pecadores, para tornarem a receber outro tanto. 35 Amai, pois, a vossos inimigos, e fazei o bem, e emprestai, sem nada esperardes, e será grande o vosso galardão, e sereis filhos do Altíssimo; porque ele é benigno até para com os ingratos e maus. 36 Sede, pois, misericordiosos, como também vosso Pai é misericordioso."}, "joao": null}, {"id": 61, "ordem": 61, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": null, "titulo": "Jesus ensina sobre dar aos necessitados", "mateus": {"referencia": "Mt 6.1-4", "texto": "1 Guardai-vos de fazer a vossa esmola diante dos homens, para serdes vistos por eles; aliás, não tereis galardão junto de vosso Pai, que está nos céus. 2 Quando, pois, deres esmola, não faças tocar trombeta diante de ti, como fazem os hipócritas nas sinagogas e nas ruas, para serem glorificados pelos homens. Em verdade vos digo que já receberam o seu galardão. 3 Mas, quando tu deres esmola, não saiba a tua mão esquerda o que faz a tua direita, 4 para que a tua esmola seja dada ocultamente, e teu Pai, que vê em secreto, te recompensará publicamente."}, "marcos": null, "lucas": null, "joao": null}, {"id": 62, "ordem": 62, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": null, "titulo": "Jesus ensina sobre a oração", "mateus": {"referencia": "Mt 6.5-15", "texto": "5 E, quando orares, não sejas como os hipócritas, pois se comprazem em orar em pé nas sinagogas e às esquinas das ruas, para serem vistos pelos homens. Em verdade vos digo que já receberam o seu galardão. 6 Mas tu, quando orares, entra no teu aposento e, fechando a tua porta, ora a teu Pai, que vê o que está oculto; e teu Pai, que vê o que está oculto, te recompensará. 7 E, orando, não useis de vãs repetições, como os gentios, que pensam que, por muito falarem, serão ouvidos. 8 Não vos assemelheis, pois, a eles, porque vosso Pai sabe o que vos é necessário antes de vós lho pedirdes. 9 Portanto, vós orareis assim: Pai nosso, que estás nos céus, santificado seja o teu nome. 10 Venha o teu Reino. Seja feita a tua vontade, tanto na terra como no céu. 11 O pão nosso de cada dia dá-nos hoje. 12 Perdoa-nos as nossas dívidas, assim como nós perdoamos aos nossos devedores. 13 E não nos induzas à tentação, mas livra-nos do mal; porque teu é o Reino, e o poder, e a glória, para sempre. Amém! 14 Porque, se perdoardes aos homens as suas ofensas, também vosso Pai celestial vos perdoará a vós. 15 Se, porém, não perdoardes aos homens as suas ofensas, também vosso Pai vos não perdoará as vossas ofensas."}, "marcos": null, "lucas": null, "joao": null}, {"id": 63, "ordem": 63, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": null, "titulo": "Jesus ensina sobre o jejum", "mateus": {"referencia": "Mt 6.16-18", "texto": "16 E, quando jejuardes, não vos mostreis contristados como os hipócritas, porque desfiguram o rosto, para que aos homens pareça que jejuam. Em verdade vos digo que já receberam o seu galardão. 17 Porém tu, quando jejuares, unge a cabeça e lava o rosto, 18 para não pareceres aos homens que jejuas, mas sim a teu Pai, que está oculto; e teu Pai, que vê o que está oculto, te recompensará."}, "marcos": null, "lucas": null, "joao": null}, {"id": 64, "ordem": 64, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": null, "titulo": "Jesus ensina sobre o dinheiro", "mateus": {"referencia": "Mt 6.19-24", "texto": "19 Não ajunteis tesouros na terra, onde a traça e a ferrugem tudo consomem, e onde os ladrões minam e roubam. 20 Mas ajuntai tesouros no céu, onde nem a traça nem a ferrugem consomem, e onde os ladrões não minam, nem roubam. 21 Porque onde estiver o vosso tesouro, aí estará também o vosso coração. 22 A candeia do corpo são os olhos; de sorte que, se os teus olhos forem bons, todo o teu corpo terá luz. 23 Se, porém, os teus olhos forem maus, o teu corpo será tenebroso. Se, portanto, a luz que em ti há são trevas, quão grandes serão tais trevas! 24 Ninguém pode servir a dois senhores, porque ou há de odiar um e amar o outro ou se dedicará a um e desprezará o outro. Não podeis servir a Deus e a Mamom."}, "marcos": null, "lucas": null, "joao": null}, {"id": 65, "ordem": 65, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": null, "titulo": "Jesus ensina sobre a preocupação", "mateus": {"referencia": "Mt 6.25-34", "texto": "25 Por isso, vos digo: não andeis cuidadosos quanto à vossa vida, pelo que haveis de comer ou pelo que haveis de beber; nem quanto ao vosso corpo, pelo que haveis de vestir. Não é a vida mais do que o mantimento, e o corpo, mais do que a vestimenta? 26 Olhai para as aves do céu, que não semeiam, nem segam, nem ajuntam em celeiros; e vosso Pai celestial as alimenta. Não tendes vós muito mais valor do que elas? 27 E qual de vós poderá, com todos os seus cuidados, acrescentar um côvado à sua estatura? 28 E, quanto ao vestuário, porque andais solícitos? Olhai para os lírios do campo, como eles crescem; não trabalham, nem fiam. 29 E eu vos digo que nem mesmo Salomão, em toda a sua glória, se vestiu como qualquer deles. 30 Pois, se Deus assim veste a erva do campo, que hoje existe e amanhã é lançada no forno, não vos vestirá muito mais a vós, homens de pequena fé? 31 Não andeis, pois, inquietos, dizendo: Que comeremos ou que beberemos ou com que nos vestiremos? 32 (Porque todas essas coisas os gentios procuram.) Decerto, vosso Pai celestial bem sabe que necessitais de todas essas coisas; 33 Mas buscai primeiro o Reino de Deus, e a sua justiça, e todas essas coisas vos serão acrescentadas. 34 Não vos inquieteis, pois, pelo dia de amanhã, porque o dia de amanhã cuidará de si mesmo. Basta a cada dia o seu mal."}, "marcos": null, "lucas": null, "joao": null}, {"id": 66, "ordem": 66, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": null, "titulo": "Jesus ensina sobre a atitude de julgar os outros", "mateus": {"referencia": "Mt 7.1-6", "texto": "1 Não julgueis, para que não sejais julgados, 2 porque com o juízo com que julgardes sereis julgados, e com a medida com que tiverdes medido vos hão de medir a vós. 3 E por que reparas tu no argueiro que está no olho do teu irmão e não vês a trave que está no teu olho? 4 Ou como dirás a teu irmão: Deixa-me tirar o argueiro do teu olho, estando uma trave no teu? 5 Hipócrita, tira primeiro a trave do teu olho e, então, cuidarás em tirar o argueiro do olho do teu irmão. 6 Não deis aos cães as coisas santas, nem deiteis aos porcos as vossas pérolas; para que não as pisem e, voltando-se, vos despedacem."}, "marcos": null, "lucas": {"referencia": "Lc 6.37-42", "texto": "37 Não julgueis, e não sereis julgados; não condeneis, e não sereis condenados; soltai, e soltar-vos-ão. 38 Dai, e ser-vos-á dado; boa medida, recalcada, sacudida e transbordando vos darão; porque com a mesma medida com que medirdes também vos medirão de novo. 39 E disse-lhes uma parábola: Pode, porventura, um cego guiar outro cego? Não cairão ambos na cova? 40 O discípulo não é superior a seu mestre, mas todo o que for perfeito será como o seu mestre. 41 E por que atentas tu no argueiro que está no olho do teu irmão e não reparas na trave que está no teu próprio olho? 42 Ou como podes dizer a teu irmão: Irmão, deixa-me tirar o argueiro que está no teu olho, não atentando tu mesmo na trave que está no teu olho? Hipócrita, tira primeiro a trave do teu olho e, então, verás bem para tirar o argueiro que está no olho de teu irmão."}, "joao": null}, {"id": 67, "ordem": 67, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": null, "titulo": "Jesus ensina sobre pedir, buscar, bater", "mateus": {"referencia": "Mt 7.7-11", "texto": "7 Pedi, e dar-se-vos-á; buscai e encontrareis; batei, e abrir-se-vos-á. 8 Porque aquele que pede recebe; e o que busca encontra; e, ao que bate, se abre. 9 E qual dentre vós é o homem que, pedindo-lhe pão o seu filho, lhe dará uma pedra? 10 E, pedindo-lhe peixe, lhe dará uma serpente? 11 Se, vós, pois, sendo maus, sabeis dar boas coisas aos vossos filhos, quanto mais vosso Pai, que está nos céus, dará bens aos que lhe pedirem?"}, "marcos": null, "lucas": null, "joao": null}, {"id": 68, "ordem": 68, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": null, "titulo": "A regra áurea", "mateus": {"referencia": "Mt 7.12", "texto": "12 Portanto, tudo o que vós quereis que os homens vos façam, fazei-lho também vós, porque esta é a lei e os profetas."}, "marcos": null, "lucas": null, "joao": null}, {"id": 69, "ordem": 69, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": null, "titulo": "Jesus ensina sobre o caminho para o céu", "mateus": {"referencia": "Mt 7.13-14", "texto": "13 Entrai pela porta estreita, porque larga é a porta, e espaçoso, o caminho que conduz à perdição, e muitos são os que entram por ela; 14 E porque estreita é a porta, e apertado, o caminho que leva à vida, e poucos há que a encontrem."}, "marcos": null, "lucas": null, "joao": null}, {"id": 70, "ordem": 70, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": null, "titulo": "Jesus ensina sobre o fruto na vida das pessoas", "mateus": {"referencia": "Mt 7.15-29", "texto": "15 Acautelai-vos, porém, dos falsos profetas, que vêm até vós vestidos como ovelhas, mas interiormente são lobos devoradores. 16 Por seus frutos os conhecereis. Porventura, colhem-se uvas dos espinheiros ou figos dos abrolhos? 17 Assim, toda árvore boa produz bons frutos, e toda árvore má produz frutos maus. 18 Não pode a árvore boa dar maus frutos, nem a árvore má dar frutos bons. 19 Toda árvore que não dá bom fruto corta-se e lança-se no fogo. 20 Portanto, pelos seus frutos os conhecereis. 21 Nem todo o que me diz: Senhor, Senhor! entrará no Reino dos céus, mas aquele que faz a vontade de meu Pai, que está nos céus. 22 Muitos me dirão naquele Dia: Senhor, Senhor, não profetizamos nós em teu nome? E, em teu nome, não expulsamos demônios? E, em teu nome, não fizemos muitas maravilhas? 23 E, então, lhes direi abertamente: Nunca vos conheci; apartai-vos de mim, vós que praticais a iniquidade. 24 Todo aquele, pois, que escuta estas minhas palavras e as pratica, assemelhá-lo-ei ao homem prudente, que edificou a sua casa sobre a rocha. 25 E desceu a chuva, e correram rios, e assopraram ventos, e combateram aquela casa, e não caiu, porque estava edificada sobre a rocha. 26 E aquele que ouve estas minhas palavras e as não cumpre, compará-lo-ei ao homem insensato, que edificou a sua casa sobre a areia. 27 E desceu a chuva, e correram rios, e assopraram ventos, e combateram aquela casa, e caiu, e foi grande a sua queda. 28 E aconteceu que, concluindo Jesus este discurso, a multidão se admirou da sua doutrina, 29 porquanto os ensinava com autoridade e não como os escribas."}, "marcos": null, "lucas": {"referencia": "Lc 6.43-49", "texto": "43 Porque não há boa árvore que dê mau fruto, nem má árvore que dê bom fruto. 44 Porque cada árvore se conhece pelo seu próprio fruto; pois não se colhem figos dos espinheiros, nem se vindimam uvas dos abrolhos. 45 O homem bom, do bom tesouro do seu coração, tira o bem, e o homem mau, do mau tesouro do seu coração, tira o mal, porque da abundância do seu coração fala a boca. 46 E por que me chamais Senhor, Senhor, e não fazeis o que eu digo? 47 Qualquer que vem a mim, e ouve as minhas palavras, e as observa, eu vos mostrarei a quem é semelhante. 48 É semelhante ao homem que edificou uma casa, e cavou, e abriu bem fundo, e pôs os alicerces sobre rocha; e, vindo a enchente, bateu com ímpeto a corrente naquela casa e não a pôde abalar, porque estava fundada sobre rocha. 49 Mas o que ouve e não pratica é semelhante ao homem que edificou uma casa sobre terra, sem alicerces, na qual bateu com ímpeto a corrente, e logo caiu; e foi grande a ruína daquela casa."}, "joao": null}, {"id": 71, "ordem": 71, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": null, "titulo": "Um oficial romano demonstra fé", "mateus": {"referencia": "Mt 8.5-13", "texto": "5 E, entrando Jesus em Cafarnaum, chegou junto dele um centurião, rogando-lhe 6 e dizendo: Senhor, o meu criado jaz em casa paralítico e violentamente atormentado. 7 E Jesus lhe disse: Eu irei e lhe darei saúde. 8 E o centurião, respondendo, disse: Senhor, não sou digno de que entres debaixo do meu telhado, mas dize somente uma palavra, e o meu criado sarará, 9 pois também eu sou homem sob autoridade e tenho soldados às minhas ordens; e digo a este: vai, e ele vai; e a outro: vem, e ele vem; e ao meu criado: faze isto, e ele o faz. 10 E maravilhou-se Jesus, ouvindo isso, e disse aos que o seguiam: Em verdade vos digo que nem mesmo em Israel encontrei tanta fé. 11 Mas eu vos digo que muitos virão do Oriente e do Ocidente e assentar-se-ão à mesa com Abraão, e Isaque, e Jacó, no Reino dos céus; 12 E os filhos do Reino serão lançados nas trevas exteriores; ali, haverá pranto e ranger de dentes. 13 Então, disse Jesus ao centurião: Vai, e como creste te seja feito. E, naquela mesma hora, o seu criado sarou."}, "marcos": null, "lucas": {"referencia": "Lc 7.1-10", "texto": "1 E, depois de concluir todos esses discursos perante o povo, entrou em Cafarnaum. 2 E o servo de um certo centurião, a quem este muito estimava, estava doente e moribundo. 3 E, quando ouviu falar de Jesus, enviou-lhe uns anciãos dos judeus, rogando-lhe que viesse curar o seu servo. 4 E, chegando eles junto de Jesus, rogaram-lhe muito, dizendo: É digno de que lhe concedas isso. 5 Porque ama a nossa nação e ele mesmo nos edificou a sinagoga. 6 E foi Jesus com eles; mas, quando já estava perto da casa, enviou-lhe o centurião uns amigos, dizendo-lhe: Senhor, não te incomodes, porque não sou digno de que entres debaixo do meu telhado; 7 e, por isso, nem ainda me julguei digno de ir ter contigo; dize, porém, uma palavra, e o meu criado sarará. 8 Porque também eu sou homem sujeito à autoridade, e tenho soldados sob o meu poder, e digo a este: vai; e ele vai; e a outro: vem; e ele vem; e ao meu servo: faze isto; e ele o faz. 9 E, ouvindo isso, Jesus maravilhou-se dele e, voltando-se, disse à multidão que o seguia: Digo-vos que nem ainda em Israel tenho achado tanta fé. 10 E, voltando para casa os que foram enviados, acharam são o servo enfermo."}, "joao": null}, {"id": 72, "ordem": 72, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": null, "titulo": "Jesus ressuscita o filho de uma viúva", "mateus": null, "marcos": null, "lucas": {"referencia": "Lc 7.11-17", "texto": "11 E aconteceu, pouco depois, ir ele à cidade chamada Naim, e com ele iam muitos dos seus discípulos e uma grande multidão. 12 E, quando chegou perto da porta da cidade, eis que levavam um defunto, filho único de sua mãe, que era viúva; e com ela ia uma grande multidão da cidade. 13 E, vendo-a, o Senhor moveu-se de íntima compaixão por ela e disse-lhe: Não chores. 14 E, chegando-se, tocou o esquife (e os que o levavam pararam) e disse: Jovem, eu te digo: Levanta-te. 15 E o defunto assentou-se e começou a falar. E entregou-o à sua mãe. 16 E de todos se apoderou o temor, e glorificavam a Deus, dizendo: Um grande profeta se levantou entre nós, e Deus visitou o seu povo. 17 E correu dele esta fama por toda a Judeia e por toda a terra circunvizinha."}, "joao": null}, {"id": 73, "ordem": 73, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": null, "titulo": "Jesus sana a dúvida de João", "mateus": {"referencia": "Mt 11.1-19", "texto": "1 E aconteceu que, acabando Jesus de dar instruções aos seus doze discípulos, partiu dali a ensinar e a pregar nas cidades deles. 2 E João, ouvindo no cárcere falar dos feitos de Cristo, enviou dois dos seus discípulos 3 a dizer-lhe: És tu aquele que havia de vir ou esperamos outro? 4 E Jesus, respondendo, disse-lhe: Ide e anunciai a João as coisas que ouvis e vedes: 5 Os cegos veem, e os coxos andam; os leprosos são limpos, e os surdos ouvem; os mortos são ressuscitados, e aos pobres é anunciado o evangelho. 6 E bem-aventurado é aquele que se não escandalizar em mim. 7 E, partindo eles, começou Jesus a dizer às turbas a respeito de João: Que fostes ver no deserto? Uma cana agitada pelo vento? 8 Sim, que fostes ver? Um homem ricamente vestido? Os que se trajam ricamente estão nas casas dos reis. 9 Mas, então, que fostes ver? Um profeta? Sim, vos digo eu, e muito mais do que profeta; 10 porque é este de quem está escrito: Eis que diante da tua face envio o meu anjo, que preparará diante de ti o teu caminho. 11 Em verdade vos digo que, entre os que de mulher têm nascido, não apareceu alguém maior do que João Batista; mas aquele que é o menor no Reino dos céus é maior do que ele. 12 E, desde os dias de João Batista até agora, se faz violência ao Reino dos céus, e pela força se apoderam dele. 13 Porque todos os profetas e a lei profetizaram até João. 14 E, se quereis dar crédito, é este o Elias que havia de vir. 15 Quem tem ouvidos para ouvir ouça. 16 Mas a quem assemelharei esta geração? É semelhante aos meninos que se assentam nas praças, e clamam aos seus companheiros, 17 e dizem: Tocamo-vos flauta, e não dançastes; cantamo-vos lamentações, e não chorastes. 18 Porquanto veio João, não comendo, nem bebendo, e dizem: Tem demônio. 19 Veio o Filho do Homem, comendo e bebendo, e dizem: Eis aí um homem comilão e beberrão, amigo de publicanos e pecadores. Mas a sabedoria é justificada por seus filhos."}, "marcos": null, "lucas": {"referencia": "Lc 7.18-35", "texto": "18 E os discípulos de João anunciaram-lhe todas essas coisas. 19 E João, chamando dois dos seus discípulos, enviou-os a Jesus, dizendo: És tu aquele que havia de vir ou esperamos outro? 20 E, quando aqueles homens chegaram junto dele, disseram: João Batista enviou-nos a perguntar-te: És tu aquele que havia de vir ou esperamos outro? 21 E, na mesma hora, curou muitos de enfermidades, e males, e espíritos maus; e deu vista a muitos cegos. 22 Respondendo, então, Jesus, disse-lhes: Ide e anunciai a João o que tendes visto e ouvido: os cegos veem, os coxos andam, os leprosos são purificados, os surdos ouvem, os mortos ressuscitam e aos pobres anuncia-se o evangelho. 23 E bem-aventurado aquele que em mim se não escandalizar. 24 E, tendo-se retirado os mensageiros de João, começou a dizer à multidão acerca de João: Que saístes a ver no deserto? Uma cana abalada pelo vento? 25 Mas que saístes a ver? Um homem trajado de vestes delicadas? Eis que os que andam com vestes preciosas e em delícias estão nos paços reais. 26 Mas que saístes a ver? Um profeta? Sim, vos digo, e muito mais do que profeta. 27 Este é aquele de quem está escrito: Eis que envio o meu anjo diante da tua face, o qual preparará diante de ti o teu caminho. 28 E eu vos digo que, entre os nascidos de mulheres, não há maior profeta do que João Batista; mas o menor no Reino de Deus é maior do que ele. 29 E todo o povo que o ouviu e os publicanos, tendo sido batizados com o batismo de João, justificaram a Deus. 30 Mas os fariseus e os doutores da lei rejeitaram o conselho de Deus contra si mesmos, não tendo sido batizados por ele. 31 E disse o Senhor: A quem, pois, compararei os homens desta geração, e a quem são semelhantes? 32 São semelhantes aos meninos que, assentados nas praças, clamam uns aos outros e dizem: Nós vos tocamos flauta, e não dançastes; cantamos lamentações, e não chorastes. 33 Porque veio João Batista, que não comia pão nem bebia vinho, e dizeis: Tem demônio. 34 Veio o Filho do Homem, que come e bebe, e dizeis: Eis aí um homem comilão e bebedor de vinho, amigo dos publicanos e dos pecadores. 35 Mas a sabedoria é justificada por todos os seus filhos."}, "joao": null}, {"id": 74, "ordem": 74, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": null, "titulo": "Jesus promete repouso para a alma", "mateus": {"referencia": "Mt 11.20-30", "texto": "20 Então, começou ele a lançar em rosto às cidades onde se operou a maior parte dos seus prodígios o não se haverem arrependido, dizendo: 21 Ai de ti, Corazim! Ai de ti, Betsaida! Porque, se em Tiro e em Sidom fossem feitos os prodígios que em vós se fizeram, há muito que se teriam arrependido com pano de saco grosseiro e com cinza. 22 Por isso, eu vos digo que haverá menos rigor para Tiro e Sidom, no Dia do Juízo, do que para vós. 23 E tu, Cafarnaum, que te ergues até aos céus, serás abatida até aos infernos; porque, se em Sodoma tivessem sido feitos os prodígios que em ti se operaram, teria ela permanecido até hoje. 24 Porém eu vos digo que haverá menos rigor para os de Sodoma, no Dia do Juízo, do que para ti. 25 Naquele tempo, respondendo Jesus, disse: Graças te dou, ó Pai, Senhor do céu e da terra, que ocultaste estas coisas aos sábios e instruídos e as revelaste aos pequeninos. 26 Sim, ó Pai, porque assim te aprouve. 27 Todas as coisas me foram entregues por meu Pai; e ninguém conhece o Filho, senão o Pai; e ninguém conhece o Pai, senão o Filho e aquele a quem o Filho o quiser revelar. 28 Vinde a mim, todos os que estais cansados e oprimidos, e eu vos aliviarei. 29 Tomai sobre vós o meu jugo, e aprendei de mim, que sou manso e humilde de coração, e encontrareis descanso para a vossa alma. 30 Porque o meu jugo é suave, e o meu fardo é leve."}, "marcos": null, "lucas": null, "joao": null}, {"id": 75, "ordem": 75, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": null, "titulo": "Uma mulher pecadora unge os pés de Jesus", "mateus": null, "marcos": null, "lucas": {"referencia": "Lc 7.36-50", "texto": "36 E rogou-lhe um dos fariseus que comesse com ele; e, entrando em casa do fariseu, assentou-se à mesa. 37 E eis que uma mulher da cidade, uma pecadora, sabendo que ele estava à mesa em casa do fariseu, levou um vaso de alabastro com unguento. 38 E, estando por detrás, aos seus pés, chorando, começou a regar-lhe os pés com lágrimas, e enxugava-lhos com os cabelos da sua cabeça e beijava-lhe os pés, e ungia-lhos com o unguento. 39 Quando isso viu o fariseu que o tinha convidado, falava consigo, dizendo: Se este fora profeta, bem saberia quem e qual é a mulher que lhe tocou, pois é uma pecadora. 40 E, respondendo, Jesus disse-lhe: Simão, uma coisa tenho a dizer-te. E ele disse: Dize-a, Mestre. 41 Um certo credor tinha dois devedores; um devia-lhe quinhentos dinheiros, e outro, cinquenta. 42 E, não tendo eles com que pagar, perdoou-lhes a ambos. Dize, pois: qual deles o amará mais? 43 E Simão, respondendo, disse: Tenho para mim que é aquele a quem mais perdoou. E ele lhe disse: Julgaste bem. 44 E, voltando-se para a mulher, disse a Simão: Vês tu esta mulher? Entrei em tua casa, e não me deste água para os pés; mas esta regou-me os pés com lágrimas e mos enxugou com os seus cabelos. 45 Não me deste ósculo, mas esta, desde que entrou, não tem cessado de me beijar os pés. 46 Não me ungiste a cabeça com óleo, mas esta ungiu-me os pés com unguento. 47 Por isso, te digo que os seus muitos pecados lhe são perdoados, porque muito amou; mas aquele a quem pouco é perdoado pouco ama. 48 E disse a ela: Os teus pecados te são perdoados. 49 E os que estavam à mesa começaram a dizer entre si: Quem é este, que até perdoa pecados? 50 E disse à mulher: A tua fé te salvou; vai-te em paz."}, "joao": null}, {"id": 76, "ordem": 76, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": null, "titulo": "Mulheres acompanham Jesus e os discípulos", "mateus": null, "marcos": null, "lucas": {"referencia": "Lc 8.1-3", "texto": "1 E aconteceu, depois disso, que andava de cidade em cidade e de aldeia em aldeia, pregando e anunciando o evangelho do Reino de Deus; e os doze iam com ele, 2 e também algumas mulheres que haviam sido curadas de espíritos malignos e de enfermidades: Maria, chamada Madalena, da qual saíram sete demônios; 3 e Joana, mulher de Cuza, procurador de Herodes, e Suzana, e muitas outras que o serviam com suas fazendas."}, "joao": null}, {"id": 77, "ordem": 77, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": null, "titulo": "Os líderes religiosos acusam Jesus de obter seu poder de Satanás", "mateus": {"referencia": "Mt 12.22-37", "texto": "22 Trouxeram-lhe, então, um endemoninhado cego e mudo; e, de tal modo o curou, que o cego e mudo falava e via. 23 E toda a multidão se admirava e dizia: Não é este o Filho de Davi? 24 Mas os fariseus, ouvindo isso, diziam: Este não expulsa os demônios senão por Belzebu, príncipe dos demônios. 25 Jesus, porém, conhecendo os seus pensamentos, disse-lhes: Todo reino dividido contra si mesmo é devastado; e toda cidade ou casa dividida contra si mesma não subsistirá. 26 E, se Satanás expulsa a Satanás, está dividido contra si mesmo; como subsistirá, pois, o seu reino? 27 E, se eu expulso os demônios por Belzebu, por quem os expulsam, então, os vossos filhos? Portanto, eles mesmos serão os vossos juízes. 28 Mas, se eu expulso os demônios pelo Espírito de Deus, é conseguintemente chegado a vós o Reino de Deus. 29 Ou como pode alguém entrar em casa do homem valente e furtar os seus bens, se primeiro não manietar o valente, saqueando, então, a sua casa? 30 Quem não é comigo é contra mim; e quem comigo não ajunta espalha. 31 Portanto, eu vos digo: todo pecado e blasfêmia se perdoará aos homens, mas a blasfêmia contra o Espírito não será perdoada aos homens. 32 E, se qualquer disser alguma palavra contra o Filho do Homem, ser-lhe-á perdoado, mas, se alguém falar contra o Espírito Santo, não lhe será perdoado, nem neste século nem no futuro. 33 Ou dizeis que a árvore é boa e o seu fruto, bom, ou dizeis que a árvore é má e o seu fruto, mau; porque pelo fruto se conhece a árvore. 34 Raça de víboras, como podeis vós dizer boas coisas, sendo maus? Pois do que há em abundância no coração, disso fala a boca. 35 O homem bom tira boas coisas do seu bom tesouro, e o homem mau do mau tesouro tira coisas más. 36 Mas eu vos digo que de toda palavra ociosa que os homens disserem hão de dar conta no Dia do Juízo. 37 Porque por tuas palavras serás justificado e por tuas palavras serás condenado."}, "marcos": {"referencia": "Mc 3.20-30", "texto": "20 E foram para uma casa. E afluiu outra vez a multidão, de tal maneira que nem sequer podiam comer pão. 21 E, quando os seus parentes ouviram isso, saíram para o prender, porque diziam: Está fora de si. 22 E os escribas, que tinham descido de Jerusalém, diziam: Tem Belzebu e pelo príncipe dos demônios expulsa os demônios. 23 E, chamando-os a si, disse-lhes por parábolas: Como pode Satanás expulsar Satanás? 24 Se um reino se dividir contra si mesmo, tal reino não pode subsistir; 25 e se uma casa se dividir contra si mesma, tal casa não pode subsistir. 26 Se Satanás se levantar contra si mesmo, e for dividido, não pode subsistir; antes, tem fim. 27 Ninguém pode roubar os bens do valente, entrando-lhe em sua casa, se primeiro não manietar o valente; e, então, roubará a sua casa. 28 Na verdade vos digo que todos os pecados serão perdoados aos filhos dos homens, e toda sorte de blasfêmias, com que blasfemarem. 29 Qualquer, porém, que blasfemar contra o Espírito Santo, nunca obterá perdão, mas será réu do eterno juízo. 30 (Porque diziam: Tem espírito imundo.)"}, "lucas": {"referencia": "Lc 11.14-23", "texto": "14 E estava ele expulsando um demônio, o qual era mudo. E aconteceu que, saindo o demônio, o mudo falou; e maravilhou-se a multidão. 15 Mas alguns deles diziam: Ele expulsa os demônios por Belzebu, príncipe dos demônios. 16 E outros, tentando-o, pediam-lhe um sinal do céu. 17 Mas, conhecendo ele os seus pensamentos, disse-lhes: Todo reino dividido contra si mesmo será assolado; e a casa dividida contra si mesma cairá. 18 E, se também Satanás está dividido contra si mesmo, como subsistirá o seu reino? Pois dizeis que eu expulso os demônios por Belzebu. 19 E, se eu expulso os demônios por Belzebu, por quem os expulsam vossos filhos? Eles, pois, serão os vossos juízes. 20 Mas, se eu expulso os demônios pelo dedo de Deus, certamente, a vós é chegado o Reino de Deus. 21 Quando o valente guarda, armado, a sua casa, em segurança está tudo quanto tem. 22 Mas, sobrevindo outro mais valente do que ele e vencendo-o, tira-lhe toda a armadura em que confiava e reparte os seus despojos. 23 Quem não é comigo é contra mim; e quem comigo não ajunta espalha."}, "joao": null}, {"id": 78, "ordem": 78, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": null, "titulo": "Os líderes religiosos pedem a Jesus um sinal miraculoso", "mateus": {"referencia": "Mt 12.38-45", "texto": "38 Então, alguns dos escribas e dos fariseus tomaram a palavra, dizendo: Mestre, quiséramos ver da tua parte algum sinal. 39 Mas ele lhes respondeu e disse: Uma geração má e adúltera pede um sinal, porém não se lhe dará outro sinal, senão o do profeta Jonas, 40 pois, como Jonas esteve três dias e três noites no ventre da baleia, assim estará o Filho do Homem três dias e três noites no seio da terra. 41 Os ninivitas ressurgirão no Juízo com esta geração e a condenarão, porque se arrependeram com a pregação de Jonas. E eis que está aqui quem é mais do que Jonas. 42 A Rainha do Sul se levantará no Dia do Juízo com esta geração e a condenará, porque veio dos confins da terra para ouvir a sabedoria de Salomão. E eis que está aqui quem é mais do que Salomão. 43 E, quando o espírito imundo tem saído do homem, anda por lugares áridos, buscando repouso, e não o encontra. 44 Então, diz: Voltarei para a minha casa, donde saí. E, voltando, acha-a desocupada, varrida e adornada. 45 Então, vai e leva consigo outros sete espíritos piores do que ele, e, entrando, habitam ali; e são os últimos atos desse homem piores do que os primeiros. Assim acontecerá também a esta geração má."}, "marcos": null, "lucas": {"referencia": "Lc 11.24-32", "texto": "24 Quando o espírito imundo tem saído do homem, anda por lugares secos, buscando repouso; e, não o achando, diz: Tornarei para minha casa, de onde saí. 25 E, chegando, acha-a varrida e adornada. 26 Então, vai e leva consigo outros sete espíritos piores do que ele; e, entrando, habitam ali; e o último estado desse homem é pior do que o primeiro. 27 E aconteceu que, dizendo ele essas coisas, uma mulher dentre a multidão, levantando a voz, lhe disse: Bem-aventurado o ventre que te trouxe e os peitos em que mamaste! 28 Mas ele disse: Antes, bem-aventurados os que ouvem a palavra de Deus e a guardam. 29 E, ajuntando-se a multidão, começou a dizer: Maligna é esta geração; ela pede um sinal; e não lhe será dado outro sinal, senão o sinal do profeta Jonas. 30 Porquanto assim como Jonas foi sinal para os ninivitas, assim o Filho do Homem o será também para esta geração. 31 A rainha do Sul se levantará no Dia do Juízo com os homens desta geração e os condenará; pois até dos confins da terra veio ouvir a sabedoria de Salomão; e eis aqui está quem é maior do que Salomão. 32 Os homens de Nínive se levantarão no Dia do Juízo com esta geração e a condenarão; pois se converteram com a pregação de Jonas; e eis aqui está quem é maior do que Jonas."}, "joao": null}, {"id": 79, "ordem": 79, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": null, "titulo": "Jesus descreve sua verdadeira família", "mateus": {"referencia": "Mt 12.46-50", "texto": "46 E, falando ele ainda à multidão, eis que estavam fora sua mãe e seus irmãos, pretendendo falar-lhe. 47 E disse-lhe alguém: Eis que estão ali fora tua mãe e teus irmãos, que querem falar-te. 48 Porém ele, respondendo, disse ao que lhe falara: Quem é minha mãe? E quem são meus irmãos? 49 E, estendendo a mão para os seus discípulos, disse: Eis aqui minha mãe e meus irmãos; 50 porque qualquer que fizer a vontade de meu Pai, que está nos céus, este é meu irmão, e irmã, e mãe."}, "marcos": {"referencia": "Mc 3.31-35", "texto": "31 Chegaram, então, seus irmãos e sua mãe; e, estando de fora, mandaram-no chamar. 32 E a multidão estava assentada ao redor dele, e disseram-lhe: Eis que tua mãe e teus irmãos te procuram e estão lá fora. 33 E ele lhes respondeu, dizendo: Quem é minha mãe e meus irmãos? 34 E, olhando em redor para os que estavam assentados junto dele disse: Eis aqui minha mãe e meus irmãos. 35 Porquanto qualquer que fizer a vontade de Deus, esse é meu irmão, e minha irmã, e minha mãe."}, "lucas": {"referencia": "Lc 8.19-21", "texto": "19 E foram ter com ele sua mãe e seus irmãos e não podiam aproximar-se dele, por causa da multidão. 20 E foi-lhe dito: Estão lá fora tua mãe e teus irmãos, que querem ver-te. 21 Mas, respondendo ele, disse-lhes: Minha mãe e meus irmãos são aqueles que ouvem a palavra de Deus e a executam."}, "joao": null}, {"id": 80, "ordem": 80, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": null, "titulo": "A parábola dos quatro tipos de solo", "mateus": {"referencia": "Mt 13.1-23", "texto": "1 Tendo Jesus saído de casa naquele dia, estava assentado junto ao mar. 2 E ajuntou-se muita gente ao pé dele, de sorte que, entrando num barco, se assentou; e toda a multidão estava em pé na praia. 3 E falou-lhe de muitas coisas por parábolas, dizendo: Eis que o semeador saiu a semear. 4 E, quando semeava, uma parte da semente caiu ao pé do caminho, e vieram as aves e comeram-na; 5 e outra parte caiu em pedregais, onde não havia terra bastante, e logo nasceu, porque não tinha terra funda. 6 Mas, vindo o sol, queimou-se e secou-se, porque não tinha raiz. 7 E outra caiu entre espinhos, e os espinhos cresceram e sufocaram-na. 8 E outra caiu em boa terra e deu fruto: um, a cem, outro, a sessenta, e outro, a trinta. 9 Quem tem ouvidos para ouvir, que ouça. 10 E, acercando-se dele os discípulos, disseram-lhe: Por que lhes falas por parábolas? 11 Ele, respondendo, disse-lhes: Porque a vós é dado conhecer os mistérios do Reino dos céus, mas a eles não lhes é dado; 12 porque àquele que tem se dará, e terá em abundância; mas aquele que não tem, até aquilo que tem lhe será tirado. 13 Por isso, lhes falo por parábolas, porque eles, vendo, não veem; e, ouvindo, não ouvem, nem compreendem. 14 E neles se cumpre a profecia de Isaías, que diz: Ouvindo, ouvireis, mas não compreendereis e, vendo, vereis, mas não percebereis. 15 Porque o coração deste povo está endurecido, e ouviu de mau grado com seus ouvidos e fechou os olhos, para que não veja com os olhos, e ouça com os ouvidos, e compreenda com o coração, e se converta, e eu o cure. 16 Mas bem-aventurados os vossos olhos, porque veem, e os vossos ouvidos, porque ouvem. 17 Porque em verdade vos digo que muitos profetas e justos desejaram ver o que vós vedes e não o viram, e ouvir o que vós ouvis, e não o ouviram. 18 Escutai vós, pois, a parábola do semeador. 19 Ouvindo alguém a palavra do Reino e não a entendendo, vem o maligno e arrebata o que foi semeado no seu coração; este é o que foi semeado ao pé do caminho; 20 porém o que foi semeado em pedregais é o que ouve a palavra e logo a recebe com alegria; 21 mas não tem raiz em si mesmo; antes, é de pouca duração; e, chegada a angústia e a perseguição por causa da palavra, logo se ofende; 22 e o que foi semeado entre espinhos é o que ouve a palavra, mas os cuidados deste mundo e a sedução das riquezas sufocam a palavra, e fica infrutífera; 23 mas o que foi semeado em boa terra é o que ouve e compreende a palavra; e dá fruto, e um produz cem, outro, sessenta, e outro, trinta."}, "marcos": {"referencia": "Mc 4.1-20", "texto": "1 E outra vez começou a ensinar junto ao mar, e ajuntou-se a ele grande multidão; de sorte que ele entrou e assentou-se num barco, sobre o mar; e toda a multidão estava em terra junto ao mar. 2 E ensinava-lhes muitas coisas por parábolas e lhes dizia na sua doutrina: 3 Ouvi: Eis que saiu o semeador a semear. 4 E aconteceu que, semeando ele, uma parte da semente caiu junto ao caminho, e vieram as aves do céu e a comeram. 5 E outra caiu sobre pedregais, onde não havia muita terra, e nasceu logo, porque não tinha terra profunda. 6 Mas, saindo o sol, queimou-se e, porque não tinha raiz, secou-se. 7 E outra caiu entre espinhos, e, crescendo os espinhos, a sufocaram, e não deu fruto. 8 E outra caiu em boa terra e deu fruto, que vingou e cresceu; e um produziu trinta, outro, sessenta, e outro, cem. 9 E disse-lhes: Quem tem ouvidos para ouvir, que ouça. 10 E, quando se achou só, os que estavam junto dele com os doze interrogaram-no acerca da parábola. 11 E ele disse-lhes: A vós vos é dado saber os mistérios do Reino de Deus, mas aos que estão de fora todas essas coisas se dizem por parábolas, 12 para que, vendo, vejam e não percebam; e, ouvindo, ouçam e não entendam, para que se não convertam, e lhes sejam perdoados os pecados. 13 E disse-lhes: Não percebeis esta parábola? Como, pois, entendereis todas as parábolas? 14 O que semeia semeia a palavra; 15 e os que estão junto ao caminho são aqueles em quem a palavra é semeada; mas, tendo eles a ouvido, vem logo Satanás e tira a palavra que foi semeada no coração deles. 16 E da mesma sorte os que recebem a semente sobre pedregais, que, ouvindo a palavra, logo com prazer a recebem; 17 mas não têm raiz em si mesmos; antes, são temporãos; depois, sobrevindo tribulação ou perseguição por causa da palavra, logo se escandalizam. 18 E os outros são os que recebem a semente entre espinhos, os quais ouvem a palavra; 19 mas os cuidados deste mundo, e os enganos das riquezas, e as ambições de outras coisas, entrando, sufocam a palavra, e fica infrutífera. 20 E os que recebem a semente em boa terra são os que ouvem a palavra, e a recebem, e dão fruto, um, a trinta, outro, a sessenta, e outro, a cem, por um."}, "lucas": {"referencia": "Lc 8.4-15", "texto": "4 E, ajuntando-se uma grande multidão, e vindo ter com ele gente de todas as cidades, disse por parábolas: 5 Um semeador saiu a semear a sua semente, e, quando semeava, caiu alguma junto do caminho e foi pisada, e as aves do céu a comeram. 6 E outra caiu sobre pedra e, nascida, secou-se, pois que não tinha umidade. 7 E outra caiu entre espinhos, e, crescendo com ela os espinhos, a sufocaram; 8 E outra caiu em boa terra e, nascida, produziu fruto, cento por um. Dizendo ele estas coisas, clamava: Quem tem ouvidos para ouvir, que ouça. 9 E os seus discípulos o interrogaram, dizendo: Que parábola é esta? 10 E ele disse: A vós vos é dado conhecer os mistérios do Reino de Deus, mas aos outros, por parábolas, para que, vendo, não vejam e, ouvindo, não entendam. 11 Esta é, pois, a parábola: a semente é a palavra de Deus; 12 e os que estão junto do caminho, estes são os que ouvem; depois, vem o diabo e tira-lhes do coração a palavra, para que se não salvem, crendo; 13 e os que estão sobre pedra, estes são os que, ouvindo a palavra, a recebem com alegria, mas, como não têm raiz, apenas creem por algum tempo e, no tempo da tentação, se desviam; 14 e a que caiu entre espinhos, esses são os que ouviram, e, indo por diante, são sufocados com os cuidados, e riquezas, e deleites da vida, e não dão fruto com perfeição; 15 e a que caiu em boa terra, esses são os que, ouvindo a palavra, a conservam num coração honesto e bom e dão fruto com perseverança."}, "joao": null}, {"id": 81, "ordem": 81, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": null, "titulo": "Jesus conta a parábola da candeia", "mateus": null, "marcos": {"referencia": "Mc 4.21-25", "texto": "21 E disse-lhes: Vem, porventura, a candeia para ser posta debaixo do cesto ou debaixo da cama? Não vem, antes, para se colocar no velador? 22 Porque nada há encoberto que não haja de ser manifesto; e nada se faz para ficar oculto, mas para ser descoberto. 23 Se alguém tem ouvidos para ouvir, que ouça. 24 E disse-lhes: Atendei ao que ides ouvir. Com a medida com que medirdes vos medirão a vós, e ser-vos-á ainda acrescentada. 25 Porque ao que tem, ser-lhe-á dado; e, ao que não tem, até o que tem lhe será tirado."}, "lucas": {"referencia": "Lc 8.16-18", "texto": "16 E ninguém, acendendo uma candeia, a cobre com algum vaso ou a põe debaixo da cama; mas põe-na no velador, para que os que entram vejam a luz. 17 Porque não há coisa oculta que não haja de manifestar-se, nem escondida que não haja de saber-se e vir à luz. 18 Vede, pois, como ouvis, porque a qualquer que tiver lhe será dado, e a qualquer que não tiver até o que parece ter lhe será tirado."}, "joao": null}, {"id": 82, "ordem": 82, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": null, "titulo": "Jesus conta a parábola da semente", "mateus": null, "marcos": {"referencia": "Mc 4.26-29", "texto": "26 E dizia: O Reino de Deus é assim como se um homem lançasse semente à terra, 27 e dormisse, e se levantasse de noite ou de dia, e a semente brotasse e crescesse, não sabendo ele como. 28 Porque a terra por si mesma frutifica; primeiro, a erva, depois, a espiga, e, por último, o grão cheio na espiga. 29 E, quando já o fruto se mostra, mete-lhe logo a foice, porque está chegada a ceifa."}, "lucas": null, "joao": null}, {"id": 83, "ordem": 83, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": null, "titulo": "Jesus conta a parábola do joio", "mateus": {"referencia": "Mt 13.24-30", "texto": "24 Propôs-lhes outra parábola, dizendo: O Reino dos céus é semelhante ao homem que semeia boa semente no seu campo; 25 mas, dormindo os homens, veio o seu inimigo, e semeou o joio no meio do trigo, e retirou-se. 26 E, quando a erva cresceu e frutificou, apareceu também o joio. 27 E os servos do pai de família, indo ter com ele, disseram-lhe: Senhor, não semeaste tu no teu campo boa semente? Por que tem, então, joio? 28 E ele lhes disse: Um inimigo é quem fez isso. E os servos lhe disseram: Queres, pois, que vamos arrancá-lo? 29 Porém ele lhes disse: Não; para que, ao colher o joio, não arranqueis também o trigo com ele. 30 Deixai crescer ambos juntos até à ceifa; e, por ocasião da ceifa, direi aos ceifeiros: colhei primeiro o joio e atai-o em molhos para o queimar; mas o trigo, ajuntai-o no meu celeiro."}, "marcos": null, "lucas": null, "joao": null}, {"id": 84, "ordem": 84, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": null, "titulo": "Jesus conta as parábolas do grão de mostarda e do fermento", "mateus": {"referencia": "Mt 13.31-33", "texto": "31 Outra parábola lhes propôs, dizendo: O Reino dos céus é semelhante a um grão de mostarda que um homem, pegando dele, semeou no seu campo; 32 o qual é realmente a menor de todas as sementes; mas, crescendo, é a maior das plantas e faz-se uma árvore, de sorte que vêm as aves do céu e se aninham nos seus ramos. 33 Outra parábola lhes disse: O Reino dos céus é semelhante ao fermento que uma mulher toma e introduz em três medidas de farinha, até que tudo esteja levedado."}, "marcos": {"referencia": "Mc 4.30-32", "texto": "30 E dizia: A que assemelharemos o Reino de Deus? Ou com que parábola o representaremos? 31 É como um grão de mostarda, que, quando se semeia na terra, é a menor de todas as sementes que há na terra; 32 mas, tendo sido semeado, cresce, e faz-se a maior de todas as hortaliças, e cria grandes ramos, de tal maneira que as aves do céu podem aninhar-se debaixo da sua sombra."}, "lucas": {"referencia": "Lc 13.18-21", "texto": "18 E dizia: A que é semelhante o Reino de Deus, e a que o compararei? 19 É semelhante ao grão de mostarda que um homem, tomando-o, lançou na sua horta; e cresceu e fez-se grande árvore, e em seus ramos se aninharam as aves do céu. 20 E disse outra vez: A que compararei o Reino de Deus? 21 É semelhante ao fermento que uma mulher, tomando-o, escondeu em três medidas de farinha, até que tudo levedou."}, "joao": null}, {"id": 85, "ordem": 85, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": null, "titulo": "Por que Jesus ensinava usando parábolas", "mateus": {"referencia": "Mt 13.34-35", "texto": "34 Tudo isso disse Jesus por parábolas à multidão e nada lhes falava sem parábolas, 35 para que se cumprisse o que fora dito pelo profeta, que disse: Abrirei em parábolas a boca; publicarei coisas ocultas desde a criação do mundo."}, "marcos": {"referencia": "Mc 4.33-34", "texto": "33 E com muitas parábolas tais lhes dirigia a palavra, segundo o que podiam compreender. 34 E sem parábolas nunca lhes falava, porém tudo declarava em particular aos seus discípulos."}, "lucas": null, "joao": null}, {"id": 86, "ordem": 86, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": null, "titulo": "Jesus explica a parábola do joio", "mateus": {"referencia": "Mt 13.36-43", "texto": "36 Então, tendo despedido a multidão, foi Jesus para casa. E chegaram ao pé dele os seus discípulos, dizendo: Explica-nos a parábola do joio do campo. 37 E ele, respondendo, disse-lhes: O que semeia a boa semente é o Filho do Homem, 38 o campo é o mundo, a boa semente são os filhos do Reino, e o joio são os filhos do Maligno. 39 O inimigo que o semeou é o diabo; e a ceifa é o fim do mundo; e os ceifeiros são os anjos. 40 Assim como o joio é colhido e queimado no fogo, assim será na consumação deste mundo. 41 Mandará o Filho do Homem os seus anjos, e eles colherão do seu Reino tudo o que causa escândalo e os que cometem iniquidade. 42 E lançá-los-ão na fornalha de fogo; ali, haverá pranto e ranger de dentes. 43 Então, os justos resplandecerão como o sol, no Reino de seu Pai. Quem tem ouvidos para ouvir, que ouça."}, "marcos": null, "lucas": null, "joao": null}, {"id": 87, "ordem": 87, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": null, "titulo": "Jesus conta a parábola do tesouro escondido", "mateus": {"referencia": "Mt 13.44", "texto": "44 Também o Reino dos céus é semelhante a um tesouro escondido num campo que um homem achou e escondeu; e, pelo gozo dele, vai, vende tudo quanto tem e compra aquele campo."}, "marcos": null, "lucas": null, "joao"
