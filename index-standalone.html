Mensagem e Ministério de Jesus", "subsecao": "O Ministério de Jesus em Jerusalém", "titulo": "Jesus conta a parábola do dinheiro emprestado", "mateus": {"referencia": "Mt 25.14-30", "texto": "14 Porque isto é também como um homem que, partindo para fora da terra, chamou os seus servos, e entregou-lhes os seus bens, 15 e a um deu cinco talentos, e a outro, dois, e a outro, um, a cada um segundo a sua capacidade, e ausentou-se logo para longe. 16 E, tendo ele partido, o que recebera cinco talentos negociou com eles e granjeou outros cinco talentos. 17 Da mesma sorte, o que recebera dois granjeou também outros dois. 18 Mas o que recebera um foi, e cavou na terra, e escondeu o dinheiro do seu senhor. 19 E, muito tempo depois, veio o senhor daqueles servos e ajustou contas com eles. 20 Então, aproximou-se o que recebera cinco talentos e trouxe-lhe outros cinco talentos, dizendo: Senhor, entregaste-me cinco talentos; eis aqui outros cinco talentos que ganhei com eles. 21 E o seu senhor lhe disse: Bem está, servo bom e fiel. Sobre o pouco foste fiel, sobre muito te colocarei; entra no gozo do teu senhor. 22 E, chegando também o que tinha recebido dois talentos, disse: Senhor, entregaste-me dois talentos; eis que com eles ganhei outros dois talentos. 23 Disse-lhe o seu senhor: Bem está, bom e fiel servo. Sobre o pouco foste fiel, sobre muito te colocarei; entra no gozo do teu senhor. 24 Mas, chegando também o que recebera um talento disse: Senhor, eu conhecia-te, que és um homem duro, que ceifas onde não semeaste e ajuntas onde não espalhaste; 25 e, atemorizado, escondi na terra o teu talento; aqui tens o que é teu. 26 Respondendo, porém, o seu senhor, disse-lhe: Mau e negligente servo; sabes que ceifo onde não semeei e ajunto onde não espalhei; 27 devias, então, ter dado o meu dinheiro aos banqueiros, e, quando eu viesse, receberia o que é meu com os juros. 28 Tirai-lhe, pois, o talento e dai-o ao que tem os dez talentos. 29 Porque a qualquer que tiver será dado, e terá em abundância; mas ao que não tiver, até o que tem ser-lhe-á tirado. 30 Lançai, pois, o servo inútil nas trevas exteriores; ali, haverá pranto e ranger de dentes."}, "marcos": null, "lucas": null, "joao": null}, {"id": 207, "ordem": 207, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "O Ministério de Jesus em Jerusalém", "titulo": "Jesus fala sobre o juízo final", "mateus": {"referencia": "Mt 25.31-46", "texto": "31 E, quando o Filho do Homem vier em sua glória, e todos os santos anjos, com ele, então, se assentará no trono da sua glória; 32 e todas as nações serão reunidas diante dele, e apartará uns dos outros, como o pastor aparta dos bodes as ovelhas. 33 E porá as ovelhas à sua direita, mas os bodes à esquerda. 34 Então, dirá o Rei aos que estiverem à sua direita: Vinde, benditos de meu Pai, possuí por herança o Reino que vos está preparado desde a fundação do mundo; 35 porque tive fome, e destes-me de comer; tive sede, e destes-me de beber; era estrangeiro, e hospedastes-me; 36 estava nu, e vestistes-me; adoeci, e visitastes-me; estive na prisão, e fostes ver-me. 37 Então, os justos lhe responderão, dizendo: Senhor, quando te vimos com fome e te demos de comer? Ou com sede e te demos de beber? 38 E, quando te vimos estrangeiro e te hospedamos? Ou nu e te vestimos? 39 E, quando te vimos enfermo ou na prisão e fomos ver-te? 40 E, respondendo o Rei, lhes dirá: Em verdade vos digo que, quando o fizestes a um destes meus pequeninos irmãos, a mim o fizestes. 41 Então, dirá também aos que estiverem à sua esquerda: Apartai-vos de mim, malditos, para o fogo eterno, preparado para o diabo e seus anjos; 42 porque tive fome, e não me destes de comer; tive sede, e não me destes de beber; 43 sendo estrangeiro, não me recolhestes; estando nu, não me vestistes; e estando enfermo e na prisão, não me visitastes. 44 Então, eles também lhe responderão, dizendo: Senhor, quando te vimos com fome, ou com sede, ou estrangeiro, ou nu, ou enfermo, ou na prisão e não te servimos? 45 Então, lhes responderá, dizendo: Em verdade vos digo que, quando a um destes pequeninos o não fizestes, não o fizestes a mim. 46 E irão estes para o tormento eterno, mas os justos, para a vida eterna."}, "marcos": null, "lucas": null, "joao": null}, {"id": 208, "ordem": 208, "secao": "C. Morte e Ressurreição de Jesus", "subsecao": null, "titulo": "Os líderes religiosos tramam a morte de Jesus", "mateus": {"referencia": "Mt 26.1-5", "texto": "1 E aconteceu que, quando Jesus concluiu todos esses discursos, disse aos seus discípulos: 2 Bem sabeis que, daqui a dois dias, é a Páscoa, e o Filho do Homem será entregue para ser crucificado. 3 Depois, os príncipes dos sacerdotes, e os escribas, e os anciãos do povo reuniram-se na sala do sumo sacerdote, o qual se chamava Caifás, 4 e consultaram-se mutuamente para prenderem Jesus com dolo e o matarem. 5 Mas diziam: Não durante a festa, para que não haja alvoroço entre o povo."}, "marcos": {"referencia": "Mc 14.1-2", "texto": "1 E, dali a dois dias, era a Páscoa e a Festa dos Pães Asmos; e os principais dos sacerdotes e os escribas buscavam como o prenderiam com dolo e o matariam. 2 Mas eles diziam: Não na festa, para que, porventura, se não faça alvoroço entre o povo."}, "lucas": {"referencia": "Lc 22.1-2", "texto": "1 Estava, pois, perto a Festa dos Pães Asmos, chamada de Páscoa. 2 E os principais dos sacerdotes e os escribas andavam procurando como o matariam, porque temiam o povo."}, "joao": null}, {"id": 209, "ordem": 209, "secao": "C. Morte e Ressurreição de Jesus", "subsecao": null, "titulo": "Judas concorda em trair Jesus", "mateus": {"referencia": "Mt 26.14-16", "texto": "14 Então, um dos doze, chamado Judas Iscariotes, foi ter com os príncipes dos sacerdotes 15 e disse: Que me quereis dar, e eu vo-lo entregarei? E eles lhe pesaram trinta moedas de prata. 16 E, desde então, buscava oportunidade para o entregar."}, "marcos": {"referencia": "Mc 14.10-11", "texto": "10 E Judas Iscariotes, um dos doze, foi ter com os principais dos sacerdotes para lho entregar. 11 E eles, ouvindo-o, alegraram-se e prometeram dar-lhe dinheiro; e buscava como o entregaria em ocasião oportuna."}, "lucas": {"referencia": "Lc 22.3-6", "texto": "3 Entrou, porém, Satanás em Judas, que tinha por sobrenome Iscariotes, o qual era do número dos doze. 4 E foi e falou com os principais dos sacerdotes e com os capitães de como lho entregaria, 5 os quais se alegraram e convieram em lhe dar dinheiro. 6 E ele concordou e buscava oportunidade para lho entregar sem alvoroço."}, "joao": null}, {"id": 210, "ordem": 210, "secao": "C. Morte e Ressurreição de Jesus", "subsecao": null, "titulo": "Os discípulos preparam-se para a Páscoa", "mateus": {"referencia": "Mt 26.17-19", "texto": "17 E, no primeiro dia da Festa dos Pães Asmos, chegaram os discípulos junto de Jesus, dizendo: Onde queres que preparemos a comida da Páscoa? 18 E ele disse: Ide à cidade a um certo homem e dizei-lhe: O Mestre diz: O meu tempo está próximo; em tua casa celebrarei a Páscoa com os meus discípulos. 19 E os discípulos fizeram como Jesus lhes ordenara e prepararam a Páscoa."}, "marcos": {"referencia": "Mc 14.12-16", "texto": "12 E, no primeiro dia da Festa dos Pães Asmos, quando sacrificavam a Páscoa, disseram-lhe os discípulos: Aonde queres que vamos fazer os preparativos para comer a Páscoa? 13 E enviou dois dos seus discípulos e disse-lhes: Ide à cidade, e um homem que leva um cântaro de água vos encontrará; segui-o. 14 E, onde quer que entrar, dizei ao senhor da casa: O Mestre diz: Onde está o aposento em que hei de comer a Páscoa com os meus discípulos? 15 E ele vos mostrará um grande cenáculo mobilado e preparado; preparai-a ali. 16 E, saindo os seus discípulos, foram à cidade, e acharam como lhes tinha dito, e prepararam a Páscoa."}, "lucas": {"referencia": "Lc 22.7-13", "texto": "7 Chegou, porém, o dia da Festa dos Pães Asmos, em que importava sacrificar a Páscoa. 8 E mandou a Pedro e a João, dizendo: Ide, preparai-nos a Páscoa, para que a comamos. 9 E eles lhe perguntaram: Onde queres que a preparemos? 10 E ele lhes disse: Eis que, quando entrardes na cidade, encontrareis um homem levando um cântaro de água; segui-o até à casa em que ele entrar. 11 E direis ao pai de família da casa: O mestre te diz: Onde está o aposento em que hei de comer a Páscoa com os meus discípulos? 12 Então, ele vos mostrará um grande cenáculo mobilado; aí fazei os preparativos. 13 E, indo eles, acharam como lhes havia sido dito; e prepararam a Páscoa."}, "joao": null}, {"id": 211, "ordem": 211, "secao": "C. Morte e Ressurreição de Jesus", "subsecao": null, "titulo": "Jesus lava os pés dos discípulos", "mateus": null, "marcos": null, "lucas": null, "joao": {"referencia": "Jo 13.1-20", "texto": "1 Ora, antes da festa da Páscoa, sabendo Jesus que já era chegada a sua hora de passar deste mundo para o Pai, como havia amado os seus que estavam no mundo, amou-os até ao fim. 2 E, acabada a ceia, tendo já o diabo posto no coração de Judas Iscariotes, filho de Simão, que o traísse, 3 Jesus, sabendo que o Pai tinha depositado nas suas mãos todas as coisas, e que havia saído de Deus, e que ia para Deus, 4 levantou-se da ceia, tirou as vestes e, tomando uma toalha, cingiu-se. 5 Depois, pôs água numa bacia e começou a lavar os pés aos discípulos e a enxugar-lhos com a toalha com que estava cingido. 6 Aproximou-se, pois, de Simão Pedro, que lhe disse: Senhor, tu lavas-me os pés a mim? 7 Respondeu Jesus e disse-lhe: O que eu faço, não o sabes tu, agora, mas tu o saberás depois. 8 Disse-lhe Pedro: Nunca me lavarás os pés. Respondeu-lhe Jesus: Se eu te não lavar, não tens parte comigo. 9 Disse-lhe Simão Pedro: Senhor, não só os meus pés, mas também as mãos e a cabeça. 10 Disse-lhe Jesus: Aquele que está lavado não necessita de lavar senão os pés, pois no mais todo está limpo. Ora, vós estais limpos, mas não todos. 11 Porque bem sabia ele quem o havia de trair; por isso, disse: Nem todos estais limpos. 12 Depois que lhes lavou os pés, e tomou as suas vestes, e se assentou outra vez à mesa, disse-lhes: Entendeis o que vos tenho feito? 13 Vós me chamais Mestre e Senhor e dizeis bem, porque eu o sou. 14 Ora, se eu, Senhor e Mestre, vos lavei os pés, vós deveis também lavar os pés uns aos outros. 15 Porque eu vos dei o exemplo, para que, como eu vos fiz, façais vós também. 16 Na verdade, na verdade vos digo que não é o servo maior do que o seu senhor, nem o enviado, maior do que aquele que o enviou. 17 Se sabeis essas coisas, bem-aventurados sois se as fizerdes. 18 Não falo de todos vós; eu bem sei os que tenho escolhido; mas para que se cumpra a Escritura: O que come o pão comigo levantou contra mim o seu calcanhar. 19 Desde agora, vo-lo digo, antes que aconteça, para que, quando acontecer, acrediteis que eu sou. 20 Na verdade, na verdade vos digo que se alguém receber o que eu enviar, me recebe a mim, e quem me recebe a mim recebe aquele que me enviou."}}, {"id": 212, "ordem": 212, "secao": "C. Morte e Ressurreição de Jesus", "subsecao": null, "titulo": "Jesus e os discípulos participam da última ceia", "mateus": {"referencia": "Mt 26.20-30", "texto": "20 E, chegada a tarde, assentou-se à mesa com os doze. 21 E, enquanto eles comiam, disse: Em verdade vos digo que um de vós me há de trair. 22 E eles, entristecendo-se muito, começaram um por um a dizer-lhe: Porventura, sou eu, Senhor? 23 E ele, respondendo, disse: O que mete comigo a mão no prato, esse me há de trair. 24 Em verdade o Filho do Homem vai, como acerca dele está escrito, mas ai daquele homem por quem o Filho do Homem é traído! Bom seria para esse homem se não houvera nascido. 25 E, respondendo Judas, o que o traía, disse: Porventura, sou eu, Rabi? Ele disse: Tu o disseste. 26 Enquanto comiam, Jesus tomou o pão, e, abençoando-o, o partiu, e o deu aos discípulos, e disse: Tomai, comei, isto é o meu corpo. 27 E, tomando o cálice e dando graças, deu-lho, dizendo: Bebei dele todos. 28 Porque isto é o meu sangue, o sangue do Novo Testamento, que é derramado por muitos, para remissão dos pecados. 29 E digo-vos que, desde agora, não beberei deste fruto da vide até àquele Dia em que o beba de novo convosco no Reino de meu Pai. 30 E, tendo cantado um hino, saíram para o monte das Oliveiras."}, "marcos": {"referencia": "Mc 14.17-26", "texto": "17 E, chegada a tarde, foi com os doze. 18 E, quando estavam assentados a comer, disse Jesus: Em verdade vos digo que um de vós, que comigo come, há de trair-me. 19 E eles começaram a entristecer-se e a dizer-lhe um após outro: Porventura, sou eu, Senhor? E outro: Porventura, sou eu, Senhor? 20 Mas ele, respondendo, disse-lhes: É um dos doze, que mete comigo a mão no prato. 21 Na verdade o Filho do Homem vai, como dele está escrito, mas ai daquele homem por quem o Filho do Homem é traído! Bom seria para o tal homem não haver nascido. 22 E, comendo eles, tomou Jesus pão, e, abençoando-o, o partiu, e deu-lho, e disse: Tomai, comei, isto é o meu corpo. 23 E, tomando o cálice e dando graças, deu-lho; e todos beberam dele. 24 E disse-lhes: Isto é o meu sangue, o sangue do Novo Testamento, que por muitos é derramado. 25 Em verdade vos digo que não beberei mais do fruto da vide, até àquele Dia em que o beber novo, no Reino de Deus. 26 E, tendo cantado o hino, saíram para o monte das Oliveiras."}, "lucas": {"referencia": "Lc 22.14-30", "texto": "14 E, chegada a hora, pôs-se à mesa, e, com ele, os doze apóstolos. 15 E disse-lhes: Desejei muito comer convosco esta Páscoa, antes que padeça, 16 porque vos digo que não a comerei mais até que ela se cumpra no Reino de Deus. 17 E, tomando o cálice e havendo dado graças, disse: Tomai-o e reparti-o entre vós, 18 porque vos digo que já não beberei do fruto da vide, até que venha o Reino de Deus. 19 E, tomando o pão e havendo dado graças, partiu-o e deu-lho, dizendo: Isto é o meu corpo, que por vós é dado; fazei isso em memória de mim. 20 Semelhantemente, tomou o cálice, depois da ceia, dizendo: Este cálice é o Novo Testamento no meu sangue, que é derramado por vós. 21 Mas eis que a mão do que me trai está comigo à mesa. 22 E, na verdade, o Filho do Homem vai segundo o que está determinado; mas ai daquele homem por quem é traído! 23 E começaram a perguntar entre si qual deles seria o que havia de fazer isso. 24 E houve também entre eles contenda sobre qual deles parecia ser o maior. 25 E ele lhes disse: Os reis dos gentios dominam sobre eles, e os que têm autoridade sobre eles são chamados benfeitores. 26 Mas não sereis vós assim; antes, o maior entre vós seja como o menor; e quem governa, como quem serve. 27 Pois qual é maior: quem está à mesa ou quem serve? Porventura, não é quem está à mesa? Eu, porém, entre vós, sou como aquele que serve. 28 E vós sois os que tendes permanecido comigo nas minhas tentações. 29 E eu vos destino o Reino, como meu Pai mo destinou, 30 para que comais e bebais à minha mesa no meu Reino e vos assenteis sobre tronos, julgando as doze tribos de Israel."}, "joao": {"referencia": "Jo 13.21-30", "texto": "21 Tendo Jesus dito isso, turbou-se em espírito e afirmou, dizendo: Na verdade, na verdade vos digo que um de vós me há de trair. 22 Então, os discípulos olhavam uns para os outros, sem saberem de quem ele falava. 23 Ora, um de seus discípulos, aquele a quem Jesus amava, estava reclinado no seio de Jesus. 24 Então, Simão Pedro fez sinal a este, para que perguntasse quem era aquele de quem ele falava. 25 E, inclinando-se ele sobre o peito de Jesus, disse-lhe: Senhor, quem é? 26 Jesus respondeu: É aquele a quem eu der o bocado molhado. E, molhando o bocado, o deu a Judas Iscariotes, filho de Simão. 27 E, após o bocado, entrou nele Satanás. Disse, pois, Jesus: O que fazes, faze-o depressa. 28 E nenhum dos que estavam assentados à mesa compreendeu a que propósito lhe dissera isso, 29 porque, como Judas tinha a bolsa, pensavam alguns que Jesus lhe tinha dito: Compra o que nos é necessário para a festa ou que desse alguma coisa aos pobres. 30 E, tendo Judas tomado o bocado, saiu logo. E era já noite."}}, {"id": 213, "ordem": 213, "secao": "C. Morte e Ressurreição de Jesus", "subsecao": null, "titulo": "Jesus prediz a negação de Pedro", "mateus": {"referencia": "Mt 26.31-35", "texto": "31 Então, Jesus lhes disse: Todos vós esta noite vos escandalizareis em mim, porque está escrito: Ferirei o pastor, e as ovelhas do rebanho se dispersarão. 32 Mas, depois de eu ressuscitar, irei adiante de vós para a Galileia. 33 Mas Pedro, respondendo, disse-lhe: Ainda que todos se escandalizem em ti, eu nunca me escandalizarei. 34 Disse-lhe Jesus: Em verdade te digo que, nesta mesma noite, antes que o galo cante, três vezes me negarás. 35 Disse-lhe Pedro: Ainda que me seja necessário morrer contigo, não te negarei. E todos os discípulos disseram o mesmo."}, "marcos": {"referencia": "Mc 14.27-31", "texto": "27 E disse-lhes Jesus: Todos vós esta noite vos escandalizareis em mim, porque escrito está: Ferirei o pastor, e as ovelhas se dispersarão. 28 Mas, depois que eu houver ressuscitado, irei adiante de vós para a Galileia. 29 E disse-lhe Pedro: Ainda que todos se escandalizem, nunca, porém, eu. 30 E disse-lhe Jesus: Em verdade te digo que hoje, nesta noite, antes que o galo cante duas vezes, três vezes me negarás. 31 Mas ele disse com mais veemência: Ainda que me seja necessário morrer contigo, de modo nenhum te negarei. E da mesma maneira diziam todos também."}, "lucas": {"referencia": "Lc 22.31-38", "texto": "31 Disse também o Senhor: Simão, Simão, eis que Satanás vos pediu para vos cirandar como trigo. 32 Mas eu roguei por ti, para que a tua fé não desfaleça; e tu, quando te converteres, confirma teus irmãos. 33 E ele lhe disse: Senhor, estou pronto a ir contigo até à prisão e à morte. 34 Mas ele disse: Digo-te, Pedro, que não cantará hoje o galo antes que três vezes negues que me conheces. 35 E disse-lhes: Quando vos mandei sem bolsa, alforje ou sandálias, faltou-vos, porventura, alguma coisa? Eles responderam: Nada. 36 Disse-lhes, pois: Mas, agora, aquele que tiver bolsa, tome-a, como também o alforje; e o que não tem espada, venda a sua veste e compre-a; 37 porquanto vos digo que importa que em mim se cumpra aquilo que está escrito: E com os malfeitores foi contado. Porque o que está escrito de mim terá cumprimento. 38 E eles disseram: Senhor, eis aqui duas espadas. E ele lhes disse: Basta."}, "joao": {"referencia": "Jo 13.31-38", "texto": "31 Tendo ele, pois, saído, disse Jesus: Agora, é glorificado o Filho do Homem, e Deus é glorificado nele. 32 Se Deus é glorificado nele, também Deus o glorificará em si mesmo e logo o há de glorificar. 33 Filhinhos, ainda por um pouco estou convosco. Vós me buscareis, e, como tinha dito aos judeus: para onde eu vou não podeis vós ir, eu vo-lo digo também agora. 34 Um novo mandamento vos dou: Que vos ameis uns aos outros; como eu vos amei a vós, que também vós uns aos outros vos ameis. 35 Nisto todos conhecerão que sois meus discípulos, se vos amardes uns aos outros. 36 Disse-lhe Simão Pedro: Senhor, para onde vais? Jesus lhe respondeu: Para onde eu vou não podes, agora, seguir-me, mas, depois, me seguirás. 37 Disse-lhe Pedro: Por que não posso seguir-te agora? Por ti darei a minha vida. 38 Respondeu-lhe Jesus: Tu darás a tua vida por mim? Na verdade, na verdade te digo que não cantará o galo, enquanto me não tiveres negado três vezes."}}, {"id": 214, "ordem": 214, "secao": "C. Morte e Ressurreição de Jesus", "subsecao": null, "titulo": "Jesus é o caminho até o Pai", "mateus": null, "marcos": null, "lucas": null, "joao": {"referencia": "Jo 14.1-14", "texto": "1 Não se turbe o vosso coração; credes em Deus, crede também em mim. 2 Na casa de meu Pai há muitas moradas; se não fosse assim, eu vo-lo teria dito, pois vou preparar-vos lugar. 3 E, se eu for e vos preparar lugar, virei outra vez e vos levarei para mim mesmo, para que, onde eu estiver, estejais vós também. 4 Mesmo vós sabeis para onde vou e conheceis o caminho. 5 Disse-lhe Tomé: Senhor, nós não sabemos para onde vais e como podemos saber o caminho? 6 Disse-lhe Jesus: Eu sou o caminho, e a verdade, e a vida. Ninguém vem ao Pai senão por mim. 7 Se vós me conhecêsseis a mim, também conheceríeis a meu Pai; e já desde agora o conheceis e o tendes visto. 8 Disse-lhe Filipe: Senhor, mostra-nos o Pai, o que nos basta. 9 Disse-lhe Jesus: Estou há tanto tempo convosco, e não me tendes conhecido, Filipe? Quem me vê a mim vê o Pai; e como dizes tu: Mostra-nos o Pai? 10 Não crês tu que eu estou no Pai e que o Pai está em mim? As palavras que eu vos digo, não as digo de mim mesmo, mas o Pai, que está em mim, é quem faz as obras. 11 Crede-me que estou no Pai, e o Pai, em mim; crede-me, ao menos, por causa das mesmas obras. 12 Na verdade, na verdade vos digo que aquele que crê em mim também fará as obras que eu faço e as fará maiores do que estas, porque eu vou para meu Pai. 13 E tudo quanto pedirdes em meu nome, eu o farei, para que o Pai seja glorificado no Filho. 14 Se pedirdes alguma coisa em meu nome, eu o farei."}}, {"id": 215, "ordem": 215, "secao": "C. Morte e Ressurreição de Jesus", "subsecao": null, "titulo": "Jesus promete o Espírito Santo", "mateus": null, "marcos": null, "lucas": null, "joao": {"referencia": "Jo 14.15-31", "texto": "15 Se me amardes, guardareis os meus mandamentos. 16 E eu rogarei ao Pai, e ele vos dará outro Consolador, para que fique convosco para sempre, 17 o Espírito da verdade, que o mundo não pode receber, porque não o vê, nem o conhece; mas vós o conheceis, porque habita convosco e estará em vós. 18 Não vos deixarei órfãos; voltarei para vós. 19 Ainda um pouco, e o mundo não me verá mais, mas vós me vereis; porque eu vivo, e vós vivereis. 20 Naquele dia, conhecereis que estou em meu Pai, e vós, em mim, e eu, em vós. 21 Aquele que tem os meus mandamentos e os guarda, este é o que me ama; e aquele que me ama será amado de meu Pai, e eu o amarei e me manifestarei a ele. 22 Disse-lhe Judas (não o Iscariotes): Senhor, de onde vem que te hás de manifestar a nós e não ao mundo? 23 Jesus respondeu e disse-lhe: Se alguém me ama, guardará a minha palavra, e meu Pai o amará, e viremos para ele e faremos nele morada. 24 Quem não me ama não guarda as minhas palavras; ora, a palavra que ouvistes não é minha, mas do Pai que me enviou. 25 Tenho-vos dito isso, estando convosco. 26 Mas aquele Consolador, o Espírito Santo, que o Pai enviará em meu nome, vos ensinará todas as coisas e vos fará lembrar de tudo quanto vos tenho dito. 27 Deixo-vos a paz, a minha paz vos dou; não vo-la dou como o mundo a dá. Não se turbe o vosso coração, nem se atemorize. 28 Ouvistes o que eu vos disse: vou e venho para vós. Se me amásseis, certamente, exultaríeis por ter dito: vou para o Pai, porque o Pai é maior do que eu. 29 Eu vo-lo disse, agora, antes que aconteça, para que, quando acontecer, vós acrediteis. 30 Já não falarei muito convosco, porque se aproxima o príncipe deste mundo e nada tem em mim. 31 Mas é para que o mundo saiba que eu amo o Pai e que faço como o Pai me mandou. Levantai-vos, vamo-nos daqui."}}, {"id": 216, "ordem": 216, "secao": "C. Morte e Ressurreição de Jesus", "subsecao": null, "titulo": "Jesus ensina sobre a videira e os ramos", "mateus": null, "marcos": null, "lucas": null, "joao": {"referencia": "Jo 15.1-17", "texto": "1 Eu sou a videira verdadeira, e meu Pai é o lavrador. 2 Toda vara em mim que não dá fruto, a tira; e limpa toda aquela que dá fruto, para que dê mais fruto. 3 Vós já estais limpos pela palavra que vos tenho falado. 4 Estai em mim, e eu, em vós; como a vara de si mesma não pode dar fruto, se não estiver na videira, assim também vós, se não estiverdes em mim. 5 Eu sou a videira, vós, as varas; quem está em mim, e eu nele, este dá muito fruto, porque sem mim nada podereis fazer. 6 Se alguém não estiver em mim, será lançado fora, como a vara, e secará; e os colhem e lançam no fogo, e ardem. 7 Se vós estiverdes em mim, e as minhas palavras estiverem em vós, pedireis tudo o que quiserdes, e vos será feito. 8 Nisto é glorificado meu Pai: que deis muito fruto; e assim sereis meus discípulos. 9 Como o Pai me amou, também eu vos amei a vós; permanecei no meu amor. 10 Se guardardes os meus mandamentos, permanecereis no meu amor, do mesmo modo que eu tenho guardado os mandamentos de meu Pai e permaneço no seu amor. 11 Tenho-vos dito isso para que a minha alegria permaneça em vós, e a vossa alegria seja completa. 12 O meu mandamento é este: Que vos ameis uns aos outros, assim como eu vos amei. 13 Ninguém tem maior amor do que este: de dar alguém a sua vida pelos seus amigos. 14 Vós sereis meus amigos, se fizerdes o que eu vos mando. 15 Já vos não chamarei servos, porque o servo não sabe o que faz o seu senhor, mas tenho-vos chamado amigos, porque tudo quanto ouvi de meu Pai vos tenho feito conhecer. 16 Não me escolhestes vós a mim, mas eu vos escolhi a vós, e vos nomeei, para que vades e deis fruto, e o vosso fruto permaneça, a fim de que tudo quanto em meu nome pedirdes ao Pai ele vos conceda. 17 Isto vos mando: que vos ameis uns aos outros."}}, {"id": 217, "ordem": 217, "secao": "C. Morte e Ressurreição de Jesus", "subsecao": null, "titulo": "Jesus adverte do ódio do mundo", "mateus": null, "marcos": null, "lucas": null, "joao": {"referencia": "Jo 15.18-16.4", "texto": "18 Se o mundo vos aborrece, sabei que, primeiro do que a vós, me aborreceu a mim. 19 Se vós fôsseis do mundo, o mundo amaria o que era seu, mas, porque não sois do mundo, antes eu vos escolhi do mundo, por isso é que o mundo vos aborrece. 20 Lembrai-vos da palavra que vos disse: não é o servo maior do que o seu senhor. Se a mim me perseguiram, também vos perseguirão a vós; se guardarem a minha palavra, também guardarão a vossa. 21 Mas tudo isso vos farão por causa do meu nome, porque não conhecem aquele que me enviou. 22 Se eu não viera, nem lhes houvera falado, não teriam pecado, mas, agora, não têm desculpa do seu pecado. 23 Aquele que me aborrece aborrece também a meu Pai. 24 Se eu, entre eles, não fizesse tais obras, quais nenhum outro têm feito, não teriam pecado; mas, agora, viram-nas e me aborreceram a mim e a meu Pai. 25 Mas é para que se cumpra a palavra que está escrita na sua lei: Aborreceram-me sem causa. 26 Mas, quando vier o Consolador, que eu da parte do Pai vos hei de enviar, aquele Espírito da verdade, que procede do Pai, testificará de mim. 27 E vós também testificareis, pois estivestes comigo desde o princípio. 1 Tenho-vos dito essas coisas para que vos não escandalizeis. 2 Expulsar-vos-ão das sinagogas; vem mesmo a hora em que qualquer que vos matar cuidará fazer um serviço a Deus. 3 E isso vos farão, porque não conheceram ao Pai nem a mim. 4 Mas tenho-vos dito isso, a fim de que, quando chegar aquela hora, vos lembreis de que já vo-lo tinha dito; e eu não vos disse isso desde o princípio, porque estava convosco."}}, {"id": 218, "ordem": 218, "secao": "C. Morte e Ressurreição de Jesus", "subsecao": null, "titulo": "Jesus ensina sobre o Espírito Santo", "mateus": null, "marcos": null, "lucas": null, "joao": {"referencia": "Jo 16.5-15", "texto": "5 E, agora, vou para aquele que me enviou; e nenhum de vós me pergunta: Para onde vais? 6 Antes, porque isso vos tenho dito, o vosso coração se encheu de tristeza. 7 Todavia, digo-vos a verdade: que vos convém que eu vá, porque, se eu não for, o Consolador não virá a vós; mas, se eu for, enviar-vo-lo-ei. 8 E, quando ele vier, convencerá o mundo do pecado, e da justiça, e do juízo: 9 do pecado, porque não creem em mim; 10 da justiça, porque vou para meu Pai, e não me vereis mais; 11 e do juízo, porque já o príncipe deste mundo está julgado. 12 Ainda tenho muito que vos dizer, mas vós não o podeis suportar agora. 13 Mas, quando vier aquele Espírito da verdade, ele vos guiará em toda a verdade, porque não falará de si mesmo, mas dirá tudo o que tiver ouvido e vos anunciará o que há de vir. 14 Ele me glorificará, porque há de receber do que é meu e vo-lo há de anunciar. 15 Tudo quanto o Pai tem é meu; por isso, vos disse que há de receber do que é meu e vo-lo há de anunciar."}}, {"id": 219, "ordem": 219, "secao": "C. Morte e Ressurreição de Jesus", "subsecao": null, "titulo": "Jesus ensina sobre o uso de seu nome em oração", "mateus": null, "marcos": null, "lucas": null, "joao": {"referencia": "Jo 16.16-33", "texto": "16 Um pouco, e não me vereis; e outra vez um pouco, e ver-me-eis, porquanto vou para o Pai. 17 Então, alguns dos seus discípulos disseram uns para os outros: Que é isto que nos diz: Um pouco, e não me vereis, e outra vez um pouco, e ver-me-eis; e: Porquanto vou para o Pai? 18 Diziam, pois: Que quer dizer isto: um pouco? Não sabemos o que diz. 19 Conheceu, pois, Jesus que o queriam interrogar e disse-lhes: Indagais entre vós acerca disto que disse: um pouco, e não me vereis, e outra vez um pouco, e ver-me-eis? 20 Na verdade, na verdade vos digo que vós chorastes e vos lamentareis, e o mundo se alegrará, e vós estareis tristes; mas a vossa tristeza se converterá em alegria. 21 A mulher, quando está para dar à luz, sente tristeza, porque é chegada a sua hora; mas, depois de ter dado à luz a criança, já se não lembra da aflição, pelo prazer de haver nascido um homem no mundo. 22 Assim também vós, agora, na verdade, tendes tristeza; mas outra vez vos verei, e o vosso coração se alegrará, e a vossa alegria, ninguém vo-la tirará. 23 E, naquele dia, nada me perguntareis. Na verdade, na verdade vos digo que tudo quanto pedirdes a meu Pai, em meu nome, ele vo-lo há de dar. 24 Até agora, nada pedistes em meu nome; pedi e recebereis, para que a vossa alegria se cumpra. 25 Disse-vos isso por parábolas; chega, porém, a hora em que vos não falarei mais por parábolas, mas abertamente vos falarei acerca do Pai. 26 Naquele dia, pedireis em meu nome, e não vos digo que eu rogarei por vós ao Pai, 27 pois o mesmo Pai vos ama, visto como vós me amastes e crestes que saí de Deus. 28 Saí do Pai e vim ao mundo; outra vez, deixo o mundo e vou para o Pai. 29 Disseram-lhe os seus discípulos: Eis que, agora, falas abertamente e não dizes parábola alguma. 30 Agora, conhecemos que sabes tudo e não precisas de que alguém te interrogue. Por isso, cremos que saíste de Deus. 31 Respondeu-lhes Jesus: Credes, agora? 32 Eis que chega a hora, e já se aproxima, em que vós sereis dispersos, cada um para sua casa, e me deixareis só, mas não estou só, porque o Pai está comigo. 33 Tenho-vos dito isso, para que em mim tenhais paz; no mundo tereis aflições, mas tende bom ânimo; eu venci o mundo."}}, {"id": 220, "ordem": 220, "secao": "C. Morte e Ressurreição de Jesus", "subsecao": null, "titulo": "Jesus ora por Ele mesmo", "mateus": null, "marcos": null, "lucas": null, "joao": {"referencia": "Jo 17.1-5", "texto": "1 Jesus falou essas coisas e, levantando os olhos ao céu, disse: Pai, é chegada a hora; glorifica a teu Filho, para que também o teu Filho te glorifique a ti, 2 assim como lhe deste poder sobre toda carne, para que dê a vida eterna a todos quantos lhe deste. 3 E a vida eterna é esta: que conheçam a ti só por único Deus verdadeiro e a Jesus Cristo, a quem enviaste. 4 Eu glorifiquei-te na terra, tendo consumado a obra que me deste a fazer. 5 E, agora, glorifica-me tu, ó Pai, junto de ti mesmo, com aquela glória que tinha contigo antes que o mundo existisse."}}, {"id": 221, "ordem": 221, "secao": "C. Morte e Ressurreição de Jesus", "subsecao": null, "titulo": "Jesus ora por seus discípulos", "mateus": null, "marcos": null, "lucas": null, "joao": {"referencia": "Jo 17.6-19", "texto": "6 Manifestei o teu nome aos homens que do mundo me deste; eram teus, e tu mos deste, e guardaram a tua palavra. 7 Agora, já têm conhecido que tudo quanto me deste provém de ti, 8 porque lhes dei as palavras que me deste; e eles as receberam, e têm verdadeiramente conhecido que saí de ti, e creram que me enviaste. 9 Eu rogo por eles; não rogo pelo mundo, mas por aqueles que me deste, porque são teus. 10 E todas as minhas coisas são tuas, e as tuas coisas são minhas; e nisso sou glorificado. 11 E eu já não estou mais no mundo; mas eles estão no mundo, e eu vou para ti. Pai santo, guarda em teu nome aqueles que me deste, para que sejam um, assim como nós. 12 Estando eu com eles no mundo, guardava-os em teu nome. Tenho guardado aqueles que tu me deste, e nenhum deles se perdeu, senão o filho da perdição, para que a Escritura se cumprisse. 13 Mas, agora, vou para ti e digo isto no mundo, para que tenham a minha alegria completa em si mesmos. 14 Dei-lhes a tua palavra, e o mundo os odiou, porque não são do mundo, assim como eu não sou do mundo. 15 Não peço que os tires do mundo, mas que os livres do mal. 16 Não são do mundo, como eu do mundo não sou. 17 Santifica-os na verdade; a tua palavra é a verdade. 18 Assim como tu me enviaste ao mundo, também eu os enviei ao mundo. 19 E por eles me santifico a mim mesmo, para que também eles sejam santificados na verdade."}}, {"id": 222, "ordem": 222, "secao": "C. Morte e Ressurreição de Jesus", "subsecao": null, "titulo": "Jesus ora pelos futuros crentes", "mateus": null, "marcos": null, "lucas": null, "joao": {"referencia": "Jo 17.20-26", "texto": "20 Eu não rogo somente por estes, mas também por aqueles que, pela sua palavra, hão de crer em mim; 21 para que todos sejam um, como tu, ó Pai, o és em mim, e eu, em ti; que também eles sejam um em nós, para que o mundo creia que tu me enviaste. 22 E eu dei-lhes a glória que a mim me deste, para que sejam um, como nós somos um. 23 Eu neles, e tu em mim, para que eles sejam perfeitos em unidade, e para que o mundo conheça que tu me enviaste a mim e que tens amado a eles como me tens amado a mim. 24 Pai, aqueles que me deste quero que, onde eu estiver, também eles estejam comigo, para que vejam a minha glória que me deste; porque tu me hás amado antes da criação do mundo. 25 Pai justo, o mundo não te conheceu; mas eu te conheci, e estes conheceram que tu me enviaste a mim. 26 E eu lhes fiz conhecer o teu nome e lho farei conhecer mais, para que o amor com que me tens amado esteja neles, e eu neles esteja."}}, {"id": 223, "ordem": 223, "secao": "C. Morte e Ressurreição de Jesus", "subsecao": null, "titulo": "Jesus agoniza no jardim", "mateus": {"referencia": "Mt 26.36-46", "texto": "36 Então, chegou Jesus com eles a um lugar chamado Getsêmani e disse a seus discípulos: Assentai-vos aqui, enquanto vou além orar. 37 E, levando consigo Pedro e os dois filhos de Zebedeu, começou a entristecer-se e a angustiar-se muito. 38 Então, lhes disse: A minha alma está cheia de tristeza até à morte; ficai aqui e vigiai comigo. 39 E, indo um pouco adiante, prostrou-se sobre o seu rosto, orando e dizendo: Meu Pai, se é possível, passa de mim este cálice; todavia, não seja como eu quero, mas como tu queres. 40 E, voltando para os seus discípulos, achou-os adormecidos; e disse a Pedro: Então, nem uma hora pudeste vigiar comigo? 41 Vigiai e orai, para que não entreis em tentação; na verdade, o espírito está pronto, mas a carne é fraca. 42 E, indo segunda vez, orou, dizendo: Meu Pai, se este cálice não pode passar de mim sem eu o beber, faça-se a tua vontade. 43 E, voltando, achou-os outra vez adormecidos, porque os seus olhos estavam carregados. 44 E, deixando-os de novo, foi orar pela terceira vez, dizendo as mesmas palavras. 45 Então, chegou junto dos seus discípulos e disse-lhes: Dormi, agora, e repousai; eis que é chegada a hora, e o Filho do Homem será entregue nas mãos dos pecadores. 46 Levantai-vos, partamos; eis que é chegado o que me trai."}, "marcos": {"referencia": "Mc 14.32-42", "texto": "32 E foram a um lugar chamado Getsêmani, e disse aos seus discípulos: Assentai-vos aqui, enquanto eu oro. 33 E tomou consigo a Pedro, e a Tiago, e a João e começou a ter pavor e a angustiar-se. 34 E disse-lhes: A minha alma está profundamente triste até a morte; ficai aqui e vigiai. 35 E, tendo ido um pouco mais adiante, prostrou-se em terra; e orou para que, se fosse possível, passasse dele aquela hora. 36 E disse: Aba, Pai, todas as coisas te são possíveis; afasta de mim este cálice; não seja, porém, o que eu quero, mas o que tu queres. 37 E, chegando, achou-os dormindo e disse a Pedro: Simão, dormes? Não podes vigiar uma hora? 38 Vigiai e orai, para que não entreis em tentação; o espírito, na verdade, está pronto, mas a carne é fraca. 39 E foi outra vez e orou, dizendo as mesmas palavras. 40 E, voltando, achou-os outra vez dormindo, porque os seus olhos estavam carregados, e não sabiam o que responder-lhe. 41 E voltou terceira vez e disse-lhes: Dormi agora e descansai. Basta; é chegada a hora. Eis que o Filho do Homem vai ser entregue nas mãos dos pecadores. 42 Levantai-vos, vamos; eis que está perto o que me trai."}, "lucas": {"referencia": "Lc 22.39-46", "texto": "39 E, saindo, foi, como costumava, para o monte das Oliveiras; e também os seus discípulos o seguiram. 40 E, quando chegou àquele lugar, disse-lhes: Orai, para que não entreis em tentação. 41 E apartou-se deles cerca de um tiro de pedra; e, pondo-se de joelhos, orava, 42 dizendo: Pai, se queres, passa de mim este cálice; todavia, não se faça a minha vontade, mas a tua. 43 E apareceu-lhe um anjo do céu, que o confortava. 44 E, posto em agonia, orava mais intensamente. E o seu suor tornou-se em grandes gotas de sangue que corriam até ao chão. 45 E, levantando-se da oração, foi ter com os seus discípulos e achou-os dormindo de tristeza. 46 E disse-lhes: Por que estais dormindo? Levantai-vos, e orai para que não entreis em tentação."}, "joao": null}, {"id": 224, "ordem": 224, "secao": "C. Morte e Ressurreição de Jesus", "subsecao": null, "titulo": "Jesus é traído e preso", "mateus": {"referencia": "Mt 26.47-56", "texto": "47 E, estando ele ainda a falar, eis que chegou Judas, um dos doze, e com ele, grande multidão com espadas e porretes, vinda da parte dos príncipes dos sacerdotes e dos anciãos do povo. 48 E o traidor tinha-lhes dado um sinal, dizendo: O que eu beijar é esse; prendei-o. 49 E logo, aproximando-se de Jesus, disse: Eu te saúdo, Rabi. E beijou-o. 50 Jesus, porém, lhe disse: Amigo, a que vieste? Então, aproximando-se eles, lançaram mão de Jesus e o prenderam. 51 E eis que um dos que estavam com Jesus, estendendo a mão, puxou da espada e, ferindo o servo do sumo sacerdote, cortou-lhe uma orelha. 52 Então, Jesus disse-lhe: Mete no seu lugar a tua espada, porque todos os que lançarem mão da espada à espada morrerão. 53 Ou pensas tu que eu não poderia, agora, orar a meu Pai e que ele não me daria mais de doze legiões de anjos? 54 Como, pois, se cumpririam as Escrituras, que dizem que assim convém que aconteça? 55 Então, disse Jesus à multidão: Saístes, como para um salteador, com espadas e porretes, para me prender? Todos os dias me assentava junto de vós, ensinando no templo, e não me prendestes. 56 Mas tudo isso aconteceu para que se cumpram as Escrituras dos profetas. Então, todos os discípulos, deixando-o, fugiram."}, "marcos": {"referencia": "Mc 14.43-52", "texto": "43 E logo, falando ele ainda, veio Judas, que era um dos doze, da parte dos principais dos sacerdotes, e dos escribas, e dos anciãos, e, com ele, uma grande multidão com espadas e porretes. 44 Ora, o que o traía tinha-lhes dado um sinal, dizendo: Aquele que eu beijar, esse é; prendei-o e levai-o com segurança. 45 E, logo que chegou, aproximou-se dele e disse-lhe: Rabi, Rabi. E beijou-o. 46 E lançaram-lhe as mãos e o prenderam. 47 E um dos que ali estavam presentes, puxando da espada, feriu o servo do sumo sacerdote e cortou-lhe uma orelha. 48 E, respondendo Jesus, disse-lhes: Saístes com espadas e porretes a prender-me, como a um salteador? 49 Todos os dias estava convosco ensinando no templo, e não me prendestes; mas isto é para que as Escrituras se cumpram. 50 Então, deixando-o, todos fugiram. 51 E um jovem o seguia, envolto em um lençol sobre o corpo nu. E lançaram-lhe as mãos, 52 mas ele, largando o lençol, fugiu nu."}, "lucas": {"referencia": "Lc 22.47-53", "texto": "47 E, estando ele ainda a falar, surgiu uma multidão; e um dos doze, que se chamava Judas, ia adiante dela e chegou-se a Jesus para o beijar. 48 E Jesus lhe disse: Judas, com um beijo trais o Filho do Homem? 49 E, vendo os que estavam com ele o que ia suceder, disseram-lhe: Senhor, feriremos à espada? 50 E um deles feriu o servo do sumo sacerdote e cortou-lhe a orelha direita. 51 E, respondendo Jesus, disse: Deixai-os; basta. E, tocando-lhe a orelha, o curou. 52 E disse Jesus aos principais dos sacerdotes, e capitães do templo, e anciãos que tinham ido contra ele: Saístes com espadas e porretes, como para deter um salteador? 53 Tenho estado todos os dias convosco no templo e não estendestes as mãos contra mim, mas esta é a vossa hora e o poder das trevas."}, "joao": {"referencia": "Jo 18.1-11", "texto": "1 Tendo Jesus dito isso, saiu com os seus discípulos para além do ribeiro de Cedrom, onde havia um horto, no qual ele entrou com os seus discípulos. 2 E Judas, que o traía, também conhecia aquele lugar, porque Jesus muitas vezes se ajuntava ali com os seus discípulos. 3 Tendo, pois, Judas recebido a coorte e oficiais dos principais sacerdotes e fariseus, veio para ali com lanternas, e archotes, e armas. 4 Sabendo, pois, Jesus todas as coisas que sobre ele haviam de vir, adiantou-se e disse-lhes: A quem buscais? 5 Responderam-lhe: A Jesus, o Nazareno. Disse-lhes Jesus: Sou eu. E Judas, que o traía, estava também com eles. 6 Quando, pois, lhes disse: Sou eu, recuaram e caíram por terra. 7 Tornou-lhes, pois, a perguntar: A quem buscais? E eles disseram: A Jesus, o Nazareno. 8 Jesus respondeu: Já vos disse que sou eu; se, pois me buscais a mim, deixai ir estes, 9 para se cumprir a palavra que tinha dito: Dos que me deste nenhum deles perdi. 10 Então, Simão Pedro, que tinha espada, desembainhou-a e feriu o servo do sumo sacerdote, cortando-lhe a orelha direita. E o nome do servo era Malco. 11 Mas Jesus disse a Pedro: Mete a tua espada na bainha; não beberei eu o cálice que o Pai me deu?"}}, {"id": 225, "ordem": 225, "secao": "C. Morte e Ressurreição de Jesus", "subsecao": null, "titulo": "Anás interroga Jesus", "mateus": null, "marcos": null, "lucas": null, "joao": {"referencia": "Jo 18.12-24", "texto": "12 Então, a coorte, e o tribuno, e os servos dos judeus prenderam a Jesus, e o manietaram, 13 e conduziram-no primeiramente a Anás, por ser sogro de Caifás, que era o sumo sacerdote daquele ano. 14 Ora, Caifás era quem tinha aconselhado aos judeus que convinha que um homem morresse pelo povo. 15 E Simão Pedro e outro discípulo seguiam a Jesus. E este discípulo era conhecido do sumo sacerdote e entrou com Jesus na sala do sumo sacerdote. 16 E Pedro estava da parte de fora, à porta. Saiu, então, o outro discípulo que era conhecido do sumo sacerdote e falou à porteira, levando Pedro para dentro. 17 Então, a porteira disse a Pedro: Não és tu também dos discípulos deste homem? Disse ele: Não sou. 18 Ora, estavam ali os servos e os criados, que tinham feito brasas, e se aquentavam, porque fazia frio; e com eles estava Pedro, aquentando-se também. 19 E o sumo sacerdote interrogou Jesus acerca dos seus discípulos e da sua doutrina. 20 Jesus lhe respondeu: Eu falei abertamente ao mundo; eu sempre ensinei na sinagoga e no templo, onde todos os judeus se ajuntam, e nada disse em oculto. 21 Para que me perguntas a mim? Pergunta aos que ouviram o que é que lhes ensinei; eis que eles sabem o que eu lhes tenho dito. 22 E, tendo dito isso, um dos criados que ali estavam deu uma bofetada em Jesus, dizendo: Assim respondes ao sumo sacerdote? 23 Respondeu-lhe Jesus: Se falei mal, dá testemunho do mal; e, se bem, porque me feres? 24 Anás mandou-o, manietado, ao sumo sacerdote Caifás."}}, {"id": 226, "ordem": 226, "secao": "C. Morte e Ressurreição de Jesus", "subsecao": null, "titulo": "Caifás interroga Jesus", "mateus": {"referencia": "Mt 26.57-68", "texto": "57 E os que prenderam Jesus o conduziram à casa do sumo sacerdote Caifás, onde os escribas e os anciãos estavam reunidos. 58 E Pedro o seguiu de longe até ao pátio do sumo sacerdote e, entrando, assentou-se entre os criados, para ver o fim. 59 Ora, os príncipes dos sacerdotes, e os anciãos, e todo o conselho buscavam falso testemunho contra Jesus, para poderem dar-lhe a morte, 60 e não o achavam, apesar de se apresentarem muitas testemunhas falsas, mas, por fim, chegaram duas 61 e disseram: Este disse: Eu posso derribar o templo de Deus e reedificá-lo em três dias. 62 E, levantando-se o sumo sacerdote, disse-lhe: Não respondes coisa alguma ao que estes depõem contra ti? 63 E Jesus, porém, guardava silêncio. E, insistindo o sumo sacerdote, disse-lhe: Conjuro-te pelo Deus vivo que nos digas se tu és o Cristo, o Filho de Deus. 64 Disse-lhes Jesus: Tu o disseste; digo-vos, porém, que vereis em breve o Filho do Homem assentado à direita do Todo-Poderoso e vindo sobre as nuvens do céu. 65 Então, o sumo sacerdote rasgou as suas vestes, dizendo: Blasfemou; para que precisamos ainda de testemunhas? Eis que bem ouvistes, agora, a sua blasfêmia. 66 Que vos parece? E eles, respondendo, disseram: É réu de morte. 67 Então, cuspiram-lhe no rosto e lhe davam murros, e outros o esbofeteavam, 68 dizendo: Profetiza-nos, Cristo, quem é o que te bateu?"}, "marcos": {"referencia": "Mc 14.53-65", "texto": "53 E levaram Jesus ao sumo sacerdote, e ajuntaram-se todos os principais dos sacerdotes, e os anciãos, e os escribas. 54 E Pedro o seguiu de longe até dentro do pátio do sumo sacerdote e estava assentado com os servidores, aquentando-se ao lume. 55 E os principais dos sacerdotes e todo o concílio buscavam algum testemunho contra Jesus, para o matar, e não o achavam. 56 Porque muitos testificavam falsamente contra ele, mas os testemunhos não eram coerentes. 57 E, levantando-se alguns, testificavam falsamente contra ele, dizendo: 58 Nós ouvimos-lhe dizer: Eu derribarei este templo, construído por mãos de homens, e em três dias edificarei outro, não feito por mãos de homens. 59 E nem assim o testemunho deles era coerente. 60 E, levantando-se o sumo sacerdote no Sinédrio, perguntou a Jesus, dizendo: Nada respondes? Que testificam estes contra ti? 61 Mas ele calou-se e nada respondeu. O sumo sacerdote lhe tornou a perguntar e disse-lhe: És tu o Cristo, Filho do Deus Bendito? 62 E Jesus disse-lhe: Eu o sou, e vereis o Filho do Homem assentado à direita do Todo-Poderoso e vindo sobre as nuvens do céu. 63 E o sumo sacerdote, rasgando as suas vestes, disse: Para que necessitamos de mais testemunhas? 64 Vós ouvistes a blasfêmia; que vos parece? E todos o consideraram culpado de morte. 65 E alguns começaram a cuspir nele, e a cobrir-lhe o rosto, e a dar-lhe punhadas, e a dizer-lhe: Profetiza. E os servidores davam-lhe bofetadas."}, "lucas": {"referencia": "Lc 22.54-65", "texto": "54 Então, prendendo-o, o levaram e o meteram em casa do sumo sacerdote. E Pedro seguia-o de longe. 55 E, havendo-se acendido fogo no meio do pátio, estando todos sentados, assentou-se Pedro entre eles. 56 E como certa criada, vendo-o estar assentado ao fogo, pusesse os olhos nele, disse: Este também estava com ele. 57 Porém ele negou-o, dizendo: Mulher, não o conheço. 58 E, um pouco depois, vendo-o outro, disse: Tu és também deles. Mas Pedro disse: Homem, não sou. 59 E, passada quase uma hora, um outro afirmava, dizendo: Também este verdadeiramente estava com ele, pois também é galileu. 60 E Pedro disse: Homem, não sei o que dizes. E logo, estando ele ainda a falar, cantou o galo. 61 E, virando-se o Senhor, olhou para Pedro, e Pedro lembrou-se da palavra do Senhor, como lhe tinha dito: Antes que o galo cante hoje, me negarás três vezes. 62 E, saindo Pedro para fora, chorou amargamente. 63 E os homens que detinham Jesus zombavam dele, ferindo-o. 64 E, vendando-lhe os olhos, feriam-no no rosto e perguntavam-lhe, dizendo: Profetiza-nos: quem é que te feriu? 65 E outras muitas coisas diziam contra ele, blasfemando."}, "joao": null}, {"id": 227, "ordem": 227, "secao": "C. Morte e Ressurreição de Jesus", "subsecao": null, "titulo": "Pedro nega conhecer Jesus", "mateus": {"referencia": "Mt 26.69-75", "texto": "69 Ora, Pedro estava assentado fora, no pátio; e, aproximando-se dele uma criada, disse: Tu também estavas com Jesus, o galileu. 70 Mas ele negou diante de todos, dizendo: Não sei o que dizes. 71 E, saindo para o vestíbulo, outra criada o viu e disse aos que ali estavam: Este também estava com Jesus, o Nazareno. 72 E ele negou outra vez, com juramento: Não conheço tal homem. 73 E, logo depois, aproximando-se os que ali estavam, disseram a Pedro: Verdadeiramente, também tu és deles, pois a tua fala te denuncia. 74 Então, começou ele a praguejar e a jurar, dizendo: Não conheço esse homem. E imediatamente o galo cantou. 75 E lembrou-se Pedro das palavras de Jesus, que lhe dissera: Antes que o galo cante, três vezes me negarás. E, saindo dali, chorou amargamente."}, "marcos": {"referencia": "Mc 14.66-72", "texto": "66 E, estando Pedro embaixo, no átrio, chegou uma das criadas do sumo sacerdote; 67 e, vendo a Pedro, que estava se aquentando, olhou para ele e disse: Tu também estavas com Jesus, o Nazareno. 68 Mas ele negou-o, dizendo: Não o conheço, nem sei o que dizes. E saiu fora ao alpendre, e o galo cantou. 69 E a criada, vendo-o outra vez, começou a dizer aos que ali estavam: Este é um dos tais. 70 Mas ele o negou outra vez. E, pouco depois, os que ali estavam disseram outra vez a Pedro: Verdadeiramente, tu és um deles, porque és também galileu. 71 E ele começou a imprecar e a jurar: Não conheço esse homem de quem falais. 72 E o galo cantou segunda vez. E Pedro lembrou-se da palavra que Jesus lhe tinha dito: Antes que o galo cante duas vezes, três vezes me negarás tu. E, retirando-se dali, chorou."}, "lucas": {"referencia": "Lc 22.54-62", "texto": "54 Então, prendendo-o, o levaram e o meteram em casa do sumo sacerdote. E Pedro seguia-o de longe. 55 E, havendo-se acendido fogo no meio do pátio, estando todos sentados, assentou-se Pedro entre eles. 56 E como certa criada, vendo-o estar assentado ao fogo, pusesse os olhos nele, disse: Este também estava com ele. 57 Porém ele negou-o, dizendo: Mulher, não o conheço. 58 E, um pouco depois, vendo-o outro, disse: Tu és também deles. Mas Pedro disse: Homem, não sou. 59 E, passada quase uma hora, um outro afirmava, dizendo: Também este verdadeiramente estava com ele, pois também é galileu. 60 E Pedro disse: Homem, não sei o que dizes. E logo, estando ele ainda a falar, cantou o galo. 61 E, virando-se o Senhor, olhou para Pedro, e Pedro lembrou-se da palavra do Senhor, como lhe tinha dito: Antes que o galo cante hoje, me negarás três vezes. 62 E, saindo Pedro para fora, chorou amargamente."}, "joao": {"referencia": "Jo 18.25-27", "texto": "25 E Simão Pedro estava ali e aquentava-se. Disseram-lhe, pois: Não és também tu um dos seus discípulos? Ele negou e disse: Não sou. 26 E um dos servos do sumo sacerdote, parente daquele a quem Pedro cortara a orelha, disse: Não te vi eu no horto com ele? 27 E Pedro negou outra vez, e logo o galo cantou."}}, {"id": 228, "ordem": 228, "secao": "C. Morte e Ressurreição de Jesus", "subsecao": null, "titulo": "O conselho dos líderes religiosos condena Jesus", "mateus": {"referencia": "Mt 27.1-2", "texto": "1 E, chegando a manhã, todos os príncipes dos sacerdotes e os anciãos do povo formavam juntamente conselho contra Jesus, para o matarem. 2 E, manietando-o, o levaram e o entregaram ao governador Pôncio Pilatos."}, "marcos": {"referencia": "Mc 15.1", "texto": "1 E, logo ao amanhecer, os principais dos sacerdotes, e os anciãos, e os escribas, e todo o Sinédrio tiveram conselho; e, amarrando Jesus, o levaram e entregaram a Pilatos."}, "lucas": null, "joao": null}, {"id": 229, "ordem": 229, "secao": "C. Morte e Ressurreição de Jesus", "subsecao": null, "titulo": "Judas enforca-se", "mateus": {"referencia": "Mt 27.3-10", "texto": "3 Então, Judas, o que o traíra, vendo que fora condenado, trouxe, arrependido, as trinta moedas de prata aos príncipes dos sacerdotes e aos anciãos, 4 dizendo: Pequei, traindo sangue inocente. Eles, porém, disseram: Que nos importa? Isso é contigo. 5 E ele, atirando para o templo as moedas de prata, retirou-se e foi-se enforcar. 6 E os príncipes dos sacerdotes, tomando as moedas de prata, disseram: Não é lícito metê-las no cofre das ofertas, porque são preço de sangue. 7 E, tendo deliberado em conselho, compraram com elas o campo de um oleiro, para sepultura dos estrangeiros. 8 Por isso, foi chamado aquele campo, até ao dia de hoje, Campo de Sangue. 9 Então, se realizou o que vaticinara o profeta Jeremias: Tomaram as trinta moedas de prata, preço do que foi avaliado, que certos filhos de Israel avaliaram. 10 E deram-nas pelo campo do oleiro, segundo o que o Senhor determinou."}, "marcos": null, "lucas": null, "joao": null}, {"id": 230, "ordem": 230, "secao": "C. Morte e Ressurreição de Jesus", "subsecao": null, "titulo": "Jesus é julgado perante Pilatos", "mateus": {"referencia": "Mt 27.11-14", "texto": "11 E foi Jesus apresentado ao governador, e o governador o interrogou, dizendo: És tu o Rei dos judeus? E disse-lhe Jesus: Tu o dizes. 12 E, sendo acusado pelos príncipes dos sacerdotes e pelos anciãos, nada respondeu. 13 Disse-lhe, então, Pilatos: Não ouves quanto testificam contra ti? 14 E nem uma palavra lhe respondeu, de sorte que o governador estava muito maravilhado."}, "marcos": {"referencia": "Mc 15.2-5", "texto": "2 E Pilatos lhe perguntou: Tu és o Rei dos judeus? E ele, respondendo, disse-lhe: Tu o dizes. 3 E os principais dos sacerdotes o acusavam de muitas coisas, porém ele nada respondia. 4 E Pilatos o interrogou outra vez, dizendo: Nada respondes? Vê quantas coisas testificam contra ti. 5 Mas Jesus nada mais respondeu, de maneira que Pilatos se maravilhava."}, "lucas": {"referencia": "Lc 23.1-7", "texto": "1 E, levantando-se toda a multidão deles, o levaram a Pilatos. 2 E começaram a acusá-lo, dizendo: Havemos achado este pervertendo a nossa nação, proibindo dar o tributo a César e dizendo que ele mesmo é Cristo, o rei. 3 E Pilatos perguntou-lhe, dizendo: Tu és o Rei dos judeus? E ele, respondendo, disse-lhe: Tu o dizes. 4 E disse Pilatos aos principais dos sacerdotes e à multidão: Não acho culpa alguma neste homem. 5 Mas eles insistiam cada vez mais, dizendo: Alvoroça o povo ensinando por toda a Judeia, começando desde a Galileia até aqui. 6 Então, Pilatos, ouvindo falar da Galileia, perguntou se aquele homem era galileu. 7 E, sabendo que era da jurisdição de Herodes, remeteu-o a Herodes, que também, naqueles dias, estava em Jerusalém."}, "joao": {"referencia": "Jo 18.28-37", "texto": "28 Depois, levaram Jesus da casa de Caifás para a audiência. E era pela manhã cedo. E não entraram na audiência, para não se contaminarem e poderem comer a Páscoa. 29 Então, Pilatos saiu e disse-lhes: Que acusação trazeis contra este homem? 30 Responderam e disseram-lhe: Se este não fosse malfeitor, não to entregaríamos. 31 Disse-lhes, pois, Pilatos: Levai-o vós e julgai-o segundo a vossa lei. Disseram-lhe, então, os judeus: A nós não nos é lícito matar pessoa alguma. 32 (Para que se cumprisse a palavra que Jesus tinha dito, significando de que morte havia de morrer.) 33 Tornou, pois, a entrar Pilatos na audiência, e chamou a Jesus, e disse-lhe: Tu és o rei dos judeus? 34 Respondeu-lhe Jesus: Tu dizes isso de ti mesmo ou disseram-to outros de mim? 35 Pilatos respondeu: Porventura, sou eu judeu? A tua nação e os principais dos sacerdotes entregaram-te a mim. Que fizeste? 36 Respondeu Jesus: O meu Reino não é deste mundo; se o meu Reino fosse deste mundo, lutariam os meus servos, para que eu não fosse entregue aos judeus; mas, agora, o meu Reino não é daqui. 37 Disse-lhe, pois, Pilatos: Logo tu és rei? Jesus respondeu: Tu dizes que eu sou rei. Eu para isso nasci e para isso vim ao mundo, a fim de dar testemunho da verdade. Todo aquele que é da verdade ouve a minha voz."}}, {"id": 231, "ordem": 231, "secao": "C. Morte e Ressurreição de Jesus", "subsecao": null, "titulo": "Jesus é julgado perante Herodes", "mateus": null, "marcos": null, "lucas": {"referencia": "Lc 23.8-12", "texto": "8 E Herodes, quando viu a Jesus, alegrou-se muito, porque havia muito que desejava vê-lo, por ter ouvido dele muitas coisas; e esperava que lhe veria fazer algum sinal. 9 E interrogava-o com muitas palavras, mas ele nada lhe respondia. 10 E estavam os principais dos sacerdotes e os escribas acusando-o com grande veemência. 11 E Herodes, com os seus soldados, desprezou-o, e, escarnecendo dele, vestiu-o de uma roupa resplandecente, e tornou a enviá-lo a Pilatos. 12 E, no mesmo dia, Pilatos e Herodes, entre si, se fizeram amigos; pois, dantes, andavam em inimizade um com o outro."}, "joao": null}, {"id": 232, "ordem": 232, "secao": "C. Morte e Ressurreição de Jesus", "subsecao": null, "titulo": "Pilatos entrega Jesus para ser crucificado", "mateus": {"referencia": "Mt 27.15-26", "texto": "15 Ora, por ocasião da festa, costumava o governador soltar um preso, escolhendo o povo aquele que quisesse. 16 E tinham, então, um preso bem-conhecido, chamado Barrabás. 17 Portanto, estando eles reunidos, disse-lhes Pilatos: Qual quereis que vos solte? Barrabás ou Jesus, chamado Cristo? 18 Porque sabia que por inveja o haviam entregado. 19 E, estando ele assentado no tribunal, sua mulher mandou-lhe dizer: Não entres na questão desse justo, porque num sonho muito sofri por causa dele. 20 Mas os príncipes dos sacerdotes e os anciãos persuadiram à multidão que pedisse Barrabás e matasse Jesus. 21 E, respondendo o governador, disse-lhes: Qual desses dois quereis vós que eu solte? E eles disseram: Barrabás. 22 Disse-lhes Pilatos: Que farei, então, de Jesus, chamado Cristo? Disseram-lhe todos: Seja crucificado! 23 O governador, porém, disse: Mas que mal fez ele? E eles mais clamavam, dizendo: Seja crucificado! 24 Então, Pilatos, vendo que nada aproveitava, antes o tumulto crescia, tomando água, lavou as mãos diante da multidão, dizendo: Estou inocente do sangue deste justo; considerai isso. 25 E, respondendo todo o povo, disse: O seu sangue caia sobre nós e sobre nossos filhos. 26 Então, soltou-lhes Barrabás e, tendo mandado açoitar a Jesus, entregou-o para ser crucificado."}, "marcos": {"referencia": "Mc 15.6-15", "texto": "6 Ora, no dia da festa costumava soltar-lhes um preso qualquer que eles pedissem. 7 E havia um chamado Barrabás, que, preso com outros amotinadores, tinha num motim cometido uma morte. 8 E a multidão, dando gritos, começou a pedir que fizesse como sempre lhes tinha feito. 9 E Pilatos lhes respondeu, dizendo: Quereis que vos solte o Rei dos judeus? 10 Porque ele bem sabia que, por inveja, os principais dos sacerdotes o tinham entregado. 11 Mas os principais dos sacerdotes incitaram a multidão para que fosse solto antes Barrabás. 12 E Pilatos, respondendo, lhes disse outra vez: Que quereis, pois, que faça daquele a quem chamais Rei dos judeus? 13 E eles tornaram a clamar: Crucifica-o. 14 Mas Pilatos lhes disse: Mas que mal fez? E eles cada vez clamavam mais: Crucifica-o. 15 Então, Pilatos, querendo satisfazer a multidão, soltou-lhes Barrabás, e, açoitado Jesus, o entregou para que fosse crucificado."}, "lucas": {"referencia": "Lc 23.13-25", "texto": "13 E, convocando Pilatos os principais dos sacerdotes, e os magistrados, e o povo, disse-lhes: 14 Haveis-me apresentado este homem como pervertedor do povo; e eis que, examinando-o na vossa presença, nenhuma culpa, das de que o acusais, acho neste homem. 15 Nem mesmo Herodes, porque a ele vos remeti, e eis que não tem feito coisa alguma digna de morte. 16 Castigá-lo-ei, pois, e soltá-lo-ei. 17 E era-lhe necessário soltar-lhes um detento por ocasião da festa. 18 Mas toda a multidão clamou à uma, dizendo: Fora daqui com este e solta-nos Barrabás. 19 Barrabás fora lançado na prisão por causa de uma sedição feita na cidade e de um homicídio. 20 Falou, pois, outra vez Pilatos, querendo soltar a Jesus. 21 Mas eles clamavam em contrário, dizendo: Crucifica-o! Crucifica-o! 22 Então, ele, pela terceira vez, lhes disse: Mas que mal fez este? Não acho nele culpa alguma de morte. Castigá-lo-ei, pois, e soltá-lo-ei. 23 Mas eles instavam com grandes gritos, pedindo que fosse crucificado. E os seus gritos e os dos principais dos sacerdotes redobravam. 24 Então, Pilatos julgou que devia fazer o que eles pediam. 25 E soltou-lhes o que fora lançado na prisão por uma sedição e homicídio, que era o que pediam; mas entregou Jesus à vontade deles."}, "joao": {"referencia": "Jo 18.38-19.16", "texto": "38 Disse-lhe Pilatos: Que é a verdade? E, dizendo isso, voltou até os judeus e disse-lhes: Não acho nele crime algum. 39 Mas vós tendes por costume que eu vos solte alguém por ocasião da Páscoa. Quereis, pois, que vos solte o rei dos judeus? 40 Então, todos voltaram a gritar, dizendo: Este não, mas Barrabás! E Barrabás era um salteador. 1 Pilatos, pois, tomou, então, a Jesus e o açoitou. 2 E os soldados, tecendo uma coroa de espinhos, lha puseram sobre a cabeça e lhe vestiram uma veste de púrpura. 3 E diziam: Salve, rei dos judeus! E davam-lhe bofetadas. 4 Então, Pilatos saiu outra vez fora e disse-lhes: Eis aqui vo-lo trago fora, para que saibais que não acho nele crime algum. 5 Saiu, pois, Jesus, levando a coroa de espinhos e a veste de púrpura. E disse-lhes Pilatos: Eis aqui o homem. 6 Vendo-o, pois, os principais dos sacerdotes e os servos, gritaram, dizendo: Crucifica-o! Crucifica-o! Disse-lhes Pilatos: Tomai-o vós e crucificai-o, porque eu nenhum crime acho nele. 7 Responderam-lhe os judeus: Nós temos uma lei, e, segundo a nossa lei, deve morrer, porque se fez Filho de Deus. 8 E Pilatos, quando ouviu essa palavra, mais atemorizado ficou. 9 E entrou outra vez na audiência e disse a Jesus: De onde és tu? Mas Jesus não lhe deu resposta. 10 Disse-lhe, pois, Pilatos: Não me falas a mim? Não sabes tu que tenho poder para te crucificar e tenho poder para te soltar? 11 Respondeu Jesus: Nenhum poder terias contra mim, se de cima te não fosse dado; mas aquele que me entregou a ti maior pecado tem. 12 Desde então, Pilatos procurava soltá-lo; mas os judeus gritavam, dizendo: Se soltas este, não és amigo do César! Qualquer que se faz rei é contra o César! 13 Ouvindo, pois, Pilatos esse dito, levou Jesus para fora e assentou-se no tribunal, no lugar chamado Litóstrotos, e em hebraico o nome é Gabatá. 14 E era a preparação da Páscoa e quase à hora sexta; e disse aos judeus: Eis aqui o vosso rei. 15 Mas eles bradaram: Tira! Tira! Crucifica-o! Disse-lhes Pilatos: Hei de crucificar o vosso rei? Responderam os principais dos sacerdotes: Não temos rei, senão o César. 16 Então, entregou-lho, para que fosse crucificado. E tomaram a Jesus e o levaram."}}, {"id": 233, "ordem": 233, "secao": "C. Morte e Ressurreição de Jesus", "subsecao": null, "titulo": "Os soldados romanos zombam de Jesus", "mateus": {"referencia": "Mt 27.27-31", "texto": "27 E logo os soldados do governador, conduzindo Jesus à audiência, reuniram junto dele toda a coorte. 28 E, despindo-o, o cobriram com uma capa escarlate. 29 E, tecendo uma coroa de espinhos, puseram-lha na cabeça e, em sua mão direita, uma cana; e, ajoelhando diante dele, o escarneciam, dizendo: Salve, Rei dos judeus! 30 E, cuspindo nele, tiraram-lhe a cana e batiam-lhe com ela na cabeça. 31 E, depois de o haverem escarnecido, tiraram-lhe a capa, vestiram-lhe as suas vestes e o levaram para ser crucificado."}, "marcos": {"referencia": "Mc 15.16-20", "texto": "16 E os soldados o levaram para dentro do palácio, à sala da audiência, e convocaram toda a coorte. 17 E vestiram-no de púrpura e, tecendo uma coroa de espinhos, lha puseram na cabeça. 18 E começaram a saudá-lo, dizendo: Salve, Rei dos judeus! 19 E feriram-no na cabeça com uma cana, e cuspiram nele, e, postos de joelhos, o adoravam. 20 E, havendo-o escarnecido, despiram-lhe a púrpura, e o vestiram com as suas próprias vestes, e o levaram para fora, a fim de o crucificarem."}, "lucas": null, "joao": null}, {"id": 234, "ordem": 234, "secao": "C. Morte e Ressurreição de Jesus", "subsecao": null, "titulo": "Jesus é levado para ser crucificado", "mateus": {"referencia": "Mt 27.32", "texto": "32 E, quando saíam, encontraram um homem cireneu, chamado Simão, a quem constrangeram a levar a sua cruz."}, "marcos": {"referencia": "Mc 15.21", "texto": "21 E constrangeram um certo Simão Cireneu, pai de Alexandre e de Rufo, que por ali passava, vindo do campo, a que levasse a cruz."}, "lucas": {"referencia": "Lc 23.26-31", "texto": "26 E, quando o iam levando, tomaram um certo Simão, cireneu, que vinha do campo, e puseram-lhe a cruz às costas, para que a levasse após Jesus. 27 E seguia-o grande multidão de povo e de mulheres, as quais batiam nos peitos e o lamentavam. 28 Porém Jesus, voltando-se para elas, disse: Filhas de Jerusalém, não choreis por mim; chorai, antes, por vós mesmas e por vossos filhos. 29 Porque eis que hão de vir dias em que dirão: Bem-aventuradas as estéreis, e os ventres que não geraram, e os peitos que não amamentaram! 30 Então, começarão a dizer aos montes: Caí sobre nós! E aos outeiros: Cobri-nos! 31 Porque, se ao madeiro verde fazem isso, que se fará ao seco?"}, "joao": null}, {"id": 235, "ordem": 235, "secao": "C. Morte e Ressurreição de Jesus", "subsecao": null, "titulo": "Jesus é pregado na cruz", "mateus": {"referencia": "Mt 27.33-44", "texto": "33 E, chegando ao lugar chamado Gólgota, que significa Lugar da Caveira, 34 deram-lhe a beber vinho misturado com fel; mas ele, provando-o, não quis beber. 35 E, havendo-o crucificado, repartiram as suas vestes, lançando sortes, para que se cumprisse o que foi dito pelo profeta: Repartiram entre si as minhas vestes, e sobre a minha túnica lançaram sortes. 36 E, assentados, o guardavam ali. 37 E, por cima da sua cabeça, puseram escrita a sua acusação: ESTE É JESUS, O REI DOS JUDEUS. 38 E foram crucificados com ele dois salteadores, um, à direita, e outro, à esquerda. 39 E os que passavam blasfemavam dele, meneando a cabeça 40 e dizendo: Tu, que destróis o templo e, em três dias, o reedificas, salva-te a ti mesmo; se és o Filho de Deus, desce da cruz. 41 E da mesma maneira também os príncipes dos sacerdotes, com os escribas, e anciãos, e fariseus, escarnecendo, diziam: 42 Salvou os outros e a si mesmo não pode salvar-se. Se é o Rei de Israel, desça, agora, da cruz, e creremos nele; 43 confiou em Deus; livre-o agora, se o ama; porque disse: Sou Filho de Deus. 44 E o mesmo lhe lançaram também em rosto os salteadores que com ele estavam crucificados."}, "marcos": {"referencia": "Mc 15.22-32", "texto": "22 E levaram-no ao lugar do Gólgota, que se traduz por lugar da Caveira. 23 E deram-lhe a beber vinho com mirra, mas ele não o tomou. 24 E, havendo-o crucificado, repartiram as suas vestes, lançando sobre eles sortes, para saber o que cada um levaria. 25 E era a hora terceira, e o crucificaram. 26 E, por cima dele, estava escrita a sua acusação: O REI DOS JUDEUS. 27 E crucificaram com ele dois salteadores, um à sua direita, e outro à esquerda. 28 E cumpriu-se a Escritura que diz: E com os malfeitores foi contado. 29 E os que passavam blasfemavam dele, meneando a cabeça e dizendo: Ah! Tu que derribas o templo e, em três dias, o edificas! 30 Salva-te a ti mesmo e desce da cruz. 31 E da mesma maneira também os principais dos sacerdotes, com os escribas, diziam uns para os outros, zombando: Salvou os outros e não pode salvar-se a si mesmo. 32 O Cristo, o Rei de Israel, desça agora da cruz, para que o vejamos e acreditemos. Também os que com ele foram crucificados o injuriavam."}, "lucas": {"referencia": "Lc 23.32-43", "texto": "32 E também conduziram outros dois, que eram malfeitores, para com ele serem mortos. 33 E, quando chegaram ao lugar chamado a Caveira, ali o crucificaram e aos malfeitores, um, à direita, e outro, à esquerda. 34 E dizia Jesus: Pai, perdoa-lhes, porque não sabem o que fazem. E, repartindo as suas vestes, lançaram sortes. 35 E o povo estava olhando. E também os príncipes zombavam dele, dizendo: Aos outros salvou; salve-se a si mesmo, se este é o Cristo, o escolhido de Deus. 36 E também os soldados escarneciam dele, chegando-se a ele, e apresentando-lhe vinagre, 37 e dizendo: Se tu és o Rei dos judeus, salva-te a ti mesmo. 38 E também, por cima dele, estava um título, escrito em letras gregas, romanas e hebraicas: ESTE É O REI DOS JUDEUS. 39 E um dos malfeitores que estavam pendurados blasfemava dele, dizendo: Se tu és o Cristo, salva-te a ti mesmo e a nós. 40 Respondendo, porém, o outro, repreendia-o, dizendo: Tu nem ainda temes a Deus, estando na mesma condenação? 41 E nós, na verdade, com justiça, porque recebemos o que os nossos feitos mereciam; mas este nenhum mal fez. 42 E disse a Jesus: Senhor, lembra-te de mim, quando entrares no teu Reino. 43 E disse-lhe Jesus: Em verdade te digo que hoje estarás comigo no Paraíso."}, "joao": {"referencia": "Jo 19.17-27", "texto": "17 E, levando ele às costas a sua cruz, saiu para o lugar chamado Calvário, que em hebraico se chama Gólgota, 18 onde o crucificaram, e, com ele, outros dois, um de cada lado, e Jesus no meio. 19 E Pilatos escreveu também um título e pô-lo em cima da cruz; e nele estava escrito: JESUS NAZARENO, REI DOS JUDEUS. 20 E muitos dos judeus leram este título, porque o lugar onde Jesus estava crucificado era próximo da cidade; e estava escrito em hebraico, grego e latim. 21 Diziam, pois, os principais sacerdotes dos judeus a Pilatos: Não escrevas, Rei dos judeus, mas que ele disse: Sou Rei dos judeus. 22 Respondeu Pilatos: O que escrevi escrevi. 23 Tendo, pois, os soldados crucificado a Jesus, tomaram as suas vestes e fizeram quatro partes, para cada soldado uma parte, e também a túnica. A túnica, porém, tecida toda de alto a baixo, não tinha costura. 24 Disseram, pois, uns aos outros: Não a rasguemos, mas lancemos sortes sobre ela, para ver de quem será. Isso foi assim para que se cumprisse a Escritura, que diz: Dividiram entre si as minhas vestes e sobre a minha túnica lançaram sortes. Os soldados, pois, fizeram essas coisas. 25 E junto à cruz de Jesus estava sua mãe, e a irmã de sua mãe, Maria, mulher de Clopas, e Maria Madalena. 26 Ora, Jesus, vendo ali sua mãe e que o discípulo a quem ele amava estava presente, disse à sua mãe: Mulher, eis aí o teu filho. 27 Depois, disse ao discípulo: Eis aí tua mãe. E desde aquela hora o discípulo a recebeu em sua casa."}}, {"id": 236, "ordem": 236, "secao": "C. Morte e Ressurreição de Jesus", "subsecao": null, "titulo": "Jesus morre na cruz", "mateus": {"referencia": "Mt 27.45-56", "texto": "45 E, desde a hora sexta, houve trevas sobre toda a terra, até à hora nona. 46 E, perto da hora nona, exclamou Jesus em alta voz, dizendo: Eli, Eli, lemá sabactâni, isto é, Deus meu, Deus meu, por que me desamparaste? 47 E alguns dos que ali estavam, ouvindo isso, diziam: Este chama por Elias. 48 E logo um deles, correndo, tomou uma esponja, e embebeu-a em vinagre, e, pondo-a numa cana, dava-lhe de beber. 49 Os outros, porém, diziam: Deixa, vejamos se Elias vem livrá-lo. 50 E Jesus, clamando outra vez com grande voz, entregou o espírito. 51 E eis que o véu do templo se rasgou em dois, de alto a baixo; e tremeu a terra, e fenderam-se as pedras. 52 E abriram-se os sepulcros, e muitos corpos de santos que dormiam foram ressuscitados; 53 E, saindo dos sepulcros, depois da ressurreição dele, entraram na Cidade Santa e apareceram a muitos. 54 E o centurião e os que com ele guardavam a Jesus, vendo o terremoto e as coisas que haviam sucedido, tiveram grande temor e disseram: Verdadeiramente, este era o Filho de Deus. 55 E estavam ali, olhando de longe, muitas mulheres que tinham seguido Jesus desde a Galileia, para o servir, 56 entre as quais estavam Maria Madalena, e Maria, mãe de Tiago e de José, e a mãe dos filhos de Zebedeu."}, "marcos": {"referencia": "Mc 15.33-41", "texto": "33 E, chegada a hora sexta, houve trevas sobre toda a terra até à hora nona. 34 E, à hora nona, Jesus exclamou com grande voz, dizendo: Eloí, Eloí, lemá sabactâni? Isso, traduzido, é: Deus meu, Deus meu, por que me desamparaste? 35 E alguns dos que ali estavam, ouvindo isso, diziam: Eis que chama por Elias. 36 E um deles correu a embeber uma esponja em vinagre e, pondo-a numa cana, deu-lho a beber, dizendo: Deixai, vejamos se virá Elias tirá-lo. 37 E Jesus, dando um grande brado, expirou. 38 E o véu do templo se rasgou em dois, de alto a baixo. 39 E o centurião que estava defronte dele, vendo que assim clamando expirara, disse: Verdadeiramente, este homem era o Filho de Deus. 40 E também ali estavam algumas mulheres, olhando de longe, entre as quais também Maria Madalena, e Maria, mãe de Tiago, o menor, e de José, e Salomé, 41 as quais também o seguiam e o serviam, quando estava na Galileia; e muitas outras que tinham subido com ele a Jerusalém."}, "lucas": {"referencia": "Lc 23.44-49", "texto": "44 E era já quase a hora sexta, e houve trevas em toda a terra até à hora nona, 45 escurecendo-se o sol; e rasgou-se ao meio o véu do templo. 46 E, clamando Jesus com grande voz, disse: Pai, nas tuas mãos entrego o meu espírito. E, havendo dito isso, expirou. 47 E o centurião, vendo o que tinha acontecido, deu glória a Deus, dizendo: Na verdade, este homem era justo. 48 E toda a multidão que se ajuntara a este espetáculo, vendo o que havia acontecido, voltava batendo nos peitos. 49 E todos os seus conhecidos e as mulheres que juntamente o haviam seguido desde a Galileia estavam de longe vendo essas coisas."}, "joao": {"referencia": "Jo 19.28-37", "texto": "28 Depois, sabendo Jesus que já todas as coisas estavam terminadas, para que a Escritura se cumprisse, disse: Tenho sede. 29 Estava, pois, ali um vaso cheio de vinagre. E encheram de vinagre uma esponja e, pondo-a num hissopo, lha chegaram à boca. 30 E, quando Jesus tomou o vinagre, disse: Está consumado. E, inclinando a cabeça, entregou o espírito. 31 Os judeus, pois, para que no sábado não ficassem os corpos na cruz, visto como era a preparação (pois era grande o dia de sábado), rogaram a Pilatos que se lhes quebrassem as pernas, e fossem tirados. 32 Foram, pois, os soldados e, na verdade, quebraram as pernas ao primeiro e ao outro que com ele fora crucificado. 33 Mas, vindo a Jesus e vendo-o já morto, não lhe quebraram as pernas. 34 Contudo, um dos soldados lhe furou o lado com uma lança, e logo saiu sangue e água. 35 E aquele que o viu testificou, e o seu testemunho é verdadeiro, e sabe que é verdade o que diz, para que também vós o creiais. 36 Porque isso aconteceu para que se cumprisse a Escritura, que diz: Nenhum dos seus ossos será quebrado. 37 E outra vez diz a Escritura: Verão aquele que traspassaram."}}, {"id": 237, "ordem": 237, "secao": "C. Morte e Ressurreição de Jesus", "subsecao": null, "titulo": "Jesus é depositado no sepulcro", "mateus": {"referencia": "Mt 27.57-61", "texto": "57 E, vinda já a tarde, chegou um homem rico de Arimateia, por nome José, que também era discípulo de Jesus. 58 Este foi ter com Pilatos e pediu-lhe o corpo de Jesus. Então, Pilatos mandou que o corpo lhe fosse dado. 59 E José, tomando o corpo, envolveu-o num fino e limpo lençol, 60 e o pôs no seu sepulcro novo, que havia aberto em rocha, e, rolando uma grande pedra para a porta do sepulcro, foi-se. 61 E estavam ali Maria Madalena e a outra Maria, assentadas defronte do sepulcro."}, "marcos": {"referencia": "Mc 15.42-47", "texto": "42 E, chegada a tarde, porquanto era o Dia da Preparação, isto é, a véspera do sábado, 43 chegou José de Arimateia, senador honrado, que também esperava o Reino de Deus, e ousadamente foi a Pilatos, e pediu o corpo de Jesus. 44 E Pilatos se admirou de que já estivesse morto. E, chamando o centurião, perguntou-lhe se já havia muito que tinha morrido. 45 E, tendo-se certificado pelo centurião, deu o corpo a José, 46 o qual comprara um lençol fino, e, tirando-o da cruz, o envolveu nele, e o depositou num sepulcro lavrado numa rocha, e revolveu uma pedra para a porta do sepulcro. 47 E Maria Madalena e Maria, mãe de José, observavam onde o punham."}, "lucas": {"referencia": "Lc 23.50-56", "texto": "50 E eis que um homem por nome José, senador, homem de bem e justo 51 (que não tinha consentido no conselho e nos atos dos outros), natural de Arimateia, cidade dos judeus, e que também esperava o Reino de Deus, 52 este, chegando a Pilatos, pediu o corpo de Jesus. 53 E, havendo-o tirado, envolveu-o num lençol e pô-lo num sepulcro escavado numa penha, onde ninguém ainda havia sido posto. 54 E era o Dia da Preparação, e amanhecia o sábado. 55 E as mulheres que tinham vindo com ele da Galileia seguiram também e viram o sepulcro e como foi posto o seu corpo. 56 E, voltando elas, prepararam especiarias e unguentos e, no sábado, repousaram, conforme o mandamento."}, "joao": {"referencia": "Jo 19.38-42", "texto": "38 Depois disso, José de Arimateia (o que era discípulo de Jesus, mas oculto, por medo dos judeus) rogou a Pilatos que lhe permitisse tirar o corpo de Jesus. E Pilatos lho permitiu. Então, foi e tirou o corpo de Jesus. 39 E foi também Nicodemos (aquele que, anteriormente, se dirigira de noite a Jesus), levando quase cem libras de um composto de mirra e aloés. 40 Tomaram, pois, o corpo de Jesus e o envolveram em lençóis com as especiarias, como os judeus costumam fazer na preparação para o sepulcro. 41 E havia um horto naquele lugar onde fora crucificado e, no horto, um sepulcro novo, em que ainda ninguém havia sido posto. 42 Ali, pois (por causa da preparação dos judeus e por estar perto aquele sepulcro), puseram a Jesus."}}, {"id": 238, "ordem": 238, "secao": "C. Morte e Ressurreição de Jesus", "subsecao": null, "titulo": "Uma guarda é postada no sepulcro", "mateus": {"referencia": "Mt 27.62-66", "texto": "62 E, no dia seguinte, que é o dia depois da Preparação, reuniram-se os príncipes dos sacerdotes e os fariseus em casa de Pilatos, 63 dizendo: Senhor, lembramo-nos de que aquele enganador, vivendo ainda, disse: Depois de três dias, ressuscitarei. 64 Manda, pois, que o sepulcro seja guardado com segurança até ao terceiro dia; não se dê o caso que os seus discípulos vão de noite, e o furtem, e digam ao povo: Ressuscitou dos mortos; e assim o último erro será pior do que o primeiro. 65 E disse-lhes Pilatos: Tendes a guarda; ide, guardai-o como entenderdes. 66 E, indo eles, seguraram o sepulcro com a guarda, selando a pedra."}, "marcos": null, "lucas": null, "joao": null}, {"id": 239, "ordem": 239, "secao": "C. Morte e Ressurreição de Jesus", "subsecao": null, "titulo": "Jesus ressuscita", "mateus": {"referencia": "Mt 28.1-8", "texto": "1 E, no fim do sábado, quando já despontava o primeiro dia da semana, Maria Madalena e a outra Maria foram ver o sepulcro. 2 E eis que houvera um grande terremoto, porque um anjo do Senhor, descendo do céu, chegou, removendo a pedra, e sentou-se sobre ela. 3 E o seu aspecto era como um relâmpago, e a sua veste branca como a neve. 4 E os guardas, com medo dele, ficaram muito assombrados e como mortos. 5 Mas o anjo, respondendo, disse às mulheres: Não tenhais medo; pois eu sei que buscai a Jesus, que foi crucificado. 6 Ele não está aqui, porque já ressuscitou, como tinha dito. Vinde e vede o lugar onde o Senhor jazia. 7 Ide, pois, imediatamente, e dizei aos seus discípulos que já ressuscitou dos mortos. E eis que ele vai adiante de vós para a Galileia; ali o vereis. Eis que eu vo-lo tenho dito. 8 E, saindo elas pressurosamente do sepulcro, com temor e grande alegria, correram a anunciá-lo aos seus discípulos."}, "marcos": {"referencia": "Mc 16.1-8", "texto": "1 E, passado o sábado, Maria Madalena, Salomé e Maria, mãe de Tiago, compraram aromas para irem ungi-lo. 2 E, no primeiro dia da semana, foram ao sepulcro, de manhã cedo, ao nascer do sol, 3 e diziam umas às outras: Quem nos revolverá a pedra da porta do sepulcro? 4 E, olhando, viram que já a pedra estava revolvida; e era ela muito grande. 5 E, entrando no sepulcro, viram um jovem assentado à direita, vestido de uma roupa comprida e branca; e ficaram espantadas. 6 Porém ele disse-lhes: Não vos ass
