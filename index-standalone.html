m ainda queria levantar os olhos ao céu, mas batia no peito, dizendo: Ó Deus, tem misericórdia de mim, pecador! 14 Digo-vos que este desceu justificado para sua casa, e não aquele; porque qualquer que a si mesmo se exalta será humilhado, e qualquer que a si mesmo se humilha será exaltado."}, "joao": null}, {"id": 176, "ordem": 176, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Dirige-se a Jerusalém", "titulo": "Jesus ensina sobre casamento e divórcio", "mateus": {"referencia": "Mt 19.3-12", "texto": "3 Então, chegaram ao pé dele os fariseus, tentando-o e dizendo-lhe: É lícito ao homem repudiar sua mulher por qualquer motivo? 4 Ele, porém, respondendo, disse-lhes: Não tendes lido que, no princípio, o Criador os fez macho e fêmea 5 e disse: Portanto, deixará o homem pai e mãe e se unirá à sua mulher, e serão dois numa só carne? 6 Assim não são mais dois, mas uma só carne. Portanto, o que Deus ajuntou não separe o homem. 7 Disseram-lhe eles: Então, por que mandou Moisés dar-lhe carta de divórcio e repudiá-la? 8 Disse-lhes ele: Moisés, por causa da dureza do vosso coração, vos permitiu repudiar vossa mulher; mas, ao princípio, não foi assim. 9 Eu vos digo, porém, que qualquer que repudiar sua mulher, não sendo por causa de prostituição, e casar com outra, comete adultério; e o que casar com a repudiada também comete adultério. 10 Disseram-lhe seus discípulos: Se assim é a condição do homem relativamente à mulher, não convém casar. 11 Ele, porém, lhes disse: Nem todos podem receber esta palavra, mas só aqueles a quem foi concedido. 12 Porque há eunucos que assim nasceram do ventre da mãe; e há eunucos que foram castrados pelos homens; e há eunucos que se castraram a si mesmos por causa do Reino dos céus. Quem pode receber isso, que o receba."}, "marcos": {"referencia": "Mc 10.2-12", "texto": "2 E, aproximando-se dele os fariseus, perguntaram-lhe, tentando-o: É lícito ao homem repudiar sua mulher? 3 Mas ele, respondendo, disse-lhes: Que vos mandou Moisés? 4 E eles disseram: Moisés permitiu escrever carta de divórcio e repudiar. 5 E Jesus, respondendo, disse-lhes: Pela dureza do vosso coração vos deixou ele escrito esse mandamento; 6 porém, desde o princípio da criação, Deus os fez macho e fêmea. 7 Por isso, deixará o homem a seu pai e a sua mãe e unir-se-á a sua mulher. 8 E serão os dois uma só carne e, assim, já não serão dois, mas uma só carne. 9 Portanto, o que Deus ajuntou, não o separe o homem. 10 E em casa tornaram os discípulos a interrogá-lo acerca disso mesmo. 11 E ele lhes disse: Qualquer que deixar a sua mulher e casar com outra adultera contra ela. 12 E, se a mulher deixar a seu marido e casar com outro, adultera."}, "lucas": null, "joao": null}, {"id": 177, "ordem": 177, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Dirige-se a Jerusalém", "titulo": "Jesus abençoa as criancinhas", "mateus": {"referencia": "Mt 19.13-15", "texto": "13 Trouxeram-lhe, então, algumas crianças, para que lhes impusesse as mãos e orasse; mas os discípulos os repreendiam. 14 Jesus, porém, disse: Deixai os pequeninos e não os estorveis de vir a mim, porque dos tais é o Reino dos céus. 15 E, tendo-lhes imposto as mãos, partiu dali."}, "marcos": {"referencia": "Mc 10.13-16", "texto": "13 E traziam-lhe crianças para que lhes tocasse, mas os discípulos repreendiam aos que lhas traziam. 14 Jesus, porém, vendo isso, indignou-se e disse-lhes: Deixai vir os pequeninos a mim e não os impeçais, porque dos tais é o Reino de Deus. 15 Em verdade vos digo que qualquer que não receber o Reino de Deus como uma criança de maneira nenhuma entrará nele. 16 E, tomando-as nos seus braços e impondo-lhes as mãos, as abençoou."}, "lucas": {"referencia": "Lc 18.15-17", "texto": "15 E traziam-lhe também crianças, para que ele as tocasse; e os discípulos, vendo isso, repreendiam-nos. 16 Mas Jesus, chamando-as para si, disse: Deixai vir a mim os pequeninos e não os impeçais, porque dos tais é o Reino de Deus. 17 Em verdade vos digo que qualquer que não receber o Reino de Deus como uma criança não entrará nele."}, "joao": null}, {"id": 178, "ordem": 178, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Dirige-se a Jerusalém", "titulo": "Jesus fala ao jovem rico", "mateus": {"referencia": "Mt 19.16-30", "texto": "16 E eis que, aproximando-se dele um jovem, disse-lhe: Bom Mestre, que bem farei, para conseguir a vida eterna? 17 E ele disse-lhe: Por que me chamas bom? Não há bom, senão um só que é Deus. Se queres, porém, entrar na vida, guarda os mandamentos. 18 Disse-lhe ele: Quais? E Jesus disse: Não matarás, não cometerás adultério, não furtarás, não dirás falso testemunho; 19 honra teu pai e tua mãe, e amarás o teu próximo como a ti mesmo. 20 Disse-lhe o jovem: Tudo isso tenho guardado desde a minha mocidade; que me falta ainda? 21 Disse-lhe Jesus: Se queres ser perfeito, vai, vende tudo o que tens, dá-o aos pobres e terás um tesouro no céu; e vem e segue-me. 22 E o jovem, ouvindo essa palavra, retirou-se triste, porque possuía muitas propriedades. 23 Disse, então, Jesus aos seus discípulos: Em verdade vos digo que é difícil entrar um rico no Reino dos céus. 24 E outra vez vos digo que é mais fácil passar um camelo pelo fundo de uma agulha do que entrar um rico no Reino de Deus. 25 Os seus discípulos, ouvindo isso, admiraram-se muito, dizendo: Quem poderá, pois, salvar-se? 26 E Jesus, olhando para eles, disse-lhes: Aos homens é isso impossível, mas a Deus tudo é possível. 27 Então, Pedro, tomando a palavra, disse-lhe: Eis que nós deixamos tudo e te seguimos; que receberemos? 28 E Jesus disse-lhes: Em verdade vos digo que vós, que me seguistes, quando, na regeneração, o Filho do Homem se assentar no trono da sua glória, também vos assentareis sobre doze tronos, para julgar as doze tribos de Israel. 29 E todo aquele que tiver deixado casas, ou irmãos, ou irmãs, ou pai, ou mãe, ou mulher, ou filhos, ou terras, por amor do meu nome, receberá cem vezes tanto e herdará a vida eterna. 30 Porém muitos primeiros serão derradeiros, e muitos derradeiros serão primeiros."}, "marcos": {"referencia": "Mc 10.17-31", "texto": "17 E, pondo-se a caminho, correu para ele um homem, o qual se ajoelhou diante dele e lhe perguntou: Bom Mestre, que farei para herdar a vida eterna? 18 E Jesus lhe disse: Por que me chamas bom? Ninguém há bom senão um, que é Deus. 19 Tu sabes os mandamentos: Não adulterarás; não matarás; não furtarás; não dirás falsos testemunhos; não defraudarás alguém; honra a teu pai e a tua mãe. 20 Ele, porém, respondendo, lhe disse: Mestre, tudo isso guardei desde a minha mocidade. 21 E Jesus, olhando para ele, o amou e lhe disse: Falta-te uma coisa: vai, e vende tudo quanto tens, e dá-o aos pobres, e terás um tesouro no céu; e vem e segue-me. 22 Mas ele, contrariado com essa palavra, retirou-se triste, porque possuía muitas propriedades. 23 Então, Jesus, olhando ao redor, disse aos seus discípulos: Quão dificilmente entrarão no Reino de Deus os que têm riquezas! 24 E os discípulos se admiraram destas suas palavras; mas Jesus, tornando a falar, disse-lhes: Filhos, quão difícil é, para os que confiam nas riquezas, entrar no Reino de Deus! 25 É mais fácil passar um camelo pelo fundo de uma agulha do que entrar um rico no Reino de Deus. 26 E eles se admiravam ainda mais, dizendo entre si: Quem poderá, pois, salvar-se? 27 Jesus, porém, olhando para eles, disse: Para os homens é impossível, mas não para Deus, porque para Deus todas as coisas são possíveis. 28 E Pedro começou a dizer-lhe: Eis que nós tudo deixamos e te seguimos. 29 E Jesus, respondendo, disse: Em verdade vos digo que ninguém há, que tenha deixado casa, ou irmãos, ou irmãs, ou pai, ou mãe, ou mulher, ou filhos, ou campos, por amor de mim e do evangelho, 30 que não receba cem vezes tanto, já neste tempo, em casas, e irmãos, e irmãs, e mães, e filhos, e campos, com perseguições, e, no século futuro, a vida eterna. 31 Porém muitos primeiros serão derradeiros, e muitos derradeiros serão primeiros."}, "lucas": {"referencia": "Lc 18.18-30", "texto": "18 E perguntou-lhe um certo príncipe, dizendo: Bom Mestre, que hei de fazer para herdar a vida eterna? 19 Jesus lhe disse: Por que me chamas bom? Ninguém há bom, senão um, que é Deus. 20 Sabes os mandamentos: Não adulterarás, não matarás, não furtarás, não dirás falso testemunho, honra a teu pai e a tua mãe. 21 E disse ele: Todas essas coisas tenho observado desde a minha mocidade. 22 E, quando Jesus ouviu isso, disse-lhe: Ainda te falta uma coisa: vende tudo quanto tens, reparte-o pelos pobres e terás um tesouro no céu; depois, vem e segue-me. 23 Mas, ouvindo ele isso, ficou muito triste, porque era muito rico. 24 E, vendo Jesus que ele ficara muito triste, disse: Quão dificilmente entrarão no Reino de Deus os que têm riquezas! 25 Porque é mais fácil entrar um camelo pelo fundo de uma agulha do que entrar um rico no Reino de Deus. 26 E os que ouviram isso disseram: Logo, quem pode salvar-se? 27 Mas ele respondeu: As coisas que são impossíveis aos homens são possíveis a Deus. 28 E disse Pedro: Eis que nós deixamos tudo e te seguimos. 29 E ele lhes disse: Na verdade vos digo que ninguém há, que tenha deixado casa, ou pais, ou irmãos, ou mulher, ou filhos pelo Reino de Deus 30 e não haja de receber muito mais neste mundo e, na idade vindoura, a vida eterna."}, "joao": null}, {"id": 179, "ordem": 179, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Dirige-se a Jerusalém", "titulo": "Jesus conta a parábola dos trabalhadores da vinha", "mateus": {"referencia": "Mt 20.1-16", "texto": "1 Porque o Reino dos céus é semelhante a um homem, pai de família, que saiu de madrugada a assalariar trabalhadores para a sua vinha. 2 E, ajustando com os trabalhadores a um dinheiro por dia, mandou-os para a sua vinha. 3 E, saindo perto da hora terceira, viu outros que estavam ociosos na praça. 4 E disse-lhes: Ide vós também para a vinha, e dar-vos-ei o que for justo. E eles foram. 5 Saindo outra vez, perto da hora sexta e nona, fez o mesmo. 6 E, saindo perto da hora undécima, encontrou outros que estavam ociosos e perguntou-lhes: Por que estais ociosos todo o dia? 7 Disseram-lhe eles: Porque ninguém nos assalariou. Diz-lhes ele: Ide vós também para a vinha e recebereis o que for justo. 8 E, aproximando-se a noite, diz o senhor da vinha ao seu mordomo: Chama os trabalhadores, e paga-lhes o salário, começando pelos derradeiros até aos primeiros. 9 E, chegando os que tinham ido perto da hora undécima, receberam um dinheiro cada um; 10 vindo, porém, os primeiros, cuidaram que haviam de receber mais; mas, do mesmo modo, receberam um dinheiro cada um. 11 E, recebendo-o, murmuravam contra o pai de família, 12 dizendo: Estes derradeiros trabalharam só uma hora, e tu os igualaste conosco, que suportamos a fadiga e a calma do dia. 13 Mas ele, respondendo, disse a um deles: Amigo, não te faço injustiça; não ajustaste tu comigo um dinheiro? 14 Toma o que é teu e retira-te; eu quero dar a este derradeiro tanto como a ti. 15 Ou não me é lícito fazer o que quiser do que é meu? Ou é mau o teu olho porque eu sou bom? 16 Assim, os derradeiros serão primeiros, e os primeiros, derradeiros, porque muitos são chamados, mas poucos, escolhidos."}, "marcos": null, "lucas": null, "joao": null}, {"id": 180, "ordem": 180, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Dirige-se a Jerusalém", "titulo": "Jesus prediz sua morte pela terceira vez", "mateus": {"referencia": "Mt 20.17-19", "texto": "17 E, subindo Jesus a Jerusalém, chamou à parte os seus doze discípulos e, no caminho, disse-lhes: 18 Eis que vamos para Jerusalém, e o Filho do Homem será entregue aos príncipes dos sacerdotes e aos escribas, e condená-lo-ão à morte. 19 E o entregarão aos gentios para que dele escarneçam, e o açoitem, e crucifiquem, e ao terceiro dia ressuscitará."}, "marcos": {"referencia": "Mc 10.32-34", "texto": "32 E iam no caminho, subindo para Jerusalém; e Jesus ia adiante deles. E eles maravilhavam-se e seguiam-no atemorizados. E, tornando a tomar consigo os doze, começou a dizer-lhes as coisas que lhe deviam sobrevir, 33 dizendo: Eis que nós subimos a Jerusalém, e o Filho do Homem será entregue aos príncipes dos sacerdotes e aos escribas, e o condenarão à morte, e o entregarão aos gentios, 34 e o escarnecerão, e açoitarão, e cuspirão nele, e o matarão; mas, ao terceiro dia, ressuscitará."}, "lucas": {"referencia": "Lc 18.31-34", "texto": "31 E, tomando consigo os doze, disse-lhes: Eis que subimos a Jerusalém, e se cumprirá no Filho do Homem tudo o que pelos profetas foi escrito. 32 Pois há de ser entregue aos gentios e escarnecido, injuriado e cuspido; 33 e, havendo-o açoitado, o matarão; e, ao terceiro dia, ressuscitará. 34 E eles nada disso entendiam, e esta palavra lhes era encoberta, não percebendo o que se lhes dizia."}, "joao": null}, {"id": 181, "ordem": 181, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Dirige-se a Jerusalém", "titulo": "Jesus ensina sobre servir aos outros", "mateus": {"referencia": "Mt 20.20-28", "texto": "20 Então, se aproximou dele a mãe dos filhos de Zebedeu, com seus filhos, adorando-o e fazendo-lhe um pedido. 21 E ele diz-lhe: Que queres? Ela respondeu: Dize que estes meus dois filhos se assentem um à tua direita e outro à tua esquerda, no teu Reino. 22 Jesus, porém, respondendo, disse: Não sabeis o que pedis; podeis vós beber o cálice que eu hei de beber e ser batizados com o batismo com que eu sou batizado? Dizem-lhe eles: Podemos. 23 E diz-lhes ele: Na verdade bebereis o meu cálice, mas o assentar-se à minha direita ou à minha esquerda não me pertence dá-lo, mas é para aqueles para quem meu Pai o tem preparado. 24 E, quando os dez ouviram isso, indignaram-se contra os dois irmãos. 25 Então, Jesus, chamando-os para junto de si, disse: Bem sabeis que pelos príncipes dos gentios são estes dominados e que os grandes exercem autoridade sobre eles. 26 Não será assim entre vós; mas todo aquele que quiser, entre vós, fazer-se grande, que seja vosso serviçal; 27 e qualquer que, entre vós, quiser ser o primeiro, que seja vosso servo, 28 bem como o Filho do Homem não veio para ser servido, mas para servir e para dar a sua vida em resgate de muitos."}, "marcos": {"referencia": "Mc 10.35-45", "texto": "35 E aproximaram-se dele Tiago e João, filhos de Zebedeu, dizendo: Mestre, queremos que nos faças o que pedirmos. 36 E ele lhes disse: Que quereis que vos faça? 37 E eles lhe disseram: Concede-nos que, na tua glória, nos assentemos, um à tua direita, e outro à tua esquerda. 38 Mas Jesus lhes disse: Não sabeis o que pedis; podeis vós beber o cálice que eu bebo e ser batizados com o batismo com que eu sou batizado? 39 E eles lhe disseram: Podemos. Jesus, porém, disse-lhes: Em verdade vós bebereis o cálice que eu beber e sereis batizados com o batismo com que eu sou batizado, 40 mas o assentar-se à minha direita ou à minha esquerda não me pertence a mim concedê-lo, mas isso é para aqueles a quem está reservado. 41 E os dez, tendo ouvido isso, começaram a indignar-se contra Tiago e João. 42 Mas Jesus, chamando-os a si, disse-lhes: Sabeis que os que julgam ser príncipes das gentes delas se assenhoreiam, e os seus grandes usam de autoridade sobre elas; 43 mas entre vós não será assim; antes, qualquer que, entre vós, quiser ser grande será vosso serviçal. 44 E qualquer que, dentre vós, quiser ser o primeiro será servo de todos. 45 Porque o Filho do Homem também não veio para ser servido, mas para servir e dar a sua vida em resgate de muitos."}, "lucas": null, "joao": null}, {"id": 182, "ordem": 182, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Dirige-se a Jerusalém", "titulo": "Jesus cura dois mendigos cegos", "mateus": {"referencia": "Mt 20.29-34", "texto": "29 E, saindo eles de Jericó, seguiu-o grande multidão. 30 E eis que dois cegos, assentados junto do caminho, ouvindo que Jesus passava, clamaram, dizendo: Senhor, Filho de Davi, tem misericórdia de nós. 31 E a multidão os repreendia, para que se calassem; eles, porém, cada vez clamavam mais, dizendo: Senhor, Filho de Davi, tem misericórdia de nós. 32 E Jesus, parando, chamou-os e disse: Que quereis que vos faça? 33 Disseram-lhe eles: Senhor, que os nossos olhos sejam abertos. 34 Então, Jesus, movido de íntima compaixão, tocou-lhes nos olhos, e logo viram; e eles o seguiram."}, "marcos": {"referencia": "Mc 10.46-52", "texto": "46 Depois, foram para Jericó. E, saindo ele de Jericó com seus discípulos e uma grande multidão, Bartimeu, o cego, filho de Timeu, estava assentado junto ao caminho, mendigando. 47 E, ouvindo que era Jesus de Nazaré, começou a clamar e a dizer: Jesus, Filho de Davi, tem misericórdia de mim! 48 E muitos o repreendiam, para que se calasse; mas ele clamava cada vez mais: Filho de Davi, tem misericórdia de mim! 49 E Jesus, parando, disse que o chamassem; e chamaram o cego, dizendo-lhe: Tem bom ânimo; levanta-te, que ele te chama. 50 E ele, lançando de si a sua capa, levantou-se e foi ter com Jesus. 51 E Jesus, falando, disse-lhe: Que queres que te faça? E o cego lhe disse: Mestre, que eu tenha vista. 52 E Jesus lhe disse: Vai, a tua fé te salvou. E logo viu, e seguiu a Jesus pelo caminho."}, "lucas": {"referencia": "Lc 18.35-43", "texto": "35 E aconteceu que, chegando ele perto de Jericó, estava um cego assentado junto do caminho, mendigando. 36 E, ouvindo passar a multidão, perguntou que era aquilo. 37 E disseram-lhe que Jesus, o Nazareno, passava. 38 Então, clamou, dizendo: Jesus, Filho de Davi, tem misericórdia de mim! 39 E os que iam passando repreendiam-no para que se calasse; mas ele clamava ainda mais: Filho de Davi, tem misericórdia de mim! 40 Então, Jesus, parando, mandou que lho trouxessem; e, chegando ele, perguntou-lhe, 41 dizendo: Que queres que te faça? E ele disse: Senhor, que eu veja. 42 E Jesus lhe disse: Vê; a tua fé te salvou. 43 E logo viu e seguia-o, glorificando a Deus. E todo o povo, vendo isso, dava louvores a Deus."}, "joao": null}, {"id": 183, "ordem": 183, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Dirige-se a Jerusalém", "titulo": "Jesus traz salvação à casa de Zaqueu", "mateus": null, "marcos": null, "lucas": {"referencia": "Lc 19.1-10", "texto": "1 E, tendo Jesus entrado em Jericó, ia passando. 2 E eis que havia ali um homem, chamado Zaqueu; e era este um chefe dos publicanos e era rico. 3 E procurava ver quem era Jesus e não podia, por causa da multidão, pois era de pequena estatura. 4 E, correndo adiante, subiu a uma figueira brava para o ver, porque havia de passar por ali. 5 E, quando Jesus chegou àquele lugar, olhando para cima, viu-o e disse-lhe: Zaqueu, desce depressa, porque, hoje, me convém pousar em tua casa. 6 E, apressando-se, desceu e recebeu-o com júbilo. 7 E, vendo todos isso, murmuravam, dizendo que entrara para ser hóspede de um homem pecador. 8 E, levantando-se Zaqueu, disse ao Senhor: Senhor, eis que eu dou aos pobres metade dos meus bens; e, se em alguma coisa tenho defraudado alguém, o restituo quadruplicado. 9 E disse-lhe Jesus: Hoje, veio a salvação a esta casa, pois também este é filho de Abraão. 10 Porque o Filho do Homem veio buscar e salvar o que se havia perdido."}, "joao": null}, {"id": 184, "ordem": 184, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Dirige-se a Jerusalém", "titulo": "Jesus conta a parábola dos dez servos do rei", "mateus": null, "marcos": null, "lucas": {"referencia": "Lc 19.11-27", "texto": "11 E, ouvindo eles essas coisas, ele prosseguiu e contou uma parábola, porquanto estava perto de Jerusalém, e cuidavam que logo se havia de manifestar o Reino de Deus. 12 Disse, pois: Certo homem nobre partiu para uma terra remota, a fim de tomar para si um reino e voltar depois. 13 E, chamando dez servos seus, deu-lhes dez minas e disse-lhes: Negociai até que eu venha. 14 Mas os seus concidadãos aborreciam-no e mandaram após ele embaixadores, dizendo: Não queremos que este reine sobre nós. 15 E aconteceu que, voltando ele, depois de ter tomado o reino, disse que lhe chamassem aqueles servos a quem tinha dado o dinheiro, para saber o que cada um tinha ganhado, negociando. 16 E veio o primeiro dizendo: Senhor, a tua mina rendeu dez minas. 17 E ele lhe disse: Bem está, servo bom, porque no mínimo foste fiel, sobre dez cidades terás a autoridade. 18 E veio o segundo, dizendo: Senhor, a tua mina rendeu cinco minas. 19 E a este disse também: Sê tu também sobre cinco cidades. 20 E veio outro, dizendo: Senhor, aqui está a tua mina, que guardei num lenço, 21 porque tive medo de ti, que és homem rigoroso, que tomas o que não puseste e segas o que não semeaste. 22 Porém ele lhe disse: Mau servo, pela tua boca te julgarei; sabias que eu sou homem rigoroso, que tomo o que não pus e sego o que não semeei. 23 Por que não puseste, pois, o meu dinheiro no banco, para que eu, vindo, o exigisse com os juros? 24 E disse aos que estavam com ele: Tirai-lhe a mina e dai-a ao que tem dez minas. 25 E disseram-lhe eles: Senhor, ele tem dez minas. 26 Pois eu vos digo que a qualquer que tiver ser-lhe-á dado, mas ao que não tiver até o que tem lhe será tirado. 27 E, quanto àqueles meus inimigos que não quiseram que eu reinasse sobre eles, trazei-os aqui e matai-os diante de mim."}, "joao": null}, {"id": 185, "ordem": 185, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Dirige-se a Jerusalém", "titulo": "Uma mulher unge Jesus com perfume", "mateus": {"referencia": "Mt 26.6-13", "texto": "6 E, estando Jesus em Betânia, em casa de Simão, o leproso, 7 aproximou-se dele uma mulher com um vaso de alabastro, com unguento de grande valor, e derramou-lho sobre a cabeça, quando ele estava assentado à mesa. 8 E os seus discípulos, vendo isso, indignaram-se, dizendo: Por que este desperdício? 9 Pois este unguento podia vender-se por grande preço e dar-se o dinheiro aos pobres. 10 Jesus, porém, conhecendo isso, disse-lhes: Por que afligis esta mulher? Pois praticou uma boa ação para comigo. 11 Porquanto sempre tendes convosco os pobres, mas a mim não me haveis de ter sempre. 12 Ora, derramando ela este unguento sobre o meu corpo, fê-lo preparando-me para o meu sepultamento. 13 Em verdade vos digo que, onde quer que este evangelho for pregado, em todo o mundo, também será referido o que ela fez para memória sua."}, "marcos": {"referencia": "Mc 14.3-9", "texto": "3 E, estando ele em Betânia assentado à mesa, em casa de Simão, o leproso, veio uma mulher que trazia um vaso de alabastro, com unguento de nardo puro, de muito preço, e, quebrando o vaso, lho derramou sobre a cabeça. 4 E alguns houve que em si mesmos se indignaram e disseram: Para que se fez este desperdício de unguento? 5 Porque podia vender-se por mais de trezentos dinheiros e dá-lo aos pobres. E bramavam contra ela. 6 Jesus, porém, disse: Deixai-a, para que a molestais? Ela fez-me boa obra. 7 Porque sempre tendes os pobres convosco e podeis fazer-lhes bem, quando quiserdes; mas a mim nem sempre me tendes. 8 Esta fez o que podia; antecipou-se a ungir o meu corpo para a sepultura. 9 Em verdade vos digo que, em todas as partes do mundo onde este evangelho for pregado, também o que ela fez será contado para sua memória."}, "lucas": null, "joao": {"referencia": "Jo 12.1-11", "texto": "1 Foi, pois, Jesus seis dias antes da Páscoa a Betânia, onde estava Lázaro, o que falecera e a quem ressuscitara dos mortos. 2 Fizeram-lhe, pois, ali uma ceia, e Marta servia, e Lázaro era um dos que estavam à mesa com ele. 3 Então, Maria, tomando uma libra de unguento de nardo puro, de muito preço, ungiu os pés de Jesus e enxugou-lhe os pés com os seus cabelos; e encheu-se a casa do cheiro do unguento. 4 Então, um dos seus discípulos, Judas Iscariotes, filho de Simão, o que havia de traí-lo, disse: 5 Por que não se vendeu este unguento por trezentos dinheiros, e não se deu aos pobres? 6 Ora, ele disse isso não pelo cuidado que tivesse dos pobres, mas porque era ladrão, e tinha a bolsa, e tirava o que ali se lançava. 7 Disse, pois, Jesus: Deixai-a; para o dia da minha sepultura guardou isto. 8 Porque os pobres, sempre os tendes convosco, mas a mim nem sempre me tendes. 9 E muita gente dos judeus soube que ele estava ali; e foram, não só por causa de Jesus, mas também para ver a Lázaro, a quem ressuscitara dos mortos. 10 E os principais dos sacerdotes tomaram deliberação para matar também a Lázaro, 11 porque muitos dos judeus, por causa dele, iam e criam em Jesus."}}, {"id": 186, "ordem": 186, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "O Ministério de Jesus em Jerusalém", "titulo": "Jesus entra em Jerusalém montado em um jumento", "mateus": {"referencia": "Mt 21.1-11", "texto": "1 E, quando se aproximaram de Jerusalém e chegaram a Betfagé, ao monte das Oliveiras, enviou, então, Jesus dois discípulos, dizendo-lhes: 2 Ide à aldeia que está defronte de vós e logo encontrareis uma jumenta presa e um jumentinho com ela; desprendei-a e trazei-mos. 3 E, se alguém vos disser alguma coisa, direis que o Senhor precisa deles; e logo os enviará. 4 Ora, tudo isso aconteceu para que se cumprisse o que foi dito pelo profeta, que diz: 5 Dizei à filha de Sião: Eis que o teu Rei aí te vem, humilde e assentado sobre uma jumenta e sobre um jumentinho, filho de animal de carga. 6 E, indo os discípulos e fazendo como Jesus lhes ordenara, 7 trouxeram a jumenta e o jumentinho, e sobre eles puseram as suas vestes, e fizeram-no assentar em cima. 8 E muitíssima gente estendia as suas vestes pelo caminho, e outros cortavam ramos de árvores e os espalhavam pelo caminho. 9 E as multidões, tanto as que iam adiante como as que o seguiam, clamavam, dizendo: Hosana ao Filho de Davi! Bendito o que vem em nome do Senhor! Hosana nas alturas! 10 E, entrando ele em Jerusalém, toda a cidade se alvoroçou, dizendo: Quem é este? 11 E a multidão dizia: Este é Jesus, o Profeta de Nazaré da Galileia."}, "marcos": {"referencia": "Mc 11.1-11", "texto": "1 E, logo que se aproximaram de Jerusalém, de Betfagé e de Betânia, junto ao monte das Oliveiras, enviou dois dos seus discípulos 2 e disse-lhes: Ide à aldeia que está defronte de vós; e, logo que ali entrardes, encontrareis preso um jumentinho, sobre o qual ainda não montou homem algum; soltai-o e trazei-mo. 3 E, se alguém vos disser: Por que fazeis isso?, dizei-lhe que o Senhor precisa dele, e logo o deixará trazer para aqui. 4 E foram, e encontraram o jumentinho preso fora da porta, entre dois caminhos, e o soltaram. 5 E alguns dos que ali estavam lhes disseram: Que fazeis, soltando o jumentinho? 6 Eles, porém, disseram-lhes como Jesus lhes tinha mandado; e os deixaram ir. 7 E levaram o jumentinho a Jesus e lançaram sobre ele as suas vestes, e assentou-se sobre ele. 8 E muitos estendiam as suas vestes pelo caminho, e outros cortavam ramos das árvores e os espalhavam pelo caminho. 9 E aqueles que iam adiante e os que seguiam clamavam, dizendo: Hosana! Bendito o que vem em nome do Senhor! 10 Bendito o Reino do nosso pai Davi, que vem em nome do Senhor! Hosana nas alturas! 11 E Jesus entrou em Jerusalém, no templo, e, tendo visto tudo ao redor, como fosse já tarde, saiu para Betânia, com os doze."}, "lucas": {"referencia": "Lc 19.28-40", "texto": "28 E, dito isso, ia caminhando adiante, subindo para Jerusalém. 29 E aconteceu que, chegando perto de Betfagé e de Betânia, ao monte chamado das Oliveiras, mandou dois dos seus discípulos, 30 dizendo: Ide à aldeia que está defronte e aí, ao entrardes, achareis preso um jumentinho em que nenhum homem ainda montou; soltai-o e trazei-o. 31 E, se alguém vos perguntar: Por que o soltais?, assim lhe direis: Porque o Senhor precisa dele. 32 E, indo os que haviam sido mandados, acharam como lhes dissera. 33 E, quando soltaram o jumentinho, seus donos lhes disseram: Por que soltais o jumentinho? 34 E eles responderam: O Senhor precisa dele. 35 E trouxeram-no a Jesus; e, lançando sobre o jumentinho as suas vestes, puseram Jesus em cima. 36 E, indo ele, estendiam no caminho as suas vestes. 37 E, quando já chegava perto da descida do monte das Oliveiras, toda a multidão dos discípulos, regozijando-se, começou a dar louvores a Deus em alta voz, por todas as maravilhas que tinham visto, 38 dizendo: Bendito o Rei que vem em nome do Senhor! Paz no céu e glória nas alturas! 39 E disseram-lhe dentre a multidão alguns dos fariseus: Mestre, repreende os teus discípulos. 40 E, respondendo ele, disse-lhes: Digo-vos que, se estes se calarem, as próprias pedras clamarão."}, "joao": {"referencia": "Jo 12.12-19", "texto": "12 No dia seguinte, ouvindo uma grande multidão que viera à festa que Jesus vinha a Jerusalém, 13 tomaram ramos de palmeiras, e saíram-lhe ao encontro, e clamavam: Hosana! Bendito o Rei de Israel que vem em nome do Senhor! 14 E achou Jesus um jumentinho e assentou-se sobre ele, como está escrito: 15 Não temas, ó filha de Sião! Eis que o teu Rei vem assentado sobre o filho de uma jumenta. 16 Os seus discípulos, porém, não entenderam isso no princípio; mas, quando Jesus foi glorificado, então, se lembraram de que isso estava escrito dele e que isso lhe fizeram. 17 A multidão, pois, que estava com ele quando Lázaro foi chamado da sepultura testificava que ele o ressuscitara dos mortos. 18 Pelo que a multidão lhe saiu ao encontro, porque tinham ouvido que ele fizera este sinal. 19 Disseram, pois, os fariseus entre si: Vedes que nada aproveitais? Eis que todos vão após ele."}}, {"id": 187, "ordem": 187, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "O Ministério de Jesus em Jerusalém", "titulo": "Jesus se entristece outra vez por Jerusalém", "mateus": null, "marcos": null, "lucas": {"referencia": "Lc 19.41-44", "texto": "41 E, quando ia chegando, vendo a cidade, chorou sobre ela, 42 dizendo: Ah! Se tu conhecesses também, ao menos neste teu dia, o que à tua paz pertence! Mas, agora, isso está encoberto aos teus olhos. 43 Porque dias virão sobre ti, em que os teus inimigos te cercarão de trincheiras, e te sitiarão, e te estreitarão de todas as bandas, 44 e te derribarão, a ti e a teus filhos que dentro de ti estiverem, e não deixarão em ti pedra sobre pedra, pois que não conheceste o tempo da tua visitação."}, "joao": null}, {"id": 188, "ordem": 188, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "O Ministério de Jesus em Jerusalém", "titulo": "Jesus limpa outra vez o Templo", "mateus": {"referencia": "Mt 21.12-17", "texto": "12 E entrou Jesus no templo de Deus, e expulsou todos os que vendiam e compravam no templo, e derribou as mesas dos cambistas e as cadeiras dos que vendiam pombas. 13 E disse-lhes: Está escrito: A minha casa será chamada casa de oração. Mas vós a tendes convertido em covil de ladrões. 14 E foram ter com ele ao templo cegos e coxos, e curou-os. 15 Vendo, então, os principais dos sacerdotes e os escribas as maravilhas que fazia e os meninos clamando no templo: Hosana ao Filho de Davi, indignaram-se 16 e disseram-lhe: Ouves o que estes dizem? E Jesus lhes disse: Sim; nunca lestes: Pela boca dos meninos e das criancinhas de peito tiraste o perfeito louvor? 17 E, deixando-os, saiu da cidade para Betânia e ali passou a noite."}, "marcos": {"referencia": "Mc 11.15-19", "texto": "15 E vieram a Jerusalém; e Jesus, entrando no templo, começou a expulsar os que vendiam e compravam no templo; e derribou as mesas dos cambistas e as cadeiras dos que vendiam pombas. 16 E não consentia que ninguém levasse algum vaso pelo templo. 17 E os ensinava, dizendo: Não está escrito: A minha casa será chamada por todas as nações casa de oração? Mas vós a tendes feito covil de ladrões. 18 E os escribas e príncipes dos sacerdotes, tendo ouvido isso, buscavam ocasião para o matar; pois eles o temiam porque toda a multidão estava admirada acerca da sua doutrina. 19 E, sendo já tarde, saiu para fora da cidade."}, "lucas": {"referencia": "Lc 19.45-48", "texto": "45 E, entrando no templo, começou a expulsar todos os que nele vendiam e compravam, 46 dizendo-lhes: Está escrito: A minha casa é casa de oração; mas vós fizestes dela covil de salteadores. 47 E todos os dias ensinava no templo; mas os principais dos sacerdotes, e os escribas, e os principais do povo procuravam matá-lo 48 e não achavam meio de o fazer, porque todo o povo pendia para ele, escutando-o."}, "joao": null}, {"id": 189, "ordem": 189, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "O Ministério de Jesus em Jerusalém", "titulo": "Jesus explica por que deve morrer", "mateus": null, "marcos": null, "lucas": null, "joao": {"referencia": "Jo 12.20-36", "texto": "20 Ora, havia alguns gregos entre os que tinham subido a adorar no dia da festa. 21 Estes, pois, dirigiram-se a Filipe, que era de Betsaida da Galileia, e rogaram-lhe, dizendo: Senhor, queríamos ver a Jesus. 22 Filipe foi dizê-lo a André, e, então, André e Filipe o disseram a Jesus. 23 E Jesus lhes respondeu, dizendo: É chegada a hora em que o Filho do Homem há de ser glorificado. 24 Na verdade, na verdade vos digo que, se o grão de trigo, caindo na terra, não morrer, fica ele só; mas, se morrer, dá muito fruto. 25 Quem ama a sua vida perdê-la-á, e quem, neste mundo, aborrece a sua vida, guardá-la-á para a vida eterna. 26 Se alguém me serve, siga-me; e, onde eu estiver, ali estará também o meu servo. E, se alguém me servir, meu Pai o honrará. 27 Agora, a minha alma está perturbada; e que direi eu? Pai, salva-me desta hora; mas para isso vim a esta hora. 28 Pai, glorifica o teu nome. Então, veio uma voz do céu que dizia: Já o tenho glorificado e outra vez o glorificarei. 29 Ora, a multidão que ali estava e que a tinha ouvido dizia que havia sido um trovão. Outros diziam: Um anjo lhe falou. 30 Respondeu Jesus e disse: Não veio esta voz por amor de mim, mas por amor de vós. 31 Agora, é o juízo deste mundo; agora, será expulso o príncipe deste mundo. 32 E eu, quando for levantado da terra, todos atrairei a mim. 33 E dizia isso significando de que morte havia de morrer. 34 Respondeu-lhe a multidão: Nós temos ouvido da lei que o Cristo permanece para sempre, e como dizes tu que convém que o Filho do Homem seja levantado? Quem é esse Filho do Homem? 35 Disse-lhes, pois, Jesus: A luz ainda está convosco por um pouco de tempo; andai enquanto tendes luz, para que as trevas vos não apanhem, pois quem anda nas trevas não sabe para onde vai. 36 Enquanto tendes luz, crede na luz, para que sejais filhos da luz. Essas coisas disse Jesus; e, retirando-se, escondeu-se deles."}}, {"id": 190, "ordem": 190, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "O Ministério de Jesus em Jerusalém", "titulo": "Muitas pessoas não creem em Jesus", "mateus": null, "marcos": null, "lucas": null, "joao": {"referencia": "Jo 12.37-43", "texto": "37 E, ainda que tivesse feito tantos sinais diante deles, não criam nele, 38 para que se cumprisse a palavra do profeta Isaías, que diz: Senhor, quem creu na nossa pregação? E a quem foi revelado o braço do Senhor? 39 Por isso, não podiam crer, pelo que Isaías disse outra vez: 40 Cegou-lhes os olhos e endureceu-lhes o coração, a fim de que não vejam com os olhos, e compreendam no coração, e se convertam, e eu os cure. 41 Isaías disse isso quando viu a sua glória e falou dele. 42 Apesar de tudo, até muitos dos principais creram nele; mas não o confessavam por causa dos fariseus, para não serem expulsos da sinagoga. 43 Porque amavam mais a glória dos homens do que a glória de Deus."}}, {"id": 191, "ordem": 191, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "O Ministério de Jesus em Jerusalém", "titulo": "Jesus resume sua mensagem", "mateus": null, "marcos": null, "lucas": null, "joao": {"referencia": "Jo 12.44-50", "texto": "44 E Jesus clamou e disse: Quem crê em mim crê não em mim, mas naquele que me enviou. 45 E quem me vê a mim vê aquele que me enviou. 46 Eu sou a luz que vim ao mundo, para que todo aquele que crê em mim não permaneça nas trevas. 47 E, se alguém ouvir as minhas palavras e não crer, eu não o julgo, porque eu vim não para julgar o mundo, mas para salvar o mundo. 48 Quem me rejeitar a mim e não receber as minhas palavras já tem quem o julgue; a palavra que tenho pregado, essa o há de julgar no último Dia. 49 Porque eu não tenho falado de mim mesmo, mas o Pai, que me enviou, ele me deu mandamento sobre o que hei de dizer e sobre o que hei de falar. 50 E sei que o seu mandamento é a vida eterna. Portanto, o que eu falo, falo-o como o Pai mo tem dito."}}, {"id": 192, "ordem": 192, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "O Ministério de Jesus em Jerusalém", "titulo": "Jesus amaldiçoa uma figueira", "mateus": {"referencia": "Mt 21.18-22", "texto": "18 E, de manhã, voltando para a cidade, teve fome. 19 E, avistando uma figueira perto do caminho, dirigiu-se a ela e não achou nela senão folhas. E disse-lhe: Nunca mais nasça fruto de ti. E a figueira secou imediatamente. 20 E os discípulos, vendo isso, maravilharam-se, dizendo: Como secou imediatamente a figueira? 21 Jesus, porém, respondendo, disse-lhes: Em verdade vos digo que, se tiverdes fé e não duvidardes, não só fareis o que foi feito à figueira, mas até, se a este monte disserdes: Ergue-te e precipita-te no mar, assim será feito. 22 E tudo o que pedirdes na oração, crendo, o recebereis."}, "marcos": {"referencia": "Mc 11.12-26", "texto": "12 E, no dia seguinte, quando saíram de Betânia, teve fome. 13 Vendo de longe uma figueira que tinha folhas, foi ver se nela acharia alguma coisa; e, chegando a ela, não achou senão folhas, porque não era tempo de figos. 14 E Jesus, falando, disse à figueira: Nunca mais coma alguém fruto de ti. E os seus discípulos ouviram isso. 15 E vieram a Jerusalém; e Jesus, entrando no templo, começou a expulsar os que vendiam e compravam no templo; e derribou as mesas dos cambistas e as cadeiras dos que vendiam pombas. 16 E não consentia que ninguém levasse algum vaso pelo templo. 17 E os ensinava, dizendo: Não está escrito: A minha casa será chamada por todas as nações casa de oração? Mas vós a tendes feito covil de ladrões. 18 E os escribas e príncipes dos sacerdotes, tendo ouvido isso, buscavam ocasião para o matar; pois eles o temiam porque toda a multidão estava admirada acerca da sua doutrina. 19 E, sendo já tarde, saiu para fora da cidade. 20 E eles, passando pela manhã, viram que a figueira se tinha secado desde as raízes. 21 E Pedro, lembrando-se, disse-lhe: Mestre, eis que a figueira que tu amaldiçoaste se secou. 22 E Jesus, respondendo, disse-lhes: Tende fé em Deus, 23 porque em verdade vos digo que qualquer que disser a este monte: Ergue-te e lança-te no mar, e não duvidar em seu coração, mas crer que se fará aquilo que diz, tudo o que disser lhe será feito. 24 Por isso, vos digo que tudo o que pedirdes, orando, crede que o recebereis e tê-lo-eis. 25 E, quando estiverdes orando, perdoai, se tendes alguma coisa contra alguém, para que vosso Pai, que está nos céus, vos perdoe as vossas ofensas. 26 Mas, se vós não perdoardes, também vosso Pai, que está nos céus, vos não perdoará as vossas ofensas."}, "lucas": null, "joao": null}, {"id": 193, "ordem": 193, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "O Ministério de Jesus em Jerusalém", "titulo": "Os líderes religiosos desafiam a autoridade de Jesus", "mateus": {"referencia": "Mt 21.23-27", "texto": "23 E, chegando ao templo, acercaram-se dele, estando já ensinando, os príncipes dos sacerdotes e os anciãos do povo, dizendo: Com que autoridade fazes isso? E quem te deu tal autoridade? 24 E Jesus, respondendo, disse-lhes: Eu também vos perguntarei uma coisa; se ma disserdes, também eu vos direi com que autoridade faço isso. 25 O batismo de João donde era? Do céu ou dos homens? E pensavam entre si, dizendo: Se dissermos: do céu, ele nos dirá: Então, por que não o crestes? 26 E, se dissermos: dos homens, tememos o povo, porque todos consideram João como profeta. 27 E, respondendo a Jesus, disseram: Não sabemos. Ele disse-lhes: Nem eu vos digo com que autoridade faço isso."}, "marcos": {"referencia": "Mc 11.27-33", "texto": "27 E tornaram a Jerusalém; e, andando ele pelo templo, os principais dos sacerdotes, e os escribas, e os anciãos se aproximaram dele 28 e lhe disseram: Com que autoridade fazes tu estas coisas? Ou quem te deu tal autoridade para fazer estas coisas? 29 Mas Jesus, respondendo, disse-lhes: Também eu vos perguntarei uma coisa, e respondei-me; e, então, vos direi com que autoridade faço estas coisas. 30 O batismo de João era do céu ou dos homens? Respondei-me. 31 E eles arrazoavam entre si, dizendo: Se dissermos: Do céu, ele nos dirá: Então, por que o não crestes? 32 Se, porém, dissermos: Dos homens, tememos o povo, porque todos sustentavam que João, verdadeiramente, era profeta. 33 E, respondendo, disseram a Jesus: Não sabemos. E Jesus lhes replicou: Também eu vos não direi com que autoridade faço estas coisas."}, "lucas": {"referencia": "Lc 20.1-8", "texto": "1 E aconteceu, num daqueles dias, que, estando ele ensinando o povo no templo e anunciando o evangelho, sobrevieram os principais dos sacerdotes e os escribas com os anciãos 2 e falaram-lhe, dizendo: Dize-nos: com que autoridade fazes essas coisas? Ou quem é que te deu esta autoridade? 3 E, respondendo ele, disse-lhes: Também eu vos farei uma pergunta: dizei-me, pois: 4 o batismo de João era do céu ou dos homens? 5 E eles arrazoavam entre si, dizendo: Se dissermos: do céu, ele nos dirá: Então, por que o não crestes? 6 E, se dissermos: dos homens, todo o povo nos apedrejará, pois têm por certo que João era profeta. 7 E responderam que não sabiam de onde era. 8 E Jesus lhes disse: Tampouco vos direi com que autoridade faço isto."}, "joao": null}, {"id": 194, "ordem": 194, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "O Ministério de Jesus em Jerusalém", "titulo": "Jesus conta a parábola dos dois filhos", "mateus": {"referencia": "Mt 21.28-32", "texto": "28 Mas que vos parece? Um homem tinha dois filhos e, dirigindo-se ao primeiro, disse: Filho, vai trabalhar hoje na minha vinha. 29 Ele, porém, respondendo, disse: Não quero. Mas, depois, arrependendo-se, foi. 30 E, dirigindo-se ao segundo, falou-lhe de igual modo; e, respondendo ele, disse: Eu vou, senhor; e não foi. 31 Qual dos dois fez a vontade do pai? Disseram-lhe eles: O primeiro. Disse-lhes Jesus: Em verdade vos digo que os publicanos e as meretrizes entram adiante de vós no Reino de Deus. 32 Porque João veio a vós no caminho de justiça, e não o crestes, mas os publicanos e as meretrizes o creram; vós, porém, vendo isso, nem depois vos arrependestes para o crer."}, "marcos": null, "lucas": null, "joao": null}, {"id": 195, "ordem": 195, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "O Ministério de Jesus em Jerusalém", "titulo": "Jesus conta a parábola dos lavradores perversos", "mateus": {"referencia": "Mt 21.33-46", "texto": "33 Ouvi, ainda, outra parábola: Houve um homem, pai de família, que plantou uma vinha, e circundou-a de um valado, e construiu nela um lagar, e edificou uma torre, e arrendou-a a uns lavradores, e ausentou-se para longe. 34 E, chegando o tempo dos frutos, enviou os seus servos aos lavradores, para receber os seus frutos. 35 E os lavradores, apoderando-se dos servos, feriram um, mataram outro e apedrejaram outro. 36 Depois, enviou outros servos, em maior número do que os primeiros; e eles fizeram-lhes o mesmo. 37 E, por último, enviou-lhes seu filho, dizendo: Terão respeito a meu filho. 38 Mas os lavradores, vendo o filho, disseram entre si: Este é o herdeiro; vinde, matemo-lo e apoderemo-nos da sua herança. 39 E, lançando mão dele, o arrastaram para fora da vinha e o mataram. 40 Quando, pois, vier o Senhor da vinha, que fará àqueles lavradores? 41 Dizem-lhe eles: Dará afrontosa morte aos maus e arrendará a vinha a outros lavradores, que, a seu tempo, lhe deem os frutos. 42 Diz-lhes Jesus: Nunca lestes nas Escrituras: A pedra que os edificadores rejeitaram, essa foi posta por cabeça do ângulo; pelo Senhor foi feito isso e é maravilhoso aos nossos olhos? 43 Portanto, eu vos digo que o Reino de Deus vos será tirado e será dado a uma nação que dê os seus frutos. 44 E quem cair sobre esta pedra despedaçar-se-á; e aquele sobre quem ela cair ficará reduzido a pó. 45 E os príncipes dos sacerdotes e os fariseus, ouvindo essas palavras, entenderam que falava deles; 46 e, pretendendo prendê-lo, recearam o povo, porquanto o tinham por profeta."}, "marcos": {"referencia": "Mc 12.1-12", "texto": "1 E começou a falar-lhes por parábolas: Um homem plantou uma vinha, e cercou-a de um valado, e fundou nela um lagar, e edificou uma torre, e arrendou-a a uns lavradores, e partiu para fora da terra. 2 E, chegado o tempo, mandou um servo aos lavradores para que recebesse, dos lavradores, do fruto da vinha. 3 Mas estes, apoderando-se dele, o feriram e o mandaram embora vazio. 4 E tornou a enviar-lhes outro servo; e eles, apedrejando-o, o feriram na cabeça e o mandaram embora, tendo-o afrontado. 5 E tornou a enviar-lhes outro, e a este mataram; e a outros muitos, dos quais a uns feriram e a outros mataram. 6 Tendo ele, pois, ainda um, seu filho amado, enviou-o também a estes por derradeiro, dizendo: Ao menos terão respeito ao meu filho. 7 Mas aqueles lavradores disseram entre si: Este é o herdeiro; vamos, matemo-lo, e a herança será nossa. 8 E, agarrando-o, o mataram e o lançaram fora da vinha. 9 Que fará, pois, o Senhor da vinha? Virá, e destruirá os lavradores, e dará a vinha a outros. 10 Ainda não lestes esta Escritura: A pedra que os edificadores rejeitaram, esta foi posta por cabeça da esquina; 11 isso foi feito pelo Senhor e é coisa maravilhosa aos nossos olhos? 12 E buscavam prendê-lo, mas temiam a multidão, porque entendiam que contra eles dizia esta parábola; e, deixando-o, foram-se."}, "lucas": {"referencia": "Lc 20.9-19", "texto": "9 E começou a dizer ao povo esta parábola: Certo homem plantou uma vinha, e arrendou-a a uns lavradores, e partiu para fora da terra por muito tempo. 10 E, no devido tempo, mandou um servo aos lavradores, para que lhe dessem dos frutos da vinha; mas os lavradores, espancando-o, mandaram-no vazio. 11 E tornou ainda a mandar outro servo; mas eles, espancando também a este e afrontando-o, mandaram-no vazio. 12 E tornou ainda a mandar um terceiro; mas eles, ferindo também a este, o expulsaram. 13 E disse o senhor da vinha: Que farei? Mandarei o meu filho amado; talvez, vendo-o, o respeitem. 14 Mas, vendo-o os lavradores, arrazoaram entre si dizendo: Este é o herdeiro; vinde, matemo-lo, para que a herança seja nossa. 15 E, lançando-o fora da vinha, o mataram. Que lhes fará, pois, o senhor da vinha? 16 Irá, e destruirá estes lavradores, e dará a outros a vinha. E, ouvindo eles isso, disseram: Não seja assim! 17 Mas ele, olhando para eles, disse: Que é isto, pois, que está escrito? A pedra que os edificadores reprovaram, essa foi feita cabeça da esquina. 18 Qualquer que cair sobre aquela pedra ficará em pedaços, e aquele sobre quem ela cair será feito em pó. 19 E os principais dos sacerdotes e os escribas procuravam lançar mão dele naquela mesma hora; mas temeram o povo, porque entenderam que contra eles dissera esta parábola."}, "joao": null}, {"id": 196, "ordem": 196, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "O Ministério de Jesus em Jerusalém", "titulo": "Jesus conta a parábola do jantar de casamento", "mateus": {"referencia": "Mt 22.1-14", "texto": "1 Então, Jesus, tomando a palavra, tornou a falar-lhes em parábolas, dizendo: 2 O Reino dos céus é semelhante a um certo rei que celebrou as bodas de seu filho. 3 E enviou os seus servos a chamar os convidados para as bodas; e estes não quiseram vir. 4 Depois, enviou outros servos, dizendo: Dizei aos convidados: Eis que tenho o meu jantar preparado, os meus bois e cevados já mortos, e tudo já pronto; vinde às bodas. 5 Porém eles, não fazendo caso, foram, um para o seu campo, e outro para o seu negócio; 6 e, os outros, apoderando-se dos servos, os ultrajaram e mataram. 7 E o rei, tendo notícias disso, encolerizou-se, e, enviando os seus exércitos, destruiu aqueles homicidas, e incendiou a sua cidade. 8 Então, disse aos servos: As bodas, na verdade, estão preparadas, mas os convidados não eram dignos. 9 Ide, pois, às saídas dos caminhos e convidai para as bodas a todos os que encontrardes. 10 E os servos, saindo pelos caminhos, ajuntaram todos quantos encontraram, tanto maus como bons; e a festa nupcial ficou cheia de convidados. 11 E o rei, entrando para ver os convidados, viu ali um homem que não estava trajado com veste nupcial. 12 E disse-lhe: Amigo, como entraste aqui, não tendo veste nupcial? E ele emudeceu. 13 Disse, então, o rei aos servos: Amarrai-o de pés e mãos, levai-o e lançai-o nas trevas exteriores; ali, haverá pranto e ranger de dentes. 14 Porque muitos são chamados, mas poucos, escolhidos."}, "marcos": null, "lucas": null, "joao": null}, {"id": 197, "ordem": 197, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "O Ministério de Jesus em Jerusalém", "titulo": "Os líderes religiosos questionam Jesus acerca do pagamento de impostos", "mateus": {"referencia": "Mt 22.15-22", "texto": "15 Então, retirando-se os fariseus, consultaram entre si como o surpreenderiam em alguma palavra. 16 E enviaram-lhe os seus discípulos, com os herodianos, dizendo: Mestre, bem sabemos que és verdadeiro e ensinas o caminho de Deus, segundo a verdade, sem te importares com quem quer que seja, porque não olhas à aparência dos homens. 17 Dize-nos, pois, que te parece: é lícito pagar o tributo a César ou não? 18 Jesus, porém, conhecendo a sua malícia, disse: Por que me experimentais, hipócritas? 19 Mostrai-me a moeda do tributo. E eles lhe apresentaram um dinheiro. 20 E ele disse-lhes: De quem é esta efígie e esta inscrição? 21 Disseram-lhe eles: De César. Então, ele lhes disse: Dai, pois, a César o que é de César e a Deus, o que é de Deus. 22 E eles, ouvindo isso, maravilharam-se e, deixando-o, se retiraram."}, "marcos": {"referencia": "Mc 12.13-17", "texto": "13 E enviaram-lhe alguns dos fariseus e dos herodianos, para que o apanhassem em alguma palavra. 14 E, chegando eles, disseram-lhe: Mestre, sabemos que és homem de verdade e não te importas com quem quer que seja, porque não olhas a aparência dos homens, antes, com verdade, ensinas o caminho de Deus. É lícito pagar tributo a César ou não? Pagaremos ou não pagaremos? 15 Então, ele, conhecendo a sua hipocrisia, disse-lhes: Por que me tentais? Trazei-me uma moeda, para que a veja. 16 E eles lha trouxeram. E disse-lhes: De quem é esta imagem e inscrição? E eles lhe disseram: De César. 17 E Jesus, respondendo, disse-lhes: Dai, pois, a César o que é de César e a Deus, o que é de Deus. E maravilharam-se dele."}, "lucas": {"referencia": "Lc 20.20-26", "texto": "20 E, trazendo-o debaixo de olho, mandaram espias que se fingiam de justos, para o apanharem em alguma palavra e o entregarem à jurisdição e poder do governador. 21 E perguntaram-lhe, dizendo: Mestre, nós sabemos que falas e ensinas bem e retamente e que não consideras a aparência da pessoa, mas ensinas com verdade o caminho de Deus. 22 É-nos lícito dar tributo a César ou não? 23 E, entendendo ele a sua astúcia, disse-lhes: Por que me tentais? 24 Mostrai-me uma moeda. De quem tem a imagem e a inscrição? E, respondendo eles, disseram: De César. 25 Disse-lhes, então: Dai, pois, a César o que é de César e a Deus, o que é de Deus. 26 E não puderam apanhá-lo em palavra alguma diante do povo; e, maravilhados da sua resposta, calaram-se."}, "joao": null}, {"id": 198, "ordem": 198, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "O Ministério de Jesus em Jerusalém", "titulo": "Os líderes religiosos questionam Jesus acerca da ressurreição", "mateus": {"referencia": "Mt 22.23-33", "texto": "23 No mesmo dia, chegaram junto dele os saduceus, que dizem não haver ressurreição, e o interrogaram, 24 dizendo: Mestre, Moisés disse: Se morrer alguém, não tendo filhos, casará o seu irmão com a mulher dele e suscitará descendência a seu irmão. 25 Ora, houve entre nós sete irmãos; o primeiro, tendo casado, morreu e, não tendo descendência, deixou sua mulher a seu irmão. 26 Da mesma sorte, o segundo, e o terceiro, até ao sétimo; 27 por fim, depois de todos, morreu também a mulher. 28 Portanto, na ressurreição, de qual dos sete será a mulher, visto que todos a possuíram? 29 Jesus, porém, respondendo, disse-lhes: Errais, não conhecendo as Escrituras, nem o poder de Deus. 30 Porque, na ressurreição, nem casam, nem são dados em casamento; mas serão como os anjos no céu. 31 E, acerca da ressurreição dos mortos, não tendes lido o que Deus vos declarou, dizendo: 32 Eu sou o Deus de Abraão, o Deus de Isaque e o Deus de Jacó? Ora, Deus não é Deus dos mortos, mas dos vivos. 33 E, as turbas, ouvindo isso, ficaram maravilhadas da sua doutrina."}, "marcos": {"referencia": "Mc 12.18-27", "texto": "18 Então, os saduceus, que dizem que não há ressurreição, aproximaram-se dele e perguntaram-lhe, dizendo: 19 Mestre, Moisés nos escreveu que, se morresse o irmão de alguém, e deixasse mulher, e não deixasse filhos, seu irmão tomasse a mulher dele e suscitasse descendência a seu irmão. 20 Ora, havia sete irmãos, e o primeiro tomou mulher e morreu sem deixar descendência; 21 e o segundo também a tomou, e morreu, e nem este deixou descendência; e o terceiro, da mesma maneira. 22 E tomaram-na os sete, sem, contudo, terem deixado descendência. Finalmente, depois de todos, morreu também a mulher. 23 Na ressurreição, pois, quando ressuscitarem, de qual destes será a mulher? Porque os sete a tiveram por mulher. 24 E Jesus, respondendo, disse-lhes: Porventura, não errais vós em razão de não saberdes as Escrituras nem o poder de Deus? 25 Porquanto, quando ressuscitarem dos mortos, nem casarão, nem se darão em casamento, mas serão como os anjos nos céus. 26 E, acerca dos mortos que houverem de ressuscitar, não tendes lido no livro de Moisés como Deus lhe falou na sarça, dizendo: Eu sou o Deus de Abraão, e o Deus de Isaque, e o Deus de Jacó? 27 Ora, Deus não é de mortos, mas sim é Deus de vivos. Por isso, vós errais muito."}, "lucas": {"referencia": "Lc 20.27-40", "texto": "27 E, chegando-se alguns dos saduceus, que dizem não haver ressurreição, perguntaram-lhe, 28 dizendo: Mestre, Moisés nos deixou escrito que, se o irmão de alguém falecer, tendo mulher e não deixar filhos, o irmão dele tome a mulher e suscite posteridade a seu irmão. 29 Houve, pois, sete irmãos, e o primeiro tomou mulher e morreu sem filhos; 30 e o segundo 31 e o terceiro também a tomaram, e, igualmente, os sete. Todos eles morreram e não deixaram filhos. 32 E, por último, depois de todos, morreu também a mulher. 33 Portanto, na ressurreição, de qual deles será a mulher, pois que os sete por mulher a tiveram? 34 E, respondendo Jesus, disse-lhes: Os filhos deste mundo casam-se e dão-se em casamento, 35 mas os que forem havidos por dignos de alcançar o mundo vindouro e a ressurreição dos mortos nem hão de casar, nem ser dados em casamento; 36 porque já não podem mais morrer, pois são iguais aos anjos e são filhos de Deus, sendo filhos da ressurreição. 37 E que os mortos hão de ressuscitar também o mostrou Moisés junto da sarça, quando chama ao Senhor Deus de Abraão, e Deus de Isaque, e Deus de Jacó. 38 Ora, Deus não é Deus de mortos, mas de vivos, porque para ele vivem todos. 39 E, respondendo alguns dos escribas, disseram: Mestre, disseste bem. 40 E não ousavam perguntar-lhe mais coisa alguma."}, "joao": null}, {"id": 199, "ordem": 199, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "O Ministério de Jesus em Jerusalém", "titulo": "Os líderes religiosos questionam Jesus acerca do maior mandamento", "mateus": {"referencia": "Mt 22.34-40", "texto": "34 E os fariseus, ouvindo que ele fizera emudecer os saduceus, reuniram-se no mesmo lugar. 35 E um deles, doutor da lei, interrogou-o para o experimentar, dizendo: 36 Mestre, qual é o grande mandamento da lei? 37 E Jesus disse-lhe: Amarás o Senhor, teu Deus, de todo o teu coração, e de toda a tua alma, e de todo o teu pensamento. 38 Este é o primeiro e grande mandamento. 39 E o segundo, semelhante a este, é: Amarás o teu próximo como a ti mesmo. 40 Desses dois mandamentos dependem toda a lei e os profetas."}, "marcos": {"referencia": "Mc 12.28-34", "texto": "28 Aproximou-se dele um dos escribas que os tinha ouvido disputar e, sabendo que lhes tinha respondido bem, perguntou-lhe: Qual é o primeiro de todos os mandamentos? 29 E Jesus respondeu-lhe: O primeiro de todos os mandamentos é: Ouve, Israel, o Senhor, nosso Deus, é o único Senhor. 30 Amarás, pois, ao Senhor, teu Deus, de todo o teu coração, e de toda a tua alma, e de todo o teu entendimento, e de todas as tuas forças; este é o primeiro mandamento. 31 E o segundo, semelhante a este, é: Amarás o teu próximo como a ti mesmo. Não há outro mandamento maior do que estes. 32 E o escriba lhe disse: Muito bem, Mestre, e com verdade disseste que há um só Deus e que não há outro além dele; 33 e que amá-lo de todo o coração, e de todo o entendimento, e de toda a alma, e de todas as forças e amar o próximo como a si mesmo é mais do que todos os holocaustos e sacrifícios. 34 E Jesus, vendo que havia respondido sabiamente, disse-lhe: Não estás longe do Reino de Deus. E já ninguém ousava perguntar-lhe mais nada."}, "lucas": null, "joao": null}, {"id": 200, "ordem": 200, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "O Ministério de Jesus em Jerusalém", "titulo": "Os líderes religiosos não conseguem responder à pergunta de Jesus", "mateus": {"referencia": "Mt 22.41-46", "texto": "41 E, estando reunidos os fariseus, interrogou-os Jesus, 42 dizendo: Que pensais vós do Cristo? De quem é filho? Eles disseram-lhe: De Davi. 43 Disse-lhes ele: Como é, então, que Davi, em espírito, lhe chama Senhor, dizendo: 44 Disse o Senhor ao meu Senhor: Assenta-te à minha direita, até que eu ponha os teus inimigos por escabelo de teus pés. 45 Se Davi, pois, lhe chama Senhor, como é seu filho? 46 E ninguém podia responder-lhe uma palavra, nem, desde aquele dia, ousou mais alguém interrogá-lo."}, "marcos": {"referencia": "Mc 12.35-37", "texto": "35 E, falando Jesus, dizia, ensinando no templo: Como dizem os escribas que o Cristo é Filho de Davi? 36 O próprio Davi disse pelo Espírito Santo: O Senhor disse ao meu Senhor: Assenta-te à minha direita, até que eu ponha os teus inimigos por escabelo dos teus pés. 37 Pois, se Davi mesmo lhe chama Senhor, como é logo seu filho? E a grande multidão o ouvia de boa vontade."}, "lucas": {"referencia": "Lc 20.41-44", "texto": "41 E ele lhes disse: Como dizem que o Cristo é Filho de Davi? 42 Visto como o mesmo Davi diz no livro dos Salmos: Disse o SENHOR ao meu Senhor: Assenta-te à minha direita, 43 até que eu ponha os teus inimigos por escabelo de teus pés. 44 Se Davi lhe chama Senhor, como é ele seu filho?"}, "joao": null}, {"id": 201, "ordem": 201, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "O Ministério de Jesus em Jerusalém", "titulo": "Jesus adverte contra os líderes religiosos", "mateus": {"referencia": "Mt 23.1-12", "texto": "1 Então, falou Jesus à multidão e aos seus discípulos, 2 dizendo: Na cadeira de Moisés, estão assentados os escribas e fariseus. 3 Observai, pois, e praticai tudo o que vos disserem; mas não procedais em conformidade com as suas obras, porque dizem e não praticam. 4 Pois atam fardos pesados e difíceis de suportar, e os põem sobre os ombros dos homens; eles, porém, nem com o dedo querem movê-los. 5 E fazem todas as obras a fim de serem vistos pelos homens, pois trazem largos filactérios, e alargam as franjas das suas vestes, 6 e amam os primeiros lugares nas ceias, e as primeiras cadeiras nas sinagogas, 7 e as saudações nas praças, e o serem chamados pelos homens: — Rabi, Rabi. 8 Vós, porém, não queirais ser chamados Rabi, porque um só é o vosso Mestre, a saber, o Cristo, e todos vós sois irmãos. 9 E a ninguém na terra chameis vosso pai, porque um só é o vosso Pai, o qual está nos céus. 10 Nem vos chameis mestres, porque um só é o vosso Mestre, que é o Cristo. 11 Porém o maior dentre vós será vosso servo. 12 E o que a si mesmo se exaltar será humilhado; e o que a si mesmo se humilhar será exaltado."}, "marcos": {"referencia": "Mc 12.38-40", "texto": "38 E, ensinando-os, dizia-lhes: Guardai-vos dos escribas, que gostam de andar com vestes compridas, e das saudações nas praças, 39 e das primeiras cadeiras nas sinagogas, e dos primeiros assentos nas ceias; 40 que devoram as casas das viúvas e isso, com pretexto de largas orações. Estes receberão mais grave condenação."}, "lucas": {"referencia": "Lc 20.45-47", "texto": "45 E, ouvindo-o todo o povo, disse Jesus aos seus discípulos: 46 Guardai-vos dos escribas, que querem andar com vestes compridas e amam as saudações nas praças, e as principais cadeiras nas sinagogas, e os primeiros lugares nos banquetes; 47 que devoram as casas das viúvas, fazendo, por pretexto, largas orações. Estes receberão maior condenação."}, "joao": null}, {"id": 202, "ordem": 202, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "O Ministério de Jesus em Jerusalém", "titulo": "Jesus condena os líderes religiosos", "mateus": {"referencia": "Mt 23.13-36", "texto": "13 Mas ai de vós, escribas e fariseus, hipócritas! Pois que fechais aos homens o Reino dos céus; e nem vós entrais, nem deixais entrar aos que estão entrando. 14 Ai de vós, escribas e fariseus, hipócritas! Pois que devorais as casas das viúvas, sob pretexto de prolongadas orações; por isso, sofrereis mais rigoroso juízo. 15 Ai de vós, escribas e fariseus, hipócritas! Pois que percorreis o mar e a terra para fazer um prosélito; e, depois de o terdes feito, o fazeis filho do inferno duas vezes mais do que vós. 16 Ai de vós, condutores cegos! Pois que dizeis: Qualquer que jurar pelo templo, isso nada é; mas o que jurar pelo ouro do templo, esse é devedor. 17 Insensatos e cegos! Pois qual é maior: o ouro ou o templo, que santifica o ouro? 18 E aquele que jurar pelo altar, isso nada é; mas aquele que jurar pela oferta que está sobre o altar, esse é devedor. 19 Insensatos e cegos! Pois qual é maior: a oferta ou o altar, que santifica a oferta? 20 Portanto, o que jurar pelo altar jura por ele e por tudo o que sobre ele está. 21 E o que jurar pelo templo jura por ele e por aquele que nele habita. 22 E o que jurar pelo céu jura pelo trono de Deus e por aquele que está assentado nele. 23 Ai de vós, escribas e fariseus, hipócritas! Pois que dais o dízimo da hortelã, do endro e do cominho e desprezais o mais importante da lei, o juízo, a misericórdia e a fé; deveis, porém, fazer essas coisas e não omitir aquelas. 24 Condutores cegos! Coais um mosquito e engolis um camelo. 25 Ai de vós, escribas e fariseus, hipócritas! Pois que limpais o exterior do copo e do prato, mas o interior está cheio de rapina e de iniquidade. 26 Fariseu cego! Limpa primeiro o interior do copo e do prato, para que também o exterior fique limpo. 27 Ai de vós, escribas e fariseus, hipócritas! Pois que sois semelhantes aos sepulcros caiados, que por fora realmente parecem formosos, mas interiormente estão cheios de ossos de mortos e de toda imundícia. 28 Assim, também vós exteriormente pareceis justos aos homens, mas interiormente estais cheios de hipocrisia e de iniquidade. 29 Ai de vós, escribas e fariseus, hipócritas! Pois que edificais os sepulcros dos profetas e adornais os monumentos dos justos 30 e dizeis: Se existíssemos no tempo de nossos pais, nunca nos associaríamos com eles para derramar o sangue dos profetas. 31 Assim, vós mesmos testificais que sois filhos dos que mataram os profetas. 32 Enchei vós, pois, a medida de vossos pais. 33 Serpentes, raça de víboras! Como escapareis da condenação do inferno? 34 Portanto, eis que eu vos envio profetas, sábios e escribas; e a uns deles matareis e crucificareis; e a outros deles açoitareis nas vossas sinagogas e os perseguireis de cidade em cidade, 35 para que sobre vós caia todo o sangue justo, que foi derramado sobre a terra, desde o sangue de Abel, o justo, até ao sangue de Zacarias, filho de Baraquias, que matastes entre o santuário e o altar. 36 Em verdade vos digo que todas essas coisas hão de vir sobre esta geração."}, "marcos": null, "lucas": null, "joao": null}, {"id": 203, "ordem": 203, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "O Ministério de Jesus em Jerusalém", "titulo": "Uma viúva pobre oferta tudo o que tem", "mateus": null, "marcos": {"referencia": "Mc 12.41-44", "texto": "41 E, estando Jesus assentado defronte da arca do tesouro, observava a maneira como a multidão lançava o dinheiro na arca do tesouro; e muitos ricos depositavam muito. 42 Vindo, porém, uma pobre viúva, depositou duas pequenas moedas, que valiam cinco réis. 43 E, chamando os seus discípulos, disse-lhes: Em verdade vos digo que esta pobre viúva depositou mais do que todos os que depositaram na arca do tesouro; 44 porque todos ali depositaram do que lhes sobejava, mas esta, da sua pobreza, depositou tudo o que tinha, todo o seu sustento."}, "lucas": {"referencia": "Lc 21.1-4", "texto": "1 E, olhando ele, viu os ricos lançarem as suas ofertas na arca do tesouro; 2 e viu também uma pobre viúva lançar ali duas pequenas moedas; 3 e disse: Em verdade vos digo que lançou mais do que todos esta pobre viúva, 4 porque todos aqueles deram como ofertas de Deus do que lhes sobeja; mas esta, da sua pobreza, deu todo o sustento que tinha."}, "joao": null}, {"id": 204, "ordem": 204, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "O Ministério de Jesus em Jerusalém", "titulo": "Jesus ensina sobre estar vigilante quanto a sua volta", "mateus": {"referencia": "Mt 24.1-51", "texto": "1 E, quando Jesus ia saindo do templo, aproximaram-se dele os seus discípulos para lhe mostrarem a estrutura do templo. 2 Jesus, porém, lhes disse: Não vedes tudo isto? Em verdade vos digo que não ficará aqui pedra sobre pedra que não seja derribada. 3 E, estando assentado no monte das Oliveiras, chegaram-se a ele os seus discípulos, em particular, dizendo: Dize-nos quando serão essas coisas e que sinal haverá da tua vinda e do fim do mundo? 4 E Jesus, respondendo, disse-lhes: Acautelai-vos, que ninguém vos engane, 5 porque muitos virão em meu nome, dizendo: Eu sou o Cristo; e enganarão a muitos. 6 E ouvireis de guerras e de rumores de guerras; olhai, não vos assusteis, porque é mister que isso tudo aconteça, mas ainda não é o fim. 7 Porquanto se levantará nação contra nação, e reino contra reino, e haverá fomes, e pestes, e terremotos, em vários lugares. 8 Mas todas essas coisas são o princípio das dores. 9 Então, vos hão de entregar para serdes atormentados e matar-vos-ão; e sereis odiados de todas as gentes por causa do meu nome. 10 Nesse tempo, muitos serão escandalizados, e trair-se-ão uns aos outros, e uns aos outros se aborrecerão. 11 E surgirão muitos falsos profetas e enganarão a muitos. 12 E, por se multiplicar a iniquidade, o amor de muitos se esfriará. 13 Mas aquele que perseverar até ao fim será salvo. 14 E este evangelho do Reino será pregado em todo o mundo, em testemunho a todas as gentes, e então virá o fim. 15 Quando, pois, virdes que a abominação da desolação, de que falou o profeta Daniel, está no lugar santo (quem lê, que entenda), 16 então, os que estiverem na Judeia, que fujam para os montes; 17 e quem estiver sobre o telhado não desça a tirar alguma coisa de sua casa; 18 e quem estiver no campo não volte atrás a buscar as suas vestes. 19 Mas ai das grávidas e das que amamentarem naqueles dias! 20 E orai para que a vossa fuga não aconteça no inverno nem no sábado, 21 porque haverá, então, grande aflição, como nunca houve desde o princípio do mundo até agora, nem tampouco haverá jamais. 22 E, se aqueles dias não fossem abreviados, nenhuma carne se salvaria; mas, por causa dos escolhidos, serão abreviados aqueles dias. 23 Então, se alguém vos disser: Eis que o Cristo está aqui ou ali, não lhe deis crédito, 24 porque surgirão falsos cristos e falsos profetas e farão tão grandes sinais e prodígios, que, se possível fora, enganariam até os escolhidos. 25 Eis que eu vo-lo tenho predito. 26 Portanto, se vos disserem: Eis que ele está no deserto, não saiais; ou: Eis que ele está no interior da casa, não acrediteis. 27 Porque, assim como o relâmpago sai do oriente e se mostra até ao ocidente, assim será também a vinda do Filho do Homem. 28 Pois onde estiver o cadáver, aí se ajuntarão as águias. 29 E, logo depois da aflição daqueles dias, o sol escurecerá, e a lua não dará a sua luz, e as estrelas cairão do céu, e as potências dos céus serão abaladas. 30 Então, aparecerá no céu o sinal do Filho do Homem; e todas as tribos da terra se lamentarão e verão o Filho do Homem vindo sobre as nuvens do céu, com poder e grande glória. 31 E ele enviará os seus anjos com rijo clamor de trombeta, os quais ajuntarão os seus escolhidos desde os quatro ventos, de uma à outra extremidade dos céus. 32 Aprendei, pois, esta parábola da figueira: quando já os seus ramos se tornam tenros e brotam folhas, sabeis que está próximo o verão. 33 Igualmente, quando virdes todas essas coisas, sabei que ele está próximo, às portas. 34 Em verdade vos digo que não passará esta geração sem que todas essas coisas aconteçam. 35 O céu e a terra passarão, mas as minhas palavras não hão de passar. 36 Porém daquele Dia e hora ninguém sabe, nem os anjos dos céus, nem o Filho, mas unicamente meu Pai. 37 E, como foi nos dias de Noé, assim será também a vinda do Filho do Homem. 38 Porquanto, assim como, nos dias anteriores ao dilúvio, comiam, bebiam, casavam e davam-se em casamento, até ao dia em que Noé entrou na arca, 39 e não o perceberam, até que veio o dilúvio, e os levou a todos, assim será também a vinda do Filho do Homem. 40 Então, estando dois no campo, será levado um, e deixado o outro; 41 Estando duas moendo no moinho, será levada uma, e deixada outra. 42 Vigiai, pois, porque não sabeis a que hora há de vir o vosso Senhor. 43 Mas considerai isto: se o pai de família soubesse a que vigília da noite havia de vir o ladrão, vigiaria e não deixaria que fosse arrombada a sua casa. 44 Por isso, estai vós apercebidos também, porque o Filho do Homem há de vir à hora em que não penseis. 45 Quem é, pois, o servo fiel e prudente, que o Senhor constituiu sobre a sua casa, para dar o sustento a seu tempo? 46 Bem-aventurado aquele servo que o Senhor, quando vier, achar servindo assim. 47 Em verdade vos digo que o porá sobre todos os seus bens. 48 Porém, se aquele mau servo disser consigo: O meu senhor tarde virá, 49 e começar a espancar os seus conservos, e a comer, e a beber com os bêbados, 50 virá o senhor daquele servo num dia em que o não espera e à hora em que ele não sabe, 51 e separá-lo-á, e destinará a sua parte com os hipócritas; ali haverá pranto e ranger de dentes."}, "marcos": {"referencia": "Mc 13.1-37", "texto": "1 E, saindo ele do templo, disse-lhe um dos seus discípulos: Mestre, olha que pedras e que edifícios! 2 E, respondendo Jesus, disse-lhe: Vês estes grandes edifícios? Não ficará pedra sobre pedra que não seja derribada. 3 E, assentando-se ele no monte das Oliveiras, defronte do templo, Pedro, e Tiago, e João, e André lhe perguntaram em particular: 4 Dize-nos quando serão essas coisas e que sinal haverá quando todas elas estiverem para se cumprir. 5 E Jesus, respondendo-lhes, começou a dizer: Olhai que ninguém vos engane, 6 porque muitos virão em meu nome, dizendo: Eu sou o Cristo; e enganarão a muitos. 7 E, quando ouvirdes de guerras e de rumores de guerras, não vos perturbeis, porque assim deve acontecer; mas ainda não será o fim. 8 Porque se levantará nação contra nação, e reino, contra reino, e haverá terremotos em diversos lugares, e haverá fomes. Isso será o princípio de dores. 9 Mas olhai por vós mesmos, porque vos entregarão aos concílios e às sinagogas; sereis açoitados e sereis apresentados ante governadores e reis, por amor de mim, para lhes servir de testemunho. 10 Mas importa que o evangelho seja primeiramente pregado entre todas as nações: 11 Quando, pois, vos conduzirem para vos entregarem, não estejais solícitos de antemão pelo que haveis de dizer; mas o que vos for dado naquela hora, isso falai; porque não sois vós os que falais, mas o Espírito Santo. 12 E o irmão entregará à morte o irmão, e o pai, o filho; e levantar-se-ão os filhos contra os pais e os farão morrer. 13 E sereis aborrecidos por todos por amor do meu nome; mas quem perseverar até ao fim, esse será salvo. 14 Ora, quando vós virdes a abominação do assolamento, que foi predito, estar onde não deve estar (quem lê, que entenda), então, os que estiverem na Judeia, que fujam para os montes; 15 e o que estiver sobre o telhado, que não desça para casa, nem entre a tomar coisa alguma de sua casa; 16 e o que estiver no campo, que não volte atrás, para tomar a sua veste. 17 Mas ai das grávidas e das que criarem naqueles dias! 18 Orai, pois, para que a vossa fuga não suceda no inverno, 19 porque, naqueles dias, haverá uma aflição tal, qual nunca houve desde o princípio da criação, que Deus criou, até agora, nem jamais haverá. 20 E, se o Senhor não abreviasse aqueles dias, nenhuma carne se salvaria; mas, por causa dos escolhidos que escolheu, abreviou aqueles dias. 21 E, então, se alguém vos disser: Eis aqui o Cristo, ou: Ei-lo ali, não acrediteis. 22 Porque se levantarão falsos cristos e falsos profetas e farão sinais e prodígios, para enganarem, se for possível, até os escolhidos. 23 Mas vós vede; eis que de antemão vos tenho dito tudo. 24 Ora, naqueles dias, depois daquela aflição, o sol se escurecerá, e a lua não dará a sua luz. 25 E as estrelas cairão do céu, e as forças que estão nos céus serão abaladas. 26 E, então, verão vir o Filho do Homem nas nuvens, com grande poder e glória. 27 E ele enviará os seus anjos e ajuntará os seus escolhidos, desde os quatro ventos, da extremidade da terra até a extremidade do céu. 28 Aprendei, pois, a parábola da figueira: quando já o seu ramo se torna tenro, e brotam folhas, bem sabeis que já está próximo o verão. 29 Assim também vós, quando virdes sucederem essas coisas, sabei que já está perto, às portas. 30 Na verdade vos digo que não passará esta geração sem que todas essas coisas aconteçam. 31 Passará o céu e a terra, mas as minhas palavras não passarão. 32 Mas, daquele Dia e hora, ninguém sabe, nem os anjos que estão no céu, nem o Filho, senão o Pai. 33 Olhai, vigiai e orai, porque não sabeis quando chegará o tempo. 34 É como se um homem, partindo para fora da terra, deixasse a sua casa, e desse autoridade aos seus servos, e a cada um, a sua obra, e mandasse ao porteiro que vigiasse. 35 Vigiai, pois, porque não sabeis quando virá o senhor da casa; se à tarde, se à meia-noite, se ao cantar do galo, se pela manhã, 36 para que, vindo de improviso, não vos ache dormindo. 37 E as coisas que vos digo digo-as a todos: Vigiai."}, "lucas": {"referencia": "Lc 21.5-38", "texto": "5 E, dizendo alguns a respeito do templo, que estava ornado de formosas pedras e dádivas, disse: 6 Quanto a estas coisas que vedes, dias virão em que se não deixará pedra sobre pedra que não seja derribada. 7 E perguntaram-lhe, dizendo: Mestre, quando serão, pois, essas coisas? E que sinal haverá quando isso estiver para acontecer? 8 Disse, então, ele: Vede que não vos enganem, porque virão muitos em meu nome, dizendo: Sou eu, e o tempo está próximo; não vades, portanto, após eles. 9 E, quando ouvirdes de guerras e sedições, não vos assusteis. Porque é necessário que isso aconteça primeiro, mas o fim não será logo. 10 Então, lhes disse: Levantar-se-á nação contra nação, e reino, contra reino; 11 e haverá, em vários lugares, grandes terremotos, e fomes, e pestilências; haverá também coisas espantosas e grandes sinais do céu. 12 Mas, antes de todas essas coisas, lançarão mão de vós e vos perseguirão, entregando-vos às sinagogas e às prisões e conduzindo-vos à presença de reis e governadores, por amor do meu nome. 13 E vos acontecerá isso para testemunho. 14 Proponde, pois, em vosso coração não premeditar como haveis de responder, 15 porque eu vos darei boca e sabedoria a que não poderão resistir, nem contradizer todos quantos se vos opuserem. 16 E até pelos pais, e irmãos, e parentes, e amigos sereis entregues; e matarão alguns de vós. 17 E de todos sereis odiados por causa do meu nome. 18 Mas não perecerá um único cabelo da vossa cabeça. 19 Na vossa paciência, possuí a vossa alma. 20 Mas, quando virdes Jerusalém cercada de exércitos, sabei, então, que é chegada a sua desolação. 21 Então, os que estiverem na Judeia, que fujam para os montes; os que estiverem no meio da cidade, que saiam; e, os que estiverem nos campos, que não entrem nela. 22 Porque dias de vingança são estes, para que se cumpram todas as coisas que estão escritas. 23 Mas ai das grávidas e das que criarem naqueles dias! Porque haverá grande aflição na terra e ira sobre este povo. 24 E cairão a fio de espada e para todas as nações serão levados cativos; e Jerusalém será pisada pelos gentios, até que os tempos dos gentios se completem. 25 E haverá sinais no sol, e na lua, e nas estrelas, e, na terra, angústia das nações, em perplexidade pelo bramido do mar e das ondas; 26 homens desmaiando de terror, na expectação das coisas que sobrevirão ao mundo, porquanto os poderes do céu serão abalados. 27 E, então, verão vir o Filho do Homem numa nuvem, com poder e grande glória. 28 Ora, quando essas coisas começarem a acontecer, olhai para cima e levantai a vossa cabeça, porque a vossa redenção está próxima. 29 E disse-lhes uma parábola: Olhai para a figueira e para todas as árvores. 30 Quando já começam a brotar, vós sabeis por vós mesmos, vendo-as, que perto está já o verão. 31 Assim também vós, quando virdes acontecer essas coisas, sabei que o Reino de Deus está perto. 32 Em verdade vos digo que não passará esta geração até que tudo aconteça. 33 Passará o céu e a terra, mas as minhas palavras não hão de passar. 34 E olhai por vós, para que não aconteça que o vosso coração se carregue de glutonaria, de embriaguez, e dos cuidados da vida, e venha sobre vós de improviso aquele dia. 35 Porque virá como um laço sobre todos os que habitam na face de toda a terra. 36 Vigiai, pois, em todo o tempo, orando, para que sejais havidos por dignos de evitar todas essas coisas que hão de acontecer e de estar em pé diante do Filho do Homem. 37 E, de dia, ensinava no templo e, à noite, saindo, ficava no monte chamado das Oliveiras. 38 E todo o povo ia ter com ele ao templo, de manhã cedo, para o ouvir."}, "joao": null}, {"id": 205, "ordem": 205, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "O Ministério de Jesus em Jerusalém", "titulo": "Jesus conta a parábola das dez virgens", "mateus": {"referencia": "Mt 25.1-13", "texto": "1 Então, o Reino dos céus será semelhante a dez virgens que, tomando as suas lâmpadas, saíram ao encontro do esposo. 2 E cinco delas eram prudentes, e cinco, loucas. 3 As loucas, tomando as suas lâmpadas, não levaram azeite consigo. 4 Mas as prudentes levaram azeite em suas vasilhas, com as suas lâmpadas. 5 E, tardando o esposo, tosquenejaram todas e adormeceram. 6 Mas, à meia-noite, ouviu-se um clamor: Aí vem o esposo! Saí-lhe ao encontro! 7 Então, todas aquelas virgens se levantaram e prepararam as suas lâmpadas. 8 E as loucas disseram às prudentes: Dai-nos do vosso azeite, porque as nossas lâmpadas se apagam. 9 Mas as prudentes responderam, dizendo: Não seja caso que nos falte a nós e a vós; ide, antes, aos que o vendem e comprai-o para vós. 10 E, tendo elas ido comprá-lo, chegou o esposo, e as que estavam preparadas entraram com ele para as bodas, e fechou-se a porta. 11 E, depois, chegaram também as outras virgens, dizendo: Senhor, senhor, abre-nos a porta! 12 E ele, respondendo, disse: Em verdade vos digo que vos não conheço. 13 Vigiai, pois, porque não sabeis o Dia nem a hora em que o Filho do Homem há de vir."}, "marcos": null, "lucas": null, "joao": null}, {"id": 206, "ordem": 206, "secao": "B.
