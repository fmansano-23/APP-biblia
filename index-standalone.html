<!DOCTYPE html>
<html lang="pt-BR" class="tema-escuro fonte-media esp-normal">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Os quatro Evangelhos em ordem cronológica — leia a vida de Cristo como uma narrativa contínua." />
  <meta name="theme-color" content="#0f0f0f" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f5f3ef" media="(prefers-color-scheme: light)" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Evangelhos" />

  <title>Evangelhos Cronológicos</title>

  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./assets/icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png" />

  <style>
/* ─── Evangelhos Cronológicos — style.css ─────────────────────────────────── */
/* Versão 1.1 | Mobile-first | Sem dependências externas                       */

/* ─── Variáveis de design ───────────────────────────────────────────────────── */
:root {
  /* Paleta escura (padrão) */
  --bg:          #111111;
  --bg-card:     #1a1a1a;
  --bg-elevated: #222222;
  --bg-input:    #1e1e1e;
  --border:      #2a2a2a;
  --border-subtle: #222222;

  --text-primary:   #e8e6e0;
  --text-secondary: #8a8580;
  --text-muted:     #555050;
  --text-accent:    #c9b077;

  --accent:       #c9b077;
  --accent-dim:   #6b5a30;
  --progress-fill: #c9b077;
  --progress-bg:  #2a2a2a;

  --dot-present: #c9b077;
  --dot-absent:  #333333;

  --status-none:    #444;
  --status-reading: #8ab4c9;
  --status-done:    #7ab87a;

  --shadow: 0 1px 4px rgba(0,0,0,0.4);
  --radius: 10px;
  --radius-sm: 6px;

  /* Tipografia */
  --font-sans:  'Inter', system-ui, -apple-system, sans-serif;
  --font-serif: 'Georgia', 'Times New Roman', serif;
  --font-body:  var(--font-sans);

  --size-xs:   12px;
  --size-sm:   14px;
  --size-base: 16px;
  --size-lg:   18px;
  --size-xl:   20px;
  --size-2xl:  24px;

  --line-normal:  1.5;
  --line-reading: 1.8;

  /* Transições */
  --ease: 0.2s ease;
}

/* Modo claro */
html.tema-claro {
  --bg:          #f5f3ef;
  --bg-card:     #ffffff;
  --bg-elevated: #eeebe5;
  --bg-input:    #f0ede8;
  --border:      #ddd9d0;
  --border-subtle: #e8e4dd;

  --text-primary:   #1a1814;
  --text-secondary: #6b6560;
  --text-muted:     #aaa69f;
  --text-accent:    #7a5c1e;

  --accent:       #7a5c1e;
  --accent-dim:   #e8d9b5;
  --progress-fill: #7a5c1e;
  --progress-bg:  #ddd9d0;

  --dot-present: #7a5c1e;
  --dot-absent:  #ccc8c0;

  --status-none:    #bbb8b0;
  --status-reading: #4a90b8;
  --status-done:    #4a9050;

  --shadow: 0 1px 4px rgba(0,0,0,0.08);
}

/* Fonte serifada */
html.fonte-serifada {
  --font-body: var(--font-serif);
}

/* Tamanhos de fonte */
html.fonte-pequena  { font-size: 14px; }
html.fonte-media    { font-size: 16px; }
html.fonte-grande   { font-size: 18px; }
html.fonte-xgrande  { font-size: 20px; }

/* Espaçamento */
html.esp-compacto   { --line-reading: 1.6; }
html.esp-normal     { --line-reading: 1.8; }
html.esp-amplo      { --line-reading: 2.1; }

/* ─── Reset & Base ──────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  font-size: 16px;
  height: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text-primary);
  min-height: 100%;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overscroll-behavior: none;
}

a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }
input, textarea { font-family: inherit; }

/* ─── Layout principal ──────────────────────────────────────────────────────── */
#app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  overflow: hidden;
}

/* ─── Topbar ─────────────────────────────────────────────────────────────────── */
#topbar {
  flex-shrink: 0;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  padding: 0 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  height: 52px;
  z-index: 10;
}

#topbar-titulo {
  font-size: var(--size-sm);
  font-weight: 600;
  letter-spacing: 0.04em;
  color: var(--text-accent);
  flex-shrink: 0;
}

#topbar-busca {
  flex: 1;
  position: relative;
}

#campo-busca {
  width: 100%;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 7px 32px 7px 10px;
  font-size: var(--size-sm);
  color: var(--text-primary);
  outline: none;
  transition: border-color var(--ease);
}

#campo-busca:focus {
  border-color: var(--accent);
}

#campo-busca::placeholder {
  color: var(--text-muted);
}

#btn-limpar-busca {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  font-size: 16px;
  display: none;
  line-height: 1;
}

#btn-limpar-busca.visivel { display: block; }

.topbar-btn {
  width: 36px;
  height: 36px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-secondary);
  transition: background var(--ease), color var(--ease);
  flex-shrink: 0;
}

.topbar-btn:hover, .topbar-btn.ativo {
  background: var(--bg-elevated);
  color: var(--text-accent);
}

/* ─── Barra de progresso ────────────────────────────────────────────────────── */
#barra-progresso-wrap {
  flex-shrink: 0;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border-subtle);
  padding: 6px 16px 8px;
  display: flex;
  align-items: center;
  gap: 10px;
}

#progresso-texto {
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: 0.03em;
  white-space: nowrap;
  flex-shrink: 0;
}

#barra-progresso-trilha {
  flex: 1;
  height: 3px;
  background: var(--progress-bg);
  border-radius: 2px;
  overflow: hidden;
}

#barra-progresso-fill {
  height: 100%;
  background: var(--progress-fill);
  border-radius: 2px;
  transition: width 0.5s ease;
  width: 0%;
}

#progresso-pct {
  font-size: 11px;
  color: var(--text-accent);
  font-weight: 600;
  letter-spacing: 0.03em;
  flex-shrink: 0;
  min-width: 32px;
  text-align: right;
}

/* ─── Continuar leitura ─────────────────────────────────────────────────────── */
#banner-continuar {
  flex-shrink: 0;
  display: none;
  padding: 8px 16px;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border-subtle);
}

#banner-continuar.visivel { display: block; }

#btn-continuar {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  background: var(--accent-dim);
  border: 1px solid var(--accent);
  border-radius: var(--radius-sm);
  padding: 8px 12px;
  color: var(--text-accent);
  font-size: var(--size-sm);
  font-weight: 500;
  transition: opacity var(--ease);
}

#btn-continuar:active { opacity: 0.75; }

#btn-continuar-titulo {
  flex: 1;
  text-align: left;
  font-size: var(--size-xs);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--text-secondary);
}

/* ─── Conteúdo scrollável ───────────────────────────────────────────────────── */
#conteudo {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

/* ─── Lista principal ───────────────────────────────────────────────────────── */
#lista-principal {
  padding: 8px 0 80px;
}

.secao-header {
  padding: 20px 16px 6px;
  font-size: var(--size-xs);
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-muted);
}

.secao-header:first-child {
  padding-top: 12px;
}

.subsecao-header {
  padding: 10px 16px 4px;
  font-size: var(--size-xs);
  letter-spacing: 0.05em;
  color: var(--text-muted);
  font-style: italic;
  opacity: 0.7;
}

/* ─── Item da lista ─────────────────────────────────────────────────────────── */
.item-lista {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border-subtle);
  cursor: pointer;
  transition: background var(--ease);
  position: relative;
}

.item-lista:active {
  background: var(--bg-card);
}

.item-numero {
  font-size: var(--size-xs);
  color: var(--text-muted);
  min-width: 24px;
  text-align: right;
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
}

.item-centro {
  flex: 1;
  min-width: 0;
}

.item-titulo {
  font-size: var(--size-sm);
  color: var(--text-primary);
  line-height: 1.35;
  margin-bottom: 5px;
}

.item-meta {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* ─── Indicador dos Evangelhos ──────────────────────────────────────────────── */
.indicador-evangelhos {
  display: flex;
  gap: 4px;
  align-items: center;
  flex-shrink: 0;
}

.indicador-evangelhos .dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--dot-absent);
  flex-shrink: 0;
  transition: background var(--ease);
}

.indicador-evangelhos .dot.presente {
  background: var(--dot-present);
}

/* Indicador grande (na tela de leitura) */
.indicador-evangelhos.grande .dot {
  width: 9px;
  height: 9px;
}

/* ─── Status de progresso ───────────────────────────────────────────────────── */
.status-icone {
  font-size: 13px;
  line-height: 1;
  color: var(--status-none);
  flex-shrink: 0;
}

.status-icone.em-leitura { color: var(--status-reading); }
.status-icone.concluido  { color: var(--status-done); }

/* ─── Seta de navegação ─────────────────────────────────────────────────────── */
.item-seta {
  color: var(--text-muted);
  font-size: 16px;
  flex-shrink: 0;
}

/* ─── Favorito na lista ─────────────────────────────────────────────────────── */
.item-fav {
  position: absolute;
  top: 10px;
  right: 40px;
  color: var(--text-muted);
  font-size: 12px;
}

.item-fav.favoritado { color: var(--accent); }

/* ─── Vazio / Sem resultados ────────────────────────────────────────────────── */
#sem-resultados {
  display: none;
  padding: 64px 24px;
  text-align: center;
  color: var(--text-muted);
  font-size: var(--size-sm);
}

/* ─── Tela de Leitura ───────────────────────────────────────────────────────── */
#tela-leitura {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 100;
  display: flex;
  flex-direction: column;
  transform: translateX(100%);
  transition: transform 0.28s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  will-change: transform;
}

#tela-leitura.aberta {
  transform: translateX(0);
}

/* Header da leitura */
#leitura-header {
  flex-shrink: 0;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  padding: 0 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  height: 52px;
}

#btn-voltar {
  display: flex;
  align-items: center;
  gap: 4px;
  color: var(--text-accent);
  font-size: var(--size-sm);
  flex-shrink: 0;
}

#leitura-header-centro {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 8px;
}

#leitura-numero-header {
  font-size: var(--size-xs);
  color: var(--text-muted);
  flex-shrink: 0;
}

#leitura-acoes {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}

.leitura-btn {
  width: 36px;
  height: 36px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-secondary);
  font-size: 18px;
  transition: background var(--ease), color var(--ease);
}

.leitura-btn:hover { background: var(--bg-elevated); }
.leitura-btn.ativo { color: var(--accent); }

/* Corpo da leitura */
#leitura-corpo {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 20px 20px 100px;
}

#leitura-titulo-area {
  margin-bottom: 20px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}

#leitura-titulo {
  font-size: var(--size-xl);
  font-weight: 600;
  color: var(--text-primary);
  line-height: 1.3;
  margin-bottom: 10px;
}

#leitura-indicador-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
}

#leitura-status-select {
  margin-left: auto;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 4px 8px;
  font-size: var(--size-xs);
  color: var(--text-secondary);
  cursor: pointer;
  outline: none;
}

/* Bloco de um Evangelho na leitura */
.evangelho-bloco {
  margin-bottom: 32px;
}

.evangelho-bloco + .evangelho-bloco {
  padding-top: 24px;
  border-top: 1px solid var(--border);
}

.evangelho-label {
  font-size: var(--size-xs);
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-accent);
  margin-bottom: 4px;
}

.evangelho-ref {
  font-size: var(--size-xs);
  color: var(--text-muted);
  margin-bottom: 16px;
}

.evangelho-texto {
  font-size: var(--size-base);
  color: var(--text-primary);
  line-height: var(--line-reading);
  font-family: var(--font-body);
}

/* Quebra entre versículos */
.verso-break {
  display: block;
  content: '';
  margin-top: 0.6em;
}

/* Número do versículo em linha */
.verso-num {
  font-size: 10px;
  font-weight: 700;
  color: var(--text-muted);
  vertical-align: super;
  margin-right: 1px;
  user-select: none;
  letter-spacing: 0;
}

/* Destaque de trecho */
.trecho-destacado {
  background: rgba(201, 176, 119, 0.2);
  border-radius: 2px;
  cursor: pointer;
}

html.tema-claro .trecho-destacado {
  background: rgba(122, 92, 30, 0.15);
}

/* ─── Anotação ──────────────────────────────────────────────────────────────── */
#anotacao-area {
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
}

#anotacao-label {
  font-size: var(--size-xs);
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 8px;
}

#anotacao-input {
  width: 100%;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px;
  font-size: var(--size-sm);
  color: var(--text-primary);
  resize: vertical;
  min-height: 80px;
  outline: none;
  transition: border-color var(--ease);
  line-height: var(--line-normal);
}

#anotacao-input:focus {
  border-color: var(--accent);
}

#anotacao-input::placeholder {
  color: var(--text-muted);
}

#anotacao-salvo {
  font-size: var(--size-xs);
  color: var(--text-muted);
  margin-top: 4px;
  text-align: right;
  height: 16px;
}

/* ─── Navegação entre eventos ───────────────────────────────────────────────── */
#leitura-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-card);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 16px;
  padding-bottom: max(8px, env(safe-area-inset-bottom));
  z-index: 101;
  display: none;
}

#leitura-nav.visivel { display: flex; }

#btn-ant, #btn-prox {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  font-size: var(--size-sm);
  color: var(--text-secondary);
  transition: background var(--ease), color var(--ease);
}

#btn-ant:hover, #btn-prox:hover {
  background: var(--bg-elevated);
  color: var(--text-primary);
}

#btn-ant:disabled, #btn-prox:disabled {
  opacity: 0.3;
  pointer-events: none;
}

#leitura-nav-info {
  font-size: var(--size-xs);
  color: var(--text-muted);
  text-align: center;
}

/* ─── Tela de Favoritos ─────────────────────────────────────────────────────── */
#tela-favoritos {
  display: none;
  padding: 8px 0 80px;
}

#tela-favoritos.ativo { display: block; }

#favoritos-vazio {
  padding: 64px 24px;
  text-align: center;
  color: var(--text-muted);
  font-size: var(--size-sm);
}

/* ─── Tela de Configurações ─────────────────────────────────────────────────── */
#tela-config {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-card);
  border-top: 1px solid var(--border);
  border-radius: 16px 16px 0 0;
  z-index: 200;
  padding: 16px 20px;
  padding-bottom: max(20px, env(safe-area-inset-bottom));
  transform: translateY(100%);
  transition: transform 0.28s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  max-height: 90dvh;
  overflow-y: auto;
}

#tela-config.aberta { transform: translateY(0); }

#config-handle {
  width: 36px;
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin: 0 auto 16px;
}

#config-titulo {
  font-size: var(--size-base);
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 20px;
  text-align: center;
}

.config-secao {
  margin-bottom: 20px;
}

.config-secao-label {
  font-size: var(--size-xs);
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 10px;
}

.config-opcoes {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.config-btn {
  flex: 1;
  min-width: 70px;
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--bg-elevated);
  color: var(--text-secondary);
  font-size: var(--size-sm);
  text-align: center;
  transition: all var(--ease);
  white-space: nowrap;
}

.config-btn.ativo {
  background: var(--accent-dim);
  border-color: var(--accent);
  color: var(--text-accent);
}

/* ─── Overlay ───────────────────────────────────────────────────────────────── */
#overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 190;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--ease);
}

#overlay.visivel {
  opacity: 1;
  pointer-events: all;
}

/* ─── Navbar inferior ───────────────────────────────────────────────────────── */
#navbar {
  flex-shrink: 0;
  display: flex;
  background: var(--bg-card);
  border-top: 1px solid var(--border);
  height: 52px;
  padding-bottom: env(safe-area-inset-bottom);
}

.nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  color: var(--text-muted);
  font-size: 9px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  transition: color var(--ease);
  padding: 6px 0;
}

.nav-item .nav-icon {
  font-size: 20px;
  line-height: 1;
}

.nav-item.ativo {
  color: var(--text-accent);
}

/* ─── Highlight de busca ────────────────────────────────────────────────────── */
mark {
  background: rgba(201, 176, 119, 0.3);
  color: inherit;
  border-radius: 2px;
  padding: 0 1px;
}

html.tema-claro mark {
  background: rgba(122, 92, 30, 0.2);
}

/* ─── Toast ─────────────────────────────────────────────────────────────────── */
#toast {
  position: fixed;
  bottom: 72px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  color: var(--text-primary);
  font-size: var(--size-sm);
  padding: 8px 16px;
  border-radius: 20px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s, transform 0.2s;
  white-space: nowrap;
  z-index: 999;
}

#toast.visivel {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ─── Scrollbar customizada ─────────────────────────────────────────────────── */
::-webkit-scrollbar              { width: 4px; }
::-webkit-scrollbar-track        { background: transparent; }
::-webkit-scrollbar-thumb        { background: var(--border); border-radius: 2px; }
::-webkit-scrollbar-thumb:hover  { background: var(--text-muted); }

/* ─── Seleção de texto ──────────────────────────────────────────────────────── */
::selection {
  background: rgba(201, 176, 119, 0.25);
}

/* ─── Animação de entrada ───────────────────────────────────────────────────── */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

.item-lista {
  animation: fadeIn 0.15s ease both;
}

/* ─── Responsivo (tablet) ───────────────────────────────────────────────────── */
@media (min-width: 600px) {
  #lista-principal, #tela-favoritos, #leitura-corpo {
    max-width: 680px;
    margin: 0 auto;
  }

  #leitura-nav { max-width: 680px; margin: 0 auto; left: 50%; transform: translateX(-50%); }
}

</style>
</head>

    <div id="leitura-evangelhos"></div>

  <!-- Navegação anterior / próximo -->
  <div id="leitura-nav">
    <button id="btn-ant" aria-label="Acontecimento anterior">‹ Anterior</button>
    <div id="leitura-nav-info"></div>
    <button id="btn-prox" aria-label="Próximo acontecimento">Próximo ›</button>
  </div>

</div><!-- /#tela-leitura -->

<script>
window.__CRONOLOGIA__ = [{"id": 1, "ordem": 1, "secao": "A. Nascimento e Preparação de Jesus Cristo", "subsecao": null, "titulo": "A natureza dos Evangelhos", "mateus": null, "marcos": {"referencia": "Mc 1.1", "texto": "1 Princípio do evangelho de Jesus Cristo, Filho de Deus."}, "lucas": {"referencia": "Lc 1.1-4", "texto": "1 Tendo, pois, muitos empreendido pôr em ordem a narração dos fatos que entre nós se cumpriram, 2 segundo nos transmitiram os mesmos que os presenciaram desde o princípio e foram ministros da palavra, 3 pareceu-me também a mim conveniente descrevê-los a ti, ó excelentíssimo Teófilo, por sua ordem, havendo-me já informado minuciosamente de tudo desde o princípio, 4 para que conheças a certeza das coisas de que já estás informado."}, "joao": null}, {"id": 2, "ordem": 2, "secao": "A. Nascimento e Preparação de Jesus Cristo", "subsecao": null, "titulo": "Deus fez-se homem", "mateus": null, "marcos": null, "lucas": null, "joao": {"referencia": "Jo 1.1-18", "texto": "1 No princípio, era o Verbo, e o Verbo estava com Deus, e o Verbo era Deus. 2 Ele estava no princípio com Deus. 3 Todas as coisas foram feitas por ele, e sem ele nada do que foi feito se fez. 4 Nele, estava a vida e a vida era a luz dos homens; 5 e a luz resplandece nas trevas, e as trevas não a compreenderam. 6 Houve um homem enviado de Deus, cujo nome era João. 7 Este veio para testemunho para que testificasse da luz, para que todos cressem por ele. 8 Não era ele a luz, mas veio para que testificasse da luz. 9 Ali estava a luz verdadeira, que alumia a todo homem que vem ao mundo, 10 estava no mundo, e o mundo foi feito por ele e o mundo não o conheceu. 11 Veio para o que era seu, e os seus não o receberam. 12 Mas a todos quantos o receberam deu-lhes o poder de serem feitos filhos de Deus: aos que creem no seu nome, 13 os quais não nasceram do sangue, nem da vontade da carne, nem da vontade do varão, mas de Deus. 14 E o Verbo se fez carne e habitou entre nós, e vimos a sua glória, como a ência dos justos, com o fim de preparar ao Senhor um povo bem disposto. 18 Disse, então, Zacarias ao anjo: Como saberei isso? Pois eu já sou velho, e minha mulher, avançada em idade. 19 E, respondendo o anjo, disse-lhe: Eu sou Gabriel, que assisto diante de Deus, e fui enviado a falar-te e dar-te estas alegres novas. 20 Todavia ficarás mudo e não poderás falar até ao dia em que estas coisas aconteçam, porquanto não creste nas minhas palavras, que a seu tempo se hão de cumprir. 21 E o povo estava esperando a Zacarias e maravilhava-se de que tanto se demorasse no templo. 22 E, saindo ele, não lhes podia falar; e entenderam que tivera alguma visão no templo. E falava por acenos e ficou mudo. 23 E sucedeu que, terminados os dias de seu ministério, voltou para sua casa. 24 E, depois daqueles dias, Isabel, sua mulher, concebeu e, por cinco meses, se ocultou, dizendo: 25 Assim me fez o Senhor, nos dias em que atentou em mim, para destruir o meu opróbrio entre os homens."}, "joao": null}, {"id": 4, "ordem": 4, "secao": "A. Nascimento e Preparação de Jesus Cristo", "subsecao": null, "titulo": "Um anjo promete a Maria o nascimento de Jesus", "mateus": null, "marcos": null, "lucas": {"referencia": "Lc 1.26-38", "texto": "26 E, no sexto mês, foi o anjo Gabriel enviado por Deus a uma cidade da Galileia, chamada Nazaré, 27 a uma virgem desposada com um varão cujo nome era José, da casa de Davi; e o nome da virgem era Maria. 28 E, entrando o anjo onde ela estava, disse: Salve, agraciada; o Senhor é contigo; bendita és tu entre as mulheres. 29 E, vendo-o ela, turbou-se muito com aquelas palavras e considerava que saudação seria esta. 30 Disse-lhe, então, o anjo: Maria, não temas, porque achaste graça diante de Deus, 31 E eis que em teu ventre conceberás, e darás à luz um filho, e pôr-lhe-ás o nome de Jesus. 32 Este será grande e será chamado Filho do Altíssimo; e o Senhor Deus lhe dará o trono de Davi, seu pai, 33 e reinará eternamente na casa de Jacó, e o seu Reino não terá fim. 3 u nome. 50 E a sua misericórdia é de geração em geração sobre os que o temem. 51 Com o seu braço, agiu valorosamente, dissipou os soberbos no pensamento de seu coração, 52 depôs dos tronos os poderosos e elevou os humildes; 53 encheu de bens os famintos, despediu vazios os ricos, 54 e auxiliou a Israel, seu servo, recordando-se da sua misericórdia 55 (como falou a nossos pais) para com Abraão e sua posteridade, para sempre. 56 E Maria ficou com ela quase três meses e depois voltou para sua casa."}, "joao": null}, {"id": 7, "ordem": 7, "secao": "A. Nascimento e Preparação de Jesus Cristo", "subsecao": null, "titulo": "Nasce João Batista", "mateus": null, "marcos": null, "lucas": {"referencia": "Lc 1.57-66", "texto": "57 E completou-se para Isabel o tempo de dar à luz, e teve um filho. 58 E os seus vizinhos e parentes ouviram que tinha Deus usado para com ela de grande misericórdia e alegraram-se com ela. 59 E aconteceu que, ao oitavo dia, vieram circuncidar o menino e lhe chamavam Zacarias, o nome de seu pai. 60 E, respondendo sua mãe, disse: Não, porém será chamado João. 61 E disseram-lhe: Ninguém há na tua parentela que se chame por este nome. 62 E perguntaram, por acenos, ao pai como queria que lhe chamassem. 63 E, pedindo ele uma tabuinha de escrever, escreveu, dizendo: O seu nome é João. E todos se maravilharam. 64 E logo a boca se lhe abriu, e a língua se lhe soltou; e falava, louvando a Deus. 65 E veio temor sobre todos os seus vizinhos, e em todas as montanhas da Judeia foram divulgadas todas essas coisas. 66 E todos os que as ouviam as conservavam em seu coração, dizendo: Quem será, pois, este menino? E a mão do Senhor estava com ele."}, "joao": null}, {"id": 8, "ordem": 8, "secao": "A. Nascimento e Preparação de Jesus Cristo", "subsecao": null, "titulo": "A profecia de Zacarias", "mateus": null, "marcos": null, "lucas": {"referencia": "Lc 1.67-80", "texto": "67 E Zacarias, seu pai, foi cheio do Espírito Santo e profetizou, dizendo: 68 Bendito o Senhor, Deus de Israel, porque visitou e remiu o seu povo! 69 E nos levantou uma salvação poderosa na casa de Davi, seu servo, 70 como falou pela boca dos seus santos profetas, desde o princípio do mundo, 71 para nos livrar dos nossos inimigos e das mãos de todos os que nos aborrecem 72 e para manifestar misericórdia a nossos pais, e para lembrar-se do seu santo concerto 73 e do juramento que jurou a Abraão, nosso pai, 74 de conceder-nos que, libertados das mãos de nossos inimigos, o servíssemos sem temor, 75 em santidade e justiça perante ele, todos os dias da nossa vida. 76 E tu, ó menino, serás chamado profeta do Altíssimo, porque hás de ir ante a face do Senhor, a preparar os seus caminhos, 77 para dar ao seu povo conhecimento da salvação, na remissão dos seus pecados, 78 pelas entranhas da misericórdia do nosso Deus, com que o oriente do alto nos visitou, 79 para alumiar os que estão assentados em trevas e sombra de morte, a fim de dirigir os nossos pés pelo caminho da paz. 80 E o menino crescia, e se robustecia em espírito, e esteve nos desertos até ao dia em que havia de mostrar-se a Israel."}, "joao": null}, {"id": 9, "ordem": 9, "secao": "A. Nascimento e Preparação de Jesus Cristo", "subsecao": null, "titulo": "Um anjo aparece a José", "mateus": {"referencia": "Mt 1.18-25", "texto": "18 Ora, o nascimento de Jesus Cristo foi assim: Estando Maria, sua mãe, desposada com José, antes de se ajuntarem, achou-se ter concebido do Espírito Santo. 19 Então, José, seu marido, como era justo e a não queria infamar, intentou deixá-la secretamente. 20 E, projetando ele isso, eis que, em sonho, lhe apareceu um anjo do Senhor, dizendo: José, filho de Davi, não temas receber a Maria, tua mulher, porque o que nela está gerado é do Espírito Santo. 21 E ela dará à luz um filho, e lhe porás o nome de JESUS, porque ele salvará o seu povo dos seus pecados. 22 Tudo isso aconteceu para que se cumprisse o que foi dito da parte do Senhor pelo profeta, que diz: 23 Eis que a virgem conceberá e dará à luz um filho, e ele será chamado pelo nome de EMANUEL. (EMANUEL traduzido é: Deus conosco). 24 E José, despertando do sonho, fez como o anjo do Senhor lhe ordenara, e recebeu a sua mulher, 25 e não a conheceu até que deu à luz seu filho, o primogênito; e pôs-lhe o nome de JESUS."}, "marcos": null, "lucas": null, "joao": null}, {"id": 10, "ordem": 10, "secao": "A. Nascimento e Preparação de Jesus Cristo", "subsecao": null, "titulo": "O registro dos antepassados de Jesus", "mateus": {"referencia": "Mt 1.1-17", "texto": "1 Livro da geração de Jesus Cristo, Filho de Davi, Filho de Abraão. 2 Abraão gerou a Isaque, e Isaque gerou a Jacó, e Jacó gerou a Judá e a seus irmãos, 3 e Judá gerou de Tamar a Perez e a Zerá, e Perez gerou a Esrom, e Esrom gerou a Arão. 4 Arão gerou a Aminadabe, e Aminadabe gerou a Naassom, e Naassom gerou a Salmom, 5 e Salmom gerou de Raabe a Boaz, e Boaz gerou de Rute a Obede, e Obede gerou a Jessé. 6 Jessé gerou ao rei Davi, e o rei Davi gerou a Salomão da que foi mulher de Urias. 7 Salomão gerou a Roboão, e Roboão gerou a Abias, e Abias gerou a Asa, 8 e Asa gerou a Josafá, e Josafá gerou a Jorão, e Jorão gerou a Uzias, 9 e Uzias gerou a Jotão, e Jotão gerou a Acaz, e Acaz gerou a Ezequias. 10 Ezequias gerou a Manassés, e Manassés gerou a Amom, e Amom gerou a Josias, 11 e Josias gerou a Jeconias e a seus irmãos na deportação para a Babilônia. 12 E, depois da deportação para a Babilônia, Jeconias gerou a Salatiel, e Salatiel gerou a Zorobabel, 13 e Zorobabel gerou a Abiúde, e Abiúde gerou a Eliaquim, e Eliaquim gerou a Azor, 14 e Azor gerou a Sadoque, e Sadoque gerou a Aquim, e Aquim gerou a Eliúde, 15 e Eliúde gerou a Eleazar, e Eleazar gerou a Matã, e Matã gerou a Jacó, 16 e Jacó gerou a José, marido de Maria, da qual nasceu JESUS, que se chama o Cristo. 17 De sorte que todas as gerações, desde Abraão até Davi, são catorze gerações; e, desde Davi até a deportação para a Babilônia, catorze gerações; e, desde a deportação para a Babilônia até Cristo, catorze gerações."}, "marcos": null, "lucas": {"referencia": "Lc 3.23-38", "texto": "23 E o mesmo Jesus começava a ser de quase trinta anos, sendo (como se cuidava) filho de José, e José, de Eli, 24 e Eli, de Matate, e Matate, de Levi, e Levi, de Melqui, e Melqui, de Janai, e Janai, de José, 25 e José, de Matatias, e Matatias, de Amós, e Amós, de Naum, e Naum, de Esli, e Esli, de Nagai, 26 e Nagai, de Maate, e Maate, de Matatias, e Matatias, de Semei, e Semei, de José, e José, de Jodá, 27 e Jodá, de Joanã, e Joanã, de Resa, e Resa, de Zorobabel, e Zorobabel, de Salatiel, e Salatiel, de Neri, 28 e Neri, de Melqui, e Melqui, de Adi, e Adi, de Cosã, e Cosã, de Elmadã, e Elmadã, de Er, 29 e Er, de Josué, e Josué, de Eliézer, e Eliézer, de Jorim, e Jorim, de Matate, e Matate, de Levi, 30 e Levi, de Simeão, e Simeão, de Judá, e Judá, de José, e José, de Jonã, e Jonã, de Eliaquim, 31 e Eliaquim, de Meleá, e Meleá, de Mená, e Mená, de Matatá, e Matatá, de Natã, e Natã, de Davi, 32 e Davi, de Jessé, e Jessé, de Obede, e Obede, de Boaz, e Boaz, de Salá, e Salá, de Naassom, 33 e Naassom, de Aminadabe, e Aminadabe, de Admim, e Admim, de Arni, e Arni, de Esrom, e Esrom, de Perez, e Perez, de Judá, 34 e Judá, de Jacó, e Jacó, de Isaque, e Isaque, de Abraão, e Abraão, de Tera, e Tera de Naor, 35 e Naor, de Serugue, e Serugue, de Ragaú, e Ragaú, de Faleque, e Faleque, de Éber, e Éber, de Salá, 36 e Salá, de Cainã, e Cainã, de Arfaxade, e Arfaxade, de Sem, e Sem, de Noé, e Noé, de Lameque, 37 e Lameque, de Metusalém, e Metusalém, de Enoque, e Enoque, de Jarede, e Jarede, de Maalalel, e Maalalel, de Cainã, 38 e Cainã, de Enos, e Enos, de Sete, e Sete, de Adão, e Adão, de Deus."}, "joao": null}, {"id": 11, "ordem": 11, "secao": "A. Nascimento e Preparação de Jesus Cristo", "subsecao": null, "titulo": "Nasce Jesus em Belém", "mateus": null, "marcos": null, "lucas": {"referencia": "Lc 2.1-7", "texto": "1 E aconteceu, naqueles dias, que saiu um decreto da parte de César Augusto, para que todo o mundo se alistasse. 2 (Este primeiro alistamento foi feito sendo Cirênio governador da Síria.) 3 E todos iam alistar-se, cada um à sua própria cidade. 4 E subiu da Galileia também José, da cidade de Nazaré, à Judeia, à cidade de Davi chamada Belém (porque era da casa e família de Davi), 5 a fim de alistar-se com Maria, sua mulher, que estava grávida. 6 E aconteceu que, estando eles ali, se cumpriram os dias em que ela havia de dar à luz. 7 E deu à luz o seu filho primogênito, e envolveu-o em panos, e deitou-o numa manjedoura, porque não havia lugar para eles na estalagem."}, "joao": null}, {"id": 12, "ordem": 12, "secao": "A. Nascimento e Preparação de Jesus Cristo", "subsecao": null, "titulo": "Pastores visitam Jesus", "mateus": null, "marcos": null, "lucas": {"referencia": "Lc 2.8-20", "texto": "8 Ora, havia, naquela mesma comarca, pastores que estavam no campo e guardavam durante as vigílias da noite o seu rebanho. 9 E eis que um anjo do Senhor veio sobre eles, e a glória do Senhor os cercou de resplendor, e tiveram grande temor. 10 E o anjo lhes disse: Não temais, porque eis aqui vos trago novas de grande alegria, que será para todo o povo, 11 pois, na cidade de Davi, vos nasceu hoje o Salvador, que é Cristo, o Senhor. 12 E isto vos será por sinal: achareis o menino envolto em panos e deitado numa manjedoura. 13 E, no mesmo instante, apareceu com o anjo uma multidão dos exércitos celestiais, louvando a Deus e dizendo: 14 Glória a Deus nas alturas, paz na terra, boa vontade para com os homens! 15 E aconteceu que, ausentando-se deles os anjos para o céu, disseram os pastores uns aos outros: Vamos, pois, até Belém e vejamos isso que aconteceu e que o Senhor nos fez saber. 16 E foram apressadamente e acharam Maria, e José, e o menino deitado na manjedoura. 17 E, vendo-o, divulgaram a palavra que acerca do menino lhes fora dita. 18 E todos os que a ouviram se maravilharam do que os pastores lhes diziam. 19 Mas Maria guardava todas essas coisas, conferindo-as em seu coração. 20 E voltaram os pastores glorificando e louvando a Deus por tudo o que tinham ouvido e visto, como lhes havia sido dito."}, "joao": null}, {"id": 13, "ordem": 13, "secao": "A. Nascimento e Preparação de Jesus Cristo", "subsecao": null, "titulo": "Maria e José levam Jesus ao Templo", "mateus": null, "marcos": null, "lucas": {"referencia": "Lc 2.21-24", "texto": "21 E, quando os oito dias foram cumpridos para circuncidar o menino, foi-lhe dado o nome de Jesus, que pelo anjo lhe fora posto antes de ser concebido. 22 E, cumprindo-se os dias da purificação, segundo a lei de Moisés, o levaram a Jerusalém, para o apresentarem ao Senhor 23 (segundo o que está escrito na lei do Senhor: Todo macho primogênito será consagrado ao Senhor) 24 e para darem a oferta segundo o disposto na lei do Senhor: um par de rolas ou dois pombinhos."}, "joao": null}, {"id": 14, "ordem": 14, "secao": "A. Nascimento e Preparação de Jesus Cristo", "subsecao": null, "titulo": "A profecia de Simeão", "mateus": null, "marcos": null, "lucas": {"referencia": "Lc 2.25-35", "texto": "25 Havia em Jerusalém um homem cujo nome era Simeão; e este homem era justo e temente a Deus, esperando a consolação de Israel; e o Espírito Santo estava sobre ele. 26 E fora-lhe revelado pelo Espírito Santo que ele não morreria antes de ter visto o Cristo do Senhor. 27 E, pelo Espírito, foi ao templo e, quando os pais trouxeram o menino Jesus, para com ele procederem segundo o uso da lei, 28 ele, então, o tomou em seus braços, e louvou a Deus, e disse: 29 Agora, Senhor, podes despedir em paz o teu servo, segundo a tua palavra, 30 pois já os meus olhos viram a tua salvação, 31 a qual tu preparaste perante a face de todos os povos, 32 luz para alumiar as nações e para glória de teu povo Israel. 33 José e Maria se maravilharam das coisas que dele se diziam. 34 E Simeão os abençoou e disse à Maria, sua mãe: Eis que este é posto para queda e elevação de muitos em Israel e para sinal que é contraditado 35 (e uma espada traspassará também a tua própria alma), para que se manifestem os pensamentos de muitos corações."}, "joao": null}, {"id": 15, "ordem": 15, "secao": "A. Nascimento e Preparação de Jesus Cristo", "subsecao": null, "titulo": "A profecia de Ana", "mateus": null, "marcos": null, "lucas": {"referencia": "Lc 2.36-38", "texto": "36 E estava ali a profetisa Ana, filha de Fanuel, da tribo de Aser. Esta era já avançada em idade, e tinha vivido com o marido sete anos, desde a sua virgindade, 37 e era viúva, de quase oitenta e quatro anos, e não se afastava do templo, servindo a Deus em jejuns e orações, de noite e de dia. 38 E, sobrevindo na mesma hora, ela dava graças a Deus e falava dele a todos os que esperavam a redenção em Jerusalém."}, "joao": null}, {"id": 16, "ordem": 16, "secao": "A. Nascimento e Preparação de Jesus Cristo", "subsecao": null, "titulo": "Visitantes chegam do Oriente", "mateus": {"referencia": "Mt 2.1-12", "texto": "1 E, tendo nascido Jesus em Belém da Judeia, no tempo do rei Herodes, eis que uns magos vieram do Oriente a Jerusalém, 2 e perguntaram: Onde está aquele que é nascido rei dos judeus? Porque vimos a sua estrela no Oriente e viemos a adorá-lo. 3 E o rei Herodes, ouvindo isso, perturbou-se, e toda a Jerusalém, com ele. 4 E, congregados todos os príncipes dos sacerdotes e os escribas do povo, perguntou-lhes onde havia de nascer o Cristo. 5 E eles lhe disseram: Em Belém da Judeia, porque assim está escrito pelo profeta: 6 E tu, Belém, terra de Judá, de modo nenhum és a menor entre as capitais de Judá, porque de ti sairá o Guia que há de apascentar o meu povo de Israel. 7 Então, Herodes, chamando secretamente os magos, inquiriu exatamente deles acerca do tempo em que a estrela lhes aparecera. 8 E, enviando-os a Belém, disse: Ide, e perguntai diligentemente pelo menino, e, quando o achardes, participai-mo, para que também eu vá e o adore. 9 E, tendo eles ouvido o rei, partiram; e eis que a estrela que tinham visto no Oriente ia adiante deles, até que, chegando, se deteve sobre o lugar onde estava o menino. 10 E, vendo eles a estrela, alegraram-se muito com grande júbilo. 11 E, entrando na casa, acharam o menino com Maria, sua mãe, e, prostrando-se, o adoraram; e, abrindo os seus tesouros, lhe ofertaram dádivas: ouro, incenso e mirra. 12 E, sendo por divina revelação avisados em sonhos para que não voltassem para junto de Herodes, partiram para a sua terra por outro caminho."}, "marcos": null, "lucas": null, "joao": null}, {"id": 17, "ordem": 17, "secao": "A. Nascimento e Preparação de Jesus Cristo", "subsecao": null, "titulo": "A fuga para o Egito", "mateus": {"referencia": "Mt 2.13-18", "texto": "13 E, tendo-se eles retirado, eis que o anjo do Senhor apareceu a José em sonhos, dizendo: Levanta-te, e toma o menino e sua mãe, e foge para o Egito, e demora-te lá até que eu te diga, porque Herodes há de procurar o menino para o matar. 14 E, levantando-se ele, tomou o menino e sua mãe, de noite, e foi para o Egito. 15 E esteve lá até à morte de Herodes, para que se cumprisse o que foi dito da parte do Senhor pelo profeta, que diz: Do Egito chamei o meu Filho. 16 Então, Herodes, vendo que tinha sido iludido pelos magos, irritou-se muito e mandou matar todos os meninos que havia em Belém e em todos os seus contornos, de dois anos para baixo, segundo o tempo que diligentemente inquirira dos magos. 17 Então, se cumpriu o que foi dito pelo profeta Jeremias, que diz: 18 Em Ramá se ouviu uma voz, lamentação, choro e grande pranto; era Raquel chorando os seus filhos e não querendo ser consolada, porque já não existiam."}, "marcos": null, "lucas": null, "joao": null}, {"id": 18, "ordem": 18, "secao": "A. Nascimento e Preparação de Jesus Cristo", "subsecao": null, "titulo": "O retorno do Egito", "mateus": {"referencia": "Mt 2.19-22", "texto": "19 Morto, porém, Herodes, eis que o anjo do Senhor apareceu, num sonho, a José, no Egito, 20 dizendo: Levanta-te, e toma o menino e sua mãe, e vai para a terra de Israel, porque já estão mortos os que procuravam a morte do menino. 21 Então, ele se levantou, e tomou o menino e sua mãe, e foi para a terra de Israel. 22 E, ouvindo que Arquelau reinava na Judeia em lugar de Herodes, seu pai, receou ir para lá; mas, avisado em sonhos por divina revelação, foi para as regiões da Galileia."}, "marcos": null, "lucas": null, "joao": null}, {"id": 19, "ordem": 19, "secao": "A. Nascimento e Preparação de Jesus Cristo", "subsecao": null, "titulo": "Infância de Jesus em Nazaré", "mateus": {"referencia": "Mt 2.23", "texto": "23 E chegou e habitou numa cidade chamada Nazaré, para que se cumprisse o que fora dito pelos profetas: Ele será chamado Nazareno."}, "marcos": null, "lucas": {"referencia": "Lc 2.39-40", "texto": "39 E, quando acabaram de cumprir tudo segundo a lei do Senhor, voltaram à Galileia, para a sua cidade de Nazaré. 40 E o menino crescia e se fortalecia em espírito, cheio de sabedoria; e a graça de Deus estava sobre ele."}, "joao": null}, {"id": 20, "ordem": 20, "secao": "A. Nascimento e Preparação de Jesus Cristo", "subsecao": null, "titulo": "Jesus fala com os mestres religiosos", "mateus": null, "marcos": null, "lucas": {"referencia": "Lc 2.41-52", "texto": "41 Ora, todos os anos, iam seus pais a Jerusalém, à Festa da Páscoa. 42 E, tendo ele já doze anos, subiram a Jerusalém, segundo o costume do dia da festa. 43 E, regressando eles, terminados aqueles dias, ficou o menino Jesus em Jerusalém, e não o souberam seus pais. 44 Pensando, porém, eles que viria de companhia pelo caminho, andaram caminho de um dia e procuravam-no entre os parentes e conhecidos. 45 E, como o não encontrassem, voltaram a Jerusalém em busca dele. 46 E aconteceu que, passados três dias, o acharam no templo, assentado no meio dos doutores, ouvindo-os e interrogando-os. 47 E todos os que o ouviam admiravam a sua inteligência e respostas. 48 E, quando o viram, maravilharam-se, e disse-lhe sua mãe: Filho, por que fizeste assim para conosco? Eis que teu pai e eu, ansiosos, te procurávamos. 49 E ele lhes disse: Por que é que me procuráveis? Não sabeis que me convém tratar dos negócios de meu Pai? 50 E eles não compreenderam as palavras que lhes dizia. 51 E desceu com eles, e foi para Nazaré, e era-lhes sujeito. E sua mãe guardava no coração todas essas coisas. 52 E crescia Jesus em sabedoria, e em estatura, e em graça para com Deus e os homens."}, "joao": null}, {"id": 21, "ordem": 21, "secao": "A. Nascimento e Preparação de Jesus Cristo", "subsecao": null, "titulo": "João Batista prepara o caminho para Jesus", "mateus": {"referencia": "Mt 3.1-12", "texto": "1 E, naqueles dias, apareceu João Batista pregando no deserto da Judeia 2 e dizendo: Arrependei-vos, porque é chegado o Reino dos céus. 3 Porque este é o anunciado pelo profeta Isaías, que disse: Voz do que clama no deserto: Preparai o caminho do Senhor, endireitai as suas veredas. 4 E este João tinha a sua veste de pelos de camelo e um cinto de couro em torno de seus lombos e alimentava-se de gafanhotos e de mel silvestre. 5 Então, ia ter com ele Jerusalém, e toda a Judeia, e toda a província adjacente ao Jordão; 6 e eram por ele batizados no rio Jordão, confessando os seus pecados. 7 E, vendo ele muitos dos fariseus e dos saduceus que vinham ao seu batismo, dizia-lhes: Raça de víboras, quem vos ensinou a fugir da ira futura? 8 Produzi, pois, frutos dignos de arrependimento 9 e não presumais de vós mesmos, dizendo: Temos por pai a Abraão; porque eu vos digo que mesmo destas pedras Deus pode suscitar filhos a Abraão. 10 E também, agora, está posto o machado à raiz das árvores; toda árvore, pois, que não produz bom fruto é cortada e lançada no fogo. 11 E eu, em verdade, vos batizo com água, para o arrependimento; mas aquele que vem após mim é mais poderoso do que eu; não sou digno de levar as suas sandálias; ele vos batizará com o Espírito Santo e com fogo. 12 Em sua mão tem a pá, e limpará a sua eira, e recolherá no celeiro o seu trigo, e queimará a palha com fogo que nunca se apagará."}, "marcos": {"referencia": "Mc 1.2-8", "texto": "2 Como está escrito no profeta Isaías: Eis que eu envio o meu anjo ante a tua face, o qual preparará o teu caminho diante de ti. 3 Voz do que clama no deserto: Preparai o caminho do Senhor, endireitai as suas veredas. 4 Apareceu João batizando no deserto e pregando o batismo de arrependimento, para remissão de pecados. 5 E toda a província da Judeia e todos os habitantes de Jerusalém iam ter com ele; e todos eram batizados por ele no rio Jordão, confessando os seus pecados. 6 E João andava vestido de pelos de camelo e com um cinto de couro em redor de seus lombos, e comia gafanhotos e mel silvestre, 7 e pregava, dizendo: Após mim vem aquele que é mais forte do que eu, do qual não sou digno de, abaixando-me, desatar a correia das sandálias. 8 Eu, em verdade, tenho-vos batizado com água; ele, porém, vos batizará com o Espírito Santo."}, "lucas": {"referencia": "Lc 3.1-18", "texto": "1 E, no ano quinze do império de Tibério César, sendo Pôncio Pilatos governador da Judeia, e Herodes, tetrarca da Galileia, e seu irmão Filipe, tetrarca da Itureia e da província de Traconites, e Lisânias, tetrarca de Abilene, 2 sendo Anás e Caifás sumos sacerdotes, veio no deserto a palavra de Deus a João, filho de Zacarias. 3 E percorreu toda a terra ao redor do Jordão, pregando o batismo de arrependimento, para o perdão dos pecados, 4 segundo o que está escrito no livro das palavras do profeta Isaías, que diz: Voz do que clama no deserto: Preparai o caminho do Senhor; endireitai as suas veredas. 5 Todo vale se encherá, e se abaixará todo monte e outeiro; e o que é tortuoso se endireitará, e os caminhos escabrosos se aplanarão; 6 e toda carne verá a salvação de Deus. 7 Dizia, pois, João à multidão que saía para ser batizada por ele: Raça de víboras, quem vos ensinou a fugir da ira que está para vir? 8 Produzi, pois, frutos dignos de arrependimento e não comeceis a dizer em vós mesmos: Temos Abraão por pai, porque eu vos digo que até destas pedras pode Deus suscitar filhos a Abraão. 9 E também já está posto o machado à raiz das árvores; toda árvore, pois, que não dá bom fruto é cortada e lançada no fogo. 10 E a multidão o interrogava, dizendo: Que faremos, pois? 11 E, respondendo ele, disse-lhes: Quem tiver duas túnicas, que reparta com o que não tem, e quem tiver alimentos, que faça da mesma maneira. 12 E chegaram também uns publicanos, para serem batizados, e disseram-lhe: Mestre, que devemos fazer? 13 E ele lhes disse: Não peçais mais do que aquilo que vos está ordenado. 14 E uns soldados o interrogaram também, dizendo: E nós, que faremos? E ele lhes disse: A ninguém trateis mal, nem defraudeis e contentai-vos com o vosso soldo. 15 E, estando o povo em expectação e pensando todos de João, em seu coração, se, porventura, seria o Cristo, 16 respondeu João a todos, dizendo: Eu, na verdade, batizo-vos com água, mas eis que vem aquele que é mais poderoso do que eu, a quem eu não sou digno de desatar a correia das sandálias; este vos batizará com o Espírito Santo e com fogo. 17 Ele tem a pá na sua mão, e limpará a sua eira, e ajuntará o trigo no seu celeiro, mas queimará a palha com fogo que nunca se apaga. 18 E assim admoestando-os, muitas outras coisas também anunciava ao povo."}, "joao": {"referencia": "Jo 1.19-28", "texto": "19 E este é o testemunho de João, quando os judeus mandaram de Jerusalém sacerdotes e levitas para que lhe perguntassem: Quem és tu? 20 E confessou e não negou; confessou: Eu não sou o Cristo. 21 E perguntaram-lhe: Então, quem és, pois? És tu Elias? E disse: Não sou. És tu o profeta? E respondeu: Não. 22 Disseram-lhe, pois: Quem és, para que demos resposta àqueles que nos enviaram? Que dizes de ti mesmo? 23 Disse: Eu sou a voz do que clama no deserto: Endireitai o caminho do Senhor, como disse o profeta Isaías. 24 E os que tinham sido enviados eram dos fariseus, 25 e perguntaram-lhe, e disseram-lhe: Por que batizas, pois, se tu não és o Cristo, nem Elias, nem o profeta? 26 João respondeu-lhes, dizendo: Eu batizo com água, mas, no meio de vós, está um a quem vós não conheceis. 27 Este é aquele que vem após mim, que foi antes de mim, do qual eu não sou digno de desatar as correias das sandálias. 28 Essas coisas aconteceram em Betânia, do outro lado do Jordão, onde João estava batizando."}}, {"id": 22, "ordem": 22, "secao": "A. Nascimento e Preparação de Jesus Cristo", "subsecao": null, "titulo": "O batismo de Jesus", "mateus": {"referencia": "Mt 3.13-17", "texto": "13 Então, veio Jesus da Galileia ter com João junto do Jordão, para ser batizado por ele. 14 Mas João opunha-se-lhe, dizendo: Eu careço de ser batizado por ti, e vens tu a mim? 15 Jesus, porém, respondendo, disse-lhe: Deixa por agora, porque assim nos convém cumprir toda a justiça. Então, ele o permitiu. 16 E, sendo Jesus batizado, saiu logo da água, e eis que se lhe abriram os céus, e viu o Espírito de Deus descendo como pomba e vindo sobre ele. 17 E eis que uma voz dos céus dizia: Este é o meu Filho amado, em quem me comprazo."}, "marcos": {"referencia": "Mc 1.9-11", "texto": "9 E aconteceu, naqueles dias, que Jesus, tendo ido de Nazaré, da Galileia, foi batizado por João, no rio Jordão. 10 E, logo que saiu da água, viu os céus abertos e o Espírito, que, como pomba, descia sobre ele. 11 E ouviu-se uma voz dos céus, que dizia: Tu és o meu Filho amado, em quem me comprazo."}, "lucas": {"referencia": "Lc 3.21-22", "texto": "21 E aconteceu que, como todo o povo se batizava, sendo batizado também Jesus, orando ele, o céu se abriu, 22 e o Espírito Santo desceu sobre ele em forma corpórea, como uma pomba; e ouviu-se uma voz do céu, que dizia: Tu és meu Filho amado; em ti me tenho comprazido."}, "joao": null}, {"id": 23, "ordem": 23, "secao": "A. Nascimento e Preparação de Jesus Cristo", "subsecao": null, "titulo": "Satanás tenta Jesus no deserto", "mateus": {"referencia": "Mt 4.1-11", "texto": "1 Então, foi conduzido Jesus pelo Espírito ao deserto, para ser tentado pelo diabo. 2 E, tendo jejuado quarenta dias e quarenta noites, depois teve fome; 3 E, chegando-se a ele o tentador, disse: Se tu és o Filho de Deus, manda que estas pedras se tornem em pães. 4 Ele, porém, respondendo, disse: Está escrito: Nem só de pão viverá o homem, mas de toda a palavra que sai da boca de Deus. 5 Então o diabo o transportou à Cidade Santa, e colocou-o sobre o pináculo do templo, 6 e disse-lhe: Se tu és o Filho de Deus, lança-te daqui abaixo; porque está escrito: Aos seus anjos dará ordens a teu respeito, e tomar-te-ão nas mãos, para que nunca tropeces em alguma pedra. 7 Disse-lhe Jesus: Também está escrito: Não tentarás o Senhor, teu Deus. 8 Novamente, o transportou o diabo a um monte muito alto; e mostrou-lhe todos os reinos do mundo e a glória deles. 9 E disse-lhe: Tudo isto te darei se, prostrado, me adorares. 10 Então, disse-lhe Jesus: Vai-te, Satanás, porque está escrito: Ao Senhor, teu Deus, adorarás e só a ele servirás. 11 Então, o diabo o deixou; e, eis que chegaram os anjos e o serviram."}, "marcos": {"referencia": "Mc 1.12-13", "texto": "12 E logo o Espírito o impeliu para o deserto. 13 E ali esteve no deserto quarenta dias, tentado por Satanás. E vivia entre as feras, e os anjos o serviam."}, "lucas": {"referencia": "Lc 4.1-13", "texto": "1 E Jesus, cheio do Espírito Santo, voltou do Jordão e foi levado pelo Espírito ao deserto. 2 E quarenta dias foi tentado pelo diabo, e, naqueles dias, não comeu coisa alguma, e, terminados eles, teve fome. 3 E disse-lhe o diabo: Se tu és o Filho de Deus, dize a esta pedra que se transforme em pão. 4 E Jesus lhe respondeu, dizendo: Escrito está que nem só de pão viverá o homem, mas de toda palavra de Deus. 5 E o diabo, levando-o a um alto monte, mostrou-lhe, num momento de tempo, todos os reinos do mundo. 6 E disse-lhe o diabo: Dar-te-ei a ti todo este poder e a sua glória, porque a mim me foi entregue, e dou-o a quem quero. 7 Portanto, se tu me adorares, tudo será teu. 8 E Jesus, respondendo, disse-lhe: Vai-te, Satanás, porque está escrito: Adorarás o Senhor, teu Deus, e só a ele servirás. 9 Levou-o também a Jerusalém, e pô-lo sobre o pináculo do templo, e disse-lhe: Se tu és o Filho de Deus, lança-te daqui abaixo, 10 porque está escrito: Mandará aos seus anjos, acerca de ti, que te guardem 11 e que te sustenham nas mãos, para que nunca tropeces com o teu pé em alguma pedra. 12 E Jesus, respondendo, disse-lhe: Dito está: Não tentarás ao Senhor, teu Deus. 13 E, acabando o diabo toda a tentação, ausentou-se dele por algum tempo."}, "joao": null}, {"id": 24, "ordem": 24, "secao": "A. Nascimento e Preparação de Jesus Cristo", "subsecao": null, "titulo": "João Batista proclama Jesus como o Messias", "mateus": null, "marcos": null, "lucas": null, "joao": {"referencia": "Jo 1.29-34", "texto": "29 No dia seguinte, João viu a Jesus, que vinha para ele, e disse: Eis o Cordeiro de Deus, que tira o pecado do mundo. 30 Este é aquele do qual eu disse: após mim vem um homem que foi antes de mim, porque já era primeiro do que eu. 31 E eu não o conhecia, mas, para que ele fosse manifestado a Israel, vim eu, por isso, batizando com água. 32 E João testificou, dizendo: Eu vi o Espírito descer do céu como uma pomba e repousar sobre ele. 33 E eu não o conhecia, mas o que me mandou a batizar com água, esse me disse: Sobre aquele que vires descer o Espírito e sobre ele repousar, esse é o que batiza com o Espírito Santo. 34 E eu vi e tenho testificado que este é o Filho de Deus."}}, {"id": 25, "ordem": 25, "secao": "A. Nascimento e Preparação de Jesus Cristo", "subsecao": null, "titulo": "Os primeiros discípulos seguem Jesus", "mateus": null, "marcos": null, "lucas": null, "joao": {"referencia": "Jo 1.35-51", "texto": "35 No dia seguinte João estava outra vez ali, na companhia de dois dos seus discípulos. 36 E, vendo passar a Jesus, disse: Eis aqui o Cordeiro de Deus. 37 E os dois discípulos ouviram-no dizer isso e seguiram a Jesus. 38 E Jesus, voltando-se e vendo que eles o seguiam, disse-lhes: Que buscais? E eles disseram: Rabi (que, traduzido, quer dizer Mestre), onde moras? 39 Ele lhes disse: Vinde e vede. Foram, e viram onde morava, e ficaram com ele aquele dia; e era já quase a hora décima. 40 Era André, irmão de Simão Pedro, um dos dois que ouviram aquilo de João e o haviam seguido. 41 Este achou primeiro a seu irmão Simão e disse-lhe: Achamos o Messias (que, traduzido, é o Cristo). 42 E levou-o a Jesus. E, olhando Jesus para ele, disse: Tu és Simão, filho de Jonas; tu serás chamado Cefas (que quer dizer Pedro). 43 No dia seguinte, quis Jesus ir à Galileia, e achou a Filipe, e disse-lhe: Segue-me. 44 E Filipe era de Betsaida, cidade de André e de Pedro. 45 Filipe achou Natanael e disse-lhe: Havemos achado aquele de quem Moisés escreveu na Lei e de quem escreveram os Profetas: Jesus de Nazaré, filho de José. 46 Disse-lhe Natanael: Pode vir alguma coisa boa de Nazaré? Disse-lhe Filipe: Vem e vê. 47 Jesus viu Natanael vir ter com ele e disse dele: Eis aqui um verdadeiro israelita, em quem não há dolo. 48 Disse-lhe Natanael: De onde me conheces tu? Jesus respondeu e disse-lhe: Antes que Filipe te chamasse, te vi eu estando tu debaixo da figueira. 49 Natanael respondeu e disse-lhe: Rabi, tu és o Filho de Deus, tu és o Rei de Israel. 50 Jesus respondeu e disse-lhe: Porque te disse: vi-te debaixo da figueira, crês? Coisas maiores do que estas verás. 51 E disse-lhe: Na verdade, na verdade vos digo que, daqui em diante, vereis o céu aberto e os anjos de Deus subirem e descerem sobre o Filho do Homem."}}, {"id": 26, "ordem": 26, "secao": "A. Nascimento e Preparação de Jesus Cristo", "subsecao": null, "titulo": "Jesus transforma água em vinho", "mateus": null, "marcos": null, "lucas": null, "joao": {"referencia": "Jo 2.1-12", "texto": "1 E, ao terceiro dia, fizeram-se umas bodas em Caná da Galileia; e estava ali a mãe de Jesus. 2 E foram também convidados Jesus e os seus discípulos para as bodas. 3 E, faltando o vinho, a mãe de Jesus lhe disse: Não têm vinho. 4 Disse-lhe Jesus: Mulher, que tenho eu contigo? Ainda não é chegada a minha hora. 5 Sua mãe disse aos empregados: Fazei tudo quanto ele vos disser. 6 E estavam ali postas seis talhas de pedra, para as purificações dos judeus, e em cada uma cabiam duas ou três metretas. 7 Disse-lhes Jesus: Enchei de água essas talhas. E encheram-nas até em cima. 8 E disse-lhes: Tirai agora e levai ao mestre-sala. E levaram. 9 E, logo que o mestre-sala provou a água feita vinho (não sabendo de onde viera, se bem que o sabiam os empregados que tinham tirado a água), chamou o mestre-sala ao esposo. 10 E disse-lhe: Todo homem põe primeiro o vinho bom e, quando já têm bebido bem, então, o inferior; mas tu guardaste até agora o bom vinho. 11 Jesus principiou assim os seus sinais em Caná da Galileia e manifestou a sua glória, e os seus discípulos creram nele. 12 Depois disso, desceu a Cafarnaum, ele, e sua mãe, e seus irmãos, e seus discípulos, e ficaram ali não muitos dias."}}, {"id": 27, "ordem": 27, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Inicia seu Ministério em Jerusalém", "titulo": "Jesus limpa o Templo", "mateus": null, "marcos": null, "lucas": null, "joao": {"referencia": "Jo 2.13-22", "texto": "13 E estava próxima a Páscoa dos judeus, e Jesus subiu a Jerusalém. 14 E achou no templo os que vendiam bois, e ovelhas, e pombos, e os cambiadores assentados. 15 E, tendo feito um azorrague de cordéis, lançou todos fora do templo, bem como os bois e ovelhas; e espalhou o dinheiro dos cambiadores, e derribou as mesas, 16 e disse aos que vendiam pombos: Tirai daqui estes e não façais da casa de meu Pai casa de vendas. 17 E os seus discípulos lembraram-se do que está escrito: O zelo da tua casa me devorará. 18 Responderam, pois, os judeus e disseram-lhe: Que sinal nos mostras para fazeres isso? 19 Jesus respondeu e disse-lhes: Derribai este templo, e em três dias o levantarei. 20 Disseram, pois, os judeus: Em quarenta e seis anos, foi edificado este templo, e tu o levantarás em três dias? 21 Mas ele falava do templo do seu corpo. 22 Quando, pois, ressuscitou dos mortos, os seus discípulos lembraram-se de que lhes dissera isso; e creram na Escritura e na palavra que Jesus tinha dito."}}, {"id": 28, "ordem": 28, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Inicia seu Ministério em Jerusalém", "titulo": "Nicodemos visita Jesus à noite", "mateus": null, "marcos": null, "lucas": null, "joao": {"referencia": "Jo 2.23-3.21", "texto": "23 E, estando ele em Jerusalém pela Páscoa, durante a festa, muitos, vendo os sinais que fazia, creram no seu nome. 24 Mas o mesmo Jesus não confiava neles, porque a todos conhecia 25 e não necessitava de que alguém testificasse do homem, porque ele bem sabia o que havia no homem. 1 E havia entre os fariseus um homem chamado Nicodemos, príncipe dos judeus. 2 Este foi ter de noite com Jesus e disse-lhe: Rabi, bem sabemos que és mestre vindo de Deus, porque ninguém pode fazer estes sinais que tu fazes, se Deus não for com ele. 3 Jesus respondeu e disse-lhe: Na verdade, na verdade te digo que aquele que não nascer de novo não pode ver o Reino de Deus. 4 Disse-lhe Nicodemos: Como pode um homem nascer, sendo velho? Porventura, pode tornar a entrar no ventre de sua mãe e nascer? 5 Jesus respondeu: Na verdade, na verdade te digo que aquele que não nascer da água e do Espírito não pode entrar no Reino de Deus. 6 O que é nascido da carne é carne, e o que é nascido do Espírito é espírito. 7 Não te maravilhes de te ter dito: Necessário vos é nascer de novo. 8 O vento assopra onde quer, e ouves a sua voz, mas não sabes donde vem, nem para onde vai; assim é todo aquele que é nascido do Espírito. 9 Nicodemos respondeu e disse-lhe: Como pode ser isso? 10 Jesus respondeu e disse-lhe: Tu és mestre de Israel e não sabes isso? 11 Na verdade, na verdade te digo que nós dizemos o que sabemos e testificamos o que vimos, e não aceitais o nosso testemunho. 12 Se vos falei de coisas terrestres, e não crestes, como crereis, se vos falar das celestiais? 13 Ora, ninguém subiu ao céu, senão o que desceu do céu, o Filho do Homem, que está no céu. 14 E, como Moisés levantou a serpente no deserto, assim importa que o Filho do Homem seja levantado, 15 para que todo aquele que nele crê não pereça, mas tenha a vida eterna. 16 Porque Deus amou o mundo de tal maneira que deu o seu Filho unigênito, para que todo aquele que nele crê não pereça, mas tenha a vida eterna. 17 Porque Deus enviou o seu Filho ao mundo não para que condenasse o mundo, mas para que o mundo fosse salvo por ele. 18 Quem crê nele não é condenado; mas quem não crê já está condenado, porquanto não crê no nome do unigênito Filho de Deus. 19 E a condenação é esta: Que a luz veio ao mundo, e os homens amaram mais as trevas do que a luz, porque as suas obras eram más. 20 Porque todo aquele que faz o mal aborrece a luz e não vem para a luz para que as suas obras não sejam reprovadas. 21 Mas quem pratica a verdade vem para a luz, a fim de que as suas obras sejam manifestas, porque são feitas em Deus."}}, {"id": 29, "ordem": 29, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Inicia seu Ministério em Jerusalém", "titulo": "João Batista fala mais sobre Jesus", "mateus": null, "marcos": null, "lucas": null, "joao": {"referencia": "Jo 3.22-36", "texto": "22 Depois disso, foi Jesus com os seus discípulos para a terra da Judeia; e estava ali com eles e batizava. 23 Ora, João batizava também em Enom, junto a Salim, porque havia ali muitas águas; e vinham ali e eram batizados. 24 Porque ainda João não tinha sido lançado na prisão. 25 Houve, então, uma questão entre os discípulos de João e um judeu, acerca da purificação. 26 E foram ter com João e disseram-lhe: Rabi, aquele que estava contigo além do Jordão, do qual tu deste testemunho, ei-lo batizando, e todos vão ter com ele. 27 João respondeu e disse: O homem não pode receber coisa alguma, se lhe não for dada do céu. 28 Vós mesmos me sois testemunhas de que disse: eu não sou o Cristo, mas sou enviado adiante dele. 29 Aquele que tem a esposa é o esposo; mas o amigo do esposo, que lhe assiste e o ouve, alegra-se muito com a voz do esposo. Assim, pois, já essa minha alegria está cumprida. 30 É necessário que ele cresça e que eu diminua. 31 Aquele que vem de cima é sobre todos, aquele que vem da terra é da terra e fala da terra. Aquele que vem do céu é sobre todos. 32 E aquilo que ele viu e ouviu, isso testifica; e ninguém aceita o seu testemunho. 33 Aquele que aceitou o seu testemunho, esse confirmou que Deus é verdadeiro. 34 Porque aquele que Deus enviou fala as palavras de Deus, pois não lhe dá Deus o Espírito por medida. 35 O Pai ama o Filho e todas as coisas entregou nas suas mãos. 36 Aquele que crê no Filho tem a vida eterna, mas aquele que não crê no Filho não verá a vida, mas a ira de Deus sobre ele permanece."}}, {"id": 30, "ordem": 30, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Inicia seu Ministério em Jerusalém", "titulo": "Herodes coloca João na prisão", "mateus": null, "marcos": null, "lucas": {"referencia": "Lc 3.19-20", "texto": "19 Sendo, porém, o tetrarca Herodes repreendido por ele por causa de Herodias, mulher de seu irmão Filipe, e por todas as maldades que Herodes tinha feito, 20 acrescentou a todas as outras ainda esta, a de encerrar João num cárcere."}, "joao": null}, {"id": 31, "ordem": 31, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Inicia seu Ministério em Jerusalém", "titulo": "Jesus deixa a Judeia", "mateus": {"referencia": "Mt 4.12", "texto": "12 Jesus, porém, ouvindo que João estava preso, voltou para a Galileia."}, "marcos": {"referencia": "Mc 1.14", "texto": "14 E, depois que João foi entregue à prisão, veio Jesus para a Galileia, pregando o evangelho do Reino de Deus"}, "lucas": null, "joao": {"referencia": "Jo 4.1-3", "texto": "1 E, quando o Senhor veio a saber que os fariseus tinham ouvido que Jesus fazia e batizava mais discípulos do que João 2 (ainda que Jesus mesmo não batizava, mas os seus discípulos), 3 deixou a Judeia e foi outra vez para a Galileia."}}, {"id": 32, "ordem": 32, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Ministra em Samaria", "titulo": "Jesus conversa com uma mulher junto ao poço", "mateus": null, "marcos": null, "lucas": null, "joao": {"referencia": "Jo 4.4-26", "texto": "4 E era-lhe necessário passar por Samaria. 5 Foi, pois, a uma cidade de Samaria, chamada Sicar, junto da herdade que Jacó tinha dado a seu filho José. 6 E estava ali a fonte de Jacó. Jesus, pois, cansado do caminho, assentou-se assim junto da fonte. Era isso quase à hora sexta. 7 Veio uma mulher de Samaria tirar água. Disse-lhe Jesus: Dá-me de beber. 8 Porque os seus discípulos tinham ido à cidade comprar comida. 9 Disse-lhe, pois, a mulher samaritana: Como, sendo tu judeu, me pedes de beber a mim, que sou mulher samaritana (porque os judeus não se comunicam com os samaritanos)? 10 Jesus respondeu e disse-lhe: Se tu conheceras o dom de Deus e quem é o que te diz: Dá-me de beber, tu lhe pedirias, e ele te daria água viva. 11 Disse-lhe a mulher: Senhor, tu não tens com que a tirar, e o poço é fundo; onde, pois, tens a água viva? 12 És tu maior do que Jacó, o nosso pai, que nos deu o poço, bebendo ele próprio dele, e os seus filhos, e o seu gado? 13 Jesus respondeu e disse-lhe: Qualquer que beber desta água tornará a ter sede, 14 mas aquele que beber da água que eu lhe der nunca terá sede, porque a água que eu lhe der se fará nele uma fonte de água a jorrar para a vida eterna. 15 Disse-lhe a mulher: Senhor, dá-me dessa água, para que não mais tenha sede e não venha aqui tirá-la. 16 Disse-lhe Jesus: Vai, chama o teu marido e vem cá. 17 A mulher respondeu e disse: Não tenho marido. Disse-lhe Jesus: Disseste bem: Não tenho marido, 18 porque tiveste cinco maridos e o que agora tens não é teu marido; isso disseste com verdade. 19 Disse-lhe a mulher: Senhor, vejo que és profeta. 20 Nossos pais adoraram neste monte, e vós dizeis que é em Jerusalém o lugar onde se deve adorar. 21 Disse-lhe Jesus: Mulher, crê-me que a hora vem em que nem neste monte nem em Jerusalém adorareis o Pai. 22 Vós adorais o que não sabeis; nós adoramos o que sabemos porque a salvação vem dos judeus. 23 Mas a hora vem, e agora é, em que os verdadeiros adoradores adorarão o Pai em espírito e em verdade, porque o Pai procura a tais que assim o adorem. 24 Deus é Espírito, e importa que os que o adoram o adorem em espírito e em verdade. 25 A mulher disse-lhe: Eu sei que o Messias (que se chama o Cristo) vem; quando ele vier, nos anunciará tudo. 26 Jesus disse-lhe: Eu o sou, eu que falo contigo."}}, {"id": 33, "ordem": 33, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Ministra em Samaria", "titulo": "Jesus fala sobre a colheita espiritual", "mateus": null, "marcos": null, "lucas": null, "joao": {"referencia": "Jo 4.27-38", "texto": "27 E nisso vieram os seus discípulos e maravilharam-se de que estivesse falando com uma mulher; todavia, nenhum lhe disse: Que perguntas? ou: Por que falas com ela? 28 Deixou, pois, a mulher o seu cântaro, e foi à cidade, e disse àqueles homens: 29 Vinde e vede um homem que me disse tudo quanto tenho feito; porventura, não é este o Cristo? 30 Saíram, pois, da cidade e foram ter com ele. 31 E, entretanto, os seus discípulos lhe rogaram, dizendo: Rabi, come. 32 Porém ele lhes disse: Uma comida tenho para comer, que vós não conheceis. 33 Então, os discípulos diziam uns aos outros: Trouxe-lhe, porventura, alguém de comer? 34 Jesus disse-lhes: A minha comida é fazer a vontade daquele que me enviou e realizar a sua obra. 35 Não dizeis vós que ainda há quatro meses até que venha a ceifa? Eis que eu vos digo: levantai os vossos olhos e vede as terras, que já estão brancas para a ceifa. 36 E o que ceifa recebe galardão e ajunta fruto para a vida eterna, para que, assim o que semeia como o que ceifa, ambos se regozijem. 37 Porque nisso é verdadeiro o ditado: Um é o que semeia, e outro, o que ceifa. 38 Eu vos enviei a ceifar onde vós não trabalhastes; outros trabalharam, e vós entrastes no seu trabalho."}}, {"id": 34, "ordem": 34, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Ministra em Samaria", "titulo": "Muitos samaritanos creem em Jesus", "mateus": null, "marcos": null, "lucas": null, "joao": {"referencia": "Jo 4.39-42", "texto": "39 E muitos dos samaritanos daquela cidade creram nele, pela palavra da mulher, que testificou: Disse-me tudo quanto tenho feito. 40 Indo, pois, ter com ele os samaritanos, rogaram-lhe que ficasse com eles; e ficou ali dois dias. 41 E muitos mais creram nele, por causa da sua palavra. 42 E diziam à mulher: Já não é pelo que disseste que nós cremos, porque nós mesmos o temos ouvido e sabemos que este é verdadeiramente o Cristo, o Salvador do mundo."}}, {"id": 35, "ordem": 35, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Ministra na Galileia", "titulo": "Jesus prega na Galileia", "mateus": {"referencia": "Mt 4.13-17", "texto": "13 E, deixando Nazaré, foi habitar em Cafarnaum, cidade marítima, nos confins de Zebulom e Naftali, 14 para que se cumprisse o que foi dito pelo profeta Isaías, que diz: 15 A terra de Zebulom e a terra de Naftali, junto ao caminho do mar, além do Jordão, a Galileia das nações, 16 o povo que estava assentado em trevas viu uma grande luz; e aos que estavam assentados na região e sombra da morte a luz raiou. 17 Desde então, começou Jesus a pregar e a dizer: Arrependei-vos, porque é chegado o Reino dos céus."}, "marcos": {"referencia": "Mc 1.15", "texto": "15 e dizendo: O tempo está cumprido, e o Reino de Deus está próximo. Arrependei-vos e crede no evangelho."}, "lucas": {"referencia": "Lc 4.14-15", "texto": "14 Então, pela virtude do Espírito, voltou Jesus para a Galileia, e a sua fama correu por todas as terras em derredor. 15 E ensinava nas suas sinagogas e por todos era louvado."}, "joao": {"referencia": "Jo 4.43-45", "texto": "43 E, dois dias depois, partiu dali e foi para a Galileia. 44 Porque Jesus mesmo testificou que um profeta não tem honra na sua própria pátria. 45 Chegando, pois, à Galileia, os galileus o receberam, porque viram todas as coisas que fizera em Jerusalém no dia da festa; porque também eles tinham ido à festa."}}, {"id": 36, "ordem": 36, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Ministra na Galileia", "titulo": "Jesus cura o filho de um oficial do governo", "mateus": null, "marcos": null, "lucas": null, "joao": {"referencia": "Jo 4.46-54", "texto": "46 Segunda vez foi Jesus a Caná da Galileia, onde da água fizera vinho. E havia ali um oficial do rei, cujo filho estava enfermo em Cafarnaum. 47 Ouvindo este que Jesus vinha da Judeia para a Galileia, foi ter com ele e rogou-lhe que descesse e curasse o seu filho, porque já estava à morte. 48 Então, Jesus lhe disse: Se não virdes sinais e milagres, não crereis. 49 Disse-lhe o oficial: Senhor, desce, antes que meu filho morra. 50 Disse-lhe Jesus: Vai, o teu filho vive. E o homem creu na palavra que Jesus lhe disse e foi-se. 51 E, descendo ele logo, saíram-lhe ao encontro os seus servos e lhe anunciaram, dizendo: O teu filho vive. 52 Perguntou-lhes, pois, a que hora se achara melhor; e disseram-lhe: Ontem, às sete horas, a febre o deixou. 53 Entendeu, pois, o pai que era aquela hora a mesma em que Jesus lhe disse: O teu filho vive; e creu ele, e toda a sua casa. 54 Jesus fez este segundo milagre quando ia da Judeia para a Galileia."}}, {"id": 37, "ordem": 37, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Ministra na Galileia", "titulo": "Alguns pescadores seguem Jesus", "mateus": {"referencia": "Mt 4.18-22", "texto": "18 E Jesus, andando junto ao mar da Galileia, viu dois irmãos, Simão, chamado Pedro, e André, os quais lançavam as redes ao mar, porque eram pescadores. 19 E disse-lhes: Vinde após mim, e eu vos farei pescadores de homens. 20 Então, eles, deixando logo as redes, seguiram-no. 21 E, adiantando-se dali, viu outros dois irmãos: Tiago, filho de Zebedeu, e João, seu irmão, num barco com Zebedeu, seu pai, consertando as redes; e chamou-os. 22 Eles, deixando imediatamente o barco e seu pai, seguiram-no."}, "marcos": {"referencia": "Mc 1.16-20", "texto": "16 E, andando junto ao mar da Galileia, viu Simão e André, seu irmão, que lançavam a rede ao mar, pois eram pescadores. 17 E Jesus lhes disse: Vinde após mim, e eu farei que sejais pescadores de homens. 18 E, deixando logo as suas redes, o seguiram. 19 E, passando dali um pouco mais adiante, viu Tiago, filho de Zebedeu, e João, seu irmão, que estavam no barco consertando as redes, 20 e logo os chamou. E eles, deixando o seu pai Zebedeu no barco com os empregados, foram após ele."}, "lucas": {"referencia": "Lc 5.1-11", "texto": "1 E aconteceu que, apertando-o a multidão para ouvir a palavra de Deus, estava ele junto ao lago de Genesaré. 2 E viu estar dois barcos junto à praia do lago; e os pescadores, havendo descido deles, estavam lavando as redes. 3 E, entrando num dos barcos, que era o de Simão, pediu-lhe que o afastasse um pouco da terra; e, assentando-se, ensinava do barco a multidão. 4 E, quando acabou de falar, disse a Simão: faze-te ao mar alto, e lançai as vossas redes para pescar. 5 E, respondendo Simão, disse-lhe: Mestre, havendo trabalhado toda a noite, nada apanhamos; mas, porque mandas, lançarei a rede. 6 E, fazendo assim, colheram uma grande quantidade de peixes, e rompia-se-lhes a rede. 7 E fizeram sinal aos companheiros que estavam no outro barco, para que os fossem ajudar. E foram e encheram ambos os barcos, de maneira tal que quase iam a pique. 8 E, vendo isso Simão Pedro, prostrou-se aos pés de Jesus, dizendo: Senhor, ausenta-te de mim, por que sou um homem pecador. 9 Pois que o espanto se apoderara dele e de todos os que com ele estavam, por causa da pesca que haviam feito, 10 e, de igual modo, também de Tiago e João, filhos de Zebedeu, que eram companheiros de Simão. E disse Jesus a Simão: Não temas; de agora em diante, serás pescador de homens. 11 E, levando os barcos para terra, deixaram tudo e o seguiram."}, "joao": null}, {"id": 38, "ordem": 38, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Ministra na Galileia", "titulo": "Jesus ensina com autoridade", "mateus": null, "marcos": {"referencia": "Mc 1.21-28", "texto": "21 Entraram em Cafarnaum, e, logo no sábado, indo ele à sinagoga, ali ensinava. 22 E maravilharam-se da sua doutrina, porque os ensinava como tendo autoridade e não como os escribas. 23 E estava na sinagoga deles um homem com um espírito imundo, o qual exclamou, dizendo: 24 Ah! Que temos contigo, Jesus Nazareno? Vieste destruir-nos? Bem sei quem és: o Santo de Deus. 25 E repreendeu-o Jesus, dizendo: Cala-te e sai dele. 26 Então, o espírito imundo, agitando-o e clamando com grande voz, saiu dele. 27 E todos se admiraram, a ponto de perguntarem entre si, dizendo: Que é isto? Que nova doutrina é esta? Pois com autoridade ordena aos espíritos imundos, e eles lhe obedecem! 28 E logo correu a sua fama por toda a província da Galileia."}, "lucas": {"referencia": "Lc 4.31-37", "texto": "31 E desceu a Cafarnaum, cidade da Galileia, e os ensinava nos sábados. 32 E admiravam-se da sua doutrina, porque a sua palavra era com autoridade. 33 E estava na sinagoga um homem que tinha um espírito de um demônio imundo, e este exclamou em alta voz, 34 dizendo: Ah! Que temos nós contigo, Jesus Nazareno? Vieste a destruir-nos? Bem sei quem és: o Santo de Deus. 35 E Jesus o repreendeu, dizendo: Cala-te e sai dele. E o demônio, lançando-o por terra no meio do povo, saiu dele, sem lhe fazer mal. 36 E veio espanto sobre todos, e falavam uns e outros, dizendo: Que palavra é esta, que até aos espíritos imundos manda com autoridade e poder, e eles saem? 37 E a sua fama divulgava-se por todos os lugares, em redor daquela comarca."}, "joao": null}, {"id": 39, "ordem": 39, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Ministra na Galileia", "titulo": "Jesus cura a sogra de Pedro e muitos outros", "mateus": {"referencia": "Mt 8.14-17", "texto": "14 E Jesus, entrando na casa de Pedro, viu a sogra deste jazendo com febre. 15 E tocou-lhe na mão, e a febre a deixou; e levantou-se e serviu-os. 16 E, chegada a tarde, trouxeram-lhe muitos endemoninhados, e ele, com a sua palavra, expulsou deles os espíritos e curou todos os que estavam enfermos, 17 para que se cumprisse o que fora dito pelo profeta Isaías, que diz: Ele tomou sobre si as nossas enfermidades e levou as nossas doenças."}, "marcos": {"referencia": "Mc 1.29-34", "texto": "29 E logo, saindo da sinagoga, foram à casa de Simão e de André, com Tiago e João. 30 E a sogra de Simão estava deitada, com febre; e logo lhe falaram dela. 31 Então, chegando-se a ela, tomou-a pela mão e levantou-a; e a febre a deixou, e servia-os. 32 E, tendo chegado a tarde, quando já estava se pondo o sol, trouxeram-lhe todos os que se achavam enfermos e os endemoninhados. 33 E toda a cidade se ajuntou à porta. 34 E curou muitos que se achavam enfermos de diversas enfermidades e expulsou muitos demônios, porém não deixava falar os demônios, porque o conheciam."}, "lucas": {"referencia": "Lc 4.38-41", "texto": "38 Ora, levantando-se Jesus da sinagoga, entrou em casa de Simão; e a sogra de Simão estava enferma com muita febre; e rogaram-lhe por ela. 39 E, inclinando-se para ela, repreendeu a febre, e esta a deixou. E ela, levantando-se logo, servia-os. 40 E, ao pôr do sol, todos os que tinham enfermos de várias doenças lhos traziam; e, impondo as mãos sobre cada um deles, os curava. 41 E também de muitos saíam demônios, clamando e dizendo: Tu és o Cristo, o Filho de Deus. E ele, repreendendo-os, não os deixava falar, pois sabiam que ele era o Cristo."}, "joao": null}, {"id": 40, "ordem": 40, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Ministra na Galileia", "titulo": "Jesus prega por toda a Galileia", "mateus": {"ref
