usteis; buscais a Jesus, o Nazareno, que foi crucificado; já ressuscitou, não está aqui; eis aqui o lugar onde o puseram. 7 Mas ide, dizei a seus discípulos e a Pedro que ele vai adiante de vós para a Galileia; ali o vereis, como ele vos disse. 8 E, saindo elas apressadamente, fugiram do sepulcro, porque estavam possuídas de temor e assombro; e nada diziam a ninguém, porque temiam."}, "lucas": {"referencia": "Lc 24.1-11", "texto": "1 E, no primeiro dia da semana, muito de madrugada, foram elas ao sepulcro, levando as especiarias que tinham preparado. 2 E acharam a pedra do sepulcro removida. 3 E, entrando, não acharam o corpo do Senhor Jesus. 4 E aconteceu que, estando elas perplexas a esse respeito, eis que pararam junto delas dois varões com vestes resplandecentes. 5 E, estando elas muito atemorizadas e abaixando o rosto para o chão, eles lhe disseram: Por que buscais o vivente entre os mortos? 6 Não está aqui, mas ressuscitou. Lembrai-vos como vos falou, estando ainda na Galileia, 7 dizendo: Convém que o Filho do Homem seja entregue nas mãos de homens pecadores, e seja crucificado, e, ao terceiro dia, ressuscite. 8 E lembraram-se das suas palavras. 9 E, voltando do sepulcro, anunciaram todas essas coisas aos onze e a todos os demais. 10 E eram Maria Madalena, e Joana, e Maria, mãe de Tiago, e as outras que com elas estavam as que diziam estas coisas aos apóstolos. 11 E as suas palavras lhes pareciam como desvario, e não as creram."}, "joao": {"referencia": "Jo 20.1-2", "texto": "1 E, no primeiro dia da semana, Maria Madalena foi ao sepulcro de madrugada, sendo ainda escuro, e viu a pedra tirada do sepulcro. 2 Correu, pois, e foi a Simão Pedro e ao outro discípulo a quem Jesus amava e disse-lhes: Levaram o Senhor do sepulcro, e não sabemos onde o puseram."}}, {"id": 240, "ordem": 240, "secao": "C. Morte e Ressurreição de Jesus", "subsecao": null, "titulo": "Pedro e João correm até o sepulcro", "mateus": null, "marcos": null, "lucas": {"referencia": "Lc 24.12", "texto": "12 Pedro, porém, levantando-se, correu ao sepulcro e, abaixando-se, viu só os lenços ali postos; e retirou-se, admirando consigo aquele caso."}, "joao": {"referencia": "Jo 20.3-10", "texto": "3 Então, Pedro saiu com o outro discípulo e foram ao sepulcro. 4 E os dois corriam juntos, mas o outro discípulo correu mais apressadamente do que Pedro e chegou primeiro ao sepulcro. 5 E, abaixando-se, viu no chão os lençóis; todavia, não entrou. 6 Chegou, pois, Simão Pedro, que o seguia, e entrou no sepulcro, e viu no chão os lençóis 7 e que o lenço que tinha estado sobre a sua cabeça não estava com os lençóis, mas enrolado, num lugar à parte. 8 Então, entrou também o outro discípulo, que chegara primeiro ao sepulcro, e viu, e creu. 9 Porque ainda não sabiam a Escritura, que diz que era necessário que ressuscitasse dos mortos. 10 Tornaram, pois, os discípulos para casa."}}, {"id": 241, "ordem": 241, "secao": "C. Morte e Ressurreição de Jesus", "subsecao": null, "titulo": "Jesus aparece às mulheres", "mateus": {"referencia": "Mt 28.9-10", "texto": "9 E, indo elas, eis que Jesus lhes sai ao encontro, dizendo: Eu vos saúdo. E elas, chegando, abraçaram os seus pés e o adoraram. 10 Então, Jesus disse-lhes: Não temais; ide dizer a meus irmãos que vão a Galileia e lá me verão."}, "marcos": {"referencia": "Mc 16.9-11", "texto": "9 E Jesus, tendo ressuscitado na manhã do primeiro dia da semana, apareceu primeiramente a Maria Madalena, da qual tinha expulsado sete demônios. 10 E, partindo ela, anunciou-o àqueles que tinham estado com ele, os quais estavam tristes e chorando. 11 E, ouvindo eles que Jesus vivia e que tinha sido visto por ela, não o creram."}, "lucas": null, "joao": {"referencia": "Jo 20.11-18", "texto": "11 E Maria estava chorando fora, junto ao sepulcro. Estando ela, pois, chorando, abaixou-se para o sepulcro 12 e viu dois anjos vestidos de branco, assentados onde jazera o corpo de Jesus, um à cabeceira e outro aos pés. 13 E disseram-lhe eles: Mulher, por que choras? Ela lhes disse: Porque levaram o meu Senhor, e não sei onde o puseram. 14 E, tendo dito isso, voltou-se para trás e viu Jesus em pé, mas não sabia que era Jesus. 15 Disse-lhe Jesus: Mulher, por que choras? Quem buscas? Ela, cuidando que era o hortelão, disse-lhe: Senhor, se tu o levaste, dize-me onde o puseste, e eu o levarei. 16 Disse-lhe Jesus: Maria! Ela, voltando-se, disse-lhe: Raboni (que quer dizer Mestre)! 17 Disse-lhe Jesus: Não me detenhas, porque ainda não subi para meu Pai, mas vai para meus irmãos e dize-lhes que eu subo para meu Pai e vosso Pai, meu Deus e vosso Deus. 18 Maria Madalena foi e anunciou aos discípulos que vira o Senhor e que ele lhe dissera isso."}}, {"id": 242, "ordem": 242, "secao": "C. Morte e Ressurreição de Jesus", "subsecao": null, "titulo": "Os líderes religiosos subornam os guardas", "mateus": {"referencia": "Mt 28.11-15", "texto": "11 E, quando iam, eis que alguns da guarda, chegando à cidade, anunciaram aos príncipes dos sacerdotes todas as coisas que haviam acontecido. 12 E, congregados eles com os anciãos e tomando conselho entre si, deram muito dinheiro aos soldados, ordenando: 13 Dizei: Vieram de noite os seus discípulos e, dormindo nós, o furtaram. 14 E, se isso chegar a ser ouvido pelo governador, nós o persuadiremos e vos poremos em segurança. 15 E eles, recebendo o dinheiro, fizeram como estavam instruídos. E foi divulgado esse dito entre os judeus, até ao dia de hoje."}, "marcos": null, "lucas": null, "joao": null}, {"id": 243, "ordem": 243, "secao": "C. Morte e Ressurreição de Jesus", "subsecao": null, "titulo": "Jesus aparece a dois crentes que viajam pela estrada", "mateus": null, "marcos": {"referencia": "Mc 16.12-13", "texto": "12 E, depois, manifestou-se em outra forma a dois deles que iam de caminho para o campo. 13 E, indo estes, anunciaram-no aos outros, mas nem ainda estes creram."}, "lucas": {"referencia": "Lc 24.13-35", "texto": "13 E eis que, no mesmo dia, iam dois deles para uma aldeia que distava de Jerusalém sessenta estádios, cujo nome era Emaús. 14 E iam falando entre si de tudo aquilo que havia sucedido. 15 E aconteceu que, indo eles falando entre si e fazendo perguntas um ao outro, o mesmo Jesus se aproximou e ia com eles. 16 Mas os olhos deles estavam como que fechados, para que o não conhecessem. 17 E ele lhes disse: Que palavras são essas que, caminhando, trocais entre vós e por que estais tristes? 18 E, respondendo um, cujo nome era Cleopas, disse-lhe: És tu só peregrino em Jerusalém e não sabes as coisas que nela têm sucedido nestes dias? 19 E ele lhes perguntou: Quais? E eles lhe disseram: As que dizem respeito a Jesus, o Nazareno, que foi um profeta poderoso em obras e palavras diante de Deus e de todo o povo; 20 e como os principais dos sacerdotes e os nossos príncipes o entregaram à condenação de morte e o crucificaram. 21 E nós esperávamos que fosse ele o que remisse Israel; mas, agora, com tudo isso, é já hoje o terceiro dia desde que essas coisas aconteceram. 22 É verdade que também algumas mulheres dentre nós nos maravilharam, as quais de madrugada foram ao sepulcro; 23 e, não achando o seu corpo, voltaram, dizendo que também tinham visto uma visão de anjos, que dizem que ele vive. 24 E alguns dos que estavam conosco foram ao sepulcro e acharam ser assim como as mulheres haviam dito, porém, não o viram. 25 E ele lhes disse: Ó néscios e tardos de coração para crer tudo o que os profetas disseram! 26 Porventura, não convinha que o Cristo padecesse essas coisas e entrasse na sua glória? 27 E, começando por Moisés e por todos os profetas, explicava-lhes o que dele se achava em todas as Escrituras. 28 E chegaram à aldeia para onde iam, e ele fez como quem ia para mais longe. 29 E eles o constrangeram, dizendo: Fica conosco, porque já é tarde, e já declinou o dia. E entrou para ficar com eles. 30 E aconteceu que, estando com eles à mesa, tomando o pão, o abençoou e partiu-o e lho deu. 31 Abriram-se-lhes, então, os olhos, e o conheceram, e ele desapareceu-lhes. 32 E disseram um para o outro: Porventura, não ardia em nós o nosso coração quando, pelo caminho, nos falava e quando nos abria as Escrituras? 33 E, na mesma hora, levantando-se, voltaram para Jerusalém e acharam congregados os onze e os que estavam com eles, 34 os quais diziam: Ressuscitou, verdadeiramente, o Senhor e já apareceu a Simão. 35 E eles lhes contaram o que lhes acontecera no caminho, e como deles foi conhecido no partir do pão."}, "joao": null}, {"id": 244, "ordem": 244, "secao": "C. Morte e Ressurreição de Jesus", "subsecao": null, "titulo": "Jesus aparece a seus discípulos", "mateus": null, "marcos": {"referencia": "Mc 16.14", "texto": "14 Finalmente apareceu aos onze, estando eles assentados juntamente, e lançou-lhes em rosto a sua incredulidade e dureza de coração, por não haverem crido nos que o tinham visto já ressuscitado."}, "lucas": {"referencia": "Lc 24.36-43", "texto": "36 E, falando ele dessas coisas, o mesmo Jesus se apresentou no meio deles e disse-lhes: Paz seja convosco. 37 E eles, espantados e atemorizados, pensavam que viam algum espírito. 38 E ele lhes disse: Por que estais perturbados, e por que sobem tais pensamentos ao vosso coração? 39 Vede as minhas mãos e os meus pés, que sou eu mesmo; tocai-me e vede, pois um espírito não tem carne nem ossos, como vedes que eu tenho. 40 E, dizendo isso, mostrou-lhes as mãos e os pés. 41 E, não o crendo eles ainda por causa da alegria e estando maravilhados, disse-lhes: Tendes aqui alguma coisa que comer? 42 Então, eles apresentaram-lhe parte de um peixe assado e um favo de mel, 43 o que ele tomou e comeu diante deles."}, "joao": {"referencia": "Jo 20.19-23", "texto": "19 Chegada, pois, a tarde daquele dia, o primeiro da semana, e cerradas as portas onde os discípulos, com medo dos judeus, se tinham ajuntado, chegou Jesus, e pôs-se no meio, e disse-lhes: Paz seja convosco! 20 E, dizendo isso, mostrou-lhes as mãos e o lado. De sorte que os discípulos se alegraram, vendo o Senhor. 21 Disse-lhes, pois, Jesus outra vez: Paz seja convosco! Assim como o Pai me enviou, também eu vos envio a vós. 22 E, havendo dito isso, assoprou sobre eles e disse-lhes: Recebei o Espírito Santo. 23 Àqueles a quem perdoardes os pecados, lhes são perdoados; e, àqueles a quem os retiverdes, lhes são retidos."}}, {"id": 245, "ordem": 245, "secao": "C. Morte e Ressurreição de Jesus", "subsecao": null, "titulo": "Jesus aparece a Tomé", "mateus": null, "marcos": null, "lucas": null, "joao": {"referencia": "Jo 20.24-31", "texto": "24 Ora, Tomé, um dos doze, chamado Dídimo, não estava com eles quando veio Jesus. 25 Disseram-lhe, pois, os outros discípulos: Vimos o Senhor. Mas ele disse-lhes: Se eu não vir o sinal dos cravos em suas mãos, e não puser o dedo no lugar dos cravos, e não puser a minha mão no seu lado, de maneira nenhuma o crerei. 26 E, oito dias depois, estavam outra vez os seus discípulos dentro, e, com eles, Tomé. Chegou Jesus, estando as portas fechadas, e apresentou-se no meio, e disse: Paz seja convosco! 27 Depois, disse a Tomé: Põe aqui o teu dedo e vê as minhas mãos; chega a tua mão e põe-na no meu lado; não sejas incrédulo, mas crente. 28 Tomé respondeu e disse-lhe: Senhor meu, e Deus meu! 29 Disse-lhe Jesus: Porque me viste, Tomé, creste; bem-aventurados os que não viram e creram! 30 Jesus, pois, operou também, em presença de seus discípulos, muitos outros sinais, que não estão escritos neste livro. 31 Estes, porém, foram escritos para que creiais que Jesus é o Cristo, o Filho de Deus, e para que, crendo, tenhais vida em seu nome."}}, {"id": 246, "ordem": 246, "secao": "C. Morte e Ressurreição de Jesus", "subsecao": null, "titulo": "Jesus aparece a sete discípulos", "mateus": null, "marcos": null, "lucas": null, "joao": {"referencia": "Jo 21.1-14", "texto": "1 Depois disso, manifestou-se Jesus outra vez aos discípulos, junto ao mar de Tiberíades; e manifestou-se assim: 2 estavam juntos Simão Pedro, e Tomé, chamado Dídimo, e Natanael, que era de Caná da Galileia, e os filhos de Zebedeu, e outros dois dos seus discípulos. 3 Disse-lhes Simão Pedro: Vou pescar. Disseram-lhe eles: Também nós vamos contigo. Foram, e subiram logo para o barco, e naquela noite nada apanharam. 4 E, sendo já manhã, Jesus se apresentou na praia, mas os discípulos não conheceram que era Jesus. 5 Disse-lhes, pois, Jesus: Filhos, tendes alguma coisa de comer? Responderam-lhe: Não. 6 E ele lhes disse: Lançai a rede à direita do barco e achareis. Lançaram-na, pois, e já não a podiam tirar, pela multidão dos peixes. 7 Então, aquele discípulo a quem Jesus amava disse a Pedro: É o Senhor. E, quando Simão Pedro ouviu que era o Senhor, cingiu-se com a túnica (porque estava nu) e lançou-se ao mar. 8 E os outros discípulos foram com o barco (porque não estavam distantes da terra senão quase duzentos côvados), levando a rede cheia de peixes. 9 Logo que saltaram em terra, viram ali brasas, e um peixe posto em cima, e pão. 10 Disse-lhes Jesus: Trazei dos peixes que agora apanhastes. 11 Simão Pedro subiu e puxou a rede para terra, cheia de cento e cinquenta e três grandes peixes; e, sendo tantos, não se rompeu a rede. 12 Disse-lhes Jesus: Vinde, jantai. E nenhum dos discípulos ousava perguntar-lhe: Quem és tu? Porque sabiam que era o Senhor. 13 Chegou, pois, Jesus, e tomou o pão, e deu-lho, e, semelhantemente, o peixe. 14 E já era a terceira vez que Jesus se manifestava aos seus discípulos depois de ter ressuscitado dos mortos."}}, {"id": 247, "ordem": 247, "secao": "C. Morte e Ressurreição de Jesus", "subsecao": null, "titulo": "Jesus desafia Pedro", "mateus": null, "marcos": null, "lucas": null, "joao": {"referencia": "Jo 21.15-25", "texto": "15 E, depois de terem jantado, disse Jesus a Simão Pedro: Simão, filho de Jonas, amas-me mais do que estes? E ele respondeu: Sim, Senhor; tu sabes que te amo. Disse-lhe: Apascenta os meus cordeiros. 16 Tornou a dizer-lhe segunda vez: Simão, filho de Jonas, amas-me? Disse-lhe: Sim, Senhor; tu sabes que te amo. Disse-lhe: Apascenta as minhas ovelhas. 17 Disse-lhe terceira vez: Simão, filho de Jonas, amas-me? Simão entristeceu-se por lhe ter dito terceira vez: Amas-me? E disse-lhe: Senhor, tu sabes tudo; tu sabes que eu te amo. Jesus disse-lhe: Apascenta as minhas ovelhas. 18 Na verdade, na verdade te digo que, quando eras mais moço, te cingias a ti mesmo e andavas por onde querias: mas, quando já fores velho, estenderás as mãos, e outro te cingirá e te levará para onde tu não queiras. 19 E disse isso significando com que morte havia ele de glorificar a Deus. E, dito isso, disse-lhe: Segue-me. 20 E Pedro, voltando-se, viu que o seguia aquele discípulo a quem Jesus amava, e que na ceia se recostara também sobre o seu peito, e que dissera: Senhor, quem é que te há de trair? 21 Vendo Pedro a este, disse a Jesus: Senhor, e deste que será? 22 Disse-lhe Jesus: Se eu quero que ele fique até que eu venha, que te importa a ti? Segue-me tu. 23 Divulgou-se, pois, entre os irmãos o dito de que aquele discípulo não havia de morrer. Jesus, porém, não lhe disse que não morreria, mas: Se eu quero que ele fique até que eu venha, que te importa a ti? 24 Este é o discípulo que testifica dessas coisas e as escreveu; e sabemos que o seu testemunho é verdadeiro. 25 Há, porém, ainda muitas outras coisas que Jesus fez; e, se cada uma das quais fosse escrita, cuido que nem ainda o mundo todo poderia conter os livros que se escrevessem. Amém!"}}, {"id": 248, "ordem": 248, "secao": "C. Morte e Ressurreição de Jesus", "subsecao": null, "titulo": "Jesus transmite a grande comissão", "mateus": {"referencia": "Mt 28.16-20", "texto": "16 E os onze discípulos partiram para a Galileia, para o monte que Jesus lhes tinha designado. 17 E, quando o viram, o adoraram; mas alguns duvidaram. 18 E, chegando-se Jesus, falou-lhes, dizendo: É-me dado todo o poder no céu e na terra. 19 Portanto, ide, ensinai todas as nações, batizando-as em nome do Pai, e do Filho, e do Espírito Santo; 20 ensinando-as a guardar todas as coisas que eu vos tenho mandado; e eis que eu estou convosco todos os dias, até à consumação dos séculos. Amém!"}, "marcos": {"referencia": "Mc 16.15-18", "texto": "15 E disse-lhes: Ide por todo o mundo, pregai o evangelho a toda criatura. 16 Quem crer e for batizado será salvo; mas quem não crer será condenado. 17 E estes sinais seguirão aos que crerem: em meu nome, expulsarão demônios; falarão novas línguas; 18 pegarão nas serpentes; e, se beberem alguma coisa mortífera, não lhes fará dano algum; e imporão as mãos sobre os enfermos e os curarão."}, "lucas": null, "joao": null}, {"id": 249, "ordem": 249, "secao": "C. Morte e Ressurreição de Jesus", "subsecao": null, "titulo": "Jesus aparece aos discípulos em Jerusalém", "mateus": null, "marcos": null, "lucas": {"referencia": "Lc 24.44-49", "texto": "44 E disse-lhes: São estas as palavras que vos disse estando ainda convosco: convinha que se cumprisse tudo o que de mim estava escrito na Lei de Moisés, e nos Profetas, e nos Salmos. 45 Então, abriu-lhes o entendimento para compreenderem as Escrituras. 46 E disse-lhes: Assim está escrito, e assim convinha que o Cristo padecesse e, ao terceiro dia, ressuscitasse dos mortos; 47 e, em seu nome, se pregasse o arrependimento e a remissão dos pecados, em todas as nações, começando por Jerusalém. 48 E dessas coisas sois vós testemunhas. 49 E eis que sobre vós envio a promessa de meu Pai; ficai, porém, na cidade de Jerusalém, até que do alto sejais revestidos de poder."}, "joao": null}, {"id": 250, "ordem": 250, "secao": "C. Morte e Ressurreição de Jesus", "subsecao": null, "titulo": "Jesus ascende ao céu", "mateus": null, "marcos": {"referencia": "Mc 16.19-20", "texto": "19 Ora, o Senhor, depois de lhes ter falado, foi recebido no céu e assentou-se à direita de Deus. 20 E eles, tendo partido, pregaram por todas as partes, cooperando com eles o Senhor e confirmando a palavra com os sinais que se seguiram. Amém!"}, "lucas": {"referencia": "Lc 24.50-53", "texto": "50 E levou-os fora, até Betânia; e, levantando as mãos, os abençoou. 51 E aconteceu que, abençoando-os ele, se apartou deles e foi elevado ao céu. 52 E, adorando-o eles, tornaram com grande júbilo para Jerusalém. 53 E estavam sempre no templo, louvando e bendizendo a Deus. Amém!"}, "joao": null}];
</script>
<script>
/**
 * app.js — Evangelhos Cronológicos
 * Versão 1.1 | Vanilla JS | Sem dependências externas
 *
 * Módulos internos:
 *   Estado      – store reativo mínimo
 *   Persistência – localStorage
 *   Dados       – carregamento de cronologia.json
 *   UI Lista    – tela principal
 *   UI Leitura  – tela de leitura
 *   UI Config   – painel de preferências
 *   Busca       – filtragem instantânea
 *   Favoritos   – lista de favoritos
 */

'use strict';

/* ═══════════════════════════════════════════════════════════════════════════════
   ESTADO GLOBAL
═══════════════════════════════════════════════════════════════════════════════ */

const Estado = (() => {
  const _state = {
    cronologia:    [],      // array completo de eventos
    visivel:       [],      // eventos filtrados exibidos
    eventoAtual:   null,    // id do evento aberto na leitura
    abaNativa:     'lista', // 'lista' | 'favoritos'
    busca:         '',

    // Persistidos no localStorage
    progresso:    {},  // { [id]: 'nao-iniciado' | 'em-leitura' | 'concluido' }
    favoritos:    [],  // [id, id, ...]
    destaques:    {},  // { [id]: [{ inicio, fim, texto }] }
    anotacoes:    {},  // { [id]: string }
    ultimoItem:   null,
    prefs: {
      tema:         'escuro',   // 'escuro' | 'claro'
      fonte:        'media',    // 'pequena' | 'media' | 'grande' | 'xgrande'
      espacamento:  'normal',   // 'compacto' | 'normal' | 'amplo'
      tipoFonte:    'sansserif',// 'sansserif' | 'serifada'
    },
  };

  return {
    get: k => _state[k],
    set: (k, v) => { _state[k] = v; },
    estado: _state,
  };
})();

/* ═══════════════════════════════════════════════════════════════════════════════
   PERSISTÊNCIA
═══════════════════════════════════════════════════════════════════════════════ */

const Persistencia = {
  _ler(chave, padrao) {
    try {
      const v = localStorage.getItem(chave);
      return v !== null ? JSON.parse(v) : padrao;
    } catch { return padrao; }
  },
  _salvar(chave, valor) {
    try { localStorage.setItem(chave, JSON.stringify(valor)); } catch {}
  },

  carregar() {
    Estado.set('progresso',  this._ler('progresso',  {}));
    Estado.set('favoritos',  this._ler('favoritos',  []));
    Estado.set('destaques',  this._ler('destaques',  {}));
    Estado.set('anotacoes',  this._ler('anotacoes',  {}));
    Estado.set('ultimoItem', this._ler('ultimoItem', null));
    Estado.set('prefs',      this._ler('preferencias', {
      tema: 'escuro', fonte: 'media', espacamento: 'normal', tipoFonte: 'sansserif'
    }));
  },

  salvarProgresso()   { this._salvar('progresso',   Estado.get('progresso')); },
  salvarFavoritos()   { this._salvar('favoritos',   Estado.get('favoritos')); },
  salvarDestaques()   { this._salvar('destaques',   Estado.get('destaques')); },
  salvarAnotacoes()   { this._salvar('anotacoes',   Estado.get('anotacoes')); },
  salvarUltimoItem()  { this._salvar('ultimoItem',  Estado.get('ultimoItem')); },
  salvarPrefs()       { this._salvar('preferencias',Estado.get('prefs')); },
};

/* ═══════════════════════════════════════════════════════════════════════════════
   DADOS
═══════════════════════════════════════════════════════════════════════════════ */

const Dados = {
  async carregar() {
    // Modo standalone: dados embutidos diretamente no HTML
    if (window.__CRONOLOGIA__) {
      Estado.set('cronologia', window.__CRONOLOGIA__);
      Estado.set('visivel',    window.__CRONOLOGIA__);
      return;
    }
    // Modo servidor: carrega via fetch
    const resp = await fetch('./dados/cronologia.json');
    if (!resp.ok) throw new Error('Erro ao carregar cronologia.json');
    const data = await resp.json();
    Estado.set('cronologia', data);
    Estado.set('visivel',    data);
  },

  evento(id) {
    return Estado.get('cronologia').find(e => e.id === id) || null;
  },

  indiceEvento(id) {
    return Estado.get('cronologia').findIndex(e => e.id === id);
  },

  evangelhoPresentes(evento) {
    return ['mateus','marcos','lucas','joao'].filter(g => evento[g] !== null);
  },
};

/* ═══════════════════════════════════════════════════════════════════════════════
   UTILIDADES
═══════════════════════════════════════════════════════════════════════════════ */

const Utils = {
  /** Formata o texto do verso com quebra por versículo */
  formatarTexto(texto) {
    if (!texto) return '';
    let primeiro = true;
    return texto.replace(/(\d+)\s/g, (_, n) => {
      if (primeiro) {
        primeiro = false;
        return `<span class="verso-num">${n}</span>\u2009`;
      }
      return `<br class="verso-break"><span class="verso-num">${n}</span>\u2009`;
    });
  },

  /** Retorna ícone de status */
  iconeStatus(status) {
    if (status === 'concluido')  return '●';
    if (status === 'em-leitura') return '◐';
    return '○';
  },

  /** Retorna classe CSS do status */
  classeStatus(status) {
    if (status === 'concluido')  return 'concluido';
    if (status === 'em-leitura') return 'em-leitura';
    return '';
  },

  /** Label legível do status */
  labelStatus(status) {
    if (status === 'concluido')  return 'Concluído';
    if (status === 'em-leitura') return 'Em leitura';
    return 'Não iniciado';
  },

  /** Proxima status ciclicamente */
  proximoStatus(atual) {
    if (atual === 'nao-iniciado') return 'em-leitura';
    if (atual === 'em-leitura')   return 'concluido';
    return 'nao-iniciado';
  },

  /** Destaca ocorrências de query no texto */
  destacarBusca(texto, query) {
    if (!query) return texto;
    const re = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
    return texto.replace(re, '<mark>$1</mark>');
  },

  /** Mostra toast por N ms */
  toast(msg, ms = 1800) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('visivel');
    setTimeout(() => el.classList.remove('visivel'), ms);
  },

  /** Conta eventos concluídos */
  contarConcluidos() {
    const prog = Estado.get('progresso');
    return Estado.get('cronologia').filter(e => prog[e.id] === 'concluido').length;
  },
};

/* ═══════════════════════════════════════════════════════════════════════════════
   TEMA & PREFERÊNCIAS
═══════════════════════════════════════════════════════════════════════════════ */

const Tema = {
  aplicar() {
    const prefs = Estado.get('prefs');
    const html  = document.documentElement;
    const classes = html.className.split(' ').filter(c =>
      !c.startsWith('tema-') && !c.startsWith('fonte-') &&
      !c.startsWith('esp-') && c !== 'fonte-serifada'
    );
    classes.push(`tema-${prefs.tema}`);
    classes.push(`fonte-${prefs.fonte}`);
    classes.push(`esp-${prefs.espacamento}`);
    if (prefs.tipoFonte === 'serifada') classes.push('fonte-serifada');
    html.className = classes.join(' ').trim();
  },
};

/* ═══════════════════════════════════════════════════════════════════════════════
   INDICADOR DOS EVANGELHOS
═══════════════════════════════════════════════════════════════════════════════ */

function criarIndicador(evento, grande = false) {
  const evangelhos = ['mateus', 'marcos', 'lucas', 'joao'];
  const div = document.createElement('div');
  div.className = `indicador-evangelhos${grande ? ' grande' : ''}`;
  div.setAttribute('aria-label', evangelhos.map(g =>
    `${g[0].toUpperCase() + g.slice(1)}: ${evento[g] ? 'presente' : 'ausente'}`
  ).join(', '));
  evangelhos.forEach(g => {
    const dot = document.createElement('span');
    dot.className = `dot${evento[g] ? ' presente' : ''}`;
    div.appendChild(dot);
  });
  return div;
}

/* ═══════════════════════════════════════════════════════════════════════════════
   BARRA DE PROGRESSO GLOBAL
═══════════════════════════════════════════════════════════════════════════════ */

function atualizarBarraProgresso() {
  const total      = Estado.get('cronologia').length;
  const concluidos = Utils.contarConcluidos();
  const pct        = total ? Math.round((concluidos / total) * 100) : 0;

  document.getElementById('progresso-texto').textContent  = `${concluidos} / ${total}`;
  document.getElementById('progresso-pct').textContent    = `${pct}%`;
  document.getElementById('barra-progresso-fill').style.width = `${pct}%`;
}

/* ═══════════════════════════════════════════════════════════════════════════════
   BANNER CONTINUAR LEITURA
═══════════════════════════════════════════════════════════════════════════════ */

function atualizarBannerContinuar() {
  const ultimo = Estado.get('ultimoItem');
  const banner = document.getElementById('banner-continuar');
  if (!ultimo) { banner.classList.remove('visivel'); return; }
  const ev = Dados.evento(ultimo);
  if (!ev)  { banner.classList.remove('visivel'); return; }
  document.getElementById('btn-continuar-titulo').textContent = ev.titulo;
  banner.classList.add('visivel');
}

/* ═══════════════════════════════════════════════════════════════════════════════
   LISTA PRINCIPAL
═══════════════════════════════════════════════════════════════════════════════ */

const Lista = {
  _ultimaSecao:    null,
  _ultimaSubsecao: null,

  renderizar(eventos, query = '') {
    const container = document.getElementById('lista-principal');
    container.innerHTML = '';
    this._ultimaSecao    = null;
    this._ultimaSubsecao = null;

    const semResultados = document.getElementById('sem-resultados');
    if (!eventos.length) {
      semResultados.style.display = 'block';
      return;
    }
    semResultados.style.display = 'none';

    const frag = document.createDocumentFragment();

    eventos.forEach((ev, idx) => {
      // Cabeçalho de seção
      if (!query && ev.secao !== this._ultimaSecao) {
        this._ultimaSecao    = ev.secao;
        this._ultimaSubsecao = null;
        const h = document.createElement('div');
        h.className = 'secao-header';
        h.textContent = ev.secao;
        frag.appendChild(h);
      }

      // Cabeçalho de subseção
      if (!query && ev.subsecao && ev.subsecao !== this._ultimaSubsecao) {
        this._ultimaSubsecao = ev.subsecao;
        const hs = document.createElement('div');
        hs.className = 'subsecao-header';
        hs.textContent = ev.subsecao;
        frag.appendChild(hs);
      }

      frag.appendChild(this._criarItem(ev, query, idx));
    });

    container.appendChild(frag);
  },

  _criarItem(ev, query, idx) {
    const prog  = Estado.get('progresso');
    const favs  = Estado.get('favoritos');
    const status = prog[ev.id] || 'nao-iniciado';
    const favoritado = favs.includes(ev.id);

    const li = document.createElement('div');
    li.className = 'item-lista';
    li.dataset.id = ev.id;
    li.style.animationDelay = `${Math.min(idx * 8, 200)}ms`;

    // Número
    const num = document.createElement('span');
    num.className = 'item-numero';
    num.textContent = ev.id;

    // Centro
    const centro = document.createElement('div');
    centro.className = 'item-centro';

    const titulo = document.createElement('div');
    titulo.className = 'item-titulo';
    titulo.innerHTML = query
      ? Utils.destacarBusca(ev.titulo, query)
      : ev.titulo;

    const meta = document.createElement('div');
    meta.className = 'item-meta';
    meta.appendChild(criarIndicador(ev));

    const statusEl = document.createElement('span');
    statusEl.className = `status-icone ${Utils.classeStatus(status)}`;
    statusEl.textContent = Utils.iconeStatus(status);
    statusEl.title = Utils.labelStatus(status);
    meta.appendChild(statusEl);

    centro.appendChild(titulo);
    centro.appendChild(meta);

    // Favorito
    const favEl = document.createElement('span');
    favEl.className = `item-fav${favoritado ? ' favoritado' : ''}`;
    favEl.textContent = favoritado ? '♥' : '';

    // Seta
    const seta = document.createElement('span');
    seta.className = 'item-seta';
    seta.textContent = '›';

    li.appendChild(num);
    li.appendChild(centro);
    li.appendChild(favEl);
    li.appendChild(seta);

    li.addEventListener('click', () => Leitura.abrir(ev.id));
    return li;
  },

  atualizarItem(id) {
    const li = document.querySelector(`.item-lista[data-id="${id}"]`);
    if (!li) return;
    const ev     = Dados.evento(id);
    const prog   = Estado.get('progresso');
    const favs   = Estado.get('favoritos');
    const status = prog[id] || 'nao-iniciado';
    const favoritado = favs.includes(id);

    li.querySelector('.item-titulo').textContent = ev.titulo;
    const meta   = li.querySelector('.item-meta');
    // Rebuild meta
    meta.innerHTML = '';
    meta.appendChild(criarIndicador(ev));
    const statusEl = document.createElement('span');
    statusEl.className = `status-icone ${Utils.classeStatus(status)}`;
    statusEl.textContent = Utils.iconeStatus(status);
    meta.appendChild(statusEl);

    const favEl = li.querySelector('.item-fav');
    favEl.className   = `item-fav${favoritado ? ' favoritado' : ''}`;
    favEl.textContent = favoritado ? '♥' : '';
  },
};

/* ═══════════════════════════════════════════════════════════════════════════════
   BUSCA
═══════════════════════════════════════════════════════════════════════════════ */

const Busca = {
  _timer: null,

  filtrar(query) {
    Estado.set('busca', query);
    clearTimeout(this._timer);
    this._timer = setTimeout(() => this._executar(query), 120);
  },

  _executar(query) {
    if (!query.trim()) {
      Estado.set('visivel', Estado.get('cronologia'));
      Lista.renderizar(Estado.get('cronologia'), '');
      document.getElementById('btn-limpar-busca').classList.remove('visivel');
      return;
    }

    document.getElementById('btn-limpar-busca').classList.add('visivel');
    const q   = query.toLowerCase();
    const res = Estado.get('cronologia').filter(ev => {
      if (ev.titulo.toLowerCase().includes(q)) return true;
      for (const g of ['mateus','marcos','lucas','joao']) {
        if (!ev[g]) continue;
        if (ev[g].referencia.toLowerCase().includes(q)) return true;
        if (ev[g].texto.toLowerCase().includes(q)) return true;
      }
      return false;
    });

    Estado.set('visivel', res);
    Lista.renderizar(res, query);
  },

  limpar() {
    document.getElementById('campo-busca').value = '';
    document.getElementById('btn-limpar-busca').classList.remove('visivel');
    Estado.set('busca', '');
    Estado.set('visivel', Estado.get('cronologia'));
    Lista.renderizar(Estado.get('cronologia'), '');
  },
};

/* ═══════════════════════════════════════════════════════════════════════════════
   TELA DE LEITURA
═══════════════════════════════════════════════════════════════════════════════ */

const Leitura = {
  _anotacaoTimer: null,

  abrir(id) {
    const ev = Dados.evento(id);
    if (!ev) return;

    Estado.set('eventoAtual', id);
    Estado.set('ultimoItem', id);
    Persistencia.salvarUltimoItem();
    atualizarBannerContinuar();

    this._renderizar(ev);

    // Marcar como em-leitura se ainda não iniciado
    const prog = Estado.get('progresso');
    if (!prog[id] || prog[id] === 'nao-iniciado') {
      prog[id] = 'em-leitura';
      Persistencia.salvarProgresso();
      Lista.atualizarItem(id);
      atualizarBarraProgresso();
    }

    document.getElementById('tela-leitura').classList.add('aberta');
    document.getElementById('leitura-nav').classList.add('visivel');
    document.getElementById('leitura-corpo').scrollTop = 0;
  },

  fechar() {
    document.getElementById('tela-leitura').classList.remove('aberta');
    document.getElementById('leitura-nav').classList.remove('visivel');
    Estado.set('eventoAtual', null);
  },

  _renderizar(ev) {
    const prog      = Estado.get('progresso');
    const favs      = Estado.get('favoritos');
    const anotacoes = Estado.get('anotacoes');
    const status    = prog[ev.id] || 'nao-iniciado';

    // Header
    document.getElementById('leitura-numero-header').textContent = `#${ev.id}`;
    // Indicador no header (limpa e recria)
    const hCentro = document.getElementById('leitura-header-centro');
    const oldInd = hCentro.querySelector('.indicador-evangelhos');
    if (oldInd) oldInd.remove();
    hCentro.appendChild(criarIndicador(ev));

    // Botão favorito
    const btnFav = document.getElementById('btn-fav-leitura');
    btnFav.textContent = favs.includes(ev.id) ? '♥' : '♡';
    btnFav.classList.toggle('ativo', favs.includes(ev.id));

    // Título
    document.getElementById('leitura-titulo').textContent = ev.titulo;

    // Indicador grande
    const indWrap = document.getElementById('leitura-indicador-wrap');
    const oldGrande = indWrap.querySelector('.indicador-evangelhos');
    if (oldGrande) oldGrande.remove();
    indWrap.prepend(criarIndicador(ev, true));

    // Status select
    const sel = document.getElementById('leitura-status-select');
    sel.value = status;

    // Evangelhos
    const corpoLeitura = document.getElementById('leitura-evangelhos');
    corpoLeitura.innerHTML = '';
    const nomes = { mateus:'Mateus', marcos:'Marcos', lucas:'Lucas', joao:'João' };
    const ordem = ['mateus','marcos','lucas','joao'];

    ordem.forEach(g => {
      if (!ev[g]) return;
      const bloco = document.createElement('div');
      bloco.className = 'evangelho-bloco';
      bloco.dataset.evangelho = g;

      const label = document.createElement('div');
      label.className = 'evangelho-label';
      label.textContent = nomes[g];

      const ref = document.createElement('div');
      ref.className = 'evangelho-ref';
      ref.textContent = ev[g].referencia;

      const texto = document.createElement('div');
      texto.className = 'evangelho-texto';
      texto.innerHTML = Utils.formatarTexto(ev[g].texto);

      bloco.appendChild(label);
      bloco.appendChild(ref);
      bloco.appendChild(texto);
      corpoLeitura.appendChild(bloco);
    });

    // Anotação
    const inputAnotacao = document.getElementById('anotacao-input');
    inputAnotacao.value = anotacoes[ev.id] || '';
    document.getElementById('anotacao-salvo').textContent = '';

    // Navegação
    const idx  = Dados.indiceEvento(ev.id);
    const cron = Estado.get('cronologia');
    const btnAnt  = document.getElementById('btn-ant');
    const btnProx = document.getElementById('btn-prox');
    btnAnt.disabled  = idx <= 0;
    btnProx.disabled = idx >= cron.length - 1;
    document.getElementById('leitura-nav-info').textContent = `${ev.id} / ${cron.length}`;
  },

  ir(delta) {
    const id  = Estado.get('eventoAtual');
    const idx = Dados.indiceEvento(id);
    const cron = Estado.get('cronologia');
    const prox = cron[idx + delta];
    if (prox) this.abrir(prox.id);
  },

  alternarFavorito() {
    const id   = Estado.get('eventoAtual');
    if (!id) return;
    const favs = Estado.get('favoritos');
    const idx  = favs.indexOf(id);
    if (idx === -1) favs.push(id);
    else            favs.splice(idx, 1);
    Persistencia.salvarFavoritos();

    const btnFav = document.getElementById('btn-fav-leitura');
    btnFav.textContent = favs.includes(id) ? '♥' : '♡';
    btnFav.classList.toggle('ativo', favs.includes(id));

    Lista.atualizarItem(id);
    Favoritos.renderizar();
    Utils.toast(favs.includes(id) ? 'Adicionado aos favoritos' : 'Removido dos favoritos');
  },

  salvarStatus(novoStatus) {
    const id   = Estado.get('eventoAtual');
    if (!id) return;
    const prog = Estado.get('progresso');
    prog[id] = novoStatus;
    Persistencia.salvarProgresso();
    Lista.atualizarItem(id);
    atualizarBarraProgresso();
  },

  salvarAnotacao(texto) {
    const id = Estado.get('eventoAtual');
    if (!id) return;
    const anot = Estado.get('anotacoes');
    if (texto.trim()) anot[id] = texto;
    else              delete anot[id];
    Persistencia.salvarAnotacoes();
    document.getElementById('anotacao-salvo').textContent = 'Salvo';
    setTimeout(() => {
      if (document.getElementById('anotacao-salvo').textContent === 'Salvo')
        document.getElementById('anotacao-salvo').textContent = '';
    }, 2000);
  },
};

/* ═══════════════════════════════════════════════════════════════════════════════
   FAVORITOS
═══════════════════════════════════════════════════════════════════════════════ */

const Favoritos = {
  renderizar() {
    const container = document.getElementById('tela-favoritos');
    const vazio     = document.getElementById('favoritos-vazio');
    const favs      = Estado.get('favoritos');

    container.innerHTML = '';
    if (!favs.length) {
      container.appendChild(vazio);
      vazio.style.display = 'block';
      return;
    }
    vazio.style.display = 'none';

    const frag = document.createDocumentFragment();
    favs.forEach((id, idx) => {
      const ev = Dados.evento(id);
      if (!ev) return;
      frag.appendChild(Lista._criarItem(ev, '', idx));
    });
    container.appendChild(frag);
  },
};

/* ═══════════════════════════════════════════════════════════════════════════════
   CONFIGURAÇÕES
═══════════════════════════════════════════════════════════════════════════════ */

const Config = {
  abrir() {
    document.getElementById('tela-config').classList.add('aberta');
    document.getElementById('overlay').classList.add('visivel');
    this._sincronizarUI();
  },

  fechar() {
    document.getElementById('tela-config').classList.remove('aberta');
    document.getElementById('overlay').classList.remove('visivel');
  },

  _sincronizarUI() {
    const prefs = Estado.get('prefs');
    // Marca botões ativos
    document.querySelectorAll('.config-btn').forEach(btn => {
      btn.classList.toggle('ativo',
        btn.dataset.valor === prefs[btn.dataset.pref]
      );
    });
  },

  aplicar(pref, valor) {
    const prefs = Estado.get('prefs');
    prefs[pref] = valor;
    Persistencia.salvarPrefs();
    Tema.aplicar();
    this._sincronizarUI();
  },
};

/* ═══════════════════════════════════════════════════════════════════════════════
   NAVEGAÇÃO ENTRE ABAS
═══════════════════════════════════════════════════════════════════════════════ */

function irParaAba(aba) {
  Estado.set('abaNativa', aba);
  const lista   = document.getElementById('lista-principal');
  const favTela = document.getElementById('tela-favoritos');

  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('ativo', el.dataset.aba === aba);
  });

  if (aba === 'lista') {
    lista.style.display   = '';
    favTela.classList.remove('ativo');
    document.getElementById('banner-continuar').style.display = '';
    document.getElementById('barra-progresso-wrap').style.display = '';
  } else if (aba === 'favoritos') {
    lista.style.display   = 'none';
    favTela.classList.add('ativo');
    document.getElementById('banner-continuar').style.display = 'none';
    document.getElementById('barra-progresso-wrap').style.display = 'none';
    Favoritos.renderizar();
  }
}

/* ═══════════════════════════════════════════════════════════════════════════════
   INICIALIZAÇÃO
═══════════════════════════════════════════════════════════════════════════════ */

async function inicializar() {
  // 1. Carregar preferências salvas e aplicar tema
  Persistencia.carregar();
  Tema.aplicar();

  // 2. Carregar dados
  try {
    await Dados.carregar();
  } catch (e) {
    document.getElementById('lista-principal').innerHTML =
      '<div style="padding:40px;text-align:center;color:var(--text-muted)">Erro ao carregar os dados.<br>Abra o app via servidor local.</div>';
    console.error(e);
    return;
  }

  // 3. Renderizar lista e barra de progresso
  Lista.renderizar(Estado.get('cronologia'));
  atualizarBarraProgresso();
  atualizarBannerContinuar();

  // 4. Vincular eventos de UI
  _vincularEventos();

  // 5. Registrar Service Worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./service-worker.js').catch(console.warn);
  }
}

/* ═══════════════════════════════════════════════════════════════════════════════
   EVENTOS DE UI
═══════════════════════════════════════════════════════════════════════════════ */

function _vincularEventos() {

  // ── Busca ──────────────────────────────────────────────────────────────────
  const campoBusca = document.getElementById('campo-busca');
  campoBusca.addEventListener('input', e => Busca.filtrar(e.target.value));
  document.getElementById('btn-limpar-busca')
    .addEventListener('click', () => Busca.limpar());

  // ── Botão Configurações ────────────────────────────────────────────────────
  document.getElementById('btn-config')
    .addEventListener('click', () => Config.abrir());

  // ── Overlay (fecha config) ─────────────────────────────────────────────────
  document.getElementById('overlay')
    .addEventListener('click', () => Config.fechar());

  // ── Botões de configuração ─────────────────────────────────────────────────
  document.querySelectorAll('.config-btn').forEach(btn => {
    btn.addEventListener('click', () => Config.aplicar(btn.dataset.pref, btn.dataset.valor));
  });

  // ── Fechar config ──────────────────────────────────────────────────────────
  document.getElementById('btn-fechar-config')
    .addEventListener('click', () => Config.fechar());

  // ── Continuar leitura ──────────────────────────────────────────────────────
  document.getElementById('btn-continuar')
    .addEventListener('click', () => {
      const ultimo = Estado.get('ultimoItem');
      if (ultimo) Leitura.abrir(ultimo);
    });

  // ── Voltar da leitura ──────────────────────────────────────────────────────
  document.getElementById('btn-voltar')
    .addEventListener('click', () => Leitura.fechar());

  // ── Favorito na leitura ────────────────────────────────────────────────────
  document.getElementById('btn-fav-leitura')
    .addEventListener('click', () => Leitura.alternarFavorito());

  // ── Status select ──────────────────────────────────────────────────────────
  document.getElementById('leitura-status-select')
    .addEventListener('change', e => Leitura.salvarStatus(e.target.value));

  // ── Anotação ───────────────────────────────────────────────────────────────
  const inputAnotacao = document.getElementById('anotacao-input');
  inputAnotacao.addEventListener('input', () => {
    clearTimeout(Leitura._anotacaoTimer);
    Leitura._anotacaoTimer = setTimeout(
      () => Leitura.salvarAnotacao(inputAnotacao.value), 800
    );
  });

  // ── Navegação anterior/próximo ─────────────────────────────────────────────
  document.getElementById('btn-ant')
    .addEventListener('click', () => Leitura.ir(-1));
  document.getElementById('btn-prox')
    .addEventListener('click', () => Leitura.ir(+1));

  // ── Navbar abas ───────────────────────────────────────────────────────────
  document.querySelectorAll('.nav-item').forEach(el => {
    el.addEventListener('click', () => irParaAba(el.dataset.aba));
  });

  // ── Swipe para fechar a tela de leitura ───────────────────────────────────
  let touchStartX = 0;
  const telaLeitura = document.getElementById('tela-leitura');
  telaLeitura.addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
  }, { passive: true });
  telaLeitura.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (dx > 80) Leitura.fechar();
  }, { passive: true });

  // ── Hardware back button (Android) ────────────────────────────────────────
  window.addEventListener('popstate', () => {
    if (Estado.get('eventoAtual')) Leitura.fechar();
  });
  history.pushState(null, '');
}

/* ─── Entry point ───────────────────────────────────────────────────────────── */
document.addEventListener('DOMContentLoaded', inicializar);

</script>

</body>
</html>
