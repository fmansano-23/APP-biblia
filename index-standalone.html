: null}, {"id": 88, "ordem": 88, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": null, "titulo": "Jesus conta a parábola do negociante de pérolas", "mateus": {"referencia": "Mt 13.45-46", "texto": "45 Outrossim, o Reino dos céus é semelhante ao homem negociante que busca boas pérolas; 46 e, encontrando uma pérola de grande valor, foi, vendeu tudo quanto tinha e comprou-a."}, "marcos": null, "lucas": null, "joao": null}, {"id": 89, "ordem": 89, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": null, "titulo": "Jesus conta a parábola da rede de pesca", "mateus": {"referencia": "Mt 13.47-52", "texto": "47 Igualmente, o Reino dos céus é semelhante a uma rede lançada ao mar e que apanha toda qualidade de peixes. 48 E, estando cheia, a puxam para a praia e, assentando-se, apanham para os cestos os bons; os ruins, porém, lançam fora. 49 Assim será na consumação dos séculos: virão os anjos e separarão os maus dentre os justos. 50 E lançá-los-ão na fornalha de fogo; ali, haverá pranto e ranger de dentes. 51 E disse-lhes Jesus: Entendestes todas estas coisas? Disseram-lhe eles: Sim, Senhor. 52 E ele disse-lhes: Por isso, todo escriba instruído acerca do Reino dos céus é semelhante a um pai de família que tira do seu tesouro coisas novas e velhas."}, "marcos": null, "lucas": null, "joao": null}, {"id": 90, "ordem": 90, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": null, "titulo": "Jesus aplaca uma tempestade", "mateus": {"referencia": "Mt 8.23-27", "texto": "23 E, entrando ele no barco, seus discípulos o seguiram. 24 E eis que, no mar, se levantou uma tempestade tão grande, que o barco era coberto pelas ondas; ele, porém, estava dormindo. 25 E os seus discípulos, aproximando-se, o despertaram, dizendo: Senhor, salva-nos, que perecemos. 26 E ele disse-lhes: Por que temeis, homens de pequena fé? Então, levantando-se, repreendeu os ventos e o mar, e seguiu-se uma grande bonança. 27 E aqueles homens se maravilharam, dizendo: Que homem é este, que até os ventos e o mar lhe obedecem?"}, "marcos": {"referencia": "Mc 4.35-41", "texto": "35 E, naquele dia, sendo já tarde, disse-lhes: Passemos para a outra margem. 36 E eles, deixando a multidão, o levaram consigo, assim como estava, no barco; e havia também com ele outros barquinhos. 37 E levantou-se grande temporal de vento, e subiam as ondas por cima do barco, de maneira que já se enchia de água. 38 E ele estava na popa dormindo sobre uma almofada; e despertaram-no, dizendo-lhe: Mestre, não te importa que pereçamos? 39 E ele, despertando, repreendeu o vento e disse ao mar: Cala-te, aquieta-te. E o vento se aquietou, e houve grande bonança. 40 E disse-lhes: Por que sois tão tímidos? Ainda não tendes fé? 41 E sentiram um grande temor e diziam uns aos outros: Mas quem é este que até o vento e o mar lhe obedecem?"}, "lucas": {"referencia": "Lc 8.22-25", "texto": "22 E aconteceu que, num daqueles dias, entrou num barco com seus discípulos e disse-lhes: Passemos para a outra banda do lago. E partiram. 23 E, navegando eles, adormeceu; e sobreveio uma tempestade de vento no lago, e o barco enchia-se de água, estando eles em perigo. 24 E, chegando-se a ele, o despertaram, dizendo: Mestre, Mestre, estamos perecendo. E ele, levantando-se, repreendeu o vento e a fúria da água; e cessaram, e fez-se bonança. 25 E disse-lhes: Onde está a vossa fé? E eles, temendo, maravilharam-se, dizendo uns aos outros: Quem é este, que até aos ventos e à água manda, e lhe obedecem?"}, "joao": null}, {"id": 91, "ordem": 91, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": null, "titulo": "Jesus expulsa demônios e deixa que entrem em uma manada de porcos", "mateus": {"referencia": "Mt 8.28-34", "texto": "28 E, tendo chegado à outra margem, à província dos gadarenos, saíram-lhe ao encontro dois endemoninhados, vindos dos sepulcros; tão ferozes eram, que ninguém podia passar por aquele caminho. 29 E eis que clamaram, dizendo: Que temos nós contigo, Jesus, Filho de Deus? Vieste aqui atormentar-nos antes do tempo? 30 E andava pastando distante deles uma manada de muitos porcos. 31 E os demônios rogaram-lhe, dizendo: Se nos expulsas, permite-nos que entremos naquela manada de porcos. 32 E ele lhes disse: Ide. E, saindo eles, se introduziram na manada dos porcos; e eis que toda aquela manada de porcos se precipitou no mar por um despenhadeiro, e morreram nas águas. 33 Os porqueiros fugiram e, chegando à cidade, divulgaram tudo o que acontecera aos endemoninhados. 34 E eis que toda aquela cidade saiu ao encontro de Jesus, e, vendo-o, rogaram-lhe que se retirasse do seu território."}, "marcos": {"referencia": "Mc 5.1-20", "texto": "1 E chegaram à outra margem do mar, à província dos gadarenos. 2 E, saindo ele do barco, lhe saiu logo ao seu encontro, dos sepulcros, um homem com espírito imundo, 3 o qual tinha a sua morada nos sepulcros, e nem ainda com cadeias o podia alguém prender. 4 Porque, tendo sido muitas vezes preso com grilhões e cadeias, as cadeias foram por ele feitas em pedaços, e os grilhões, em migalhas, e ninguém o podia amansar. 5 E andava sempre, de dia e de noite, clamando pelos montes e pelos sepulcros e ferindo-se com pedras. 6 E, quando viu Jesus ao longe, correu e adorou-o. 7 E, clamando com grande voz, disse: Que tenho eu contigo, Jesus, Filho do Deus Altíssimo? Conjuro-te por Deus que não me atormentes. 8 (Porque lhe dizia: Sai deste homem, espírito imundo.) 9 E perguntou-lhe: Qual é o teu nome? E lhe respondeu, dizendo: Legião é o meu nome, porque somos muitos. 10 E rogava-lhe muito que os não enviasse para fora daquela província. 11 E andava ali pastando no monte uma grande manada de porcos. 12 E todos aqueles demônios lhe rogaram, dizendo: Manda-nos para aqueles porcos, para que entremos neles. 13 E Jesus logo lho permitiu. E, saindo aqueles espíritos imundos, entraram nos porcos; e a manada se precipitou por um despenhadeiro no mar (eram quase dois mil) e afogou-se no mar. 14 E os que apascentavam os porcos fugiram e o anunciaram na cidade e nos campos; e saíram muitos a ver o que era aquilo que tinha acontecido. 15 E foram ter com Jesus, e viram o endemoninhado, o que tivera a legião, assentado, vestido e em perfeito juízo, e temeram. 16 E os que aquilo tinham visto contaram-lhes o que acontecera ao endemoninhado e acerca dos porcos. 17 E começaram a rogar-lhe que saísse do seu território. 18 E, entrando ele no barco, rogava-lhe o que fora endemoninhado que o deixasse estar com ele. 19 Jesus, porém, não lho permitiu, mas disse-lhe: Vai para tua casa, para os teus, e anuncia-lhes quão grandes coisas o Senhor te fez e como teve misericórdia de ti. 20 E ele foi e começou a anunciar em Decápolis quão grandes coisas Jesus lhe fizera; e todos se maravilhavam."}, "lucas": {"referencia": "Lc 8.26-39", "texto": "26 E navegaram para a terra dos gadarenos, que está defronte da Galileia. 27 E, quando desceu para terra, saiu-lhe ao encontro, vindo da cidade, um homem que, desde muito tempo, estava possesso de demônios e não andava vestido nem habitava em qualquer casa, mas nos sepulcros. 28 E, quando viu a Jesus, prostrou-se diante dele, exclamando e dizendo com alta voz: Que tenho eu contigo Jesus, Filho do Deus Altíssimo? Peço-te que não me atormentes. 29 Porque tinha ordenado ao espírito imundo que saísse daquele homem; pois já havia muito tempo que o arrebatava. E guardavam-no preso com grilhões e cadeias; mas, quebrando as prisões, era impelido pelo demônio para os desertos. 30 E perguntou-lhe Jesus, dizendo: Qual é o teu nome? E ele disse: Legião; porque tinham entrado nele muitos demônios. 31 E rogavam-lhe que os não mandasse para o abismo. 32 E andava pastando ali no monte uma manada de muitos porcos; e rogaram-lhe que lhes concedesse entrar neles; e concedeu-lho. 33 E, tendo saído os demônios do homem, entraram nos porcos, e a manada precipitou-se de um despenhadeiro no lago e afogou-se. 34 E aqueles que os guardavam, vendo o que acontecera, fugiram e foram anunciá-lo na cidade e nos campos. 35 E saíram a ver o que tinha acontecido e vieram ter com Jesus. Acharam, então, o homem de quem haviam saído os demônios, vestido e em seu juízo, assentado aos pés de Jesus; e temeram. 36 E os que tinham visto contaram-lhes também como fora salvo aquele endemoninhado. 37 E toda a multidão da terra dos gadarenos ao redor lhe rogou que se retirasse deles, porque estavam possuídos de grande temor. E, entrando ele no barco, voltou. 38 E aquele homem de quem haviam saído os demônios rogou-lhe que o deixasse estar com ele; mas Jesus o despediu, dizendo: 39 Torna para tua casa e conta quão grandes coisas te fez Deus. E ele foi apregoando por toda a cidade quão grandes coisas Jesus lhe tinha feito."}, "joao": null}, {"id": 92, "ordem": 92, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": null, "titulo": "Jesus cura uma mulher com hemorragia e ressuscita uma menina", "mateus": {"referencia": "Mt 9.18-26", "texto": "18 Dizendo-lhes ele essas coisas, eis que chegou um chefe e o adorou, dizendo: Minha filha faleceu agora mesmo; mas vem, impõe-lhe a tua mão, e ela viverá. 19 E Jesus, levantando-se, seguiu-o, e os seus discípulos também. 20 E eis que uma mulher que havia já doze anos padecia de um fluxo de sangue, chegando por detrás dele, tocou a orla da sua veste, 21 porque dizia consigo: Se eu tão somente tocar a sua veste, ficarei sã. 22 E Jesus, voltando-se e vendo-a, disse: Tem ânimo, filha, a tua fé te salvou. E imediatamente a mulher ficou sã. 23 E Jesus, chegando à casa daquele chefe, e vendo os instrumentistas e o povo em alvoroço, 24 disse-lhes: Retirai-vos, que a menina não está morta, mas dorme. E riram-se dele. 25 E, logo que o povo foi posto fora, entrou Jesus e pegou-lhe na mão, e a menina levantou-se. 26 E espalhou-se aquela notícia por todo aquele país."}, "marcos": {"referencia": "Mc 5.21-43", "texto": "21 E, passando Jesus outra vez num barco para o outro lado, ajuntou-se a ele uma grande multidão; e ele estava junto do mar. 22 E eis que chegou um dos principais da sinagoga, por nome Jairo, e, vendo-o, prostrou-se aos seus pés 23 e rogava-lhe muito, dizendo: Minha filha está moribunda; rogo-te que venhas e lhe imponhas as mãos para que sare e viva. 24 E foi com ele, e seguia-o uma grande multidão, que o apertava. 25 E certa mulher, que havia doze anos tinha um fluxo de sangue, 26 e que havia padecido muito com muitos médicos, e despendido tudo quanto tinha, nada lhe aproveitando isso, antes indo a pior, 27 ouvindo falar de Jesus, veio por detrás, entre a multidão, e tocou na sua vestimenta. 28 Porque dizia: Se tão somente tocar nas suas vestes, sararei. 29 E logo se lhe secou a fonte do seu sangue, e sentiu no seu corpo estar já curada daquele mal. 30 E logo Jesus, conhecendo que a virtude de si mesmo saíra, voltou-se para a multidão e disse: Quem tocou nas minhas vestes? 31 E disseram-lhe os seus discípulos: Vês que a multidão te aperta, e dizes: Quem me tocou? 32 E ele olhava em redor, para ver a que isso fizera. 33 Então, a mulher, que sabia o que lhe tinha acontecido, temendo e tremendo, aproximou-se, e prostrou-se diante dele, e disse-lhe toda a verdade. 34 E ele lhe disse: Filha, a tua fé te salvou; vai em paz e sê curada deste teu mal. 35 Estando ele ainda falando, chegaram alguns do principal da sinagoga, a quem disseram: A tua filha está morta; para que enfadas mais o Mestre? 36 E Jesus, tendo ouvido essas palavras, disse ao principal da sinagoga: Não temas, crê somente. 37 E não permitiu que alguém o seguisse, a não ser Pedro, e Tiago, e João, irmão de Tiago. 38 E, tendo chegado à casa do principal da sinagoga, viu o alvoroço e os que choravam muito e pranteavam. 39 E, entrando, disse-lhes: Por que vos alvoroçais e chorais? A menina não está morta, mas dorme. 40 E riam-se dele; porém ele, tendo-os feito sair, tomou consigo o pai e a mãe da menina e os que com ele estavam e entrou onde a menina estava deitada. 41 E, tomando a mão da menina, disse-lhe: Talitá cumi, que, traduzido, é: Menina, a ti te digo: levanta-te. 42 E logo a menina se levantou e andava, pois já tinha doze anos; e assombraram-se com grande espanto. 43 E mandou-lhes expressamente que ninguém o soubesse; e disse que lhe dessem de comer."}, "lucas": {"referencia": "Lc 8.40-56", "texto": "40 E aconteceu que, quando voltou Jesus, a multidão o recebeu, porque todos o estavam esperando. 41 E eis que chegou um varão de nome Jairo, que era príncipe da sinagoga; e, prostrando-se aos pés de Jesus, rogava-lhe que entrasse em sua casa; 42 porque tinha uma filha única, quase de doze anos, que estava à morte. E, indo ele, apertava-o a multidão. 43 E uma mulher, que tinha um fluxo de sangue, havia doze anos, e gastara com os médicos todos os seus haveres, e por nenhum pudera ser curada, 44 chegando por detrás dele, tocou na orla da sua veste, e logo estancou o fluxo do seu sangue. 45 E disse Jesus: Quem é que me tocou? E, negando todos, disse Pedro e os que estavam com ele: Mestre, a multidão te aperta e te oprime, e dizes: Quem é que me tocou? 46 E disse Jesus: Alguém me tocou, porque bem conheci que de mim saiu virtude. 47 Então, vendo a mulher que não podia ocultar-se, aproximou-se tremendo e, prostrando-se ante ele, declarou-lhe diante de todo o povo a causa por que lhe havia tocado e como logo sarara. 48 E ele lhe disse: Tem bom ânimo, filha, a tua fé te salvou; vai em paz. 49 Estando ele ainda falando, chegou um da casa do príncipe da sinagoga, dizendo: A tua filha já está morta; não incomodes o Mestre. 50 Jesus, porém, ouvindo-o, respondeu-lhe, dizendo: Não temas; crê somente, e será salva. 51 E, entrando em casa, a ninguém deixou entrar, senão a Pedro, e a Tiago, e a João, e ao pai, e a mãe da menina. 52 E todos choravam e a pranteavam; e ele disse: Não choreis; não está morta, mas dorme. 53 E riam-se dele, sabendo que estava morta. 54 Mas ele, pegando-lhe na mão, clamou, dizendo: Levanta-te, menina! 55 E o seu espírito voltou, e ela logo se levantou; e Jesus mandou que lhe dessem de comer. 56 E seus pais ficaram maravilhados, e ele lhes mandou que a ninguém dissessem o que havia sucedido."}, "joao": null}, {"id": 93, "ordem": 93, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": null, "titulo": "Jesus cura cegos e um mudo", "mateus": {"referencia": "Mt 9.27-34", "texto": "27 E, partindo Jesus dali, seguiram-no dois cegos, clamando e dizendo: Tem compaixão de nós, Filho de Davi. 28 E, quando chegou à casa, os cegos se aproximaram dele; e Jesus disse-lhes: Credes vós que eu possa fazer isto? Disseram-lhe eles: Sim, Senhor. 29 Tocou, então, os olhos deles, dizendo: Seja-vos feito segundo a vossa fé. 30 E os olhos se lhes abriram. E Jesus ameaçou-os, dizendo: Olhai que ninguém o saiba. 31 Mas, tendo ele saído, divulgaram a sua fama por toda aquela terra. 32 E, havendo-se eles retirado, trouxeram-lhe um homem mudo e endemoninhado. 33 E, expulso o demônio, falou o mudo; e a multidão se maravilhou, dizendo: Nunca tal se viu em Israel. 34 Mas os fariseus diziam: Ele expulsa os demônios pelo príncipe dos demônios."}, "marcos": null, "lucas": null, "joao": null}, {"id": 94, "ordem": 94, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": null, "titulo": "Jesus é rejeitado em Nazaré", "mateus": {"referencia": "Mt 13.53-58", "texto": "53 E aconteceu que Jesus, concluindo essas parábolas, se retirou dali. 54 E, chegando à sua pátria, ensinava-os na sinagoga deles, de sorte que se maravilhavam e diziam: Donde veio a este a sabedoria e estas maravilhas? 55 Não é este o filho do carpinteiro? E não se chama sua mãe Maria, e seus irmãos, Tiago, e José, e Simão, e Judas? 56 E não estão entre nós todas as suas irmãs? Donde lhe veio, pois, tudo isso? 57 E escandalizavam-se nele. Jesus, porém, lhes disse: Não há profeta sem honra, a não ser na sua pátria e na sua casa. 58 E não fez ali muitas maravilhas, por causa da incredulidade deles."}, "marcos": {"referencia": "Mc 6.1-6", "texto": "1 E, partindo dali, chegou à sua terra, e os seus discípulos o seguiram. 2 E, chegando o sábado, começou a ensinar na sinagoga; e muitos, ouvindo-o, se admiravam, dizendo: De onde lhe vêm essas coisas? E que sabedoria é esta que lhe foi dada? E como se fazem tais maravilhas por suas mãos? 3 Não é este o carpinteiro, filho de Maria e irmão de Tiago, e de José, e de Judas, e de Simão? E não estão aqui conosco suas irmãs? E escandalizavam-se nele. 4 E Jesus lhes dizia: Não há profeta sem honra, senão na sua terra, entre os seus parentes e na sua casa. 5 E não podia fazer ali obras maravilhosas; somente curou alguns poucos enfermos, impondo-lhes as mãos. 6 E estava admirado da incredulidade deles. E percorreu as aldeias vizinhas, ensinando."}, "lucas": {"referencia": "Lc 4.16-30", "texto": "16 E, chegando a Nazaré, onde fora criado, entrou num dia de sábado, segundo o seu costume, na sinagoga e levantou-se para ler. 17 E foi-lhe dado o livro do profeta Isaías; e, quando abriu o livro, achou o lugar em que estava escrito: 18 O Espírito do Senhor é sobre mim, pois que me ungiu para evangelizar os pobres, enviou-me a curar os quebrantados do coração, 19 a apregoar liberdade aos cativos, a dar vista aos cegos, a pôr em liberdade os oprimidos, a anunciar o ano aceitável do Senhor. 20 E, cerrando o livro e tornando a dá-lo ao ministro, assentou-se; e os olhos de todos na sinagoga estavam fitos nele. 21 Então, começou a dizer-lhes: Hoje se cumpriu esta Escritura em vossos ouvidos. 22 E todos lhe davam testemunho, e se maravilhavam das palavras de graça que saíam da sua boca, e diziam: Não é este o filho de José? 23 E ele lhes disse: Sem dúvida, me direis este provérbio: Médico, cura-te a ti mesmo; faze também aqui na tua pátria tudo o que ouvimos ter sido feito em Cafarnaum. 24 E disse: Em verdade vos digo que nenhum profeta é bem-recebido na sua pátria. 25 Em verdade vos digo que muitas viúvas existiam em Israel nos dias de Elias, quando o céu se cerrou por três anos e seis meses, de sorte que em toda a terra houve grande fome; 26 e a nenhuma delas foi enviado Elias, senão a Sarepta de Sidom, a uma mulher viúva. 27 E muitos leprosos havia em Israel no tempo do profeta Eliseu, e nenhum deles foi purificado, senão Naamã, o siro. 28 E todos, na sinagoga, ouvindo essas coisas, se encheram de ira. 29 E, levantando-se, o expulsaram da cidade e o levaram até ao cume do monte em que a cidade deles estava edificada, para dali o precipitarem. 30 Ele, porém, passando pelo meio deles, retirou-se."}, "joao": null}, {"id": 95, "ordem": 95, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": null, "titulo": "Jesus insta com os discípulos para orar por mais obreiros", "mateus": {"referencia": "Mt 9.35-38", "texto": "35 E percorria Jesus todas as cidades e aldeias, ensinando nas sinagogas deles, e pregando o evangelho do Reino, e curando todas as enfermidades e moléstias entre o povo. 36 E, vendo a multidão, teve grande compaixão deles, porque andavam desgarrados e errantes como ovelhas que não têm pastor. 37 Então, disse aos seus discípulos: A seara é realmente grande, mas poucos são os ceifeiros. 38 Rogai, pois, ao Senhor da seara que mande ceifeiros para a sua seara."}, "marcos": null, "lucas": null, "joao": null}, {"id": 96, "ordem": 96, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": null, "titulo": "Jesus envia os doze discípulos", "mateus": {"referencia": "Mt 10.1-15", "texto": "1 E, chamando os seus doze discípulos, deu-lhes poder sobre os espíritos imundos, para os expulsarem e para curarem toda enfermidade e todo mal. 2 Ora, os nomes dos doze apóstolos são estes: O primeiro, Simão, chamado Pedro, e André, seu irmão; Tiago, filho de Zebedeu, e João, seu irmão; 3 Filipe e Bartolomeu; Tomé e Mateus, o publicano; Tiago, filho de Alfeu, e Lebeu, apelidado Tadeu; 4 Simão, o Zelote, e Judas Iscariotes, aquele que o traiu. 5 Jesus enviou estes doze e lhes ordenou, dizendo: Não ireis pelo caminho das gentes, nem entrareis em cidade de samaritanos; 6 mas ide, antes, às ovelhas perdidas da casa de Israel; 7 e, indo, pregai, dizendo: É chegado o Reino dos céus. 8 Curai os enfermos, limpai os leprosos, ressuscitai os mortos, expulsai os demônios; de graça recebestes, de graça dai. 9 Não possuais ouro, nem prata, nem cobre, em vossos cintos; 10 nem alforjes para o caminho, nem duas túnicas, nem sandálias, nem bordão, porque digno é o operário do seu alimento. 11 E, em qualquer cidade ou aldeia em que entrardes, procurai saber quem nela seja digno e hospedai-vos aí até que vos retireis. 12 E, quando entrardes nalguma casa, saudai-a; 13 e, se a casa for digna, desça sobre ela a vossa paz; mas, se não for digna, torne para vós a vossa paz. 14 E, se ninguém vos receber, nem escutar as vossas palavras, saindo daquela casa ou cidade, sacudi o pó dos vossos pés. 15 Em verdade vos digo que, no Dia do Juízo, haverá menos rigor para o país de Sodoma e Gomorra do que para aquela cidade."}, "marcos": {"referencia": "Mc 6.6-13", "texto": "6 E estava admirado da incredulidade deles. E percorreu as aldeias vizinhas, ensinando. 7 Chamou a si os doze, e começou a enviá-los de dois a dois, e deu-lhes poder sobre os espíritos imundos, 8 e ordenou-lhes que nada tomassem para o caminho, senão um bordão; nem alforje, nem pão, nem dinheiro no cinto; 9 mas que calçassem sandálias e que não vestissem duas túnicas. 10 E dizia-lhes: Na casa em que entrardes, ficai nela até partirdes dali. 11 E, quando alguns vos não receberem, nem vos ouvirem, saindo dali, sacudi o pó que estiver debaixo dos vossos pés, em testemunho contra eles. Em verdade vos digo que haverá mais tolerância no Dia do Juízo para Sodoma e Gomorra do que para os daquela cidade. 12 E, saindo eles, pregavam ao povo que se arrependesse. 13 E expulsavam muitos demônios, e ungiam muitos enfermos com óleo, e os curavam."}, "lucas": {"referencia": "Lc 9.1-6", "texto": "1 E, convocando os seus doze discípulos, deu-lhes virtude e poder sobre todos os demônios e para curarem enfermidades; 2 e enviou-os a pregar o Reino de Deus e a curar os enfermos. 3 E disse-lhes: Nada leveis convosco para o caminho, nem bordões, nem alforje, nem pão, nem dinheiro, nem tenhais duas vestes. 4 E, em qualquer casa em que entrardes, ficai ali e de lá saireis. 5 E, se em qualquer cidade vos não receberem, saindo vós dali, sacudi o pó dos vossos pés, em testemunho contra eles. 6 E, saindo eles, percorreram todas as aldeias, anunciando o evangelho e fazendo curas por toda a parte."}, "joao": null}, {"id": 97, "ordem": 97, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": null, "titulo": "Jesus prepara os discípulos para a perseguição", "mateus": {"referencia": "Mt 10.16-42", "texto": "16 Eis que vos envio como ovelhas ao meio de lobos; portanto, sede prudentes como as serpentes e símplices como as pombas. 17 Acautelai-vos, porém, dos homens, porque eles vos entregarão aos sinédrios e vos açoitarão nas suas sinagogas; 18 e sereis até conduzidos à presença dos governadores e dos reis, por causa de mim, para lhes servir de testemunho, a eles e aos gentios. 19 Mas, quando vos entregarem, não vos dê cuidado como ou o que haveis de falar, porque, naquela mesma hora, vos será ministrado o que haveis de dizer. 20 Porque não sois vós quem falará, mas o Espírito de vosso Pai é que fala em vós. 21 E o irmão entregará à morte o irmão, e o pai, o filho; e os filhos se levantarão contra os pais e os matarão. 22 E odiados de todos sereis por causa do meu nome; mas aquele que perseverar até ao fim será salvo. 23 Quando, pois, vos perseguirem nesta cidade, fugi para outra; porque em verdade vos digo que não acabareis de percorrer as cidades de Israel sem que venha o Filho do Homem. 24 Não é o discípulo mais do que o mestre, nem é o servo mais do que o seu senhor. 25 Basta ao discípulo ser como seu mestre, e ao servo ser como seu senhor. Se chamaram Belzebu ao pai de família, quanto mais aos seus domésticos? 26 Portanto, não os temais, porque nada há encoberto que não haja de revelar-se, nem oculto que não haja de saber-se. 27 O que vos digo em trevas, dizei-o em luz; e o que escutais ao ouvido, pregai-o sobre os telhados. 28 E não temais os que matam o corpo e não podem matar a alma; temei, antes, aquele que pode fazer perecer no inferno a alma e o corpo. 29 Não se vendem dois passarinhos por um ceitil? E nenhum deles cairá em terra sem a vontade de vosso Pai. 30 E até mesmo os cabelos da vossa cabeça estão todos contados. 31 Não temais, pois; mais valeis vós do que muitos passarinhos. 32 Portanto, qualquer que me confessar diante dos homens, eu o confessarei diante de meu Pai, que está nos céus. 33 Mas qualquer que me negar diante dos homens, eu o negarei também diante de meu Pai, que está nos céus. 34 Não cuideis que vim trazer a paz à terra; não vim trazer paz, mas espada; 35 porque eu vim pôr em dissensão o homem contra seu pai, e a filha contra sua mãe, e a nora contra sua sogra. 36 E, assim, os inimigos do homem serão os seus familiares. 37 Quem ama o pai ou a mãe mais do que a mim não é digno de mim; e quem ama o filho ou a filha mais do que a mim não é digno de mim. 38 E quem não toma a sua cruz e não segue após mim não é digno de mim. 39 Quem achar a sua vida perdê-la-á; e quem perder a sua vida por amor de mim achá-la-á. 40 Quem vos recebe a mim me recebe; e quem me recebe a mim, recebe aquele que me enviou. 41 Quem recebe um profeta na qualidade de profeta receberá galardão de profeta; e quem recebe um justo na qualidade de justo, receberá galardão de justo. 42 E qualquer que tiver dado só que seja um copo de água fria a um destes pequenos, em nome de discípulo, em verdade vos digo que de modo algum perderá o seu galardão."}, "marcos": null, "lucas": null, "joao": null}, {"id": 98, "ordem": 98, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": null, "titulo": "Herodes mata João Batista", "mateus": {"referencia": "Mt 14.3-12", "texto": "3 Porque Herodes tinha prendido João e tinha-o manietado e encerrado no cárcere por causa de Herodias, mulher de seu irmão Filipe; 4 porque João lhe dissera: Não te é lícito possuí-la. 5 E, querendo matá-lo, temia o povo, porque o tinham como profeta. 6 Festejando-se, porém, o dia natalício de Herodes, dançou a filha de Herodias diante dele e agradou a Herodes, 7 pelo que prometeu, com juramento, dar-lhe tudo o que pedisse. 8 E ela, instruída previamente por sua mãe, disse: Dá-me aqui num prato a cabeça de João Batista. 9 E o rei afligiu-se, mas, por causa do juramento e dos que estavam à mesa com ele, ordenou que se lhe desse. 10 E mandou degolar João no cárcere, 11 e a sua cabeça foi trazida num prato e dada à jovem, e ela a levou a sua mãe. 12 E chegaram os seus discípulos, e levaram o corpo, e o sepultaram, e foram anunciá-lo a Jesus."}, "marcos": {"referencia": "Mc 6.17-29", "texto": "17 Porquanto o mesmo Herodes mandara prender a João e encerrá-lo manietado no cárcere, por causa de Herodias, mulher de Filipe, seu irmão, porquanto tinha casado com ela. 18 Pois João dizia a Herodes: Não te é lícito possuir a mulher de teu irmão. 19 E Herodias o espiava e queria matá-lo, mas não podia; 20 porque Herodes temia a João, sabendo que era varão justo e santo; e guardava-o com segurança e fazia muitas coisas, atendendo-o, e de boa vontade o ouvia. 21 E, chegando uma ocasião favorável em que Herodes, no dia do seu aniversário, dava uma ceia aos grandes, e tribunos, e príncipes da Galileia, 22 entrou a filha da mesma Herodias, e dançou, e agradou a Herodes e aos que estavam com ele à mesa. Disse, então, o rei à jovem: Pede-me o que quiseres, e eu to darei. 23 E jurou-lhe, dizendo: Tudo o que me pedires te darei, até metade do meu reino. 24 E, saindo ela, perguntou à sua mãe: Que pedirei? E ela disse: A cabeça de João Batista. 25 E, entrando apressadamente, pediu ao rei, dizendo: Quero que, imediatamente, me dês num prato a cabeça de João Batista. 26 E o rei entristeceu-se muito; todavia, por causa do juramento e dos que estavam com ele à mesa, não lha quis negar. 27 E, enviando logo o rei o executor, mandou que lhe trouxessem ali a cabeça de João. E ele foi e degolou-o na prisão. 28 E trouxe a cabeça num prato e deu-a à jovem, e esta a deu à sua mãe. 29 E os seus discípulos, tendo ouvido isso, foram, tomaram o seu corpo e o puseram num sepulcro."}, "lucas": null, "joao": null}, {"id": 99, "ordem": 99, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": null, "titulo": "Herodes pensa que Jesus é João Batista ressuscitado dos mortos", "mateus": {"referencia": "Mt 14.1-2", "texto": "1 Naquele tempo, ouviu Herodes, o tetrarca, a fama de Jesus. 2 E disse aos seus criados: Este é João Batista; ressuscitou dos mortos, e, por isso, estas maravilhas operam nele."}, "marcos": {"referencia": "Mc 6.14-16", "texto": "14 E ouviu isso o rei Herodes (porque o nome de Jesus se tornara notório) e disse: João, o que batizava, ressuscitou dos mortos, e por isso estas maravilhas operam nele. 15 Outros diziam: É Elias. E diziam outros: É um profeta ou como um dos profetas. 16 Herodes, porém, ouvindo isso, disse: Este é João, que mandei degolar; ressuscitou dos mortos."}, "lucas": {"referencia": "Lc 9.7-9", "texto": "7 E o tetrarca Herodes ouvia tudo o que se passava e estava em dúvida, porque diziam alguns que João ressuscitara dos mortos, 8 e outros, que Elias tinha aparecido, e outros, que um profeta dos antigos havia ressuscitado. 9 E disse Herodes: A João mandei eu degolar; quem é, pois, este de quem ouço dizer tais coisas? E procurava vê-lo."}, "joao": null}, {"id": 100, "ordem": 100, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": null, "titulo": "Jesus alimenta cinco mil pessoas", "mateus": {"referencia": "Mt 14.13-21", "texto": "13 E Jesus, ouvindo isso, retirou-se dali num barco, para um lugar deserto, apartado; e, sabendo-o o povo, seguiu-o a pé desde as cidades. 14 E Jesus, saindo, viu uma grande multidão e, possuído de íntima compaixão para com ela, curou os seus enfermos. 15 E, sendo chegada a tarde, os seus discípulos aproximaram-se dele, dizendo: O lugar é deserto, e a hora é já avançada; despede a multidão, para que vão pelas aldeias e comprem comida para si. 16 Jesus, porém, lhes disse: Não é mister que vão; dai-lhes vós de comer. 17 Então, eles lhe disseram: Não temos aqui senão cinco pães e dois peixes. 18 E ele disse: Trazei-mos aqui. 19 Tendo mandado que a multidão se assentasse sobre a erva, tomou os cinco pães e os dois peixes, e, erguendo os olhos ao céu, os abençoou, e, partindo os pães, deu-os aos discípulos, e os discípulos, à multidão. 20 E comeram todos e saciaram-se, e levantaram dos pedaços que sobejaram doze cestos cheios. 21 E os que comeram foram quase cinco mil homens, além das mulheres e crianças."}, "marcos": {"referencia": "Mc 6.30-44", "texto": "30 E os apóstolos ajuntaram-se a Jesus e contaram-lhe tudo, tanto o que tinham feito como o que tinham ensinado. 31 E ele disse-lhes: Vinde vós, aqui à parte, a um lugar deserto, e repousai um pouco. Porque havia muitos que iam, e vinham, e não tinham tempo para comer. 32 E foram sós num barco para um lugar deserto. 33 E a multidão viu-os partir, e muitos os conheceram, e correram para lá, a pé, de todas as cidades, e ali chegaram primeiro do que eles, e aproximavam-se deles. 34 E Jesus, saindo, viu uma grande multidão, e teve compaixão deles, porque eram como ovelhas que não têm pastor; e começou a ensinar-lhes muitas coisas. 35 E, como o dia fosse já muito adiantado, os seus discípulos se aproximaram dele e lhe disseram: O lugar é deserto, e o dia está já muito adiantado; 36 despede-os, para que vão aos campos e aldeias circunvizinhas e comprem pão para si, porque não têm o que comer. 37 Ele, porém, respondendo, lhes disse: Dai-lhes vós de comer. E eles disseram-lhe: Iremos nós e compraremos duzentos dinheiros de pão para lhes darmos de comer? 38 E ele disse-lhes: Quantos pães tendes? Ide ver. E, sabendo-o eles, disseram: Cinco pães e dois peixes. 39 E ordenou-lhes que fizessem assentar a todos, em grupos, sobre a erva verde. 40 E assentaram-se repartidos de cem em cem e de cinquenta em cinquenta. 41 E, tomando ele os cinco pães e os dois peixes, levantou os olhos ao céu, e abençoou, e partiu os pães, e deu-os aos seus discípulos para que os pusessem diante deles. E repartiu os dois peixes por todos. 42 E todos comeram e ficaram fartos, 43 e levantaram doze cestos cheios de pedaços de pão e de peixe. 44 E os que comeram os pães eram quase cinco mil homens."}, "lucas": {"referencia": "Lc 9.10-17", "texto": "10 E, regressando os apóstolos, contaram-lhe tudo o que tinham feito. E, tomando-os consigo, retirou-se para um lugar deserto de uma cidade chamada Betsaida. 11 E, sabendo-o a multidão, o seguiu; e ele os recebeu, e falava-lhes do Reino de Deus, e sarava os que necessitavam de cura. 12 E já o dia começava a declinar; então, chegando-se a ele os doze, disseram-lhe: Despede a multidão, para que, indo aos campos e aldeias ao redor, se agasalhem e achem o que comer, porque aqui estamos em lugar deserto. 13 Mas ele lhes disse: Dai-lhes vós de comer. E eles disseram: Não temos senão cinco pães e dois peixes, salvo se nós próprios formos comprar comida para todo este povo. 14 Porquanto estavam ali quase cinco mil homens. Disse, então, aos seus discípulos: Fazei-os assentar, em grupos de cinquenta em cinquenta. 15 E assim o fizeram, fazendo-os assentar a todos. 16 E, tomando os cinco pães e os dois peixes e olhando para o céu, abençoou-os, e partiu-os, e deu-os aos seus discípulos para os porem diante da multidão. 17 E comeram todos e saciaram-se; e levantaram, do que lhes sobejou, doze cestos de pedaços."}, "joao": {"referencia": "Jo 6.1-15", "texto": "1 Depois disso, partiu Jesus para o outro lado do mar da Galileia, que é o de Tiberíades. 2 E grande multidão o seguia, porque via os sinais que operava sobre os enfermos. 3 E Jesus subiu ao monte e assentou-se ali com os seus discípulos. 4 E a Páscoa, a festa dos judeus, estava próxima. 5 Então, Jesus, levantando os olhos e vendo que uma grande multidão vinha ter com ele, disse a Filipe: Onde compraremos pão, para estes comerem? 6 Mas dizia isso para o experimentar; porque ele bem sabia o que havia de fazer. 7 Filipe respondeu-lhe: Duzentos dinheiros de pão não lhes bastarão, para que cada um deles tome um pouco. 8 E um dos seus discípulos, André, irmão de Simão Pedro, disse-lhe: 9 Está aqui um rapaz que tem cinco pães de cevada e dois peixinhos; mas que é isso para tantos? 10 E disse Jesus: Mandai assentar os homens. E havia muita relva naquele lugar. Assentaram-se, pois, os homens em número de quase cinco mil. 11 E Jesus tomou os pães e, havendo dado graças, repartiu-os pelos discípulos, e os discípulos, pelos que estavam assentados; e igualmente também os peixes, quanto eles queriam. 12 E, quando estavam saciados, disse aos seus discípulos: Recolhei os pedaços que sobejaram, para que nada se perca. 13 Recolheram-nos, pois, e encheram doze cestos de pedaços dos cinco pães de cevada, que sobejaram aos que haviam comido. 14 Vendo, pois, aqueles homens o milagre que Jesus tinha feito, diziam: Este é, verdadeiramente, o profeta que devia vir ao mundo. 15 Sabendo, pois, Jesus que haviam de vir arrebatá-lo, para o fazerem rei, tornou a retirar-se, ele só, para o monte."}}, {"id": 101, "ordem": 101, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": null, "titulo": "Jesus anda sobre as águas", "mateus": {"referencia": "Mt 14.22-33", "texto": "22 E logo ordenou Jesus que os seus discípulos entrassem no barco e fossem adiante, para a outra banda, enquanto despedia a multidão. 23 E, despedida a multidão, subiu ao monte para orar à parte. E, chegada já a tarde, estava ali só. 24 E o barco estava já no meio do mar, açoitado pelas ondas, porque o vento era contrário. 25 Mas, à quarta vigília da noite, dirigiu-se Jesus para eles, caminhando por cima do mar. 26 E os discípulos, vendo-o caminhar sobre o mar, assustaram-se, dizendo: É um fantasma. E gritaram, com medo. 27 Jesus, porém, lhes falou logo, dizendo: Tende bom ânimo, sou eu; não temais. 28 E respondeu-lhe Pedro e disse: Senhor, se és tu, manda-me ir ter contigo por cima das águas. 29 E ele disse: Vem. E Pedro, descendo do barco, andou sobre as águas para ir ter com Jesus. 30 Mas, sentindo o vento forte, teve medo; e, começando a ir para o fundo, clamou, dizendo: Senhor, salva-me. 31 E logo Jesus, estendendo a mão, segurou-o e disse-lhe: Homem de pequena fé, por que duvidaste? 32 E, quando subiram para o barco, acalmou o vento. 33 Então, aproximaram-se os que estavam no barco e adoraram-no, dizendo: És verdadeiramente o Filho de Deus."}, "marcos": {"referencia": "Mc 6.45-52", "texto": "45 E logo obrigou os seus discípulos a subir para o barco, e passar adiante, para o outro lado, a Betsaida, enquanto ele despedia a multidão. 46 E, tendo-os despedido, foi ao monte para orar. 47 E, sobrevindo a tarde, estava o barco no meio do mar, e ele, sozinho em terra. 48 E, vendo que se fatigavam a remar, porque o vento lhes era contrário, perto da quarta vigília da noite, aproximou-se deles, andando sobre o mar, e queria passar adiante deles, 49 mas, quando eles o viram andar sobre o mar, pensaram que era um fantasma e deram grandes gritos. 50 Porque todos o viram e perturbaram-se; mas logo falou com eles e disse-lhes: Tende bom ânimo, sou eu; não temais. 51 E subiu para o barco para estar com eles, e o vento se aquietou; e, entre si, ficaram muito assombrados e maravilhados, 52 pois não tinham compreendido o milagre dos pães; antes, o seu coração estava endurecido."}, "lucas": null, "joao": {"referencia": "Jo 6.16-21", "texto": "16 E, quando veio a tarde, os seus discípulos desceram para o mar. 17 E, entrando no barco, passaram o mar em direção a Cafarnaum; e era já escuro, e ainda Jesus não tinha chegado perto deles. 18 E o mar se levantou, porque um grande vento assoprava. 19 E, tendo navegado uns vinte e cinco ou trinta estádios, viram Jesus andando sobre o mar e aproximando-se do barco, e temeram. 20 Porém ele lhes disse: Sou eu; não temais. 21 Então, eles, de boa mente, o receberam no barco; e logo o barco chegou à terra para onde iam."}}, {"id": 102, "ordem": 102, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": null, "titulo": "Jesus cura todos aqueles que o tocam", "mateus": {"referencia": "Mt 14.34-36", "texto": "34 E, tendo passado para a outra banda, chegaram à terra de Genesaré. 35 E, quando os homens daquele lugar o conheceram, mandaram por todas aquelas terras em redor e trouxeram-lhe todos os que estavam enfermos. 36 E rogavam-lhe que, ao menos, eles pudessem tocar a orla da sua veste; e todos os que a tocavam ficavam sãos."}, "marcos": {"referencia": "Mc 6.53-56", "texto": "53 E, quando já estavam no outro lado, dirigiram-se à terra de Genesaré e ali atracaram. 54 E, saindo eles do barco, logo o reconheceram; 55 e, percorrendo toda a terra em redor, começaram a trazer em leitos, onde quer que sabiam que ele estava, os que se achavam enfermos. 56 E, onde quer que entrava, ou em cidade, ou em aldeias, ou no campo, apresentavam os enfermos nas praças e rogavam-lhe que os deixasse tocar ao menos na orla da sua veste, e todos os que lhe tocavam saravam."}, "lucas": null, "joao": null}, {"id": 103, "ordem": 103, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": null, "titulo": "Jesus é o verdadeiro pão que veio do céu", "mateus": null, "marcos": null, "lucas": null, "joao": {"referencia": "Jo 6.22-40", "texto": "22 No dia seguinte, a multidão que estava do outro lado do mar, vendo que não havia ali mais do que um barquinho e que Jesus não entrara com seus discípulos naquele barquinho, mas que os seus discípulos tinham ido sós 23 (contudo, outros barquinhos tinham chegado de Tiberíades, perto do lugar onde comeram o pão, havendo o Senhor dado graças); 24 vendo, pois, a multidão que Jesus não estava ali, nem os seus discípulos, entraram eles também nos barcos e foram a Cafarnaum, em busca de Jesus. 25 E, achando-o no outro lado do mar, disseram-lhe: Rabi, quando chegaste aqui? 26 Jesus respondeu e disse-lhes: Na verdade, na verdade vos digo que me buscais não pelos sinais que vistes, mas porque comestes do pão e vos saciastes. 27 Trabalhai não pela comida que perece, mas pela comida que permanece para a vida eterna, a qual o Filho do Homem vos dará, porque a este o Pai, Deus, o selou. 28 Disseram-lhe, pois: Que faremos para executarmos as obras de Deus? 29 Jesus respondeu e disse-lhes: A obra de Deus é esta: que creiais naquele que ele enviou. 30 Disseram-lhe, pois: Que sinal, pois, fazes tu, para que o vejamos, e creiamos em ti? Que operas tu? 31 Nossos pais comeram o maná no deserto, como está escrito: Deu-lhes a comer o pão do céu. 32 Disse-lhes, pois, Jesus: Na verdade, na verdade vos digo que Moisés não vos deu o pão do céu, mas meu Pai vos dá o verdadeiro pão do céu. 33 Porque o pão de Deus é aquele que desce do céu e dá vida ao mundo. 34 Disseram-lhe, pois: Senhor, dá-nos sempre desse pão. 35 E Jesus lhes disse: Eu sou o pão da vida; aquele que vem a mim não terá fome; e quem crê em mim nunca terá sede. 36 Mas já vos disse que também vós me vistes e, contudo, não credes. 37 Tudo o que o Pai me dá virá a mim; e o que vem a mim de maneira nenhuma o lançarei fora. 38 Porque eu desci do céu não para fazer a minha vontade, mas a vontade daquele que me enviou. 39 E a vontade do Pai, que me enviou, é esta: que nenhum de todos aqueles que me deu se perca, mas que o ressuscite no último Dia. 40 Porquanto a vontade daquele que me enviou é esta: que todo aquele que vê o Filho e crê nele tenha a vida eterna; e eu o ressuscitarei no último Dia."}}, {"id": 104, "ordem": 104, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": null, "titulo": "Alguns discordam de que Jesus veio do céu", "mateus": null, "marcos": null, "lucas": null, "joao": {"referencia": "Jo 6.41-59", "texto": "41 Murmuravam, pois, dele os judeus, porque dissera: Eu sou o pão que desceu do céu. 42 E diziam: Não é este Jesus, o filho de José, cujo pai e mãe nós conhecemos? Como, pois, diz ele: Desci do céu? 43 Respondeu, pois, Jesus e disse-lhes: Não murmureis entre vós. 44 Ninguém pode vir a mim, se o Pai, que me enviou, o não trouxer; e eu o ressuscitarei no último Dia. 45 Está escrito nos profetas: E serão todos ensinados por Deus. Portanto, todo aquele que do Pai ouviu e aprendeu vem a mim. 46 Não que alguém visse ao Pai, a não ser aquele que é de Deus; este tem visto ao Pai. 47 Na verdade, na verdade vos digo que aquele que crê em mim tem a vida eterna. 48 Eu sou o pão da vida. 49 Vossos pais comeram o maná no deserto e morreram. 50 Este é o pão que desce do céu, para que o que dele comer não morra. 51 Eu sou o pão vivo que desceu do céu; se alguém comer desse pão, viverá para sempre; e o pão que eu der é a minha carne, que eu darei pela vida do mundo. 52 Disputavam, pois, os judeus entre si, dizendo: Como nos pode dar este a sua carne a comer? 53 Jesus, pois, lhes disse: Na verdade, na verdade vos digo que, se não comerdes a carne do Filho do Homem e não beberdes o seu sangue, não tereis vida em vós mesmos. 54 Quem come a minha carne e bebe o meu sangue tem a vida eterna, e eu o ressuscitarei no último Dia. 55 Porque a minha carne verdadeiramente é comida, e o meu sangue verdadeiramente é bebida. 56 Quem come a minha carne e bebe o meu sangue permanece em mim, e eu, nele. 57 Assim como o Pai, que vive, me enviou, e eu vivo pelo Pai, assim quem de mim se alimenta também viverá por mim. 58 Este é o pão que desceu do céu; não é o caso de vossos pais, que comeram o maná e morreram; quem comer este pão viverá para sempre. 59 Ele disse essas coisas na sinagoga, ensinando em Cafarnaum."}}, {"id": 105, "ordem": 105, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": null, "titulo": "Muitos discípulos abandonam Jesus", "mateus": null, "marcos": null, "lucas": null, "joao": {"referencia": "Jo 6.60-71", "texto": "60 Muitos, pois, dos seus discípulos, ouvindo isso, disseram: Duro é este discurso; quem o pode ouvir? 61 Sabendo, pois, Jesus em si mesmo que os seus discípulos murmuravam a respeito disso, disse-lhes: Isto vos escandaliza? 62 Que seria, pois, se vísseis subir o Filho do Homem para onde primeiro estava? 63 O espírito é o que vivifica, a carne para nada aproveita; as palavras que eu vos disse são espírito e vida. 64 Mas há alguns de vós que não creem. Porque bem sabia Jesus, desde o princípio, quem eram os que não criam e quem era o que o havia de entregar. 65 E dizia: Por isso, eu vos disse que ninguém pode vir a mim, se por meu Pai lhe não for concedido. 66 Desde então, muitos dos seus discípulos tornaram para trás e já não andavam com ele. 67 Então, disse Jesus aos doze: Quereis vós também retirar-vos? 68 Respondeu-lhe, pois, Simão Pedro: Senhor, para quem iremos nós? Tu tens as palavras da vida eterna, 69 e nós temos crido e conhecido que tu és o Cristo, o Filho de Deus. 70 Respondeu-lhe Jesus: Não vos escolhi a vós os doze? E um de vós é um diabo. 71 E isso dizia ele de Judas Iscariotes, filho de Simão, porque este o havia de entregar, sendo um dos doze."}}, {"id": 106, "ordem": 106, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": null, "titulo": "Jesus ensina sobre a pureza interior", "mateus": {"referencia": "Mt 15.1-20", "texto": "1 Então, chegaram ao pé de Jesus uns escribas e fariseus de Jerusalém, dizendo: 2 Por que transgridem os teus discípulos a tradição dos anciãos? Pois não lavam as mãos quando comem pão. 3 Ele, porém, respondendo, disse-lhes: Por que transgredis vós também o mandamento de Deus pela vossa tradição? 4 Porque Deus ordenou, dizendo: Honra a teu pai e a tua mãe; e: Quem maldisser ao pai ou à mãe, que morra de morte. 5 Mas vós dizeis: Qualquer que disser ao pai ou à mãe: É oferta ao Senhor o que poderias aproveitar de mim, esse não precisa honrar nem a seu pai nem a sua mãe, 6 E assim invalidastes, pela vossa tradição, o mandamento de Deus. 7 Hipócritas, bem profetizou Isaías a vosso respeito, dizendo: 8 Este povo honra-me com os seus lábios, mas o seu coração está longe de mim. 9 Mas em vão me adoram, ensinando doutrinas que são preceitos dos homens. 10 E, chamando a si a multidão, disse-lhes: Ouvi e entendei: 11 o que contamina o homem não é o que entra na boca, mas o que sai da boca, isso é o que contamina o homem. 12 Então, acercando-se dele os seus discípulos, disseram-lhe: Sabes que os fariseus, ouvindo essas palavras, se escandalizaram? 13 Ele, porém, respondendo, disse: Toda planta que meu Pai celestial não plantou será arrancada. 14 Deixai-os; são condutores cegos; ora, se um cego guiar outro cego, ambos cairão na cova. 15 E Pedro, tomando a palavra, disse-lhe: Explica-nos essa parábola. 16 Jesus, porém, disse: Até vós mesmos estais ainda sem entender? 17 Ainda não compreendeis que tudo o que entra pela boca desce para o ventre e é lançado fora? 18 Mas o que sai da boca procede do coração, e isso contamina o homem. 19 Porque do coração procedem os maus pensamentos, mortes, adultérios, prostituição, furtos, falsos testemunhos e blasfêmias. 20 São essas coisas que contaminam o homem; mas comer sem lavar as mãos, isso não contamina o homem."}, "marcos": {"referencia": "Mc 7.1-23", "texto": "1 E reuniram-se em volta dele os fariseus e alguns dos escribas que tinham vindo de Jerusalém. 2 E, vendo que alguns dos seus discípulos comiam pão com as mãos impuras, isto é, por lavar, os repreendiam. 3 Porque os fariseus e todos os judeus, conservando a tradição dos antigos, não comem sem lavar as mãos muitas vezes; 4 e, quando voltam do mercado, se não se lavarem, não comem. E muitas outras coisas há que receberam para observar, como lavar os copos, e os jarros, e os vasos de metal, e as camas. 5 Depois, perguntaram-lhe os fariseus e os escribas: Por que não andam os teus discípulos conforme a tradição dos antigos, mas comem com as mãos por lavar? 6 E ele, respondendo, disse-lhes: Bem profetizou Isaías acerca de vós, hipócritas, como está escrito: Este povo honra-me com os lábios, mas o seu coração está longe de mim. 7 Em vão, porém, me honram, ensinando doutrinas que são mandamentos de homens. 8 Porque, deixando o mandamento de Deus, retendes a tradição dos homens, como o lavar dos jarros e dos copos, e fazeis muitas outras coisas semelhantes a estas. 9 E dizia-lhes: Bem invalidais o mandamento de Deus para guardardes a vossa tradição. 10 Porque Moisés disse: Honra a teu pai e a tua mãe e: Quem maldisser ou o pai ou a mãe deve ser punido com a morte. 11 Porém vós dizeis: Se um homem disser ao pai ou à mãe: Aquilo que poderias aproveitar de mim é Corbã, isto é, oferta ao Senhor, 12 nada mais lhe deixais fazer por seu pai ou por sua mãe, 13 invalidando, assim, a palavra de Deus pela vossa tradição, que vós ordenastes. E muitas coisas fazeis semelhantes a estas. 14 E, chamando outra vez a multidão, disse-lhes: Ouvi-me, vós todos, e compreendei. 15 Nada há, fora do homem, que, entrando nele, o possa contaminar; mas o que sai dele, isso é que contamina o homem. 16 Se alguém tem ouvidos para ouvir, que ouça. 17 Depois, quando deixou a multidão e entrou em casa, os seus discípulos o interrogavam acerca desta parábola. 18 E ele disse-lhes: Assim também vós estais sem entendimento? Não compreendeis que tudo o que de fora entra no homem não o pode contaminar, 19 porque não entra no seu coração, mas no ventre e é lançado fora, ficando puras todas as comidas? 20 E dizia: O que sai do homem, isso é que contamina o homem. 21 Porque do interior do coração dos homens saem os maus pensamentos, os adultérios, as prostituições, os homicídios, 22 os furtos, a avareza, as maldades, o engano, a dissolução, a inveja, a blasfêmia, a soberba, a loucura. 23 Todos estes males procedem de dentro e contaminam o homem."}, "lucas": null, "joao": null}, {"id": 107, "ordem": 107, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "O Ministério de Jesus além da Galileia", "titulo": "Jesus expulsa um demônio de uma jovem", "mateus": {"referencia": "Mt 15.21-28", "texto": "21 E, partindo Jesus dali, foi para as partes de Tiro e de Sidom. 22 E eis que uma mulher cananeia, que saíra daquelas cercanias, clamou, dizendo: Senhor, Filho de Davi, tem misericórdia de mim, que minha filha está miseravelmente endemoninhada. 23 Mas ele não lhe respondeu palavra. E os seus discípulos, chegando ao pé dele, rogaram-lhe, dizendo: Despede-a, que vem gritando atrás de nós. 24 E ele, respondendo, disse: Eu não fui enviado senão às ovelhas perdidas da casa de Israel. 25 Então, chegou ela e adorou-o, dizendo: Senhor, socorre-me. 26 Ele, porém, respondendo, disse: Não é bom pegar o pão dos filhos e deitá-lo aos cachorrinhos. 27 E ela disse: Sim, Senhor, mas também os cachorrinhos comem das migalhas que caem da mesa dos seus senhores. 28 Então, respondeu Jesus e disse-lhe: Ó mulher, grande é a tua fé. Seja isso feito para contigo, como tu desejas. E, desde aquela hora, a sua filha ficou sã."}, "marcos": {"referencia": "Mc 7.24-30", "texto": "24 E, levantando-se dali, foi para os territórios de Tiro e de Sidom. E, entrando numa casa, queria que ninguém o soubesse, mas não pôde esconder-se, 25 porque uma mulher cuja filha tinha um espírito imundo, ouvindo falar dele, foi e lançou-se aos seus pés. 26 E a mulher era grega, siro-fenícia de nação, e rogava-lhe que expulsasse de sua filha o demônio. 27 Mas Jesus disse-lhe: Deixa primeiro saciar os filhos, porque não convém tomar o pão dos filhos e lançá-lo aos cachorrinhos. 28 Ela, porém, respondeu e disse-lhe: Sim, Senhor; mas também os cachorrinhos comem, debaixo da mesa, as migalhas dos filhos. 29 Então, ele disse-lhe: Por essa palavra, vai; o demônio já saiu de tua filha. 30 E, indo ela para sua casa, achou a filha deitada sobre a cama, pois o demônio já tinha saído."}, "lucas": null, "joao": null}, {"id": 108, "ordem": 108, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "O Ministério de Jesus além da Galileia", "titulo": "Jesus cura muitas pessoas", "mateus": {"referencia": "Mt 15.29-31", "texto": "29 Partindo Jesus dali, chegou ao pé do mar da Galileia e, subindo a um monte, assentou-se lá. 30 E veio ter com ele muito povo, que trazia coxos, cegos, mudos, aleijados e outros muitos; e os puseram aos pés de Jesus, e ele os sarou, 31 de tal sorte que a multidão se maravilhou vendo os mudos a falar, os aleijados sãos, os coxos a andar, e os cegos a ver; e glorificava o Deus de Israel."}, "marcos": {"referencia": "Mc 7.31-37", "texto": "31 E ele, tornando a sair dos territórios de Tiro e de Sidom, foi até ao mar da Galileia, pelos confins de Decápolis. 32 E trouxeram-lhe um surdo, que falava dificilmente, e rogaram-lhe que impusesse as mãos sobre ele. 33 E, tirando-o à parte de entre a multidão, pôs-lhe os dedos nos ouvidos e, cuspindo, tocou-lhe na língua. 34 E, levantando os olhos ao céu, suspirou e disse: Efatá, isto é, abre-te. 35 E logo se lhe abriram os ouvidos, e a prisão da língua se desfez, e falava perfeitamente. 36 E ordenou-lhes que a ninguém o dissessem; mas, quanto mais lho proibia, tanto mais o divulgavam. 37 E, admirando-se sobremaneira, diziam: Tudo faz bem; faz ouvir os surdos e falar os mudos."}, "lucas": null, "joao": null}, {"id": 109, "ordem": 109, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "O Ministério de Jesus além da Galileia", "titulo": "Jesus alimenta quatro mil pessoas", "mateus": {"referencia": "Mt 15.32-39", "texto": "32 E Jesus, chamando os seus discípulos, disse: Tenho compaixão da multidão, porque já está comigo há três dias e não tem o que comer, e não quero despedi-la em jejum, para que não desfaleça no caminho. 33 E os seus discípulos disseram-lhe: Donde nos viriam num deserto tantos pães, para saciar tal multidão? 34 E Jesus disse-lhes: Quantos pães tendes? E eles disseram: Sete e uns poucos peixinhos. 35 Então, mandou à multidão que se assentasse no chão. 36 E, tomando os sete pães e os peixes e dando graças, partiu-os e deu-os aos seus discípulos, e os discípulos, à multidão. 37 E todos comeram e se saciaram, e levantaram, do que sobejou, sete cestos cheios de pedaços. 38 Ora, os que tinham comido eram quatro mil homens, além de mulheres e crianças. 39 E, tendo despedido a multidão, entrou no barco e dirigiu-se ao território de Magdala."}, "marcos": {"referencia": "Mc 8.1-10", "texto": "1 Naqueles dias, havendo mui grande multidão e não tendo o que comer, Jesus chamou a si os seus discípulos e disse-lhes: 2 Tenho compaixão da multidão, porque há já três dias que estão comigo e não têm o que comer. 3 E, se os deixar ir em jejum para casa, desfalecerão no caminho, porque alguns deles vieram de longe. 4 E os seus discípulos responderam-lhe: Donde poderá alguém satisfazê-los de pão aqui no deserto? 5 E perguntou-lhes: Quantos pães tendes? E disseram-lhe: Sete. 6 E ordenou à multidão que se assentasse no chão. E, tomando os sete pães e tendo dado graças, partiu-os e deu-os aos seus discípulos, para que os pusessem diante deles; e puseram-nos diante da multidão. 7 Tinham também uns poucos peixinhos; e, tendo dado graças, ordenou que também lhos pusessem diante. 8 E comeram e saciaram-se; e, dos pedaços que sobejaram, levantaram sete cestos. 9 E os que comeram eram quase quatro mil; e despediu-os. 10 E, entrando logo no barco com os seus discípulos, foi para as regiões de Dalmanuta."}, "lucas": null, "joao": null}, {"id": 110, "ordem": 110, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Retoma seu Ministério na Galileia", "titulo": "Os líderes exigem um sinal miraculoso", "mateus": {"referencia": "Mt 16.1-4", "texto": "1 E, chegando-se os fariseus e os saduceus para o tentarem, pediram-lhe que lhes mostrasse algum sinal do céu. 2 Mas ele, respondendo, disse-lhes: Quando é chegada a tarde, dizeis: Haverá bom tempo, porque o céu está rubro. 3 E pela manhã: Hoje haverá tempestade, porque o céu está de um vermelho sombrio. Hipócritas, sabeis diferençar a face do céu e não conheceis os sinais dos tempos? 4 Uma geração má e adúltera pede um sinal, e nenhum sinal lhe será dado, senão o sinal do profeta Jonas. E, deixando-os, retirou-se."}, "marcos": {"referencia": "Mc 8.11-13", "texto": "11 E saíram os fariseus e começaram a disputar com ele, pedindo-lhe, para o tentarem, um sinal do céu. 12 E, suspirando profundamente em seu espírito, disse: Por que pede esta geração um sinal? Em verdade vos digo que a esta geração não se dará sinal algum. 13 E, deixando-os, tornou a entrar no barco e foi para o outro lado."}, "lucas": null, "joao": null}, {"id": 111, "ordem": 111, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Retoma seu Ministério na Galileia", "titulo": "Jesus adverte contra o ensino errôneo", "mateus": {"referencia": "Mt 16.5-12", "texto": "5 E, passando seus discípulos para a outra banda, tinham-se esquecido de fornecer-se de pão. 6 E Jesus disse-lhes: Adverti e acautelai-vos do fermento dos fariseus e saduceus. 7 E eles arrazoavam entre si, dizendo: É porque não nos fornecemos de pão. 8 E Jesus, percebendo isso, disse: Por que arrazoais entre vós, homens de pequena fé, sobre o não vos terdes fornecido de pão? 9 Não compreendeis ainda, nem vos lembrais dos cinco pães para cinco mil homens e de quantos cestos levantastes? 10 Nem dos sete pães para quatro mil e de quantos cestos levantastes? 11 Como não compreendestes que não vos falei a respeito do pão, mas que vos guardásseis do fermento dos fariseus e saduceus? 12 Então, compreenderam que não dissera que se guardassem do fermento do pão, mas da doutrina dos fariseus."}, "marcos": {"referencia": "Mc 8.14-21", "texto": "14 E eles se esqueceram de levar pão e no barco não tinham consigo senão um pão. 15 E ordenou-lhes, dizendo: Olhai, guardai-vos do fermento dos fariseus e do fermento de Herodes. 16 E arrazoavam entre si, dizendo: É porque não temos pão. 17 E Jesus, conhecendo isso, disse-lhes: Para que arrazoais, que não tendes pão? Não considerastes, nem compreendestes ainda? Tendes ainda o vosso coração endurecido? 18 Tendo olhos, não vedes? E, tendo ouvidos, não ouvis? E não vos lembrais 19 quando parti os cinco pães entre os cinco mil, quantos cestos cheios de pedaços levantastes? Disseram-lhe: Doze. 20 E, quando parti os sete entre os quatro mil, quantos cestos cheios de pedaços levantastes? E disseram-lhe: Sete. 21 E ele lhes disse: Como não entendeis ainda?"}, "lucas": null, "joao": null}, {"id": 112, "ordem": 112, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Retoma seu Ministério na Galileia", "titulo": "Jesus restaura a visão para um homem cego", "mateus": null, "marcos": {"referencia": "Mc 8.22-26", "texto": "22 E chegou a Betsaida; e trouxeram-lhe um cego e rogaram-lhe que lhe tocasse. 23 E, tomando o cego pela mão, levou-o para fora da aldeia; e, cuspindo-lhe nos olhos e impondo-lhe as mãos, perguntou-lhe se via alguma coisa. 24 E, levantando ele os olhos, disse: Vejo os homens, pois os vejo como árvores que andam. 25 Depois, tornou a pôr-lhe as mãos nos olhos, e ele, olhando firmemente, ficou restabelecido e já via ao longe e distintamente a todos. 26 E mandou-o para sua casa, dizendo: Não entres na aldeia."}, "lucas": null, "joao": null}, {"id": 113, "ordem": 113, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Retoma seu Ministério na Galileia", "titulo": "Pedro diz que Jesus é o Messias", "mateus": {"referencia": "Mt 16.13-20", "texto": "13 E, chegando Jesus às partes de Cesareia de Filipe, interrogou os seus discípulos, dizendo: Quem dizem os homens ser o Filho do Homem? 14 E eles disseram: Uns, João Batista; outros, Elias, e outros, Jeremias ou um dos profetas. 15 Disse-lhes ele: E vós, quem dizeis que eu sou? 16 E Simão Pedro, respondendo, disse: Tu és o Cristo, o Filho do Deus vivo. 17 E Jesus, respondendo, disse-lhe: Bem-aventurado és tu, Simão Barjonas, porque não foi carne e sangue quem to revelou, mas meu Pai, que está nos céus. 18 Pois também eu te digo que tu és Pedro e sobre esta pedra edificarei a minha igreja, e as portas do inferno não prevalecerão contra ela. 19 E eu te darei as chaves do Reino dos céus, e tudo o que ligares na terra será ligado nos céus, e tudo o que desligares na terra será desligado nos céus. 20 Então, mandou aos seus discípulos que a ninguém dissessem que ele era o Cristo."}, "marcos": {"referencia": "Mc 8.27-30", "texto": "27 E saiu Jesus e os seus discípulos para as aldeias de Cesareia de Filipe; e, no caminho, perguntou aos seus discípulos, dizendo: Quem dizem os homens que eu sou? 28 E eles responderam: João Batista; e outros, Elias; mas outros, um dos profetas. 29 E ele lhes disse: Mas vós quem dizeis que eu sou? E, respondendo Pedro, lhe disse: Tu és o Cristo. 30 E admoestou-os, para que a ninguém dissessem aquilo dele."}, "lucas": {"referencia": "Lc 9.18-21", "texto": "18 E aconteceu que, estando ele orando em particular, estavam com ele os discípulos; e perguntou-lhes, dizendo: Quem diz a multidão que eu sou? 19 E, respondendo eles, disseram: João Batista; outros, Elias, e outros, que um dos antigos profetas ressuscitou. 20 E disse-lhes: E vós quem dizeis que eu sou? E, respondendo Pedro, disse: O Cristo de Deus. 21 E, admoestando-os, mandou que a ninguém referissem isso,"}, "joao": null}, {"id": 114, "ordem": 114, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Retoma seu Ministério na Galileia", "titulo": "Jesus prediz sua morte pela primeira vez", "mateus": {"referencia": "Mt 16.21-28", "texto": "21 Desde então, começou Jesus a mostrar aos seus discípulos que convinha ir a Jerusalém, e padecer muito dos anciãos, e dos principais dos sacerdotes, e dos escribas, e ser morto, e ressuscitar ao terceiro dia. 22 E Pedro, tomando-o de parte, começou a repreendê-lo, dizendo: Senhor, tem compaixão de ti; de modo nenhum te acontecerá isso. 23 Ele, porém, voltando-se, disse a Pedro: Para trás de mim, Satanás, que me serves de escândalo; porque não compreendes as coisas que são de Deus, mas só as que são dos homens. 24 Então, disse Jesus aos seus discípulos: Se alguém quiser vir após mim, renuncie-se a si mesmo, tome sobre si a sua cruz e siga-me; 25 porque aquele que quiser salvar a sua vida perdê-la-á, e quem perder a sua vida por amor de mim achá-la-á. 26 Pois que aproveita ao homem ganhar o mundo inteiro, se perder a sua alma? Ou que dará o homem em recompensa da sua alma? 27 Porque o Filho do Homem virá na glória de seu Pai, com os seus anjos; e, então, dará a cada um segundo as suas obras. 28 Em verdade vos digo que alguns há, dos que aqui estão, que não provarão a morte até que vejam vir o Filho do Homem no seu Reino."}, "marcos": {"referencia": "Mc 8.31-9.1", "texto": "31 E começou a ensinar-lhes que importava que o Filho do Homem padecesse muito, e que fosse rejeitado pelos anciãos, e pelos príncipes dos sacerdotes, e pelos escribas, e que fosse morto, mas que, depois de três dias, ressuscitaria. 32 E dizia abertamente estas palavras. E Pedro o tomou à parte e começou a repreendê-lo. 33 Mas ele, virando-se e olhando para os seus discípulos, repreendeu a Pedro, dizendo: Retira-te de diante de mim, Satanás; porque não compreendes as coisas que são de Deus, mas as que são dos homens. 34 E, chamando a si a multidão, com os seus discípulos, disse-lhes: Se alguém quiser vir após mim, negue-se a si mesmo, e tome a sua cruz, e siga-me. 35 Porque qualquer que quiser salvar a sua vida perdê-la-á, mas qualquer que perder a sua vida por amor de mim e do evangelho, esse a salvará. 36 Pois que aproveitaria ao homem ganhar todo o mundo e perder a sua alma? 37 Ou que daria o homem pelo resgate da sua alma? 38 Porquanto qualquer que, entre esta geração adúltera e pecadora, se envergonhar de mim e das minhas palavras, também o Filho do Homem se envergonhará dele, quando vier na glória de seu Pai, com os santos anjos. 1 Dizia-lhes também: Em verdade vos digo que, dos que aqui estão, alguns há que não provarão a morte sem que vejam chegado o Reino de Deus com poder."}, "lucas": {"referencia": "Lc 9.22-27", "texto": "22 dizendo: É necessário que o Filho do Homem padeça muitas coisas, e seja rejeitado dos anciãos e dos escribas, e seja morto, e ressuscite ao terceiro dia. 23 E dizia a todos: Se alguém quer vir após mim, negue-se a si mesmo, e tome cada dia a sua cruz, e siga-me. 24 Porque qualquer que quiser salvar a sua vida perdê-la-á; mas qualquer que, por amor de mim, perder a sua vida a salvará. 25 Porque que aproveita ao homem granjear o mundo todo, perdendo-se ou prejudicando-se a si mesmo? 26 Porque qualquer que de mim e das minhas palavras se envergonhar, dele se envergonhará o Filho do Homem, quando vier na sua glória e na do Pai e dos santos anjos. 27 E em verdade vos digo que, dos que aqui estão, alguns há que não provarão a morte até que vejam o Reino de Deus."}, "joao": null}, {"id": 115, "ordem": 115, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Retoma seu Ministério na Galileia", "titulo": "Jesus transfigura-se no monte", "mateus": {"referencia": "Mt 17.1-13", "texto": "1 Seis dias depois, tomou Jesus consigo a Pedro, e a Tiago, e a João, seu irmão, e os conduziu em particular a um alto monte. 2 E transfigurou-se diante deles; e o seu rosto resplandeceu como o sol, e as suas vestes se tornaram brancas como a luz. 3 E eis que lhes apareceram Moisés e Elias, falando com ele. 4 E Pedro, tomando a palavra, disse a Jesus: Senhor, bom é estarmos aqui; se queres, façamos aqui três tabernáculos, um para ti, um para Moisés e um para Elias. 5 E, estando ele ainda a falar, eis que uma nuvem luminosa os cobriu. E da nuvem saiu uma voz que dizia: Este é o meu Filho amado, em quem me comprazo; escutai-o. 6 E os discípulos, ouvindo isso, caíram sobre seu rosto e tiveram grande medo. 7 E, aproximando-se Jesus, tocou-lhes e disse: Levantai-vos e não tenhais medo. 8 E, erguendo eles os olhos, ninguém viram, senão a Jesus. 9 E, descendo eles do monte, Jesus lhes ordenou, dizendo: A ninguém conteis a visão até que o Filho do Homem seja ressuscitado dos mortos. 10 E os seus discípulos o interrogaram, dizendo: Por que dizem, então, os escribas que é mister que Elias venha primeiro? 11 E Jesus, respondendo, disse-lhes: Em verdade Elias virá primeiro e restaurará todas as coisas. 12 Mas digo-vos que Elias já veio, e não o conheceram, mas fizeram-lhe tudo o que quiseram. Assim farão eles também padecer o Filho do Homem. 13 Então, entenderam os discípulos que lhes falara de João Batista."}, "marcos": {"referencia": "Mc 9.2-13", "texto": "2 E, seis dias depois, Jesus tomou consigo a Pedro, a Tiago e a João, e os levou sós, em particular, a um alto monte, e transfigurou-se diante deles. 3 E as suas vestes tornaram-se resplandecentes, em extremo brancas como a neve, tais como nenhum lavadeiro sobre a terra as poderia branquear. 4 E apareceram-lhes Elias e Moisés e falavam com Jesus. 5 E Pedro, tomando a palavra, disse a Jesus: Mestre, bom é que nós estejamos aqui e façamos três cabanas, uma para ti, outra para Moisés e outra para Elias. 6 Pois não sabia o que dizia, porque estavam assombrados. 7 E desceu uma nuvem que os cobriu com a sua sombra, e saiu da nuvem uma voz, que dizia: Este é o meu Filho amado; a ele ouvi. 8 E, tendo olhado ao redor, ninguém mais viram, senão Jesus com eles. 9 E, descendo eles do monte, ordenou-lhes que a ninguém contassem o que tinham visto, até que o Filho do Homem ressuscitasse dos mortos. 10 E eles retiveram o caso entre si, perguntando uns aos outros que seria aquilo, ressuscitar dos mortos. 11 E interrogaram-no, dizendo: Por que dizem os escribas que é necessário que Elias venha primeiro? 12 E, respondendo ele, disse-lhes: Em verdade Elias virá primeiro e todas as coisas restaurará; e, como está escrito do Filho do Homem, que ele deva padecer muito e ser aviltado. 13 Digo-vos, porém, que Elias já veio, e fizeram-lhe tudo o que quiseram, como dele está escrito."}, "lucas": {"referencia": "Lc 9.28-36", "texto": "28 E aconteceu que, quase oito dias depois dessas palavras, tomou consigo a Pedro, a João e a Tiago e subiu ao monte a orar. 29 E, estando ele orando, transfigurou-se a aparência do seu rosto, e as suas vestes ficaram brancas e mui resplandecentes. 30 E eis que estavam falando com ele dois varões, que eram Moisés e Elias, 31 os quais apareceram com glória e falavam da sua morte, a qual havia de cumprir-se em Jerusalém. 32 E Pedro e os que estavam com ele estavam carregados de sono; e, quando despertaram, viram a sua glória e aqueles dois varões que estavam com ele. 33 E aconteceu que, quando aqueles se apartaram dele, disse Pedro a Jesus: Mestre, bom é que nós estejamos aqui e façamos três tendas, uma para ti, uma para Moisés e uma para Elias, não sabendo o que dizia. 34 E, dizendo ele isso, veio uma nuvem que os cobriu com a sua sombra; e, entrando eles na nuvem, temeram. 35 E saiu da nuvem uma voz que dizia: Este é o meu Filho amado; a ele ouvi. 36 E, tendo soado aquela voz, Jesus foi achado só; e eles calaram-se e, por aqueles dias, não contaram a ninguém nada do que tinham visto."}, "joao": null}, {"id": 116, "ordem": 116, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Retoma seu Ministério na Galileia", "titulo": "Jesus cura um menino endemoninhado", "mateus": {"referencia": "Mt 17.14-21", "texto": "14 E, quando chegaram à multidão, aproximou-se-lhe um homem, pondo-se de joelhos diante dele e dizendo: 15 Senhor, tem misericórdia de meu filho, que é lunático e sofre muito; pois muitas vezes cai no fogo e, muitas vezes, na água; 16 e trouxe-o aos teus discípulos e não puderam curá-lo. 17 E Jesus, respondendo, disse: Ó geração incrédula e perversa! Até quando estarei eu convosco e até quando vos sofrerei? Trazei-mo aqui. 18 E repreendeu Jesus o demônio, que saiu dele; e, desde aquela hora, o menino sarou. 19 Então, os discípulos, aproximando-se de Jesus em particular, disseram: Porque não pudemos nós expulsá-lo? 20 E Jesus lhes disse: Por causa da vossa pequena fé; porque em verdade vos digo que, se tiverdes fé como um grão de mostarda, direis a este monte: Passa daqui para acolá — e há de passar; e nada vos será impossível. 21 Mas esta casta de demônios não se expulsa senão pela oração e pelo jejum."}, "marcos": {"referencia": "Mc 9.14-29", "texto": "14 E, quando se aproximou dos discípulos, viu ao redor deles grande multidão e alguns escribas que disputavam com eles. 15 E logo toda a multidão, vendo-o, ficou espantada, e, correndo para ele, o saudaram. 16 E perguntou aos escribas: Que é que discutis com eles? 17 E um da multidão, respondendo, disse: Mestre, trouxe-te o meu filho, que tem um espírito mudo; 18 e este, onde quer que o apanha, despedaça-o, e ele espuma, e range os dentes, e vai-se secando; e eu disse aos teus discípulos que o expulsassem, e não puderam. 19 E ele, respondendo-lhes, disse: Ó geração incrédula! Até quando estarei convosco? Até quando vos sofrerei ainda? Trazei-mo. 20 E trouxeram-lho; e, quando ele o viu, logo o espírito o agitou com violência; e, caindo o endemoninhado por terra, revolvia-se, espumando. 21 E perguntou ao pai dele: Quanto tempo há que lhe sucede isto? E ele disse-lhe: Desde a infância. 22 E muitas vezes o tem lançado no fogo e na água, para o destruir; mas, se tu podes fazer alguma coisa, tem compaixão de nós e ajuda-nos. 23 E Jesus disse-lhe: Se tu podes crer; tudo é possível ao que crê. 24 E logo o pai do menino, clamando, com lágrimas, disse: Eu creio, Senhor! Ajuda a minha incredulidade. 25 E Jesus, vendo que a multidão concorria, repreendeu o espírito imundo, dizendo-lhe: Espírito mudo e surdo, eu te ordeno: sai dele e não entres mais nele. 26 E ele, clamando e agitando-o com violência, saiu; e ficou o menino como morto, de tal maneira que muitos diziam que estava morto. 27 Mas Jesus, tomando-o pela mão, o ergueu, e ele se levantou. 28 E, quando entrou em casa, os seus discípulos lhe perguntaram à parte: Por que o não pudemos nós expulsar? 29 E disse-lhes: Esta casta não pode sair com coisa alguma, a não ser com oração e jejum."}, "lucas": {"referencia": "Lc 9.37-43", "texto": "37 E aconteceu, no dia seguinte, que, descendo eles do monte, lhes saiu ao encontro uma grande multidão. 38 E eis que um homem da multidão clamou, dizendo, Mestre, peço-te que olhes para meu filho, porque é o único que eu tenho. 39 Eis que um espírito o toma, e de repente clama, e o despedaça até espumar; e só o larga depois de o ter quebrantado. 40 E roguei aos teus discípulos que o expulsassem, e não puderam. 41 E Jesus, respondendo, disse: Ó geração incrédula e perversa! Até quando estarei ainda convosco e vos sofrerei? Traze-me cá o teu filho. 42 E, quando vinha chegando, o demônio o derribou e convulsionou; porém Jesus repreendeu o espírito imundo, e curou o menino, e o entregou a seu pai. 43 E todos pasmavam da majestade de Deus. E, maravilhando-se todos de todas as coisas que Jesus fazia, disse aos seus discípulos:"}, "joao": null}, {"id": 117, "ordem": 117, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Retoma seu Ministério na Galileia", "titulo": "Jesus prediz sua morte pela segunda vez", "mateus": {"referencia": "Mt 17.22-23", "texto": "22 Ora, achando-se eles na Galileia, disse-lhes Jesus: O Filho do Homem será entregue nas mãos dos homens, 23 e matá-lo-ão, e, ao terceiro dia, ressuscitará. E eles se entristeceram muito."}, "marcos": {"referencia": "Mc 9.30-32", "texto": "30 E, tendo partido dali, caminharam pela Galileia, e não queria que alguém o soubesse, 31 porque ensinava os seus discípulos e lhes dizia: O Filho do Homem será entregue nas mãos dos homens e matá-lo-ão; e, morto, ele ressuscitará ao terceiro dia. 32 Mas eles não entendiam esta palavra e receavam interrogá-lo."}, "lucas": {"referencia": "Lc 9.43-45", "texto": "43 E todos pasmavam da majestade de Deus. E, maravilhando-se todos de todas as coisas que Jesus fazia, disse aos seus discípulos: 44 Ponde vós estas palavras em vossos ouvidos, porque o Filho do Homem será entregue nas mãos dos homens. 45 Mas eles não entendiam essa palavra, que lhes era encoberta, para que a não compreendessem; e temiam interrogá-lo acerca dessa palavra."}, "joao": null}, {"id": 118, "ordem": 118, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Retoma seu Ministério na Galileia", "titulo": "Pedro encontra a moeda na boca do peixe", "mateus": {"referencia": "Mt 17.24-27", "texto": "24 E, chegando eles a Cafarnaum, aproximaram-se de Pedro os que cobravam as didracmas e disseram: O vosso mestre não paga as didracmas? 25 Disse ele: Sim. E, entrando em casa, Jesus se lhe antecipou, dizendo: Que te parece, Simão? De quem cobram os reis da terra os tributos ou os impostos? Dos seus filhos ou dos alheios? 26 Disse-lhe Pedro: Dos alheios. Disse-lhe Jesus: Logo, estão livres os filhos. 27 Mas, para que os não escandalizemos, vai ao mar, lança o anzol, tira o primeiro peixe que subir e, abrindo-lhe a boca, encontrarás um estáter; toma-o e dá-o por mim e por ti."}, "marcos": null, "lucas": null, "joao": null}, {"id": 119, "ordem": 119, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Retoma seu Ministério na Galileia", "titulo": "Os discípulos discutem sobre quem seria o maior", "mateus": {"referencia": "Mt 18.1-5", "texto": "1 Naquela mesma hora, chegaram os discípulos ao pé de Jesus, dizendo: Quem é o maior no Reino dos céus? 2 E Jesus, chamando uma criança, a pôs no meio deles 3 e disse: Em verdade vos digo que, se não vos converterdes e não vos fizerdes como crianças, de modo algum entrareis no Reino dos céus. 4 Portanto, aquele que se tornar humilde como esta criança, esse é o maior no Reino dos céus. 5 E qualquer que receber em meu nome uma criança tal como esta a mim me recebe."}, "marcos": {"referencia": "Mc 9.33-37", "texto": "33 E chegou a Cafarnaum e, entrando em casa, perguntou-lhes: Que estáveis vós discutindo pelo caminho? 34 Mas eles calaram-se, porque, pelo caminho, tinham disputado entre si qual era o maior. 35 E ele, assentando-se, chamou os doze e disse-lhes: Se alguém quiser ser o primeiro, será o derradeiro de todos e o servo de todos. 36 E, lançando mão de uma criança, pô-la no meio deles e, tomando-a nos seus braços, disse-lhes: 37 Qualquer que receber uma destas crianças em meu nome a mim me recebe; e qualquer que a mim me receber recebe não a mim, mas ao que me enviou."}, "lucas": {"referencia": "Lc 9.46-48", "texto": "46 E suscitou-se entre eles uma discussão sobre qual deles seria o maior. 47 Mas Jesus, vendo o pensamento do coração deles, tomou uma criança, pô-la junto a si 48 e disse-lhes: Qualquer que receber esta criança em meu nome recebe-me a mim; e qualquer que me recebe a mim recebe o que me enviou; porque aquele que entre vós todos for o menor, esse mesmo é grande."}, "joao": null}, {"id": 120, "ordem": 120, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Retoma seu Ministério na Galileia", "titulo": "Os discípulos proíbem um homem de usar o nome de Jesus", "mateus": null, "marcos": {"referencia": "Mc 9.38-41", "texto": "38 E João lhe respondeu, dizendo: Mestre, vimos um que, em teu nome, expulsava demônios, o qual não nos segue; e nós lho proibimos, porque não nos segue. 39 Jesus, porém, disse: Não lho proibais, porque ninguém há que faça milagre em meu nome e possa logo falar mal de mim. 40 Porque quem não é contra nós é por nós. 41 Porquanto qualquer que vos der a beber um copo de água em meu nome, porque sois discípulos de Cristo, em verdade vos digo que não perderá o seu galardão."}, "lucas": {"referencia": "Lc 9.49-50", "texto": "49 E, respondendo João, disse: Mestre, vimos um que em teu nome expulsava os demônios, e lho proibimos, porque não te segue conosco. 50 E Jesus lhes disse: Não o proibais, porque quem não é contra nós é por nós."}, "joao": null}, {"id": 121, "ordem": 121, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": "Jesus Retoma seu Ministério na Galileia", "titulo": "Jesus adverte contra a tentação", "mateus": {"referencia": "Mt 18.6-11", "texto": "6 Mas qualquer que escandalizar um destes pequeninos que creem em mim, melhor lhe fora que se lhe pendurasse ao pescoço uma mó de azenha, e se submergisse na profundeza do mar. 7 Ai do mundo, por causa dos escândalos. Porque é mister que venham escândalos, mas ai daquele homem por quem o escândalo vem! 8 Portanto, se a tua mão ou o teu pé te escandalizar, corta-o e atira-o para longe de ti; melhor te é entrar na vida coxo ou aleijado do que, tendo duas mãos ou dois pés, seres lançado no fogo eterno. 9 E, se o teu olho te escandalizar, arranca-o, e atira-o para longe de ti. Melhor te é entrar na vida com um só olho do que, tendo dois olhos, seres lançado no fogo do inferno. 10 Vede, não desprezeis algum destes pequeninos, porque eu vos digo que os seus anjos nos céus sempre veem a face de meu Pai que está nos céus. 11 Porque o Filho do Homem veio salvar o que se tinha perdido."}, "marcos": {"referencia": "Mc 9.42-50", "texto": "42 E qualquer que escandalizar um destes pequeninos que creem em mim, melhor lhe fora que lhe pusessem ao pescoço uma grande pedra de moinho e que fosse lançado no mar. 43 E, se a tua mão te escandalizar, corta-a; melhor é para ti entrares na vida aleijado do que, tendo duas mãos, ires para o inferno, para o fogo que nunca se apaga, 44 onde o seu bicho não morre, e o fogo nunca se apaga. 45 E, se o teu pé te escandalizar, corta-o; melhor é para ti entrares coxo na vida do que, tendo dois pés, seres lançado no inferno, no fogo que nunca se apaga, 46 onde o seu bicho não morre, e o fogo nunca se apaga. 47 E, se o teu olho te escandalizar, lança-o fora; melhor é para ti entrares no Reino de Deus com um só olho do que, tendo dois olhos, ser lançado no fogo do inferno, 48 onde o seu bicho não morre, e o fogo nunca se apaga. 49 Porque cada um será salgado com fogo, e cada sacrifício será salgado com sal. 50 Bom é o sal, mas, se o sal se tornar insulso, com que o adubareis? Tende sal em vós mesmos e paz, uns com os outros."}, "lucas": null, "joao": null}, {"id": 122, "ordem": 122, "secao": "B. Mensagem e Ministério de Jesus", "subsecao": null, "titulo": "Jesus cont
